name: TRUST-P24 Isntree KR Sunscreen Hosted Adoption Execution

on:
  pull_request:
    paths:
      - "evidence/product-fact-adoption-v1/trust-p24-isntree-kr-sunscreen-hosted-adoption-execution-v1.json"
      - "docs/evidence/trust-p24-isntree-kr-sunscreen-hosted-adoption-execution-v1.md"
      - "scripts/product-evidence/verify-trust-p24-isntree-kr-sunscreen-hosted-adoption-execution-v1.mjs"
      - ".github/workflows/trust-p24-isntree-kr-sunscreen-hosted-adoption-execution.yml"
  push:
    branches: [main]
    paths:
      - "evidence/product-fact-adoption-v1/trust-p24-isntree-kr-sunscreen-hosted-adoption-execution-v1.json"
      - "docs/evidence/trust-p24-isntree-kr-sunscreen-hosted-adoption-execution-v1.md"
      - "scripts/product-evidence/verify-trust-p24-isntree-kr-sunscreen-hosted-adoption-execution-v1.mjs"
      - ".github/workflows/trust-p24-isntree-kr-sunscreen-hosted-adoption-execution.yml"

jobs:
  verify-trust-p24-isntree-kr-sunscreen-hosted-adoption-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Attest exact head
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify TRUST-P24 Production execution closeout
        run: node scripts/product-evidence/verify-trust-p24-isntree-kr-sunscreen-hosted-adoption-execution-v1.mjs
