name: BEJEWELY Mobile 16C Google Play Data Safety

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/google-play-data-safety.json"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/lib/env.ts"
      - "scripts/verify-mobile-16c-google-data-safety.mjs"
      - ".github/workflows/mobile-16c-google-data-safety.yml"
      - "apps/mobile/package.json"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "apps/mobile/google-play-data-safety.json"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/lib/env.ts"
      - "scripts/verify-mobile-16c-google-data-safety.mjs"
      - ".github/workflows/mobile-16c-google-data-safety.yml"
      - "apps/mobile/package.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-16c-google-data-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Google Play Data Safety and Production Transport
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_16C_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify MOBILE-16C contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-mobile-16c-google-data-safety.mjs
          npm run mobile:typecheck
          npm run verify:mobile-foundation
