name: TRUST P2-C Official Robots Live Probe
run-name: "[WT:trust] P2-C Official Robots Live Probe"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trust-p2c-official-robots-live.yml"
      - "scripts/trust-p2c-robots-smoke.mjs"
      - "scripts/verify-trust-p2c-robots-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-p2c-robots-policy-one-physical-origin
  cancel-in-progress: false

jobs:
  official-robots-policy:
    name: One official robots.txt request, no product retrieval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify offline policy and fail-closed cases
        run: node scripts/verify-trust-p2c-robots-smoke.mjs
      - name: Probe only the previously observed official site's robots.txt
        env:
          TRUST_P2C_ROBOTS_LIVE_ENABLED: "true"
        run: node scripts/trust-p2c-robots-smoke.mjs --execute
