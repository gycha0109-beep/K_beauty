name: Crawler Canonical Adoption G3 Reassessment v1

on:
  pull_request:
    paths:
      - ".github/workflows/crawler-canonical-adoption-g3-reassessment-v1.yml"
      - "docs/evidence/crawler-canonical-adoption-g3-reassessment-v1.md"
      - "scripts/verify-crawler-canonical-adoption-g3-reassessment-v1.mjs"
      - "lib/product-source.js"
      - "lib/recommendation-legacy-corpus-v1.mjs"
      - "lib/recommendation-candidate-admission-core.mjs"
      - "lib/recommendation-candidate-admission.js"
      - "lib/server/recommendation-candidate-admission-runtime.js"
      - "fixtures/recommendation-governance/legacy-frozen-recommendation-corpus-v1.txt"
      - "fixtures/recommendation-governance/g3-production-candidate-admission-v1.json"
      - "scripts/verify-v21-admission-g3-production-candidate-gate-v1.mjs"
      - "crawler/**"
      - "supabase/migrations/20260620212309_candidate_product_form_promotion_contract.sql"
      - "supabase/migrations/20260804233300_admin_product_review_import_confirm.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crawler-canonical-adoption-g3-reassessment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REASSESSMENT_BASE_MAIN_SHA: 4acc939ce487e9fa277672b5b2da63b31bfcca2c
  REASSESSMENT_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-reassessment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.REASSESSMENT_CHECKOUT_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Exact-head and audit-only scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REASSESSMENT_CHECKOUT_SHA"
          git merge-base --is-ancestor "$REASSESSMENT_BASE_MAIN_SHA" HEAD
          changed="$(git diff --name-only "$REASSESSMENT_BASE_MAIN_SHA" HEAD)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/crawler-canonical-adoption-g3-reassessment-v1\.yml|docs/evidence/crawler-canonical-adoption-g3-reassessment-v1\.md|scripts/verify-crawler-canonical-adoption-g3-reassessment-v1\.mjs)$' || true)"
          test -z "$forbidden"

      - name: Frozen runtime semantic invariance
        run: |
          set -euo pipefail
          git diff --exit-code "$REASSESSMENT_BASE_MAIN_SHA" HEAD -- \
            app \
            lib \
            crawler \
            supabase/migrations \
            fixtures/recommendation-governance/legacy-frozen-recommendation-corpus-v1.txt \
            fixtures/recommendation-governance/g3-production-candidate-admission-v1.json \
            scripts/verify-v21-admission-g3-production-candidate-gate-v1.mjs \
            scripts/product-evidence

      - name: Revalidate frozen G3 / G3A / G2 / PDA
        run: |
          set -euo pipefail
          node scripts/verify-v21-admission-g3-production-candidate-gate-v1.mjs
          node scripts/verify-v21-admission-g3a-pf-authority-reader-v1.mjs
          node scripts/product-evidence/verify-initial-admission-grant-policy-v1.mjs
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-contract-v1.mjs

      - name: Verify crawler reassessment freeze
        run: |
          set -euo pipefail
          node --check scripts/verify-crawler-canonical-adoption-g3-reassessment-v1.mjs
          node scripts/verify-crawler-canonical-adoption-g3-reassessment-v1.mjs

      - name: Evidence classification guards
        run: |
          set -euo pipefail
          grep -Fq 'Original Recommendation eligibility gap = RESOLVED' docs/evidence/crawler-canonical-adoption-g3-reassessment-v1.md
          grep -Fq 'CRAWLER_REASSESSMENT_BLOCKED_BY_CANONICAL_WRITE_AUTHORITY_OVERREACH' docs/evidence/crawler-canonical-adoption-g3-reassessment-v1.md
          grep -Fq 'CRAWLER_RESUME_GATE = FROZEN_NOT_SATISFIED' docs/evidence/crawler-canonical-adoption-g3-reassessment-v1.md
          grep -Fq 'CRAWLER_RESUME = NO' docs/evidence/crawler-canonical-adoption-g3-reassessment-v1.md
          grep -Fq 'reassessment-induced business data delta = 0' docs/evidence/crawler-canonical-adoption-g3-reassessment-v1.md
