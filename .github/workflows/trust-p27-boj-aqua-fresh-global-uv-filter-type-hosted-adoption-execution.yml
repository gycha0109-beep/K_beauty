name: TRUST-P27 BOJ Aqua-Fresh Global UV Filter Type Hosted Adoption Execution

on:
  pull_request:
    paths:
      - "evidence/product-fact-adoption-v1/trust-p27-boj-aqua-fresh-global-uv-filter-type-hosted-adoption-execution-v1.json"
      - "docs/evidence/trust-p27-boj-aqua-fresh-global-uv-filter-type-hosted-adoption-execution-v1.md"
      - "scripts/product-evidence/verify-trust-p27-boj-aqua-fresh-global-uv-filter-type-hosted-adoption-execution-v1.mjs"
      - ".github/workflows/trust-p27-boj-aqua-fresh-global-uv-filter-type-hosted-adoption-execution.yml"
  push:
    branches: [main]
    paths:
      - "evidence/product-fact-adoption-v1/trust-p27-boj-aqua-fresh-global-uv-filter-type-hosted-adoption-execution-v1.json"
      - "docs/evidence/trust-p27-boj-aqua-fresh-global-uv-filter-type-hosted-adoption-execution-v1.md"
      - "scripts/product-evidence/verify-trust-p27-boj-aqua-fresh-global-uv-filter-type-hosted-adoption-execution-v1.mjs"
      - ".github/workflows/trust-p27-boj-aqua-fresh-global-uv-filter-type-hosted-adoption-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-trust-p27-boj-aqua-fresh-global-uv-filter-type-hosted-adoption-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Attest exact head
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify TRUST-P27 Production execution closeout
        run: node scripts/product-evidence/verify-trust-p27-boj-aqua-fresh-global-uv-filter-type-hosted-adoption-execution-v1.mjs
