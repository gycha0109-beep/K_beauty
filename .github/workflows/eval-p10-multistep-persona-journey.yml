name: EVAL-P10 Multi-step Persona Journey Simulation

on:
  push:
    branches:
      - eval/p10-multistep-persona-journey
      - main
  pull_request:
    paths:
      - ".github/workflows/eval-p10-multistep-persona-journey.yml"
      - "fixtures/persona-evaluation/eval-p10-interaction-personas-v1.json"
      - "fixtures/persona-evaluation/eval-p10-multistep-persona-journey-contract-v1.json"
      - "fixtures/persona-evaluation/eval-p10-journey-scenario-manifest-v1.json"
      - "scripts/verify-eval-p10-multistep-persona-journey-v1.mjs"
      - "docs/evidence/eval-p10-multistep-persona-journey-v1.md"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: eval-p10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  EVAL_P10_BASE_MAIN_SHA: 6ea3677e321a85d52955a485be30a69c42fe736a
  EVAL_P10_P9_MERGED_SHA: 6ea3677e321a85d52955a485be30a69c42fe736a
  EVAL_P10_P6_MERGED_SHA: ee8f06485a0e7d41396682ac9d44f5b1402abeaa
  EVAL_P10_P4_MERGED_SHA: a4772e3cd44d68f67fe4bbf25926ba0942f353b3
  EVAL_P10_P3_SOURCE_SHA: 4265450ddcf40bdb4359a3d5c82d22b00a1024dd
  EVAL_P10_RECOMMENDATION_REFERENCE_SHA: 783afb91a964f5d762f46846f9ef854902b48e95
  EVAL_P10_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-eval-p10:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EVAL_P10_CHECKOUT_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact authority and ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVAL_P10_CHECKOUT_SHA"
          git merge-base --is-ancestor "$EVAL_P10_BASE_MAIN_SHA" HEAD
          test "$(git merge-base "$EVAL_P10_BASE_MAIN_SHA" HEAD)" = "$EVAL_P10_BASE_MAIN_SHA"
          git merge-base --is-ancestor "$EVAL_P10_P6_MERGED_SHA" "$EVAL_P10_P9_MERGED_SHA"
          test -f docs/evidence/eval-p9-real-aggregate-calibration-contract-v1.md
          test -f fixtures/persona-evaluation/eval-p6-locked-regression-cohort-v1.json

      - name: Bounded EVAL-P10 change scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$EVAL_P10_BASE_MAIN_SHA")"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/eval-p10-multistep-persona-journey\.yml|fixtures/persona-evaluation/eval-p10-interaction-personas-v1\.json|fixtures/persona-evaluation/eval-p10-multistep-persona-journey-contract-v1\.json|fixtures/persona-evaluation/eval-p10-journey-scenario-manifest-v1\.json|scripts/verify-eval-p10-multistep-persona-journey-v1\.mjs|docs/evidence/eval-p10-multistep-persona-journey-v1\.md)$' || true)"
          test -z "$forbidden"

      - name: No Production Recommendation Product Fact or Hosted mutation
        run: |
          set -euo pipefail
          git diff --exit-code "$EVAL_P10_BASE_MAIN_SHA" -- lib app/api supabase/migrations
          test -z "$(git diff --name-only "$EVAL_P10_BASE_MAIN_SHA" -- package.json package-lock.json)"

      - name: Syntax and P10 contract parse
        run: |
          set -euo pipefail
          node --check scripts/verify-eval-p10-multistep-persona-journey-v1.mjs
          node -e 'JSON.parse(require("fs").readFileSync("fixtures/persona-evaluation/eval-p10-interaction-personas-v1.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("fixtures/persona-evaluation/eval-p10-multistep-persona-journey-contract-v1.json","utf8"))'
          node -e 'JSON.parse(require("fs").readFileSync("fixtures/persona-evaluation/eval-p10-journey-scenario-manifest-v1.json","utf8"))'

      - name: Prepare immutable P3 materialization source
        run: |
          set -euo pipefail
          rm -rf _reference/persona-p3
          git clone -q --no-hardlinks . _reference/persona-p3
          git -C _reference/persona-p3 checkout -q "$EVAL_P10_P3_SOURCE_SHA"

      - name: Revalidate EVAL-P4 locked source cohorts
        env:
          EVAL_P4_P3_REFERENCE_ROOT: _reference/persona-p3
          EVAL_P4_ARTIFACT_ROOT: artifacts/eval-p4-replay
        run: node scripts/verify-eval-p4-persona-cohort-freeze-v1.mjs

      - name: Prepare frozen Recommendation reference
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q "$EVAL_P10_RECOMMENDATION_REFERENCE_SHA"
          node -e 'const f=require("./_reference/recommendation/fixtures/recommendation-metadata/products-v1.json"); if(f.productCount!==164||f.categoryCounts?.sunscreen!==11) process.exit(1)'

      - name: Verify P10 journey pass A
        env:
          EVAL_P10_IMPLEMENTATION_SHA: ${{ env.EVAL_P10_CHECKOUT_SHA }}
          EVAL_P10_RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
          EVAL_P10_ARTIFACT_ROOT: artifacts/eval-p10/pass-a
        run: node scripts/verify-eval-p10-multistep-persona-journey-v1.mjs

      - name: Verify P10 journey pass B
        env:
          EVAL_P10_IMPLEMENTATION_SHA: ${{ env.EVAL_P10_CHECKOUT_SHA }}
          EVAL_P10_RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
          EVAL_P10_ARTIFACT_ROOT: artifacts/eval-p10/pass-b
        run: node scripts/verify-eval-p10-multistep-persona-journey-v1.mjs

      - name: Verify deterministic P10 evidence bytes
        run: |
          set -euo pipefail
          cmp artifacts/eval-p10/pass-a/multistep-persona-journey-results-v1.json artifacts/eval-p10/pass-b/multistep-persona-journey-results-v1.json
          cmp artifacts/eval-p10/pass-a/multistep-persona-journey-evidence-v1.json artifacts/eval-p10/pass-b/multistep-persona-journey-evidence-v1.json

      - name: Prepare P10 baseline engine checkout
        run: |
          set -euo pipefail
          rm -rf _reference/eval-p10-baseline-engine
          git clone -q --no-hardlinks . _reference/eval-p10-baseline-engine
          git -C _reference/eval-p10-baseline-engine checkout -q "$EVAL_P10_BASE_MAIN_SHA"

      - name: Replay P6 LOCKED regression cohort on P10 baseline engine
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          cd _reference/eval-p10-baseline-engine
          EVAL_P6_ENGINE_ROOT="$PWD" \
          EVAL_P6_ENGINE_SHA="$EVAL_P10_BASE_MAIN_SHA" \
          EVAL_P6_RUN_ROLE=BASELINE \
          EVAL_P6_P3_REFERENCE_ROOT="$root/_reference/persona-p3" \
          EVAL_P6_RECOMMENDATION_REFERENCE_ROOT="$root/_reference/recommendation" \
          EVAL_P6_P4_MANIFEST_PATH="$root/fixtures/persona-evaluation/eval-p4-cohort-freeze-manifest-v1.json" \
          EVAL_P6_COHORT_PATH="$root/fixtures/persona-evaluation/eval-p6-locked-regression-cohort-v1.json" \
          EVAL_P6_ARTIFACT_ROOT="$root/artifacts/eval-p10/regression-baseline" \
          EVAL_P6_SIMULATION_RUN_ID=EVAL_P10_BASELINE_REPLAY \
          node "$root/scripts/verify-eval-p6-persona-regression-v1.mjs"

      - name: Replay P6 LOCKED regression cohort on P10 candidate
        env:
          EVAL_P6_ENGINE_ROOT: ${{ github.workspace }}
          EVAL_P6_ENGINE_SHA: ${{ env.EVAL_P10_CHECKOUT_SHA }}
          EVAL_P6_RUN_ROLE: CANDIDATE
          EVAL_P6_P3_REFERENCE_ROOT: _reference/persona-p3
          EVAL_P6_RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
          EVAL_P6_P4_MANIFEST_PATH: fixtures/persona-evaluation/eval-p4-cohort-freeze-manifest-v1.json
          EVAL_P6_COHORT_PATH: fixtures/persona-evaluation/eval-p6-locked-regression-cohort-v1.json
          EVAL_P6_ARTIFACT_ROOT: artifacts/eval-p10/regression-candidate
          EVAL_P6_SIMULATION_RUN_ID: EVAL_P10_CANDIDATE_REPLAY
        run: node scripts/verify-eval-p6-persona-regression-v1.mjs

      - name: Verify P6 semantic zero-delta
        env:
          EVAL_P6_BASELINE_ARTIFACT_ROOT: artifacts/eval-p10/regression-baseline
          EVAL_P6_CANDIDATE_ARTIFACT_ROOT: artifacts/eval-p10/regression-candidate
          EVAL_P6_COMPARISON_ARTIFACT_ROOT: artifacts/eval-p10/regression-comparison
          EVAL_P6_EXPECT_ZERO_DELTA: "1"
        run: node scripts/compare-eval-p6-persona-regression-v1.mjs

      - name: Re-run EVAL-P3 deterministic harness
        env:
          EVAL_P3_REFERENCE_ROOT: _reference/recommendation
          EVAL_P3_IMPLEMENTATION_SHA: ${{ env.EVAL_P10_CHECKOUT_SHA }}
          EVAL_P3_ARTIFACT_ROOT: artifacts/eval-p3-replay
        run: node scripts/verify-eval-p3-persona-simulation-v1.mjs

      - name: Historical 164x12 Recommendation replay
        env:
          RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
        run: node scripts/verify-skin-decision-recommendation-invariance.mjs

      - name: Production build
        run: npm run build

      - name: Upload EVAL-P10 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-p10-multistep-persona-journey-${{ env.EVAL_P10_CHECKOUT_SHA }}
          path: artifacts/eval-p10/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish exact-SHA CI attestation
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state="success"
          context="EVAL-P10 exact-head CI"
          description="EVAL-P10 exact-head CI passed"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            context="EVAL-P10 merged-main exact-SHA CI"
            description="EVAL-P10 merged-main exact-SHA CI passed"
          fi
          if [ "$PRIOR_JOB_STATUS" != "success" ]; then
            state="failure"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then description="EVAL-P10 merged-main exact-SHA CI failed"; else description="EVAL-P10 exact-head CI failed"; fi
          fi
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="$context" -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          test "$state" = "success"
