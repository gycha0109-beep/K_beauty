name: Face Lab Single Analysis Validation

on:
  push:
    branches:
      - fix/face-lab-single-analysis-multilocale

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check lib/face-lab-hosted-evaluation-groups.mjs
          node --check scripts/run-face-lab-hosted-evaluation-single-analysis.mjs
          node --check scripts/run-face-lab-hosted-evaluation.mjs
          node --check scripts/verify-face-lab-single-analysis-evaluation.mjs
      - run: npm run face-lab:eval:verify
      - run: npm run architecture:guard
      - run: npm run build
      - run: git diff --check
