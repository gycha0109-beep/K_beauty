name: Final release whitespace cleanup

on:
  push:
    branches:
      - feature/premium-beta-flow

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore(docs): run final release whitespace cleanup'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-beta-flow
          fetch-depth: 0
      - name: Normalize reviewed Markdown whitespace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('docs/domain/facelab/face-lab-archetype-styling-contract-v1.md'),
              Path('docs/security/sec-10-browser-image-origin-contract-20260716.md'),
              Path('docs/security/sec-10-http-security-headers-20260716.md'),
              Path('docs/security/sec-11-post-only-signout-boundary-20260716.md'),
              Path('docs/security/sec-12-error-log-exposure-boundary-20260717.md'),
          ]
          for path in paths:
              lines = path.read_text(encoding='utf-8').splitlines()
              cleaned = [line.rstrip() for line in lines]
              while cleaned and cleaned[-1] == '':
                  cleaned.pop()
              path.write_text('\n'.join(cleaned) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/final-release-whitespace-cleanup.yml
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(docs): normalize final release diff hygiene"
          git push origin HEAD:feature/premium-beta-flow
