name: TRUST Phase 8H CLI Migration Name Generation

on:
  push:
    branches:
      - ops/trust-phase8h-cli-migration-generation
    paths:
      - ".github/workflows/trust-phase8h-cli-migration-generation.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Supabase CLI and command contract
        run: |
          set -euo pipefail
          npx --yes supabase@2.117.0 --version
          npx --yes supabase@2.117.0 migration new --help

      - name: Generate migration with Supabase CLI
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          before="$(mktemp)"
          after="$(mktemp)"
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$before"
          npx --yes supabase@2.117.0 migration new trust_phase8h_governed_official_source_relocation_v1
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$after"
          generated="$(comm -13 "$before" "$after")"
          test "$(printf '%s\n' "$generated" | sed '/^$/d' | wc -l)" -eq 1
          test -f "supabase/migrations/$generated"
          echo "filename=$generated" >> "$GITHUB_OUTPUT"
          printf 'Generated by Supabase CLI 2.117.0: %s\n' "$generated"

      - name: Upload CLI-generated migration identity
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.generate.outputs.filename }}
          path: supabase/migrations/${{ steps.generate.outputs.filename }}
          if-no-files-found: error
          retention-days: 1
