name: FACE-EVAL-CX1G D2D-XP Hosted Intake v1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/facelab/review/**'
      - 'app/api/facelab/review/**'
      - 'lib/face-lab-hosted-intake.js'
      - 'lib/face-lab-hosted-review-html.js'
      - 'packages/face-contracts/src/archetype-human-evaluation/**'
      - 'evidence/facelab/face-lab-independent-human-cue-single-hosted-set-20260815-v1.json'
      - 'public/facelab/hosted-review/v1/assets/**'
      - 'scripts/build-face-lab-independent-human-cue-hosted-set-v1.mjs'
      - 'scripts/build-face-lab-independent-human-cue-hosted-test-submission-v1.mjs'
      - 'scripts/check-face-lab-independent-human-cue-hosted-response-v1.mjs'
      - 'scripts/check-face-lab-independent-human-cue-hosted-set-v1.mjs'
      - 'scripts/check-face-lab-independent-human-cue-hosted-ui-v1.mjs'
      - 'scripts/check-face-lab-independent-human-cue-hosted-ui-browser-v1.mjs'
      - 'supabase/migrations/20260815023734_face_lab_hosted_intake_v1.sql'
      - 'docs/domain/facelab/face-lab-independent-human-cue-hosted-intake*.md'
      - 'package.json'
      - '.github/workflows/face-eval-cx1g-d2d-xp-hosted-intake-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Freeze Face Lab authority and exact head
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ui1_authority="a865cebcb64cd9c0fcebae691ba4e406def62673"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$ui1_authority" HEAD
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            git merge-base --is-ancestor "$ui1_authority" "$PR_BASE_SHA"
          fi

      - name: Verify hosted set authority
        run: npm run verify:face-lab-independent-human-cue-hosted-set

      - name: Verify hosted response contract
        run: npm run verify:face-lab-independent-human-cue-hosted-response

      - name: Verify hosted UI and security boundary
        run: npm run verify:face-lab-independent-human-cue-hosted-ui

      - name: Verify upstream Human cue authorities
        run: |
          npm run verify:face-lab-target-axis-definitions
          npm run verify:face-lab-independent-human-cue-protocol
          npm run verify:face-lab-independent-human-cue-review-ui-ko

      - name: Verify architecture and scoring invariance
        run: |
          npm run architecture:guard
          npm run verify:face-lab-archetype-scoring
          npm run verify:face-lab-archetype-human-evaluation

      - name: Verify synthetic regressions
        run: npm run synthetic:verify

      - name: Diff hygiene
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base "$PR_BASE_SHA" HEAD)"
            git diff --check "$base..HEAD"
          else
            git diff --check "HEAD^..HEAD"
          fi
