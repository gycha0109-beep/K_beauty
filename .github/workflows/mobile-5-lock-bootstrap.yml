name: MOBILE-5 Lock Bootstrap

on:
  push:
    branches:
      - feature/mobile-5-native-camera
    paths:
      - ".github/workflows/mobile-5-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          ref: feature/mobile-5-native-camera

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Generate npm lockfile with Expo Camera
        run: npm install --package-lock-only --workspace @bejewely/mobile "expo-camera@~57.0.3" --save

      - name: Commit generated dependency state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json package-lock.json
          git diff --cached --check
          git commit -m "chore(mobile): install expo camera" || exit 0
          git push origin HEAD:feature/mobile-5-native-camera
