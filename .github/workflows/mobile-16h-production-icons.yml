name: BEJEWELY Mobile 16H Production Icons

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/app.json"
      - "apps/mobile/assets/icon/**"
      - "apps/mobile/assets/store/bejewely-play-icon-512.png"
      - "apps/mobile/store-readiness.json"
      - "scripts/verify-mobile-13-store-release-preflight.mjs"
      - "scripts/verify-mobile-16h-production-icons.mjs"
      - ".github/workflows/mobile-16h-production-icons.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/app.json"
      - "apps/mobile/assets/icon/**"
      - "apps/mobile/assets/store/bejewely-play-icon-512.png"
      - "apps/mobile/store-readiness.json"
      - "scripts/verify-mobile-13-store-release-preflight.mjs"
      - "scripts/verify-mobile-16h-production-icons.mjs"
      - ".github/workflows/mobile-16h-production-icons.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-16h-production-icons-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-icons:
    name: Production Icon Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_16H_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify production icon contract
        run: node scripts/verify-mobile-16h-production-icons.mjs

      - name: Validate Expo public config
        working-directory: apps/mobile
        run: npx expo config --type public --json > /tmp/mobile-16h-expo-config.json

      - name: Typecheck mobile client
        run: npm --prefix apps/mobile run typecheck
