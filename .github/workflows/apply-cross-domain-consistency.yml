name: Apply Cross-domain Consistency

on:
  pull_request:
    branches:
      - agent/condition-policy-single-source

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/cross-domain-consistency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cross-domain-consistency
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: python scripts/apply-cross-domain-consistency.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-cross-domain-consistency.mjs
      - run: node scripts/verify-functional-policy-single-source.mjs
      - run: node scripts/verify-routine-policy-single-source.mjs
      - run: node scripts/verify-condition-policy-single-source.mjs
      - run: node scripts/verify-premium-decision-state.mjs
      - run: node scripts/verify-premium-report-reentry-contract.mjs
      - run: npm run architecture:guard
      - run: npm run build
      - run: git diff --check
      - name: Commit implementation and remove one-time tooling
        run: |
          rm scripts/apply-cross-domain-consistency.py
          rm .github/workflows/apply-cross-domain-consistency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add cross-domain decision consistency"
          git push origin HEAD:agent/cross-domain-consistency
