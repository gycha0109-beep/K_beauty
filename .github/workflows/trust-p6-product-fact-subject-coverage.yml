name: TRUST Historical Evidence

# Canonical gate for frozen TRUST-P6..P27 evidence/verifier history.
on:
  pull_request:
    branches: [main]
    paths:
      - "evidence/**/trust-p*"
      - "docs/evidence/trust-p*.md"
      - "scripts/product-evidence/verify-trust-p*.mjs"
      - "scripts/product-evidence/verify-trust-historical-evidence.mjs"
      - ".github/workflows/trust-p*.yml"
  push:
    branches: [main]
    paths:
      - "evidence/**/trust-p*"
      - "docs/evidence/trust-p*.md"
      - "scripts/product-evidence/verify-trust-p*.mjs"
      - "scripts/product-evidence/verify-trust-historical-evidence.mjs"
      - ".github/workflows/trust-p*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-historical-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-trust-historical-evidence:
    name: TRUST Historical Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Attest exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1

      - name: Verify frozen TRUST historical evidence
        run: node scripts/product-evidence/verify-trust-historical-evidence.mjs
