name: Premium PR27 finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/premium-pr27-finalize.yml]

permissions:
  contents: write

concurrency:
  group: premium-pr27-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/premium-engine-main-sec-baseline
          fetch-depth: 0
      - name: Build reviewed PR27 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/premium-route-storage-reentry-verification
          test "$(git rev-parse origin/agent/premium-route-storage-reentry-verification)" = "d88ad5075d9f4faab201e0d819b4f7c952d16867"
          set +e
          git merge --no-ff --no-commit origin/agent/premium-route-storage-reentry-verification
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U | sort)
          EXPECTED=("app/api/full-report/route.js" "app/api/full-report/session/route.js")
          test "${#CONFLICTS[@]}" -eq "${#EXPECTED[@]}"
          for i in "${!EXPECTED[@]}"; do test "${CONFLICTS[$i]}" = "${EXPECTED[$i]}"; done
          python - <<'PY'
          from pathlib import Path
          import ast, base64, re, zlib
          workflow = Path('.github/workflows/premium-stack-merge-once.yml').read_text(encoding='utf-8')
          for name, target in [('full','app/api/full-report/route.js'),('session','app/api/full-report/session/route.js')]:
              match = re.search(rf'^          {name} = (".*")$', workflow, re.MULTILINE)
              if not match: raise SystemExit(f'missing embedded {name} payload')
              Path(target).write_bytes(zlib.decompress(base64.b64decode(ast.literal_eval(match.group(1)))))
          suite = Path('scripts/run-security-closeout-verifier-suite.mjs')
          text = suite.read_text(encoding='utf-8')
          entry = '  "verify-premium-route-storage-reentry.mjs",\n'
          if entry not in text:
              anchor = '  "verify-premium-report-reentry-contract.mjs",\n'
              if text.count(anchor) != 1: raise SystemExit('security verifier anchor mismatch')
              suite.write_text(text.replace(anchor, anchor + entry, 1), encoding='utf-8')
          PY
          git add app/api/full-report/route.js app/api/full-report/session/route.js scripts/run-security-closeout-verifier-suite.mjs
          rm -f .github/workflows/premium-stack-merge-once.yml .github/workflows/premium-pr27-debug.yml .github/workflows/premium-pr27-final-diagnostic.yml .github/workflows/premium-pr27-finalize.yml
          git add -A
          node --check app/api/full-report/route.js
          node --check app/api/full-report/session/route.js
          git diff --cached --check
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json' || true)"
          git commit -m "merge(premium): integrate immutable route storage and reentry"
      - name: Verify complete integrated stack
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/verify-premium-route-storage-reentry.mjs
          node scripts/verify-premium-integrated-evaluation.mjs
          node scripts/verify-premium-report-reentry-contract.mjs
          node scripts/verify-premium-decision-state.mjs
          node scripts/verify-cross-domain-consistency.mjs
          node scripts/verify-condition-policy-single-source.mjs
          node scripts/verify-routine-policy-single-source.mjs
          node scripts/verify-functional-policy-single-source.mjs
          node scripts/run-security-closeout-verifier-suite.mjs
          npm run architecture:guard
          npm run build
          git diff --check
      - name: Push reviewed integration
        run: git push origin HEAD:integration/premium-engine-main-sec-baseline
