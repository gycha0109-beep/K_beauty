name: Stage 11C Hosted Revalidation Once

on:
  pull_request:
    types: [edited]
    branches:
      - codex/candidate-exposure-policy-shadow-runtime

permissions:
  contents: read

jobs:
  hosted-revalidation:
    if: github.event.pull_request.head.ref == 'codex/candidate-exposure-policy-shadow-evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_xuYA9OhCWlJETaYFOmeVodgS
      IMPLEMENTATION_SHA: 3d697efd3b7b90137c68e988d42487c7a58a92a2
      DEFAULT_DEPLOYMENT_ID: dpl_FBndGs9izVGgC32FUoRLJngcm5Dh
      DEFAULT_DEPLOYMENT_URL: https://k-beauty-36a69u14b-johnny-self.vercel.app
      SHADOW_DEPLOYMENT_ID: dpl_GGCBUfuwjAD52oF6pJiaSNhwApHy
      SHADOW_DEPLOYMENT_URL: https://k-beauty-euj8399kp-johnny-self.vercel.app
    steps:
      - name: Run exact-SHA KO/EN off/on probes
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          python3 - <<'PY'
          import binascii
          import hashlib
          import http.cookiejar
          import json
          import os
          import re
          import struct
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid
          import zlib

          TOKEN = os.environ['VERCEL_TOKEN']
          TEAM = os.environ['VERCEL_ORG_ID']
          SHA = os.environ['IMPLEMENTATION_SHA']
          deployments = {
              'off': {
                  'id': os.environ['DEFAULT_DEPLOYMENT_ID'],
                  'url': os.environ['DEFAULT_DEPLOYMENT_URL'],
              },
              'on': {
                  'id': os.environ['SHADOW_DEPLOYMENT_ID'],
                  'url': os.environ['SHADOW_DEPLOYMENT_URL'],
              },
          }
          api_headers = {
              'Authorization': f'Bearer {TOKEN}',
              'Content-Type': 'application/json',
          }
          bypasses = {}

          def api_request(path, method='GET', body=None):
              request = urllib.request.Request(
                  'https://api.vercel.com' + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers=api_headers,
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def share_secret(value):
              if isinstance(value, str):
                  match = re.search(r'[?&]_vercel_share=([^&]+)', value)
                  return urllib.parse.unquote(match.group(1)) if match else None
              if isinstance(value, dict):
                  for nested in value.values():
                      found = share_secret(nested)
                      if found:
                          return found
              if isinstance(value, list):
                  for nested in value:
                      found = share_secret(nested)
                      if found:
                          return found
              return None

          def verify_deployment(mode):
              deployment = deployments[mode]
              details = api_request(
                  '/v13/deployments/' + urllib.parse.quote(deployment['id'], safe='') +
                  '?' + urllib.parse.urlencode({'teamId': TEAM})
              )
              state = details.get('readyState') or details.get('state')
              if state != 'READY':
                  raise RuntimeError(f'{mode}_deployment_not_ready')
              if details.get('target') is not None:
                  raise RuntimeError(f'{mode}_deployment_not_preview')
              if details.get('meta', {}).get('githubCommitSha') != SHA:
                  raise RuntimeError(f'{mode}_deployment_sha_mismatch')
              if mode == 'on' and details.get('meta', {}).get('actor') != 'codex-stage11c-linked':
                  raise RuntimeError('shadow_deployment_actor_mismatch')

          def create_bypass(deployment_id):
              errors = []
              for prefix in ('/v2/aliases', '/aliases'):
                  path = (
                      f'{prefix}/{urllib.parse.quote(deployment_id, safe="")}/protection-bypass?' +
                      urllib.parse.urlencode({'teamId': TEAM})
                  )
                  try:
                      payload = api_request(path, method='PATCH', body={'ttl': 3600})
                      secret = share_secret(payload)
                      if secret:
                          print(f'::add-mask::{secret}')
                          return path, secret
                      errors.append('shareable_url_missing')
                  except urllib.error.HTTPError as error:
                      errors.append(str(error.code))
              raise RuntimeError('protection_bypass_unavailable:' + ','.join(errors))

          def revoke_bypass(path, secret):
              try:
                  api_request(
                      path,
                      method='PATCH',
                      body={'revoke': {'secret': secret, 'regenerate': False}},
                  )
              except Exception:
                  pass

          def open_session(base, secret):
              jar = http.cookiejar.CookieJar()
              opener = urllib.request.build_opener(
                  urllib.request.HTTPCookieProcessor(jar)
              )
              share_url = base + '/?_vercel_share=' + urllib.parse.quote(secret)
              with opener.open(share_url, timeout=60) as response:
                  response.read(1)
              return opener

          def png_fixture():
              width = height = 64
              raw = b''.join(
                  b'\x00' + bytes([196, 148, 132]) * width
                  for _ in range(height)
              )
              def chunk(kind, data):
                  return (
                      struct.pack('>I', len(data)) + kind + data +
                      struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)
                  )
              return (
                  b'\x89PNG\r\n\x1a\n' +
                  chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)) +
                  chunk(b'IDAT', zlib.compress(raw, 9)) +
                  chunk(b'IEND', b'')
              )

          fields = {
              'skinType': 'combination',
              'sensitivityLevel': 'low',
              'mainConcern': 'uneven_tone',
              'mainConcerns': '["uneven_tone","dehydration"]',
              'primaryConcern': 'uneven_tone',
              'recentSkinChange': 'no',
              'recentlyChangedProduct': 'no',
              'cleansingFrequency': 'twice',
              'texturePreference': 'gel',
              'postCleanseFeel': 'comfortable',
              'afternoonState': 'mostly_same',
              'environmentExposure': '["outdoor"]',
              'dislikedFeel': 'sticky',
              'genderPreference': 'unspecified',
              'whiteCastHate': 'true',
              'toneUpWanted': 'false',
              'makeupUse': 'true',
              'eyeSensitive': 'false',
              'sunscreenPreferenceState': 'answered',
              'outdoorExposure': 'true',
              'verySensitivePeriod': 'false',
              'currentProducts': '[]',
          }

          def multipart(locale):
              boundary = '----stage11c-' + uuid.uuid4().hex
              chunks = []
              for key, value in {**fields, 'locale': locale}.items():
                  chunks.append(
                      f'--{boundary}\r\n'
                      f'Content-Disposition: form-data; name="{key}"\r\n\r\n'
                      f'{value}\r\n'.encode()
                  )
              chunks.append(
                  f'--{boundary}\r\n'
                  'Content-Disposition: form-data; name="image"; '
                  'filename="stage11c-fixture.png"\r\n'
                  'Content-Type: image/png\r\n\r\n'.encode() +
                  png_fixture() + b'\r\n'
              )
              chunks.append(f'--{boundary}--\r\n'.encode())
              return boundary, b''.join(chunks)

          def stable(value):
              if isinstance(value, dict):
                  return {key: stable(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  return [stable(item) for item in value]
              return value

          def digest(value):
              encoded = json.dumps(
                  stable(value), ensure_ascii=False, separators=(',', ':')
              ).encode()
              return hashlib.sha256(encoded).hexdigest()

          def collect_ids(value, output):
              if isinstance(value, dict):
                  if isinstance(value.get('id'), str) and value['id']:
                      output.append(value['id'])
                  for key in sorted(value):
                      collect_ids(value[key], output)
              elif isinstance(value, list):
                  for item in value:
                      collect_ids(item, output)

          records = []
          try:
              verify_deployment('off')
              verify_deployment('on')
              for mode in ('off', 'on'):
                  bypasses[mode] = create_bypass(deployments[mode]['id'])
              sessions = {
                  mode: open_session(deployments[mode]['url'], bypasses[mode][1])
                  for mode in ('off', 'on')
              }

              for locale in ('ko', 'en'):
                  for mode in ('off', 'on'):
                      boundary, body = multipart(locale)
                      diagnostic_id = 'premium-session-diagnostic-' + str(uuid.uuid4())
                      request = urllib.request.Request(
                          deployments[mode]['url'] + '/api/analyze',
                          data=body,
                          headers={
                              'Content-Type': f'multipart/form-data; boundary={boundary}',
                              'x-bejewely-premium-diagnostic-id': diagnostic_id,
                          },
                          method='POST',
                      )
                      started = time.time()
                      try:
                          response = sessions[mode].open(request, timeout=180)
                          status = response.status
                          headers = dict(response.headers.items())
                          payload = json.loads(response.read())
                      except urllib.error.HTTPError as error:
                          status = error.code
                          try:
                              error_payload = json.loads(error.read())
                          except Exception:
                              error_payload = {}
                          raise RuntimeError(
                              f'{locale}_{mode}_http_{status}_' +
                              str(error_payload.get('code') or error_payload.get('error') or 'unknown')
                          )
                      if status != 200:
                          raise RuntimeError(f'{locale}_{mode}_http_{status}')

                      normalized = json.loads(json.dumps(payload))
                      normalized.pop('analysisRunId', None)
                      if isinstance(normalized.get('meta'), dict):
                          normalized['meta'].pop('generatedAt', None)
                      order = []
                      collect_ids(normalized, order)
                      lower_headers = {
                          str(key).lower(): value for key, value in headers.items()
                      }
                      records.append({
                          'locale': locale,
                          'mode': mode,
                          'httpStatus': status,
                          'durationMs': round((time.time() - started) * 1000),
                          'diagnosticId': diagnostic_id,
                          'responseFingerprint': digest(normalized),
                          'candidateOrderFingerprint': digest(order),
                          'candidateReferenceCount': len(order),
                          'runtimeCommit': lower_headers.get('x-bejewely-runtime-commit'),
                          'diagnosticVersion': lower_headers.get('x-bejewely-premium-diagnostic-version'),
                          'finalStage': lower_headers.get('x-bejewely-premium-final-stage'),
                      })

              pairs = {}
              for locale in ('ko', 'en'):
                  off = next(
                      item for item in records
                      if item['locale'] == locale and item['mode'] == 'off'
                  )
                  on = next(
                      item for item in records
                      if item['locale'] == locale and item['mode'] == 'on'
                  )
                  pairs[locale] = {
                      'responseFingerprintMatch': (
                          off['responseFingerprint'] == on['responseFingerprint']
                      ),
                      'candidateOrderFingerprintMatch': (
                          off['candidateOrderFingerprint'] == on['candidateOrderFingerprint']
                      ),
                      'candidateReferenceCountMatch': (
                          off['candidateReferenceCount'] == on['candidateReferenceCount']
                      ),
                  }

              if len(records) != 4:
                  raise RuntimeError('analyze_call_count_invalid')
              if any(item['runtimeCommit'] != SHA for item in records):
                  raise RuntimeError('runtime_commit_mismatch')

              result = {
                  'schemaVersion': 'stage11c-hosted-revalidation-aggregate-v1',
                  'implementationSha': SHA,
                  'defaultDeploymentId': deployments['off']['id'],
                  'shadowDeploymentId': deployments['on']['id'],
                  'analyzeCallCount': len(records),
                  'records': records,
                  'pairs': pairs,
              }
              with open('stage11c-hosted-revalidation-aggregate.json', 'w') as handle:
                  json.dump(result, handle, ensure_ascii=False, indent=2)
                  handle.write('\n')
              print(json.dumps({
                  'implementationSha': SHA,
                  'analyzeCallCount': len(records),
                  'http200Count': sum(item['httpStatus'] == 200 for item in records),
                  'runtimeCommitMatchCount': sum(item['runtimeCommit'] == SHA for item in records),
                  'premiumFinalStageCount': sum(
                      item['finalStage'] == 'S9_cookie_emission' for item in records
                  ),
                  'pairs': pairs,
              }, indent=2))
          finally:
              for path, secret in bypasses.values():
                  revoke_bypass(path, secret)
          PY

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage11c-hosted-revalidation-aggregate
          path: stage11c-hosted-revalidation-aggregate.json
          if-no-files-found: warn
          retention-days: 1
