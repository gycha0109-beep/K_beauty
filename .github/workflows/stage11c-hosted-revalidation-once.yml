name: Stage 11C Hosted Revalidation Once

on:
  pull_request:
    types: [edited]
    branches:
      - codex/candidate-exposure-policy-shadow-runtime

permissions:
  contents: read

jobs:
  hosted-revalidation:
    if: github.event.pull_request.head.ref == 'codex/candidate-exposure-policy-shadow-evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_xuYA9OhCWlJETaYFOmeVodgS
      VERCEL_PROJECT_ID: prj_VHh3BMegmXFGwxgOJLlgFQjksmKA
      IMPLEMENTATION_SHA: 1bc119347a2f8d3387a935163e24849ceebe349d
      IMPLEMENTATION_REF: codex/candidate-exposure-policy-shadow-evaluation
      DEFAULT_DEPLOYMENT_ID: dpl_2eueMeSRe72BNBu5tsVA7NscnDSp
      DEFAULT_DEPLOYMENT_URL: https://k-beauty-aqb363e1t-johnny-self.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1bc119347a2f8d3387a935163e24849ceebe349d
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create exact-SHA shadow-on Preview
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"

          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ['VERCEL_TOKEN']
          team = os.environ['VERCEL_ORG_ID']
          sha = os.environ['IMPLEMENTATION_SHA']
          deployment_id = os.environ['DEFAULT_DEPLOYMENT_ID']
          headers = {'Authorization': f'Bearer {token}'}
          endpoint = (
              'https://api.vercel.com/v13/deployments/'
              + urllib.parse.quote(deployment_id, safe='')
              + '?'
              + urllib.parse.urlencode({'teamId': team})
          )
          with urllib.request.urlopen(urllib.request.Request(endpoint, headers=headers), timeout=30) as response:
              deployment = json.load(response)
          state = deployment.get('readyState') or deployment.get('state')
          if state != 'READY':
              raise SystemExit('default_off_deployment_not_ready')
          if deployment.get('target') is not None:
              raise SystemExit('default_off_deployment_not_preview')
          if deployment.get('meta', {}).get('githubCommitSha') != sha:
              raise SystemExit('default_off_deployment_sha_mismatch')
          PY

          rm -rf .vercel
          mkdir -p .vercel
          python3 - <<'PY'
          import json, os
          with open('.vercel/project.json', 'w') as handle:
              json.dump({
                  'orgId': os.environ['VERCEL_ORG_ID'],
                  'projectId': os.environ['VERCEL_PROJECT_ID'],
              }, handle)
          PY

          vercel deploy --yes --force \
            --env DEV_ONLY_CANDIDATE_EXPOSURE_POLICY_SHADOW=1 \
            --meta githubCommitSha="$IMPLEMENTATION_SHA" \
            --meta githubCommitRef="$IMPLEMENTATION_REF" \
            --meta actor=codex-stage11c-remediated \
            --token="$VERCEL_TOKEN" > shadow-deploy.log

          python3 - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request

          text = open('shadow-deploy.log', errors='replace').read()
          urls = re.findall(r'https://[^\s]+?\.vercel\.app', text)
          if not urls:
              raise SystemExit('shadow_deployment_url_missing')
          deployment_url = urls[-1].rstrip('/')
          token = os.environ['VERCEL_TOKEN']
          team = os.environ['VERCEL_ORG_ID']
          sha = os.environ['IMPLEMENTATION_SHA']
          headers = {'Authorization': f'Bearer {token}'}
          endpoint = (
              'https://api.vercel.com/v13/deployments/'
              + urllib.parse.quote(deployment_url.removeprefix('https://'), safe='')
              + '?'
              + urllib.parse.urlencode({'teamId': team})
          )
          deadline = time.time() + 900
          while time.time() < deadline:
              with urllib.request.urlopen(urllib.request.Request(endpoint, headers=headers), timeout=30) as response:
                  deployment = json.load(response)
              state = deployment.get('readyState') or deployment.get('state')
              if state == 'READY':
                  if deployment.get('target') is not None:
                      raise SystemExit('shadow_deployment_not_preview')
                  if deployment.get('meta', {}).get('githubCommitSha') != sha:
                      raise SystemExit('shadow_deployment_sha_mismatch')
                  if deployment.get('meta', {}).get('actor') != 'codex-stage11c-remediated':
                      raise SystemExit('shadow_deployment_actor_mismatch')
                  with open('shadow-deployment.json', 'w') as handle:
                      json.dump({
                          'id': deployment['id'],
                          'url': 'https://' + deployment['url'],
                          'sha': sha,
                      }, handle)
                  print(json.dumps({
                      'shadowDeploymentId': deployment['id'],
                      'implementationSha': sha,
                  }))
                  break
              if state in {'ERROR', 'CANCELED'}:
                  raise SystemExit('shadow_deployment_failed')
              time.sleep(15)
          else:
              raise SystemExit('shadow_deployment_not_ready')
          PY

          rm -f shadow-deploy.log
          rm -rf .vercel

      - name: Run exactly four KO/EN off/on probes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import binascii
          import hashlib
          import json
          import os
          import struct
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid
          import zlib

          TOKEN = os.environ['VERCEL_TOKEN']
          TEAM = os.environ['VERCEL_ORG_ID']
          PROJECT = os.environ['VERCEL_PROJECT_ID']
          SHA = os.environ['IMPLEMENTATION_SHA']
          DEPLOYMENTS = {
              'off': {
                  'id': os.environ['DEFAULT_DEPLOYMENT_ID'],
                  'url': os.environ['DEFAULT_DEPLOYMENT_URL'],
              },
              'on': json.load(open('shadow-deployment.json')),
          }
          API_HEADERS = {
              'Authorization': f'Bearer {TOKEN}',
              'Content-Type': 'application/json',
          }
          BYPASS_ENDPOINT = (
              f'/v1/projects/{urllib.parse.quote(PROJECT, safe="")}/protection-bypass?'
              + urllib.parse.urlencode({'teamId': TEAM})
          )
          PROJECT_ENDPOINT = (
              f'/v9/projects/{urllib.parse.quote(PROJECT, safe="")}?'
              + urllib.parse.urlencode({'teamId': TEAM})
          )
          records = []
          bypass_secret = None
          probe_error = None
          cleanup_error = None

          def api_request(path, method='GET', body=None):
              request = urllib.request.Request(
                  'https://api.vercel.com' + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers=API_HEADERS,
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def project_bypass_map():
              value = api_request(PROJECT_ENDPOINT).get('protectionBypass')
              return value if isinstance(value, dict) else {}

          def generate_bypass():
              before = set(project_bypass_map())
              note = 'Stage 11C remediated exact-SHA probe temporary'
              api_request(
                  BYPASS_ENDPOINT,
                  method='PATCH',
                  body={'generate': {'note': note}},
              )
              after = project_bypass_map()
              created = [
                  secret for secret in set(after) - before
                  if isinstance(after.get(secret), dict)
                  and after[secret].get('scope') == 'automation-bypass'
                  and after[secret].get('note') == note
              ]
              if len(created) != 1:
                  raise RuntimeError('temporary_bypass_identification_failed')
              print(f'::add-mask::{created[0]}')
              return created[0]

          def revoke_bypass(secret):
              api_request(
                  BYPASS_ENDPOINT,
                  method='PATCH',
                  body={'revoke': {'secret': secret, 'regenerate': False}},
              )
              if secret in project_bypass_map():
                  raise RuntimeError('temporary_bypass_cleanup_failed')

          def png_fixture():
              width = height = 64
              raw = b''.join(
                  b'\x00' + bytes([196, 148, 132]) * width
                  for _ in range(height)
              )
              def chunk(kind, data):
                  return (
                      struct.pack('>I', len(data)) + kind + data
                      + struct.pack('>I', binascii.crc32(kind + data) & 0xffffffff)
                  )
              return (
                  b'\x89PNG\r\n\x1a\n'
                  + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
                  + chunk(b'IDAT', zlib.compress(raw, 9))
                  + chunk(b'IEND', b'')
              )

          fields = {
              'skinType': 'combination',
              'sensitivityLevel': 'low',
              'mainConcern': 'uneven_tone',
              'mainConcerns': '["uneven_tone","dehydration"]',
              'primaryConcern': 'uneven_tone',
              'recentSkinChange': 'no',
              'recentlyChangedProduct': 'no',
              'cleansingFrequency': 'twice',
              'texturePreference': 'gel',
              'postCleanseFeel': 'comfortable',
              'afternoonState': 'mostly_same',
              'environmentExposure': '["outdoor"]',
              'dislikedFeel': 'sticky',
              'genderPreference': 'unspecified',
              'whiteCastHate': 'true',
              'toneUpWanted': 'false',
              'makeupUse': 'true',
              'eyeSensitive': 'false',
              'sunscreenPreferenceState': 'answered',
              'outdoorExposure': 'true',
              'verySensitivePeriod': 'false',
              'currentProducts': '[]',
          }

          def multipart(locale):
              boundary = '----stage11c-' + uuid.uuid4().hex
              chunks = []
              for key, value in {**fields, 'locale': locale}.items():
                  chunks.append(
                      f'--{boundary}\r\n'
                      f'Content-Disposition: form-data; name="{key}"\r\n\r\n'
                      f'{value}\r\n'.encode()
                  )
              chunks.append(
                  f'--{boundary}\r\n'
                  'Content-Disposition: form-data; name="image"; '
                  'filename="stage11c-fixture.png"\r\n'
                  'Content-Type: image/png\r\n\r\n'.encode()
                  + png_fixture() + b'\r\n'
              )
              chunks.append(f'--{boundary}--\r\n'.encode())
              return boundary, b''.join(chunks)

          def stable(value):
              if isinstance(value, dict):
                  return {key: stable(value[key]) for key in sorted(value)}
              if isinstance(value, list):
                  return [stable(item) for item in value]
              return value

          def digest(value):
              return hashlib.sha256(
                  json.dumps(stable(value), ensure_ascii=False, separators=(',', ':')).encode()
              ).hexdigest()

          def collect_ids(value, output):
              if isinstance(value, dict):
                  if isinstance(value.get('id'), str) and value['id']:
                      output.append(value['id'])
                  for key in sorted(value):
                      collect_ids(value[key], output)
              elif isinstance(value, list):
                  for item in value:
                      collect_ids(item, output)

          def run_probe(locale, mode, secret):
              boundary, body = multipart(locale)
              diagnostic_id = 'premium-session-diagnostic-' + str(uuid.uuid4())
              request = urllib.request.Request(
                  DEPLOYMENTS[mode]['url'] + '/api/analyze',
                  data=body,
                  headers={
                      'Content-Type': f'multipart/form-data; boundary={boundary}',
                      'x-vercel-protection-bypass': secret,
                      'x-bejewely-premium-diagnostic-id': diagnostic_id,
                  },
                  method='POST',
              )
              started = time.time()
              try:
                  response = urllib.request.urlopen(request, timeout=180)
                  status = response.status
                  headers = dict(response.headers.items())
                  payload = json.loads(response.read())
              except urllib.error.HTTPError as error:
                  status = error.code
                  try:
                      error_payload = json.loads(error.read())
                  except Exception:
                      error_payload = {}
                  code = error_payload.get('code') or error_payload.get('error') or 'unknown'
                  raise RuntimeError(f'{locale}_{mode}_http_{status}_{code}')
              if status != 200:
                  raise RuntimeError(f'{locale}_{mode}_http_{status}')

              normalized = json.loads(json.dumps(payload))
              normalized.pop('analysisRunId', None)
              if isinstance(normalized.get('meta'), dict):
                  normalized['meta'].pop('generatedAt', None)
              order = []
              collect_ids(normalized, order)
              lower = {str(key).lower(): value for key, value in headers.items()}
              records.append({
                  'locale': locale,
                  'mode': mode,
                  'httpStatus': status,
                  'durationMs': round((time.time() - started) * 1000),
                  'diagnosticId': diagnostic_id,
                  'responseFingerprint': digest(normalized),
                  'candidateOrderFingerprint': digest(order),
                  'candidateReferenceCount': len(order),
                  'runtimeCommit': lower.get('x-bejewely-runtime-commit'),
                  'diagnosticVersion': lower.get('x-bejewely-premium-diagnostic-version'),
                  'finalStage': lower.get('x-bejewely-premium-final-stage'),
              })

          try:
              bypass_secret = generate_bypass()
              for locale, mode in (
                  ('ko', 'off'),
                  ('ko', 'on'),
                  ('en', 'off'),
                  ('en', 'on'),
              ):
                  run_probe(locale, mode, bypass_secret)

              if len(records) != 4:
                  raise RuntimeError('analyze_call_count_invalid')
              if any(record['runtimeCommit'] != SHA for record in records):
                  raise RuntimeError('runtime_commit_mismatch')
              if any(record['finalStage'] != 'S9_cookie_emission' for record in records):
                  raise RuntimeError('premium_final_stage_mismatch')
          except Exception as error:
              probe_error = error
          finally:
              if bypass_secret:
                  try:
                      revoke_bypass(bypass_secret)
                  except Exception as error:
                      cleanup_error = error

          pairs = {}
          if len(records) == 4:
              for locale in ('ko', 'en'):
                  off = next(item for item in records if item['locale'] == locale and item['mode'] == 'off')
                  on = next(item for item in records if item['locale'] == locale and item['mode'] == 'on')
                  pairs[locale] = {
                      'responseFingerprintMatch': off['responseFingerprint'] == on['responseFingerprint'],
                      'candidateOrderFingerprintMatch': off['candidateOrderFingerprint'] == on['candidateOrderFingerprint'],
                      'candidateReferenceCountMatch': off['candidateReferenceCount'] == on['candidateReferenceCount'],
                  }
              if any(not value['candidateOrderFingerprintMatch'] for value in pairs.values()):
                  probe_error = probe_error or RuntimeError('candidate_order_fingerprint_mismatch')
              if any(not value['candidateReferenceCountMatch'] for value in pairs.values()):
                  probe_error = probe_error or RuntimeError('candidate_reference_count_mismatch')

          result = {
              'schemaVersion': 'stage11c-hosted-revalidation-aggregate-v3',
              'implementationSha': SHA,
              'defaultDeploymentId': DEPLOYMENTS['off']['id'],
              'shadowDeploymentId': DEPLOYMENTS['on']['id'],
              'plannedAnalyzeCallCount': 4,
              'completedAnalyzeCallCount': len(records),
              'http200Count': sum(record['httpStatus'] == 200 for record in records),
              'runtimeCommitMatchCount': sum(record['runtimeCommit'] == SHA for record in records),
              'premiumFinalStageCount': sum(record['finalStage'] == 'S9_cookie_emission' for record in records),
              'temporaryAutomationBypassCreated': bypass_secret is not None,
              'temporaryAutomationBypassRevoked': bypass_secret is not None and cleanup_error is None,
              'records': records,
              'pairs': pairs,
              'errorCategory': (
                  'cleanup_failed' if cleanup_error is not None
                  else 'probe_failed' if probe_error is not None
                  else 'none'
              ),
          }
          with open('stage11c-hosted-revalidation-aggregate.json', 'w') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          print(json.dumps({
              key: value for key, value in result.items() if key != 'records'
          }, ensure_ascii=False, indent=2))

          if cleanup_error is not None:
              raise cleanup_error
          if probe_error is not None:
              raise probe_error
          PY

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage11c-remediated-hosted-revalidation
          path: stage11c-hosted-revalidation-aggregate.json
          if-no-files-found: error
          retention-days: 1
