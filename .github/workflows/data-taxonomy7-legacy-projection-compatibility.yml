name: DATA-TAXONOMY7 Legacy Projection Compatibility

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/data-taxonomy7-legacy-projection-compatibility.yml"
      - "lib/catalog-product-legacy-projection-compatibility.mjs"
      - "evidence/catalog-taxonomy-v1/data-taxonomy7-legacy-projection-compatibility-v1.json"
      - "scripts/product-evidence/verify-data-taxonomy7-legacy-projection-compatibility-v1.mjs"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/data-taxonomy7-legacy-projection-compatibility.yml"
      - "lib/catalog-product-legacy-projection-compatibility.mjs"
      - "evidence/catalog-taxonomy-v1/data-taxonomy7-legacy-projection-compatibility-v1.json"
      - "scripts/product-evidence/verify-data-taxonomy7-legacy-projection-compatibility-v1.mjs"

permissions:
  contents: read

env:
  DATA_TAXONOMY7_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    name: Legacy projection compatibility contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_TAXONOMY7_CHECKOUT_SHA }}
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$DATA_TAXONOMY7_CHECKOUT_SHA"

      - name: Verify DATA-TAXONOMY7 compatibility contract
        run: node scripts/product-evidence/verify-data-taxonomy7-legacy-projection-compatibility-v1.mjs
