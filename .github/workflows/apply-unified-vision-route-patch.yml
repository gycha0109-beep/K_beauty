name: Apply unified Vision route patch

on:
  push:
    branches:
      - design/unified-vision-observation-pipeline
    paths:
      - scripts/apply-unified-vision-route-patch.mjs
      - .github/workflows/apply-unified-vision-route-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/unified-vision-observation-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-unified-vision-route-patch.mjs
      - run: node scripts/verify-unified-vision-pipeline.mjs
      - run: git diff --check
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-unified-vision-route-patch.mjs
          git rm .github/workflows/apply-unified-vision-route-patch.yml
          git add app/api/analyze/route.js app/page.js package.json scripts/verify-unified-vision-pipeline.mjs
          git commit -m "feat(vision): unify runtime image analysis pipeline"
          git push origin HEAD:design/unified-vision-observation-pipeline
