name: Dependency security final-head validation

on:
  pull_request:
    branches:
      - codex/dependency-security-triage-validation-base

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR 147 final head
        uses: actions/checkout@v4
        with:
          ref: ce882aa2057a06d39d86f99a09f4264725b4161b
          fetch-depth: 0

      - name: Restore verifier local refs
        run: |
          git branch -f codex/stage10-hosted-preview-user-flow origin/codex/stage10-hosted-preview-user-flow
          git branch -f codex/candidate-policy-runtime-reevaluation origin/codex/candidate-policy-runtime-reevaluation

      - name: Verify exact three-file boundary
        shell: bash
        run: |
          git diff --name-status 87e3c6b8028b50b84a8bff7f2fc43087b2b78a20 HEAD | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          A	docs/verification/dependency-security-triage-and-remediation-result.md
          M	package-lock.json
          M	package.json
          EOF
          sort /tmp/expected.txt -o /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Verify zero audit findings and resolved graph
        run: |
          mkdir -p /tmp/dependency-security-final
          npm audit --json > /tmp/dependency-security-final/npm-audit.json
          npm ls next sharp postcss picomatch --all > /tmp/dependency-security-final/npm-ls.txt
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const audit = JSON.parse(readFileSync('/tmp/dependency-security-final/npm-audit.json', 'utf8'));
          if (audit.metadata?.vulnerabilities?.total !== 0) throw new Error('npm audit is not clean');
          console.log('DEPENDENCY_AUDIT=PASS total=0');
          NODE
          cat /tmp/dependency-security-final/npm-ls.txt

      - name: Security closeout verifier suite
        run: node scripts/run-security-closeout-verifier-suite.mjs

      - name: Architecture guard
        run: npm run architecture:guard

      - name: Production build
        run: npm run build

      - name: Next image optimization smoke
        shell: bash
        run: |
          npm run start > /tmp/next-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --output /tmp/optimized-image.bin --dump-header /tmp/optimized-image.headers 'http://127.0.0.1:3001/_next/image?url=%2Ficon.png&w=64&q=75'; then
              break
            fi
            sleep 1
          done
          test -s /tmp/optimized-image.bin
          grep -Ei '^content-type: image/' /tmp/optimized-image.headers
          cat /tmp/optimized-image.headers
          cat /tmp/next-start.log

      - name: Collect final-head evidence
        run: |
          mkdir -p tmp/dependency-security-final
          cp /tmp/dependency-security-final/npm-audit.json tmp/dependency-security-final/
          cp /tmp/dependency-security-final/npm-ls.txt tmp/dependency-security-final/
          cp /tmp/optimized-image.headers tmp/dependency-security-final/
          cp tmp/security-closeout-verifier-suite.json tmp/dependency-security-final/
          git diff --stat 87e3c6b8028b50b84a8bff7f2fc43087b2b78a20 HEAD > tmp/dependency-security-final/diff-stat.txt

      - name: Upload final-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-final-head-evidence
          path: tmp/dependency-security-final
          if-no-files-found: error
