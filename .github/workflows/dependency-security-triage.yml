name: Dependency security remediation candidate

on:
  pull_request:
    branches:
      - codex/dependency-security-triage-validation-base

permissions:
  contents: read

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Stage 11M final head
        uses: actions/checkout@v4
        with:
          ref: 87e3c6b8028b50b84a8bff7f2fc43087b2b78a20
          fetch-depth: 0

      - name: Restore verifier local refs
        run: |
          git branch -f codex/stage10-hosted-preview-user-flow origin/codex/stage10-hosted-preview-user-flow
          git branch -f codex/candidate-policy-runtime-reevaluation origin/codex/candidate-policy-runtime-reevaluation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate minimal remediation lockfile
        run: |
          npm pkg set dependencies.next=15.5.22
          npm pkg set dependencies.sharp=0.35.3
          npm pkg set devDependencies.postcss='^8.5.25'
          npm pkg set overrides.next.postcss=8.5.25
          npm pkg set overrides.next.sharp=0.35.3
          npm install --package-lock-only
          npm audit fix --package-lock-only

      - name: Enforce two-file candidate boundary
        shell: bash
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          printf 'package-lock.json\npackage.json\n' > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit candidate locally for clean-tree verifiers
        run: |
          git config user.name stage11n-validator
          git config user.email stage11n-validator@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m 'chore(security): remediate dependency advisories'

      - name: Install remediated lockfile
        run: npm ci

      - name: Verify resolved dependency graph
        run: |
          mkdir -p tmp/dependency-security-remediation
          npm audit --json > tmp/dependency-security-remediation/npm-audit.json
          npm ls next sharp postcss picomatch --all > tmp/dependency-security-remediation/npm-ls.txt
          cat tmp/dependency-security-remediation/npm-audit.json
          cat tmp/dependency-security-remediation/npm-ls.txt

      - name: Security closeout verifier suite
        run: node scripts/run-security-closeout-verifier-suite.mjs

      - name: Architecture guard
        run: npm run architecture:guard

      - name: Production build
        run: npm run build

      - name: Next image optimization smoke
        shell: bash
        run: |
          npm run start > /tmp/next-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --output /tmp/optimized-image.bin --dump-header /tmp/optimized-image.headers 'http://127.0.0.1:3001/_next/image?url=%2Ficon.png&w=64&q=75'; then
              break
            fi
            sleep 1
          done
          test -s /tmp/optimized-image.bin
          grep -Ei '^content-type: image/' /tmp/optimized-image.headers
          cat /tmp/optimized-image.headers
          cat /tmp/next-start.log

      - name: Capture package diff
        run: |
          git show --format= --binary HEAD -- package.json package-lock.json > tmp/dependency-security-remediation/package-diff.patch
          cp package.json package-lock.json tmp/dependency-security-remediation/

      - name: Upload remediation candidate
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-remediation-candidate
          path: tmp/dependency-security-remediation
          if-no-files-found: error
