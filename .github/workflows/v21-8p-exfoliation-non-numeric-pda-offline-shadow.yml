name: V21-8P Exfoliation Non-Numeric PDA Offline Shadow
on:
  push:
    branches: [feat/v21-8p-exfoliation-non-numeric-pda-offline-shadow, main]
    paths:
      - '.github/workflows/v21-8p-exfoliation-non-numeric-pda-offline-shadow.yml'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/**'
      - 'docs/evidence/exfoliation-non-numeric-pda-offline-shadow-implementation-v1.md'
      - 'scripts/product-evidence/exfoliation-non-numeric-pda-offline-shadow-v1.mjs'
      - 'scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-8p-exfoliation-non-numeric-pda-offline-shadow.yml'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/**'
      - 'docs/evidence/exfoliation-non-numeric-pda-offline-shadow-implementation-v1.md'
      - 'scripts/product-evidence/exfoliation-non-numeric-pda-offline-shadow-v1.mjs'
      - 'scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs'
  workflow_dispatch:
permissions: {contents: read}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      START_MAIN_SHA: 8f8d492f2682c97f71f3f7880adb710f1be4c7f2
      SNAPSHOT_SHA256: 31311c223cfc1084e02e226e36b60b6052884f16c52cdc3f5308b786641a9fea
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Exact repository authority
        env:
          PR_BASE_SHA: '${{ github.event.pull_request.base.sha }}'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$START_MAIN_SHA" HEAD
          if [ "${{ github.event_name }}" = pull_request ]; then
            test -n "$PR_BASE_SHA"
            git merge-base --is-ancestor "$START_MAIN_SHA" "$PR_BASE_SHA"
            if [ "$PR_BASE_SHA" != "$START_MAIN_SHA" ]; then
              mapfile -t drift < <(git diff --name-only "$START_MAIN_SHA..$PR_BASE_SHA" | sort)
              for f in "${drift[@]}"; do
                case "$f" in
                  .codex/AI_WORK_LOG.md|docs/domain/facelab/*|evidence/facelab/*) ;;
                  *) echo "related or unclassified PR-base drift: $f" >&2; exit 1 ;;
                esac
              done
            fi
          fi

      - name: Frozen V2.1-8O contract authority
        run: |
          set -euo pipefail
          test "$(sha256sum evidence/product-decision-axis-non-numeric-contract-v1/exfoliation-non-numeric-pda-contract-v1.json | awk '{print $1}')" = c85418df574b550672f9523bd6827e4265b57a9d7901e5bf8f6b4de203d45d40
          test "$(sha256sum evidence/product-decision-axis-non-numeric-contract-v1/exfoliation-non-numeric-pda-examples-v1.json | awk '{print $1}')" = 3b93bee53229cf19c65f2bbb85db4f2f50570da086a370d4f9fe73ba83763cab
          test "$(sha256sum evidence/product-decision-axis-non-numeric-contract-v1/exfoliation-non-numeric-pda-replay-v1.json | awk '{print $1}')" = d7192c0f16f4916849b800dee24c4a073435de60e49de238e6a9d7893a938500
          test "$(sha256sum docs/evidence/exfoliation-non-numeric-product-decision-axis-contract-v1.md | awk '{print $1}')" = 98bff1780121333b1b5d358d5581dde905380013b4dc1d67cb4e972b9adb39ba
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-contract-v1.mjs

      - name: Frozen Hosted input snapshot
        run: |
          set -euo pipefail
          test "$(sha256sum evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-current-input-v1.json | awk '{print $1}')" = "$SNAPSHOT_SHA256"
          node - <<'NODE'
          const fs = require("fs");
          const x = JSON.parse(fs.readFileSync("evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-current-input-v1.json","utf8"));
          if (x.stage !== "V2.1-8P") process.exit(1);
          if (x.hosted_counts.catalog !== 164 || x.hosted_counts.current !== 41 || x.hosted_counts.subjects !== 16) process.exit(1);
          if (x.snapshot_scope.current_rows_in_snapshot !== 28) process.exit(1);
          if (x.snapshot_scope.raw_evidence_bodies_included !== false) process.exit(1);
          if (x.snapshot_scope.unstable_access_timestamps_included !== false) process.exit(1);
          NODE

      - name: Build A B byte determinism and checked-in equality
        run: |
          set -euo pipefail
          node --check scripts/product-evidence/exfoliation-non-numeric-pda-offline-shadow-v1.mjs
          node --check scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs
          for x in a b; do
            rm -rf "/tmp/8p-$x"
            V21_8P_OUTPUT_ROOT="/tmp/8p-$x" node scripts/product-evidence/exfoliation-non-numeric-pda-offline-shadow-v1.mjs > "/tmp/8p-$x.log"
          done
          for f in \
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-offline-shadow-output-v1.json \
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-offline-shadow-summary-v1.json \
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-offline-shadow-replay-v1.json \
            docs/evidence/exfoliation-non-numeric-pda-offline-shadow-implementation-v1.md
          do
            cmp -s "/tmp/8p-a/$f" "/tmp/8p-b/$f"
            cmp -s "$f" "/tmp/8p-a/$f"
          done
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs | tee /tmp/8p-verifier.log
          sha256sum \
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-current-input-v1.json \
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-offline-shadow-output-v1.json \
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-offline-shadow-summary-v1.json \
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-offline-shadow-replay-v1.json \
            docs/evidence/exfoliation-non-numeric-pda-offline-shadow-implementation-v1.md | tee /tmp/8p-hashes.log

      - name: Historical V2.1-8J through V2.1-8O replay
        run: |
          set -euo pipefail
          node scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-anchor-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs
          node scripts/product-evidence/verify-exfoliation-load-calibration-feasibility-reassessment-v1.mjs
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-contract-v1.mjs

      - name: 164 x 12 production invariance
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q 783afb91a964f5d762f46846f9ef854902b48e95
          V21_7_BASE_MAIN_SHA=e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87 RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-product-decision-axis-comparator-v1.mjs
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-skin-decision-recommendation-invariance.mjs | tee /tmp/8p-production.log
          rm -rf _reference

      - name: Exact additive scope no production import no mutation path
        env:
          PR_BASE_SHA: '${{ github.event.pull_request.base.sha }}'
        run: |
          set -euo pipefail
          scope_base="$START_MAIN_SHA"
          if [ "${{ github.event_name }}" = pull_request ]; then
            scope_base="$(git merge-base "$PR_BASE_SHA" HEAD)"
          elif [ "${{ github.ref }}" = refs/heads/main ]; then
            scope_base="$(git rev-parse HEAD^1)"
          fi
          mapfile -t changed < <(git diff --name-only "$scope_base..HEAD" | sort)
          test "${#changed[@]}" -eq 8
          expected=(
            .github/workflows/v21-8p-exfoliation-non-numeric-pda-offline-shadow.yml
            docs/evidence/exfoliation-non-numeric-pda-offline-shadow-implementation-v1.md
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-current-input-v1.json
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-offline-shadow-output-v1.json
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-offline-shadow-replay-v1.json
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-offline-shadow-summary-v1.json
            scripts/product-evidence/exfoliation-non-numeric-pda-offline-shadow-v1.mjs
            scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test -z "$(git diff --name-only "$scope_base..HEAD" -- app components lib supabase/migrations package.json package-lock.json)"
          test -z "$(git diff --name-only "$scope_base..HEAD" -- evidence/product-decision-axis-contract-v1 evidence/product-decision-axis-calibration-v1 evidence/product-decision-axis-anchor-contract-v1 evidence/product-decision-axis-anchor-research-v1 evidence/product-decision-axis-feasibility-v1 evidence/product-decision-axis-non-numeric-contract-v1)"
          git diff --check "$scope_base..HEAD"
          test -z "$(git grep -n 'exfoliation-non-numeric-pda-offline-shadow-v1' -- app components lib 2>/dev/null || true)"
          mapper=scripts/product-evidence/exfoliation-non-numeric-pda-offline-shadow-v1.mjs
          if grep -En "from[[:space:]]+[\047\042](node:https|node:http|@supabase)|fetch[[:space:]]*\\(|axios|supabase[.]from|INSERT[[:space:]]+INTO|UPDATE[[:space:]]+product_fact|DELETE[[:space:]]+FROM|CREATE[[:space:]]+TABLE|ALTER[[:space:]]+TABLE" "$mapper"; then
            exit 1
          fi
          grep -q '"primary_terminal_outcome":"NON_NUMERIC_EXFOLIATION_PDA_OFFLINE_SHADOW_REPLAY_VALIDATED"' evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-offline-shadow-output-v1.json
