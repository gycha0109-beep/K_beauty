name: Face Lab GNM v3 Executable PoC

on:
  pull_request:
    paths:
      - "scripts/face-lab-gnm-v3-poc.py"
      - "evidence/facelab/face-space-3d/v0/google-gnm-v3-adapter.manifest.json"
      - "docs/domain/facelab/face-lab-face-space-3d-adapter-v0.md"
      - ".github/workflows/face-lab-gnm-v3-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: face-lab-gnm-v3-poc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gnm-v3-poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install minimal NumPy GNM research runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            absl-py \
            etils \
            imageio \
            immutabledict \
            importlib-resources \
            numpy \
            opencv-python-headless \
            opt-einsum \
            scipy \
            tqdm \
            typeguard

      - name: Fetch exact Google GNM revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/google-gnm
          git -C .cache/google-gnm init
          git -C .cache/google-gnm remote add origin https://github.com/google/GNM.git
          git -C .cache/google-gnm fetch --depth=1 origin a424b5153eec9154f3dfa5ee7f214e5817918d54
          git -C .cache/google-gnm checkout --detach FETCH_HEAD
          test "$(git -C .cache/google-gnm rev-parse HEAD)" = "a424b5153eec9154f3dfa5ee7f214e5817918d54"

      - name: Verify pinned GNM model blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .cache/google-gnm rev-parse HEAD:gnm/shape/data/versions/v3_0/gnm_head.npz)" = "b49ac631e4d3388e42640555c0b25c4fd134b1b8"
          test "$(stat -c%s .cache/google-gnm/gnm/shape/data/versions/v3_0/gnm_head.npz)" = "53305389"

      - name: Compile PoC runner
        run: python -m py_compile scripts/face-lab-gnm-v3-poc.py

      - name: Probe exact GNM v3 head
        env:
          PYTHONPATH: ${{ github.workspace }}/.cache/google-gnm
        run: |
          python scripts/face-lab-gnm-v3-poc.py probe \
            --output evidence/facelab/face-space-3d/v0/runtime/gnm-v3-probe.json

      - name: Run synthetic structural round-trip
        env:
          PYTHONPATH: ${{ github.workspace }}/.cache/google-gnm
        run: |
          python scripts/face-lab-gnm-v3-poc.py selftest \
            --fit-components 6 \
            --ridge 0.01 \
            --output evidence/facelab/face-space-3d/v0/runtime/gnm-v3-selftest.json

      - name: Scan local GNM controllability
        env:
          PYTHONPATH: ${{ github.workspace }}/.cache/google-gnm
        run: |
          python scripts/face-lab-gnm-v3-poc.py sensitivity \
            --components 24 \
            --amplitude 0.25 \
            --output evidence/facelab/face-space-3d/v0/runtime/gnm-v3-sensitivity.json

      - name: Show PoC results
        if: always()
        shell: bash
        run: |
          cat evidence/facelab/face-space-3d/v0/runtime/gnm-v3-probe.json
          cat evidence/facelab/face-space-3d/v0/runtime/gnm-v3-selftest.json
          test ! -f evidence/facelab/face-space-3d/v0/runtime/gnm-v3-sensitivity.json || cat evidence/facelab/face-space-3d/v0/runtime/gnm-v3-sensitivity.json

      - name: Upload research PoC evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: face-lab-gnm-v3-poc-${{ github.sha }}
          path: evidence/facelab/face-space-3d/v0/runtime/
          if-no-files-found: error
          retention-days: 14
