name: "[WT:trust] P2-C Known Sunscreen Live Pilot"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trust-p2c-known-product-live.yml"
      - "scripts/trust-p2c-known-product-smoke.mjs"
      - "scripts/verify-trust-p2c-known-product-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-p2c-one-governed-known-sunscreen
  cancel-in-progress: false

jobs:
  one-known-product:
    name: Official robots and one known sunscreen metadata check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify offline product smoke guardrails
        run: node scripts/verify-trust-p2c-known-product-smoke.mjs
      - name: Verify robots then fetch one existing governed sunscreen product
        env:
          TRUST_P2C_PRODUCT_LIVE_ENABLED: "true"
        run: node scripts/trust-p2c-known-product-smoke.mjs --execute
