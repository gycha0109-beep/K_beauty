name: Face Lab Manual Roll Capture Gate
# bridge-revision: consented-local-v1
# complete-stability-bridge: v1

on:
  pull_request:
    paths:
      - "evidence/facelab/source-intake/v0/manual-roll-capture.contract.json"
      - "docs/domain/facelab/face-lab-manual-roll-capture-protocol-v0.md"
      - "scripts/build-face-lab-manual-roll-measurement-manifest.mjs"
      - "scripts/run-face-lab-manual-roll-local.mjs"
      - "scripts/verify-face-lab-manual-roll-measurement-evidence.mjs"
      - "scripts/build-face-lab-complete-stability-evidence.mjs"
      - "scripts/verify-face-lab-complete-stability-evidence.mjs"
      - "scripts/verify-face-lab-manual-roll-capture-contract.mjs"
      - ".github/workflows/face-lab-manual-roll-capture-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: face-lab-manual-roll-capture-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout exact Face Lab head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact event head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify manual roll capture contract
        run: |
          node scripts/verify-face-lab-manual-roll-capture-contract.mjs
          node --check scripts/build-face-lab-manual-roll-measurement-manifest.mjs
          node --check scripts/run-face-lab-manual-roll-local.mjs
          node --check scripts/verify-face-lab-manual-roll-measurement-evidence.mjs
          node --check scripts/build-face-lab-complete-stability-evidence.mjs
          node --check scripts/verify-face-lab-complete-stability-evidence.mjs
