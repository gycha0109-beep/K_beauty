name: V2.1-9M Durable Evidence Readback

on:
  push:
    branches:
      - feat/v21-9m-durable-evidence-readback
      - main
  pull_request:
    paths:
      - ".github/workflows/v21-9m-durable-evidence-readback.yml"
      - "lib/exfoliation-normative-policy-durable-evidence-readback.js"
      - "scripts/product-evidence/verify-v21-9m-durable-evidence-readback-v1.mjs"
      - "supabase/migrations/20260820094500_v21_9m_shadow_evidence_readback_v1.sql"
      - "docs/evidence/v21-9m-durable-evidence-readback-v1.md"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: v21-9m-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  V21_9M_BASE_MAIN_SHA: 62ce5b20ac1b9ad19bf159e40a0c59eca9b5b38a
  V21_9I_RECOMMENDATION_REFERENCE_SHA: 783afb91a964f5d762f46846f9ef854902b48e95
  V21_9M_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-v21-9m:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout exact PR head or merged-main SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.V21_9M_CHECKOUT_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact starting authority and ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$V21_9M_CHECKOUT_SHA"
          git merge-base --is-ancestor "$V21_9M_BASE_MAIN_SHA" HEAD
          test "$(git merge-base "$V21_9M_BASE_MAIN_SHA" HEAD)" = "$V21_9M_BASE_MAIN_SHA"

      - name: Bounded V2.1-9M change scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$V21_9M_BASE_MAIN_SHA")"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/v21-9m-durable-evidence-readback\.yml|lib/exfoliation-normative-policy-durable-evidence-readback\.js|scripts/product-evidence/verify-v21-9m-durable-evidence-readback-v1\.mjs|supabase/migrations/20260820094500_v21_9m_shadow_evidence_readback_v1\.sql|docs/evidence/v21-9m-durable-evidence-readback-v1\.md)$' || true)"
          test -z "$forbidden"

      - name: No Recommendation Product Fact CandidatePolicy or activation semantic change
        run: |
          set -euo pipefail
          git diff --exit-code "$V21_9M_BASE_MAIN_SHA" -- \
            lib/recommendation-scoring.js \
            lib/candidate-exposure-policy-shadow.js \
            lib/exfoliation-non-numeric-pda-normative-production-policy-shadow.js \
            lib/exfoliation-normative-policy-activation-runtime.js \
            lib/exfoliation-normative-policy-production-shadow-observer.js \
            lib/exfoliation-normative-policy-runtime-observability.js \
            lib/exfoliation-normative-policy-organic-evidence-context.js \
            lib/exfoliation-normative-policy-organic-evidence-store.js \
            lib/product-decision-axis-mapper-v1.js
          changed_migrations="$(git diff --name-only "$V21_9M_BASE_MAIN_SHA" -- supabase/migrations)"
          test "$changed_migrations" = "supabase/migrations/20260820094500_v21_9m_shadow_evidence_readback_v1.sql"

      - name: Syntax and focused V2.1-9M verifier
        run: |
          node --check lib/exfoliation-normative-policy-durable-evidence-readback.js
          node --check scripts/product-evidence/verify-v21-9m-durable-evidence-readback-v1.mjs
          node --experimental-default-type=module scripts/product-evidence/verify-v21-9m-durable-evidence-readback-v1.mjs

      - name: Disposable PostgreSQL read RPC contract
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260820093000_v21_9l_organic_shadow_evidence_daily_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260820094500_v21_9m_shadow_evidence_readback_v1.sql

          test "$(psql -Atqc "select has_function_privilege('anon','public.read_recommendation_shadow_evidence_v1(date,date)','EXECUTE')")" = "f"
          test "$(psql -Atqc "select has_function_privilege('authenticated','public.read_recommendation_shadow_evidence_v1(date,date)','EXECUTE')")" = "f"
          test "$(psql -Atqc "select has_function_privilege('service_role','public.read_recommendation_shadow_evidence_v1(date,date)','EXECUTE')")" = "t"
          test "$(psql -Atqc "select prosecdef from pg_proc where oid='public.read_recommendation_shadow_evidence_v1(date,date)'::regprocedure")" = "f"
          test "$(psql -Atqc "select provolatile from pg_proc where oid='public.read_recommendation_shadow_evidence_v1(date,date)'::regprocedure")" = "s"
          test "$(psql -Atqc "select array_to_string(proconfig,',') from pg_proc where oid='public.read_recommendation_shadow_evidence_v1(date,date)'::regprocedure")" = "search_path=public"
          test "$(psql -Atqc "set role service_role; select public.read_recommendation_shadow_evidence_v1('2026-08-20','2026-08-21')->>'observed_days'")" = "0"
          test "$(psql -Atqc "set role service_role; select public.read_recommendation_shadow_evidence_v1('2026-08-20','2026-08-21')->'sources'->'ORGANIC_PRODUCTION'->>'execution_count'")" = "0"

          if psql -v ON_ERROR_STOP=1 -c "set role anon; select public.read_recommendation_shadow_evidence_v1('2026-08-20','2026-08-21');" >/dev/null 2>&1; then
            echo "anon unexpectedly executed 9M read RPC" >&2
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "set role authenticated; select public.read_recommendation_shadow_evidence_v1('2026-08-20','2026-08-21');" >/dev/null 2>&1; then
            echo "authenticated unexpectedly executed 9M read RPC" >&2
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "set role service_role; insert into public.recommendation_shadow_evidence_daily_v1(bucket_date,evidence_schema_version,activation_version,policy_contract_version,runtime_version,production_source,context_bucket_version,partition_key,partition_value) values ('2026-08-20','exfoliation-normative-organic-shadow-evidence-daily-v1','a','p','r','ORGANIC_PRODUCTION','privacy-safe-recommendation-context-bucket-v1','TOTAL','ALL');" >/dev/null 2>&1; then
            echo "service_role unexpectedly obtained direct table INSERT" >&2
            exit 1
          fi

          if psql -v ON_ERROR_STOP=1 -c "set role service_role; select public.read_recommendation_shadow_evidence_v1('2026-08-20','2026-08-20');" >/dev/null 2>&1; then
            echo "invalid empty window unexpectedly accepted" >&2
            exit 1
          fi
          if psql -v ON_ERROR_STOP=1 -c "set role service_role; select public.read_recommendation_shadow_evidence_v1('2026-08-19','2026-08-20');" >/dev/null 2>&1; then
            echo "pre-durable collection window unexpectedly accepted" >&2
            exit 1
          fi

          cat > /tmp/v21_9m_fixture.sql <<'SQL'
          set role service_role;
          select public.record_recommendation_shadow_evidence_daily_v1(
            '[
              {"bucket_date":"2026-08-20","evidence_schema_version":"exfoliation-normative-organic-shadow-evidence-daily-v1","activation_version":"exfoliation-non-numeric-pda-normative-production-policy-activation-v1","policy_contract_version":"exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1","runtime_version":"exfoliation-non-numeric-pda-normative-production-policy-shadow-v1","production_source":"ORGANIC_PRODUCTION","context_bucket_version":"privacy-safe-recommendation-context-bucket-v1","partition_key":"TOTAL","partition_value":"ALL","execution_count":1,"candidate_evaluation_count":2,"allow_count":1,"caution_count":1,"restrict_count":0,"defer_count":0,"not_applicable_count":0,"fallback_count":0,"runtime_error_count":0,"hypothetical_exclusion_count":0,"actual_exclusion_count":0,"stop_required_count":0},
              {"bucket_date":"2026-08-20","evidence_schema_version":"exfoliation-normative-organic-shadow-evidence-daily-v1","activation_version":"exfoliation-non-numeric-pda-normative-production-policy-activation-v1","policy_contract_version":"exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1","runtime_version":"exfoliation-non-numeric-pda-normative-production-policy-shadow-v1","production_source":"ORGANIC_PRODUCTION","context_bucket_version":"privacy-safe-recommendation-context-bucket-v1","partition_key":"PRIMARY_CONCERN_CLASS","partition_value":"barrier","execution_count":1,"candidate_evaluation_count":2,"allow_count":1,"caution_count":1,"restrict_count":0,"defer_count":0,"not_applicable_count":0,"fallback_count":0,"runtime_error_count":0,"hypothetical_exclusion_count":0,"actual_exclusion_count":0,"stop_required_count":0},
              {"bucket_date":"2026-08-20","evidence_schema_version":"exfoliation-normative-organic-shadow-evidence-daily-v1","activation_version":"exfoliation-non-numeric-pda-normative-production-policy-activation-v1","policy_contract_version":"exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1","runtime_version":"exfoliation-non-numeric-pda-normative-production-policy-shadow-v1","production_source":"ORGANIC_PRODUCTION","context_bucket_version":"privacy-safe-recommendation-context-bucket-v1","partition_key":"SENSITIVITY_RISK_CLASS","partition_value":"LOW","execution_count":1,"candidate_evaluation_count":2,"allow_count":1,"caution_count":1,"restrict_count":0,"defer_count":0,"not_applicable_count":0,"fallback_count":0,"runtime_error_count":0,"hypothetical_exclusion_count":0,"actual_exclusion_count":0,"stop_required_count":0},
              {"bucket_date":"2026-08-20","evidence_schema_version":"exfoliation-normative-organic-shadow-evidence-daily-v1","activation_version":"exfoliation-non-numeric-pda-normative-production-policy-activation-v1","policy_contract_version":"exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1","runtime_version":"exfoliation-non-numeric-pda-normative-production-policy-shadow-v1","production_source":"ORGANIC_PRODUCTION","context_bucket_version":"privacy-safe-recommendation-context-bucket-v1","partition_key":"CONCERN_STRUCTURE_CLASS","partition_value":"SINGLE","execution_count":1,"candidate_evaluation_count":2,"allow_count":1,"caution_count":1,"restrict_count":0,"defer_count":0,"not_applicable_count":0,"fallback_count":0,"runtime_error_count":0,"hypothetical_exclusion_count":0,"actual_exclusion_count":0,"stop_required_count":0},
              {"bucket_date":"2026-08-20","evidence_schema_version":"exfoliation-normative-organic-shadow-evidence-daily-v1","activation_version":"exfoliation-non-numeric-pda-normative-production-policy-activation-v1","policy_contract_version":"exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1","runtime_version":"exfoliation-non-numeric-pda-normative-production-policy-shadow-v1","production_source":"ORGANIC_PRODUCTION","context_bucket_version":"privacy-safe-recommendation-context-bucket-v1","partition_key":"SURVEY_COMPLETENESS_CLASS","partition_value":"COMPLETE","execution_count":1,"candidate_evaluation_count":2,"allow_count":1,"caution_count":1,"restrict_count":0,"defer_count":0,"not_applicable_count":0,"fallback_count":0,"runtime_error_count":0,"hypothetical_exclusion_count":0,"actual_exclusion_count":0,"stop_required_count":0},
              {"bucket_date":"2026-08-20","evidence_schema_version":"exfoliation-normative-organic-shadow-evidence-daily-v1","activation_version":"exfoliation-non-numeric-pda-normative-production-policy-activation-v1","policy_contract_version":"exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1","runtime_version":"exfoliation-non-numeric-pda-normative-production-policy-shadow-v1","production_source":"ORGANIC_PRODUCTION","context_bucket_version":"privacy-safe-recommendation-context-bucket-v1","partition_key":"RECENT_INSTABILITY_CLASS","partition_value":"ABSENT","execution_count":1,"candidate_evaluation_count":2,"allow_count":1,"caution_count":1,"restrict_count":0,"defer_count":0,"not_applicable_count":0,"fallback_count":0,"runtime_error_count":0,"hypothetical_exclusion_count":0,"actual_exclusion_count":0,"stop_required_count":0},
              {"bucket_date":"2026-08-20","evidence_schema_version":"exfoliation-normative-organic-shadow-evidence-daily-v1","activation_version":"exfoliation-non-numeric-pda-normative-production-policy-activation-v1","policy_contract_version":"exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1","runtime_version":"exfoliation-non-numeric-pda-normative-production-policy-shadow-v1","production_source":"CONTROLLED_PRODUCTION_PROBE","context_bucket_version":"privacy-safe-recommendation-context-bucket-v1","partition_key":"TOTAL","partition_value":"ALL","execution_count":3,"candidate_evaluation_count":6,"allow_count":0,"caution_count":0,"restrict_count":6,"defer_count":0,"not_applicable_count":0,"fallback_count":0,"runtime_error_count":0,"hypothetical_exclusion_count":6,"actual_exclusion_count":0,"stop_required_count":0}
            ]'::jsonb
          );
          SQL
          psql -v ON_ERROR_STOP=1 -q -f /tmp/v21_9m_fixture.sql >/dev/null

          before_count="$(psql -Atqc "select count(*) from public.recommendation_shadow_evidence_daily_v1")"
          test "$(psql -Atqc "set role service_role; select public.read_recommendation_shadow_evidence_v1('2026-08-20','2026-08-21')->'sources'->'ORGANIC_PRODUCTION'->>'execution_count'")" = "1"
          test "$(psql -Atqc "set role service_role; select public.read_recommendation_shadow_evidence_v1('2026-08-20','2026-08-21')->'sources'->'CONTROLLED_PRODUCTION_PROBE'->>'execution_count'")" = "3"
          test "$(psql -Atqc "set role service_role; select public.read_recommendation_shadow_evidence_v1('2026-08-20','2026-08-21')->'sources'->'UNKNOWN_PRODUCTION_SOURCE'->>'execution_count'")" = "0"
          test "$(psql -Atqc "set role service_role; select public.read_recommendation_shadow_evidence_v1('2026-08-20','2026-08-21')->>'observed_days'")" = "1"
          test "$(psql -Atqc "set role service_role; select jsonb_array_length(public.read_recommendation_shadow_evidence_v1('2026-08-20','2026-08-21')->'context_marginals')")" = "5"
          test "$(psql -Atqc "set role service_role; select jsonb_array_length(public.read_recommendation_shadow_evidence_v1('2026-08-20','2026-08-21')->'version_groups')")" = "1"
          after_count="$(psql -Atqc "select count(*) from public.recommendation_shadow_evidence_daily_v1")"
          test "$before_count" = "$after_count"

      - name: Historical V2.1-9L durability verifier
        run: node --experimental-default-type=module scripts/product-evidence/verify-v21-9l-organic-shadow-evidence-durability-v1.mjs

      - name: Historical V2.1-9J provenance verifier
        run: node --experimental-default-type=module scripts/product-evidence/verify-v21-9j-organic-shadow-evidence-attribution-v1.mjs

      - name: Controlled probe remains manual-only and is not executed
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('.github/workflows/v21-9j-controlled-production-probe.yml','utf8');
          if(!/^on:\n  workflow_dispatch:\s*$/m.test(s)) process.exit(1);
          if(/^\s{2}(push|pull_request|schedule):/m.test(s)) process.exit(1);
          NODE

      - name: Prepare frozen 164-product Recommendation reference
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q "$V21_9I_RECOMMENDATION_REFERENCE_SHA"
          node -e 'const f=require("./_reference/recommendation/fixtures/recommendation-metadata/products-v1.json"); if(f.productCount!==164||f.products.length!==164) process.exit(1)'

      - name: Historical V2.1-9I full verifier
        env:
          V21_9I_REFERENCE_ROOT: _reference/recommendation
        run: node --experimental-default-type=module scripts/product-evidence/verify-v21-9i-prelaunch-robustness-remediation-v1.mjs

      - name: Historical V2.1-9I-SR source-scale verifier
        run: node --experimental-default-type=module scripts/product-evidence/verify-v21-9i-routine-source-scale-contract-v1.mjs

      - name: Historical V2.1-9E production SHADOW wiring verifier
        run: node --experimental-default-type=module scripts/product-evidence/verify-exfoliation-normative-policy-production-shadow-wiring-v1.mjs

      - name: Historical V2.1-9D activation safety verifier
        env:
          V21_9D_REQUIRE_CHECKED_IN: "1"
        run: node scripts/product-evidence/verify-exfoliation-normative-policy-activation-authorization-runtime-safety-v1.mjs

      - name: CandidatePolicy shadow regressions
        run: |
          npm run verify:candidate-exposure-policy-shadow
          npm run verify:candidate-exposure-policy-shadow-evaluation

      - name: Canonical 164x12 OFF invariance
        env:
          RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
          V21_7_BASE_MAIN_SHA: e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87
          EXFOLIATION_NORMATIVE_POLICY_ENABLED: "0"
          EXFOLIATION_NORMATIVE_POLICY_KILL_SWITCH: "0"
          EXFOLIATION_NORMATIVE_POLICY_MODE: OFF
          EXFOLIATION_NORMATIVE_POLICY_ACTIVATION_VERSION: exfoliation-non-numeric-pda-normative-production-policy-activation-v1
          EXFOLIATION_NORMATIVE_POLICY_CONTRACT_VERSION: exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1
          EXFOLIATION_NORMATIVE_POLICY_RUNTIME_VERSION: exfoliation-non-numeric-pda-normative-production-policy-shadow-v1
          EXFOLIATION_NORMATIVE_POLICY_SCOPE: POST_SCORE_POST_SORT_ELIGIBILITY_OVERLAY_BEFORE_RESULT_ASSEMBLY
        run: |
          node scripts/verify-product-decision-axis-comparator-v1.mjs
          node scripts/verify-skin-decision-recommendation-invariance.mjs

      - name: Canonical 164x12 SHADOW invariance
        env:
          RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
          V21_7_BASE_MAIN_SHA: e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87
          EXFOLIATION_NORMATIVE_POLICY_ENABLED: "1"
          EXFOLIATION_NORMATIVE_POLICY_KILL_SWITCH: "0"
          EXFOLIATION_NORMATIVE_POLICY_MODE: SHADOW
          EXFOLIATION_NORMATIVE_POLICY_ACTIVATION_VERSION: exfoliation-non-numeric-pda-normative-production-policy-activation-v1
          EXFOLIATION_NORMATIVE_POLICY_CONTRACT_VERSION: exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1
          EXFOLIATION_NORMATIVE_POLICY_RUNTIME_VERSION: exfoliation-non-numeric-pda-normative-production-policy-shadow-v1
          EXFOLIATION_NORMATIVE_POLICY_SCOPE: POST_SCORE_POST_SORT_ELIGIBILITY_OVERLAY_BEFORE_RESULT_ASSEMBLY
        run: |
          node scripts/verify-product-decision-axis-comparator-v1.mjs
          node scripts/verify-skin-decision-recommendation-invariance.mjs

      - name: Production build
        run: npm run build

      - name: Publish merged-main exact-SHA CI attestation
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state="success"
          description="V2.1-9M merged-main exact-SHA CI passed"
          if [ "$PRIOR_JOB_STATUS" != "success" ]; then
            state="failure"
            description="V2.1-9M merged-main exact-SHA CI failed"
          fi
          payload=$(printf '{"state":"%s","context":"V2.1-9M merged-main exact-SHA CI","description":"%s","target_url":"%s/%s/actions/runs/%s"}' "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null
          test "$state" = "success"
