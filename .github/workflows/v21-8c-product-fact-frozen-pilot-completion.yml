name: V21-8C Frozen Pilot Product Fact Completion

on:
  push:
    branches: [research/product-fact-frozen-pilot-depth-completion-v1]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-8c-product-fact-frozen-pilot-completion.yml'
      - 'scripts/product-evidence/product-fact-adoption-batch-3-v1.mjs'
      - 'scripts/build-product-fact-adoption-batch-3-v1.mjs'
      - 'scripts/verify-product-fact-adoption-batch-3-v1.mjs'
      - 'evidence/product-fact-adoption-v1/cross-category-adoption-batch-3-v1.json'
      - 'docs/evidence/product-fact-adoption-batch-3-v1.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BASE_MAIN_SHA: a13e27e9e3dae0b5a38bab3324c587b99e8495d5
      BRANCH_NAME: research/product-fact-frozen-pilot-depth-completion-v1
      OUT_JSON: evidence/product-fact-adoption-v1/cross-category-adoption-batch-3-v1.json
      OUT_MD: docs/evidence/product-fact-adoption-batch-3-v1.md
    steps:
      - name: Checkout exact V2.1-8C head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout frozen recommendation reference
        uses: actions/checkout@v4
        with:
          repository: gycha0109-beep/K_beauty
          ref: 783afb91a964f5d762f46846f9ef854902b48e95
          path: _reference/recommendation
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout historical V2.1-2
        uses: actions/checkout@v4
        with:
          repository: gycha0109-beep/K_beauty
          ref: 6e79aa6a4ac08c98790787e371d59698588f349e
          path: _historical/v21-2
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout historical V2.1-4
        uses: actions/checkout@v4
        with:
          repository: gycha0109-beep/K_beauty
          ref: c471f5ae82acc36a7c29b9ec8158b4ca2d595ec9
          path: _historical/v21-4
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout historical V2.1-5
        uses: actions/checkout@v4
        with:
          repository: gycha0109-beep/K_beauty
          ref: 4cb69354c3919f40c2b00acc070bcd0fb142f042
          path: _historical/v21-5
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout historical V2.1-6
        uses: actions/checkout@v4
        with:
          repository: gycha0109-beep/K_beauty
          ref: bd04f0924a74c8d36a935da8a4137dd3cf497117
          path: _historical/v21-6
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authoritative main and branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_MAIN_SHA"
          git merge-base --is-ancestor "$BASE_MAIN_SHA" HEAD
          printf 'base_main=%s\nhead=%s\n' "$BASE_MAIN_SHA" "$(git rev-parse HEAD)" | tee /tmp/v21-8c-authority.txt

      - name: Frozen authority hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum evidence/product-fact-materialization-v1/cross-category-pilot-materialization-dry-run-v1.json | awk '{print $1}')" = "b2f19878f00f53d9a60dad0b1515fff1f566449e6a531825e712dfa2e3f19bb2"
          test "$(sha256sum evidence/product-evidence-decision-axis-v1/cross-category-real-evidence-pilot-v1.json | awk '{print $1}')" = "47457c0242451a35305fd8eceba0ebb7e210eb9ee2e73134ccf41696d18e517d"
          test "$(sha256sum evidence/product-evidence-decision-axis-v1/cross-category-real-fact-mapping-pilot-v1.json | awk '{print $1}')" = "c746c5d02f654ed7f0a8e8385611ac65ca30b9c4648fa4c6454ac863e7c9314f"
          test "$(sha256sum evidence/product-evidence-decision-axis-v1/cross-category-real-pilot-gap-report-v1.json | awk '{print $1}')" = "5a4580d76cca62d90a3ac306744054c507a6d5e45b0b91a41dffb3b754980215"

      - name: Batch 1 replay
        env:
          V21_8A_BASE_MAIN_SHA: 5bcebba6b945f08b0fc5b1ae9f31fb0f9067397e
        run: node scripts/verify-product-fact-adoption-batch-1-v1.mjs | tee /tmp/v21-8c-batch1.txt

      - name: Batch 2 replay
        env:
          V21_8B_BASE_MAIN_SHA: a303e216f3953567a175c4d01978efc06b20bbc6
        run: node scripts/verify-product-fact-adoption-batch-2-v1.mjs | tee /tmp/v21-8c-batch2.txt

      - name: Historical V2.1-2 replay
        run: |
          cd _historical/v21-2
          git update-ref refs/remotes/origin/main e75ae83f3cc8b682fa7cc7dfb38edf983d2aa68f
          node scripts/verify-product-fact-cross-category-materialization-dry-run-v1.mjs

      - name: Historical V2.1-4 replay
        run: |
          cd _historical/v21-4
          git update-ref refs/remotes/origin/main a38df682ebc686cb076dfc40b432ae714fdfd6da
          node scripts/verify-product-fact-evidence-fusion-review-uncertainty-v1.mjs

      - name: Historical V2.1-5 replay
        run: |
          cd _historical/v21-5
          git update-ref refs/remotes/origin/main 4dce99057ca44adb14dac549e8df6d468cf7f5e2
          node scripts/verify-product-decision-axis-cleanser-v1.mjs

      - name: Historical V2.1-6 replay
        run: |
          cd _historical/v21-6
          git update-ref refs/remotes/origin/main 45628d2c859ab0ba875b66f30b4c47c150ef3162
          node scripts/verify-product-decision-axis-cross-category-v1.mjs

      - name: V2.1-7 shadow replay
        env:
          V21_7_BASE_MAIN_SHA: e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87
          RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
        run: node scripts/verify-product-decision-axis-comparator-v1.mjs

      - name: Product Fact controlled-write contracts
        run: |
          node scripts/verify-product-fact-controlled-write-v1.mjs > /tmp/v21-8c-pf-write.json
          node scripts/verify-product-fact-subject-registration-v1.mjs > /tmp/v21-8c-pf-subject.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const f of ['/tmp/v21-8c-pf-write.json','/tmp/v21-8c-pf-subject.json']) {
            if (JSON.parse(fs.readFileSync(f,'utf8')).status !== 'PASS') throw new Error(`failed ${f}`);
          }
          NODE

      - name: V2.1-8C syntax
        run: |
          node --check scripts/product-evidence/product-fact-adoption-batch-3-v1.mjs
          node --check scripts/build-product-fact-adoption-batch-3-v1.mjs
          node --check scripts/verify-product-fact-adoption-batch-3-v1.mjs

      - name: Build A
        env:
          V21_8C_BASE_MAIN_SHA: ${{ env.BASE_MAIN_SHA }}
        run: |
          node scripts/build-product-fact-adoption-batch-3-v1.mjs | tee /tmp/v21-8c-build-a.txt
          cp "$OUT_JSON" /tmp/v21-8c-a.json
          cp "$OUT_MD" /tmp/v21-8c-a.md
          sha256sum "$OUT_JSON" "$OUT_MD" | tee /tmp/v21-8c-hash-a.txt

      - name: Build B and byte determinism
        env:
          V21_8C_BASE_MAIN_SHA: ${{ env.BASE_MAIN_SHA }}
        run: |
          rm -f "$OUT_JSON" "$OUT_MD"
          node scripts/build-product-fact-adoption-batch-3-v1.mjs | tee /tmp/v21-8c-build-b.txt
          cmp -s /tmp/v21-8c-a.json "$OUT_JSON"
          cmp -s /tmp/v21-8c-a.md "$OUT_MD"
          sha256sum "$OUT_JSON" "$OUT_MD" | tee /tmp/v21-8c-hash-b.txt

      - name: Remaining-set dependency and cardinality verifier
        env:
          V21_8C_BASE_MAIN_SHA: ${{ env.BASE_MAIN_SHA }}
        run: node scripts/verify-product-fact-adoption-batch-3-v1.mjs | tee /tmp/v21-8c-verifier.txt

      - name: Explicit remaining and subject gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -e 'const x=require("./evidence/product-fact-adoption-v1/cross-category-adoption-batch-3-v1.json"); process.stdout.write(String(x.summary.remaining_supported))')" = "10"
          test "$(node -e 'const x=require("./evidence/product-fact-adoption-v1/cross-category-adoption-batch-3-v1.json"); process.stdout.write(String(x.summary.new_subjects))')" = "0"
          test "$(node -e 'const x=require("./evidence/product-fact-adoption-v1/cross-category-adoption-batch-3-v1.json"); process.stdout.write(String(x.summary.new_unique_products))')" = "0"

      - name: 164 x 12 production replay
        run: node scripts/verify-skin-decision-recommendation-invariance.mjs | tee /tmp/v21-8c-production.txt

      - name: Exact offline scope and runtime isolation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference _historical
          mapfile -t changed < <(git diff --name-only "$BASE_MAIN_SHA..HEAD" | sort)
          allowed_re='^(\.github/workflows/v21-8c-product-fact-frozen-pilot-completion\.yml|scripts/product-evidence/product-fact-adoption-batch-3-v1\.mjs|scripts/build-product-fact-adoption-batch-3-v1\.mjs|scripts/verify-product-fact-adoption-batch-3-v1\.mjs|evidence/product-fact-adoption-v1/cross-category-adoption-batch-3-v1\.json|docs/evidence/product-fact-adoption-batch-3-v1\.md)$'
          for f in "${changed[@]}"; do [[ "$f" =~ $allowed_re ]] || { echo "unexpected path: $f"; exit 1; }; done
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then test "${#changed[@]}" -eq 6; else [[ "${#changed[@]}" -eq 4 || "${#changed[@]}" -eq 6 ]]; fi
          test -z "$(git diff --name-only "$BASE_MAIN_SHA..HEAD" -- app components lib supabase/migrations package.json package-lock.json)"
          if grep -R -n --include='*.js' --include='*.mjs' 'product-fact-adoption-batch-3-v1' app lib components 2>/dev/null; then exit 1; fi
          git diff --check "$BASE_MAIN_SHA..HEAD"
          printf '%s\n' "${changed[@]}" | tee /tmp/v21-8c-changed.txt

      - name: Product Fact direct-to-score and activation guard
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$BASE_MAIN_SHA..HEAD" -- app components lib)"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x = JSON.parse(fs.readFileSync('evidence/product-fact-adoption-v1/cross-category-adoption-batch-3-v1.json','utf8'));
          if (x.lifecycle.decision_axis_production_consumption !== false) process.exit(1);
          if (x.lifecycle.recommendation_scorer_changed !== false) process.exit(1);
          if (x.lifecycle.recommendation_activated !== false) process.exit(1);
          NODE

      - name: Secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git diff -U0 "$BASE_MAIN_SHA..HEAD" | grep '^+' | grep -Ev '^\+\+\+' | grep -E 'sk-(proj-)?[A-Za-z0-9_-]{24,}|eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'; then exit 1; fi

      - name: Freeze generated Batch 3 outputs
        if: github.event_name == 'push' && github.ref_name == 'research/product-fact-frozen-pilot-depth-completion-v1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT_JSON" "$OUT_MD"
          if ! git diff --cached --quiet; then
            git commit -m 'research(storage): freeze V2.1-8C supported-fact completion plan'
            git push origin HEAD:"$BRANCH_NAME"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-8c-frozen-pilot-completion-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/v21-8c-authority.txt
            /tmp/v21-8c-batch1.txt
            /tmp/v21-8c-batch2.txt
            /tmp/v21-8c-build-a.txt
            /tmp/v21-8c-build-b.txt
            /tmp/v21-8c-hash-a.txt
            /tmp/v21-8c-hash-b.txt
            /tmp/v21-8c-verifier.txt
            /tmp/v21-8c-production.txt
            /tmp/v21-8c-changed.txt
            /tmp/v21-8c-pf-write.json
            /tmp/v21-8c-pf-subject.json
            evidence/product-fact-adoption-v1/cross-category-adoption-batch-3-v1.json
            docs/evidence/product-fact-adoption-batch-3-v1.md
          if-no-files-found: warn
          retention-days: 14
