name: Premium PR35 integration finalizer

on:
  pull_request:
    branches: [integration/premium-engine-main-sec-baseline]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/premium-pr35-integrator.yml
      - .github/scripts/premium-pr35-integrate.py

permissions:
  contents: write

concurrency:
  group: premium-pr35-integration-finalizer
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/premium-browser-journey-main-sec-baseline
          fetch-depth: 0
      - name: Merge reviewed PR35 layer and apply integration hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/integration/premium-browser-journey-main-sec-baseline)"
          git fetch origin agent/premium-browser-journey-verification
          test "$(git rev-parse origin/agent/premium-browser-journey-verification)" = "f28dbd8bd3f08b2aa6b8b1ab3281b4053cda0f6f"
          git merge --no-ff --no-commit origin/agent/premium-browser-journey-verification
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/premium-pr35-integrate.py")
          text = path.read_text(encoding="utf-8")
          old = 'log_path.write_text(log + "\\n", encoding="utf-8")'
          new = 'log_path.write_text(log.rstrip() + "\\n", encoding="utf-8")'
          if text.count(old) != 1:
              raise SystemExit("worklog newline patch anchor mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python .github/scripts/premium-pr35-integrate.py .
          rm -f \
            .github/workflows/premium-pr35-integrator.yml \
            .github/workflows/premium-pr35-merge-diagnostic.yml \
            .github/scripts/premium-pr35-integrate.py
          git add -A
          node --check scripts/premium-browser-journey-core.mjs
          node --check scripts/run-premium-browser-journey.mjs
          node --check scripts/cleanup-premium-browser-journey.mjs
          node --check scripts/verify-premium-browser-journey-contract.mjs
          test ! -e scripts/verify-premium-browser-journey.mjs
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json' || true)"
          git commit -m "merge(premium): integrate authenticated browser journey verification"
          npm ci
      - name: Verify browser journey pure contracts repeatedly
        shell: bash
        run: |
          set -euo pipefail
          for run in 1 2 3 4 5; do
            echo "browser journey contract run ${run}/5"
            npm run verify:premium-browser-journey-contract
          done
      - name: Verify route storage and reentry
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-premium-route-storage-reentry.mjs
          node scripts/verify-premium-report-reentry-contract.mjs
          node scripts/verify-premium-integrated-evaluation.mjs
          node scripts/verify-premium-decision-state.mjs
      - name: Verify security closeout
        run: node scripts/run-security-closeout-verifier-suite.mjs
      - name: Verify architecture
        run: npm run architecture:guard
      - name: Verify production build
        run: npm run build
      - name: Verify source and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          test -z "$(git grep -nE '(Bearer [A-Za-z0-9._-]{20,}|sbp_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' -- scripts docs .codex || true)"
      - name: Push reviewed integration
        run: git push origin HEAD:integration/premium-browser-journey-main-sec-baseline
