name: SEC-12 verifier repair controller

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sec12-main-repair-once.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/sec12-main-trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout main controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/premium-beta-flow
          path: target
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Install target dependencies
        working-directory: target
        run: npm ci

      - name: Patch SEC-12 verifier and records
        working-directory: target
        shell: python
        run: |
          from pathlib import Path

          verifier = Path("scripts/verify-sec12-error-log-boundary.mjs")
          text = verifier.read_text(encoding="utf-8")

          parser_anchor = 'const { parse: parseJavaScript } = require("next/dist/compiled/babel/parser");\n'
          parser_insert = '''const { parse: parseJavaScript } = require("next/dist/compiled/babel/parser");

class UnsupportedAstNodeError extends Error {
  constructor(nodeType, phase = "analysis") {
    super(`SEC-12 unsupported AST node: ${phase}:${nodeType || "unknown"}`);
    this.name = "UnsupportedAstNodeError";
    this.code = "unsupported_ast_node";
    this.nodeType = nodeType || "unknown";
    this.phase = phase;
  }
}

function failUnsupportedAstNode(node, phase) {
  throw new UnsupportedAstNodeError(node?.type, phase);
}

const UNSUPPORTED_CLASS_AST_NODE_TYPES = new Set([
  "ClassDeclaration",
  "ClassExpression",
  "StaticBlock",
  "ClassProperty",
  "PropertyDefinition",
  "ClassPrivateProperty",
  "ClassMethod",
  "ClassPrivateMethod"
]);

function assertNoUnsupportedClassSyntax(node, phase) {
  if (!node || typeof node !== "object") return;
  walkAst(node, (candidate) => {
    if (UNSUPPORTED_CLASS_AST_NODE_TYPES.has(candidate?.type)) {
      failUnsupportedAstNode(candidate, phase);
    }
  });
}
'''
          if "class UnsupportedAstNodeError" not in text:
            if parser_anchor not in text:
              raise SystemExit("parser insertion anchor missing")
            text = text.replace(parser_anchor, parser_insert, 1)

          record_anchor = '''function recordReachableNoStoreCalls(expression, state) {
  walkAst(expression, (node) => {
'''
          record_replacement = '''function recordReachableNoStoreCalls(expression, state) {
  assertNoUnsupportedClassSyntax(expression, "expression");
  walkAst(expression, (node) => {
'''
          if record_replacement not in text:
            if record_anchor not in text:
              raise SystemExit("expression guard anchor missing")
            text = text.replace(record_anchor, record_replacement, 1)

          fallback_anchor = '''  if (statement.type === "WithStatement") {
    throw new Error("SEC-12 response-path analysis does not accept with statements");
  }

  return passthrough();
}
'''
          fallback_replacement = '''  if (statement.type === "WithStatement") {
    failUnsupportedAstNode(statement, "statement");
  }

  failUnsupportedAstNode(statement, "statement");
}
'''
          if fallback_replacement not in text:
            if fallback_anchor not in text:
              raise SystemExit("statement fallback anchor missing")
            text = text.replace(fallback_anchor, fallback_replacement, 1)

          negative_tail = '''    `${helperImport} export async function POST() { return Response.json({}, { metadata: createNoStoreHeaders(), headers: unsafeHeaders }); }`,
    `${helperImport} function mixed(condition) { if (condition) { ${safeResponse} } ${unsafeResponse} } export async function POST(condition) { return mixed(condition); }`
  ];

  for (const source of negativeSources) {
    const result = analyzeSyntheticHandler(source);
    assert.equal(result.verified, false);
  }
'''
          negative_replacement = '''    `${helperImport} export async function POST() { return Response.json({}, { metadata: createNoStoreHeaders(), headers: unsafeHeaders }); }`,
    `${helperImport} function mixed(condition) { if (condition) { ${safeResponse} } ${unsafeResponse} } export async function POST(condition) { return mixed(condition); }`,
    `${helperImport} export async function POST() { let response = Response.json({}, { headers: createNoStoreHeaders() }); class Sec12StaticOverwrite { static { response = Response.json({}); } } return response; }`
  ];

  for (const source of negativeSources) {
    let rejected = false;
    try {
      rejected = analyzeSyntheticHandler(source).verified === false;
    } catch (error) {
      rejected = error?.code === "unsupported_ast_node";
    }
    assert.equal(rejected, true);
  }
'''
          if "class Sec12StaticOverwrite" not in text:
            if negative_tail not in text:
              raise SystemExit("negative matrix anchor missing")
            text = text.replace(negative_tail, negative_replacement, 1)

          assertion_anchor = 'assert.deepEqual(result.pureMatrix, { positive: 2, negative: 16, rejected: 16 });'
          assertion_replacement = 'assert.deepEqual(result.pureMatrix, { positive: 2, negative: 17, rejected: 17 });'
          if assertion_replacement not in text:
            if assertion_anchor not in text:
              raise SystemExit("I10 count assertion anchor missing")
            text = text.replace(assertion_anchor, assertion_replacement, 1)

          verifier.write_text(text, encoding="utf-8")

          doc = Path("docs/security/sec-12-error-log-exposure-boundary-20260717.md")
          doc_text = doc.read_text(encoding="utf-8")
          note = """

## 2026-07-18 Unsupported AST fail-closed correction

A final independent gate found that the I10 response-path analyzer passed through unsupported executable statements. A reachable `ClassDeclaration` static block could overwrite a previously safe response with a response lacking the no-store contract while the verifier still reported `62/62 PASS`. The analyzer now rejects unsupported statement nodes by default, rejects class syntax encountered in reachable expressions, and includes a class-static response-overwrite negative fixture. Existing production route and handler manifests remain unchanged.
"""
          if "Unsupported AST fail-closed correction" not in doc_text:
            doc.write_text(doc_text.rstrip() + note + "\n", encoding="utf-8")

          worklog = Path(".codex/AI_WORK_LOG.md")
          worklog_text = worklog.read_text(encoding="utf-8")
          log_note = """

### 2026-07-18 SEC-12 unsupported AST verifier correction

- Independent gate reproduced an I10 fail-open: a reachable class static block overwrote a safe response variable, but unsupported `ClassDeclaration` was passed through and `62/62 PASS` remained.
- Changed the response-path analyzer to fail closed on unsupported statements and reachable class syntax.
- Added the class-static overwrite fixture to the I10 negative matrix; expected negative count is now 17.
- Production source was not changed. Hosted Preview/Production, remote Supabase, OAuth, and provider calls were not executed by this correction.
"""
          if "SEC-12 unsupported AST verifier correction" not in worklog_text:
            worklog.write_text(worklog_text.rstrip() + log_note + "\n", encoding="utf-8")

      - name: Verify SEC-12 and provider contracts
        working-directory: target
        run: |
          node --check scripts/verify-sec12-error-log-boundary.mjs
          node scripts/verify-sec12-error-log-boundary.mjs | tee "$RUNNER_TEMP/sec12.log"
          grep -F "SEC12_ERROR_LOG_BOUNDARY=PASS 62/62" "$RUNNER_TEMP/sec12.log"
          grep -F '"pureMatrix":{"positive":2,"negative":17,"rejected":17}' "$RUNNER_TEMP/sec12.log"
          node scripts/verify-provider-runtime-log-sanitization.mjs

      - name: Verify class-static mutation fails closed
        shell: bash
        run: |
          set -euo pipefail
          MUT="$RUNNER_TEMP/sec12-class-mutation"
          mkdir -p "$MUT"
          rsync -a --exclude=.git --exclude=node_modules target/ "$MUT/"
          ln -s "$GITHUB_WORKSPACE/target/node_modules" "$MUT/node_modules"
          python - "$MUT/app/api/track/route.js" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          anchor = "export async function POST(request) {\n"
          mutation = '''export async function POST(request) {
            let sec12MutationResponse = NextResponse.json({}, { headers: createNoStoreHeaders() });
            class Sec12StaticOverwrite {
              static {
                sec12MutationResponse = NextResponse.json({});
              }
            }
            return sec12MutationResponse;
          '''
          if anchor not in text:
            raise SystemExit("track POST anchor missing")
          path.write_text(text.replace(anchor, mutation, 1), encoding="utf-8")
          PY
          set +e
          (cd "$MUT" && node scripts/verify-sec12-error-log-boundary.mjs) >"$RUNNER_TEMP/sec12-mutation.log" 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          ! grep -F "SEC12_ERROR_LOG_BOUNDARY=PASS" "$RUNNER_TEMP/sec12-mutation.log"
          grep -F "unsupported AST node" "$RUNNER_TEMP/sec12-mutation.log"
          rm -rf "$MUT"

      - name: Verify security regressions
        working-directory: target
        run: |
          node scripts/verify-sec07-product-link-boundary.mjs
          node scripts/verify-sec08-image-upload-boundary.mjs
          node scripts/verify-sec09-public-result-read-boundary.mjs
          node scripts/verify-sec10-image-origin-contract.mjs
          node scripts/verify-sec10-security-headers.mjs
          node scripts/verify-sec11-signout-boundary.mjs
          node scripts/verify-analysis-request-guard.mjs
          node scripts/verify-analysis-result-response-boundary.mjs
          node scripts/verify-analysis-rls-contract.mjs

      - name: Build production application
        working-directory: target
        run: npm run build

      - name: Install Chromium
        working-directory: target
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: target
        run: npx playwright test tests/e2e/visuali-mvp.spec.ts --grep "@smoke"

      - name: Commit and push target repair
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/sec12-ast-fix-once.yml
          git add scripts/verify-sec12-error-log-boundary.mjs docs/security/sec-12-error-log-exposure-boundary-20260717.md .codex/AI_WORK_LOG.md .github/workflows/sec12-ast-fix-once.yml
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "security: close SEC-12 unsupported AST verifier gap"
          git push origin HEAD:feature/premium-beta-flow

      - name: Close temporary trigger PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close 42 --repo gycha0109-beep/K_beauty --delete-branch || true

      - name: Remove controller workflow from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/sec12-main-repair-once.yml
          git add .github/workflows/sec12-main-repair-once.yml
          git commit -m "chore: remove one-shot SEC-12 repair controller"
          git push origin HEAD:main
