name: V21-6 Acceptance Cross-category Extension v1

on:
  push:
    branches: [research/product-decision-axis-cross-category-v1]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/product-evidence/product-fact-current-group-resolver-v1.mjs'
      - 'scripts/product-evidence/product-fact-cross-category-fixture-adapter-v1.mjs'
      - 'scripts/product-evidence/product-decision-axis-cross-category-v1.mjs'
      - 'scripts/build-product-decision-axis-cross-category-v1.mjs'
      - 'scripts/verify-product-decision-axis-cross-category-v1.mjs'
      - 'evidence/product-decision-axis-v1/cross-category-product-decision-axis-v1.json'
      - 'docs/evidence/product-decision-axis-cross-category-v1.md'
      - '.github/workflows/v21-6-acceptance-cross-category-extension-v1.yml'

permissions:
  contents: write

concurrency:
  group: v21-6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-freeze:
    runs-on: ubuntu-24.04
    env:
      BASE_MAIN_SHA: 45628d2c859ab0ba875b66f30b4c47c150ef3162
      BRANCH_NAME: research/product-decision-axis-cross-category-v1
      OUT_JSON: evidence/product-decision-axis-v1/cross-category-product-decision-axis-v1.json
      OUT_MD: docs/evidence/product-decision-axis-cross-category-v1.md
      V21_5_HEAD: 4cb69354c3919f40c2b00acc070bcd0fb142f042
      V21_4_HEAD: c471f5ae82acc36a7c29b9ec8158b4ca2d595ec9
      CROSS_PILOT_HEAD: 596493154b74548187ed71f8d522bb41c7ad1900
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Freeze repository authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "${BASE_MAIN_SHA}"
          git merge-base --is-ancestor "${BASE_MAIN_SHA}" HEAD
          test "$(git rev-parse "${BASE_MAIN_SHA}:evidence/product-evidence-decision-axis-v1/cross-category-registry-v1.json")" = 32fdaa2d3a181c9d18888fc48c1343e083ad20f7
          test "$(git rev-parse "${BASE_MAIN_SHA}:evidence/product-evidence-decision-axis-v1/cross-category-real-evidence-pilot-v1.json")" = c68e26daf3d3295c9f669362851383dd9997c21c
          test "$(git rev-parse "${BASE_MAIN_SHA}:evidence/product-evidence-decision-axis-v1/cross-category-real-fact-mapping-pilot-v1.json")" = 20d211c70f6ba44ca4f9205942cb5e0387d74b7e
          test "$(git rev-parse "${BASE_MAIN_SHA}:evidence/product-evidence-decision-axis-v1/cross-category-real-pilot-gap-report-v1.json")" = 60b53f49cbac2021a47e50f4e1a0a79760ab7874
          test "$(git rev-parse "${BASE_MAIN_SHA}:supabase/migrations/20260809115932_product_fact_storage_v1.sql")" = 676afbc56bf90443a1198f93427382f067d19407
      - name: Verify frozen semantic artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo '47457c0242451a35305fd8eceba0ebb7e210eb9ee2e73134ccf41696d18e517d  evidence/product-evidence-decision-axis-v1/cross-category-real-evidence-pilot-v1.json' | sha256sum -c -
          echo 'c746c5d02f654ed7f0a8e8385611ac65ca30b9c4648fa4c6454ac863e7c9314f  evidence/product-evidence-decision-axis-v1/cross-category-real-fact-mapping-pilot-v1.json' | sha256sum -c -
          echo '5a4580d76cca62d90a3ac306744054c507a6d5e45b0b91a41dffb3b754980215  evidence/product-evidence-decision-axis-v1/cross-category-real-pilot-gap-report-v1.json' | sha256sum -c -
          echo 'b2f19878f00f53d9a60dad0b1515fff1f566449e6a531825e712dfa2e3f19bb2  evidence/product-fact-materialization-v1/cross-category-pilot-materialization-dry-run-v1.json' | sha256sum -c -
          echo 'fbddc761328f2caa5025a5867061866d17f16d24cb6566fe82d0796c20a4a0b4  evidence/product-decision-axis-v1/cleanser-product-decision-axis-v1.json' | sha256sum -c -
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/product-evidence/product-fact-current-group-resolver-v1.mjs
          node --check scripts/product-evidence/product-fact-cross-category-fixture-adapter-v1.mjs
          node --check scripts/product-evidence/product-decision-axis-cross-category-v1.mjs
          node --check scripts/build-product-decision-axis-cross-category-v1.mjs
          node --check scripts/verify-product-decision-axis-cross-category-v1.mjs
      - name: Build A
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-product-decision-axis-cross-category-v1.mjs | tee /tmp/v21-6-build-a.txt
          cp "${OUT_JSON}" /tmp/v21-6-a.json
          cp "${OUT_MD}" /tmp/v21-6-a.md
          sha256sum "${OUT_JSON}" "${OUT_MD}" | tee /tmp/v21-6-hash-a.txt
      - name: Build B determinism
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${OUT_JSON}" "${OUT_MD}"
          node scripts/build-product-decision-axis-cross-category-v1.mjs | tee /tmp/v21-6-build-b.txt
          cmp -s /tmp/v21-6-a.json "${OUT_JSON}"
          cmp -s /tmp/v21-6-a.md "${OUT_MD}"
          sha256sum "${OUT_JSON}" "${OUT_MD}" | tee /tmp/v21-6-hash-b.txt
      - name: Freeze generated outputs locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${OUT_JSON}" "${OUT_MD}"
          if ! git diff --cached --quiet; then git commit -m 'research(evidence): freeze V2.1-6 cross-category axis output'; fi
      - name: Verify V2.1-6 contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-product-decision-axis-cross-category-v1.mjs | tee /tmp/v21-6.txt
          grep -q 'PASS verify-product-decision-axis-cross-category-v1' /tmp/v21-6.txt
          grep -q 'decision_axis_consumption=NO recommendation_activation=NO hosted_writes=0' /tmp/v21-6.txt
      - name: Replay mandatory cleanser and uncertainty acceptance at frozen exact heads
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/v21-5 "${V21_5_HEAD}"
          (cd /tmp/v21-5 && node scripts/verify-product-decision-axis-cleanser-v1.mjs) | tee /tmp/v21-5.txt
          grep -q 'PASS verify-product-decision-axis-cleanser-v1' /tmp/v21-5.txt
          git worktree add --detach /tmp/v21-4 "${V21_4_HEAD}"
          (cd /tmp/v21-4 && node scripts/verify-product-fact-evidence-fusion-review-uncertainty-v1.mjs) | tee /tmp/v21-4.txt
          grep -q 'PASS verify-product-fact-evidence-fusion-review-uncertainty-v1' /tmp/v21-4.txt
          grep -q 'missing_denominator_prevalence=FORBIDDEN' /tmp/v21-4.txt
      - name: Verify Product Fact contracts unchanged
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-product-fact-controlled-write-v1.mjs > /tmp/pf-write.json
          node scripts/verify-product-fact-subject-registration-v1.mjs > /tmp/pf-subject.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['/tmp/pf-write.json','/tmp/pf-subject.json']) {
            const parsed=JSON.parse(fs.readFileSync(file,'utf8'));
            if (parsed.status !== 'PASS') throw new Error(`${file} not PASS`);
          }
          NODE
      - name: Cross-category frozen pilot replay at frozen exact head
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/cross-pilot "${CROSS_PILOT_HEAD}"
          (cd /tmp/cross-pilot && node scripts/verify-cross-category-real-evidence-pilot-v1.mjs) | tee /tmp/cross-pilot.txt
          grep -q 'PASS' /tmp/cross-pilot.txt
          grep -q 'forced_mapping_count=0' /tmp/cross-pilot.txt
      - name: Final scope and production invariance gate
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git diff --name-only "${BASE_MAIN_SHA}" HEAD | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/v21-6-acceptance-cross-category-extension-v1.yml' \
            'docs/evidence/product-decision-axis-cross-category-v1.md' \
            'evidence/product-decision-axis-v1/cross-category-product-decision-axis-v1.json' \
            'scripts/build-product-decision-axis-cross-category-v1.mjs' \
            'scripts/product-evidence/product-decision-axis-cross-category-v1.mjs' \
            'scripts/product-evidence/product-fact-cross-category-fixture-adapter-v1.mjs' \
            'scripts/product-evidence/product-fact-current-group-resolver-v1.mjs' \
            'scripts/verify-product-decision-axis-cross-category-v1.mjs')
          printf '%s\n' "${actual}"
          test "${actual}" = "${expected}"
          if printf '%s\n' "${actual}" | grep -Eq '^(app/|components/|lib/|supabase/migrations/|package\.json$)'; then exit 1; fi
          if grep -R --line-number --exclude='*.md' --exclude='*.json' --exclude='*.yml' 'product-decision-axis-cross-category-v1' app components lib 2>/dev/null; then exit 1; fi
          git diff --check "${BASE_MAIN_SHA}" HEAD
      - name: Push generated-output commit
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git rev-parse "origin/${BRANCH_NAME}")
          if test "$(git rev-parse HEAD)" != "${remote_head}"; then git push origin "HEAD:${BRANCH_NAME}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: v21-6-acceptance-cross-category-extension
          path: |
            evidence/product-decision-axis-v1/cross-category-product-decision-axis-v1.json
            docs/evidence/product-decision-axis-cross-category-v1.md
            /tmp/v21-6-hash-a.txt
            /tmp/v21-6-hash-b.txt
