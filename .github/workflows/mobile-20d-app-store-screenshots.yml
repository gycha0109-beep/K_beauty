name: BEJEWELY Mobile 20D App Store Screenshots

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/components/**"
      - "apps/mobile/features/**"
      - "apps/mobile/lib/**"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "apps/mobile/store-readiness.json"
      - "docs/store/mobile-store-listing-final.json"
      - "docs/store/mobile-20d-app-store-screenshot-packaging.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/apply-expo-modules-jsi-xcode26-compat.mjs"
      - "scripts/capture-mobile-20d-app-store-screenshots.sh"
      - "scripts/verify-mobile-20d-app-store-screenshots.mjs"
      - "scripts/verify-mobile-18-store-listing.mjs"
      - ".github/workflows/mobile-20d-app-store-screenshots.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/components/**"
      - "apps/mobile/features/**"
      - "apps/mobile/lib/**"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "apps/mobile/store-readiness.json"
      - "docs/store/mobile-store-listing-final.json"
      - "docs/store/mobile-20d-app-store-screenshot-packaging.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/apply-expo-modules-jsi-xcode26-compat.mjs"
      - "scripts/capture-mobile-20d-app-store-screenshots.sh"
      - "scripts/verify-mobile-20d-app-store-screenshots.mjs"
      - "scripts/verify-mobile-18-store-listing.mjs"
      - ".github/workflows/mobile-20d-app-store-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-20d-app-store-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-store-screenshots:
    name: App Store Screenshot Package
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MOBILE_20D_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_20D_SHA=%s\n' "$actual"

      - name: Verify Xcode 26.6 toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"
          xcrun --sdk iphonesimulator --show-sdk-version
          printf 'MOBILE_20D_XCODE_26_6=PASS\n'

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Apply bounded Expo Modules JSI Xcode 26 compatibility shim
        run: node scripts/apply-expo-modules-jsi-xcode26-compat.mjs

      - name: Verify MOBILE-20D source contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/capture-mobile-20d-app-store-screenshots.sh
          node scripts/verify-mobile-20d-app-store-screenshots.mjs source
          node scripts/verify-mobile-18-store-listing.mjs
          npm run mobile:typecheck
          npm run mobile:config

      - name: Generate iOS native project
        run: npm run prebuild:ios --workspace @bejewely/mobile

      - name: Verify generated iOS contract
        run: node scripts/verify-mobile-ios-shell.mjs

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile/ios
          pod install

      - name: Capture and package App Store iPhone screenshots
        shell: bash
        run: bash scripts/capture-mobile-20d-app-store-screenshots.sh

      - name: Upload App Store screenshot package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bejewely-mobile-20d-app-store-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: apps/mobile/.mobile-20d-app-store-package/**
