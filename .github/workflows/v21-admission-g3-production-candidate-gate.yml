name: V2.1 ADMISSION G3 Production Candidate Gate

on:
  push:
    branches:
      - admission/g3-production-candidate-gate
      - main
  pull_request:
    paths:
      - ".github/workflows/v21-admission-g3-production-candidate-gate.yml"
      - "lib/product-source.js"
      - "lib/recommendation-product-enumerator.mjs"
      - "lib/recommendation-legacy-corpus-v1.mjs"
      - "lib/recommendation-candidate-admission-core.mjs"
      - "lib/recommendation-candidate-admission.js"
      - "app/api/internal/recommendation-candidate-admission-controlled-probe/route.js"
      - "lib/recommendation-candidate-admission-controlled-probe-oidc.mjs"
      - "fixtures/recommendation-governance/g3-production-candidate-admission-v1.json"
      - "scripts/verify-v21-admission-g3-production-candidate-gate-v1.mjs"
      - "docs/evidence/v21-admission-g3-production-candidate-gate-v1.md"

permissions:
  contents: read
  deployments: read
  id-token: write
  statuses: write

concurrency:
  group: v21-admission-g3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  G3_BASE_MAIN_SHA: 6fdff47f3c41a4e90dace8b8f7281b51a92d7c3f
  G3_RECOMMENDATION_REFERENCE_SHA: 783afb91a964f5d762f46846f9ef854902b48e95
  G3_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-g3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.G3_CHECKOUT_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Exact authority and bounded scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$G3_CHECKOUT_SHA"
          git merge-base --is-ancestor "$G3_BASE_MAIN_SHA" HEAD
          changed="$(git diff --name-only "$G3_BASE_MAIN_SHA" HEAD)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/v21-admission-g3-production-candidate-gate\.yml|lib/product-source\.js|lib/recommendation-product-enumerator\.mjs|lib/recommendation-legacy-corpus-v1\.mjs|lib/recommendation-candidate-admission-core\.mjs|lib/recommendation-candidate-admission\.js|lib/recommendation-candidate-admission-controlled-probe-oidc\.mjs|app/api/internal/recommendation-candidate-admission-controlled-probe/route\.js|fixtures/recommendation-governance/g3-production-candidate-admission-v1\.json|scripts/verify-v21-admission-g3-production-candidate-gate-v1\.mjs|docs/evidence/v21-admission-g3-production-candidate-gate-v1\.md)$' || true)"
          test -z "$forbidden"
          git diff --exit-code "$G3_BASE_MAIN_SHA" HEAD -- app/api/analyze/route.js lib/recommendation-scoring.js lib/skin-match-decision-engine.js lib/candidate-exposure-policy-shadow.js scripts/product-evidence/initial-admission-grant-policy-v1.mjs scripts/product-evidence/exfoliation-non-numeric-pda-offline-shadow-v1.mjs lib/recommendation-admission-authority-reader.js lib/recommendation-admission-authority-contract.mjs supabase/migrations package.json package-lock.json

      - name: Secret and client-boundary guards
        run: |
          set -euo pipefail
          sensitive_diff="$(git diff --unified=0 "$G3_BASE_MAIN_SHA" HEAD -- app lib fixtures scripts docs || true)"
          ! printf '%s\n' "$sensitive_diff" | grep -E '^\+.*NEXT_PUBLIC_RECOMMENDATION_ADMISSION_DATABASE_URL'
          ! printf '%s\n' "$sensitive_diff" | grep -E '^\+.*process\.env\.SUPABASE_SERVICE_ROLE_KEY'
          ! printf '%s\n' "$sensitive_diff" | grep -E '^\+.*SUPABASE_SERVICE_ROLE_KEY[[:space:]]*[:=]'
          ! printf '%s\n' "$sensitive_diff" | grep -E '^\+.*postgres(ql)?://[^[:space:]]+:[^[:space:]@]+@'
          ! printf '%s\n' "$sensitive_diff" | grep -Ei '^\+.*password[[:space:]]*=[[:space:]]*["'"''][^"'"'']+'
          test "$(git grep -l 'RECOMMENDATION_ADMISSION_DATABASE_URL' -- 'app/**' 'lib/**' | tr '\n' ' ')" = "lib/recommendation-admission-authority-reader.js "
          ! git grep -n 'recommendation-admission-authority-reader' -- 'app/**' ':!app/api/internal/recommendation-admission-authority-controlled-probe/route.js'

      - name: Syntax and focused G3 verification
        run: |
          set -euo pipefail
          node --check lib/recommendation-product-enumerator.mjs
          node --check lib/recommendation-legacy-corpus-v1.mjs
          node --check lib/recommendation-candidate-admission-core.mjs
          node --check lib/recommendation-candidate-admission.js
          node --check lib/product-source.js
          node --check scripts/verify-v21-admission-g3-production-candidate-gate-v1.mjs
          node scripts/verify-v21-admission-g3-production-candidate-gate-v1.mjs

      - name: G3A protected-reader compatibility
        run: node scripts/verify-v21-admission-g3a-pf-authority-reader-v1.mjs

      - name: Revalidate frozen G2 F1-F20
        run: node scripts/product-evidence/verify-initial-admission-grant-policy-v1.mjs

      - name: Revalidate frozen PDA contract
        run: node scripts/product-evidence/verify-exfoliation-non-numeric-pda-contract-v1.mjs

      - name: CandidatePolicy shadow invariance
        run: npm run verify:candidate-exposure-policy-shadow

      - name: Prepare immutable Recommendation reference
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q "$G3_RECOMMENDATION_REFERENCE_SHA"
          node -e 'const f=require("./_reference/recommendation/fixtures/recommendation-metadata/products-v1.json"); if(f.productCount!==164) process.exit(1)'

      - name: Historical canonical 164x12 Recommendation invariance
        env:
          RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
        run: node scripts/verify-skin-decision-recommendation-invariance.mjs

      - name: Deterministic G3 replay A/B
        run: |
          set -euo pipefail
          node scripts/verify-v21-admission-g3-production-candidate-gate-v1.mjs > /tmp/g3-a.json
          node scripts/verify-v21-admission-g3-production-candidate-gate-v1.mjs > /tmp/g3-b.json
          cmp /tmp/g3-a.json /tmp/g3-b.json
          sha256sum /tmp/g3-a.json /tmp/g3-b.json

      - name: Production build
        run: npm run build

      - name: Publish exact-SHA CI attestation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          context="V2.1-ADMISSION-G3 exact-head CI"
          description="G3 exact-head CI passed"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            context="V2.1-ADMISSION-G3 merged-main exact-SHA CI"
            description="G3 merged-main exact-SHA CI passed"
          fi
          if [ "$PRIOR_JOB_STATUS" != success ]; then
            state=failure
            description="${context} failed"
          fi
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/statuses/$G3_CHECKOUT_SHA" -f state="$state" -f context="$context" -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          test "$state" = success
