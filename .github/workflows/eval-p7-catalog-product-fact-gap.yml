name: EVAL-P7 Catalog Product Fact Gap Evaluation

on:
  push:
    branches:
      - eval/p7-catalog-product-fact-gap
      - main
  pull_request:
    paths:
      - ".github/workflows/eval-p7-catalog-product-fact-gap.yml"
      - "fixtures/persona-evaluation/eval-p7-catalog-product-fact-gap-contract-v1.json"
      - "scripts/verify-eval-p7-catalog-product-fact-gap-v1.mjs"
      - "docs/evidence/eval-p7-catalog-product-fact-gap-v1.md"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: eval-p7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  EVAL_P7_BASE_MAIN_SHA: ee8f06485a0e7d41396682ac9d44f5b1402abeaa
  EVAL_P7_P6_MERGED_SHA: ee8f06485a0e7d41396682ac9d44f5b1402abeaa
  EVAL_P7_P5_MERGED_SHA: 269fe701a7f3ee967d12e15c88e9e5767af895f6
  EVAL_P7_P4_MERGED_SHA: a4772e3cd44d68f67fe4bbf25926ba0942f353b3
  EVAL_P7_P3_SOURCE_SHA: 4265450ddcf40bdb4359a3d5c82d22b00a1024dd
  EVAL_P7_RECOMMENDATION_REFERENCE_SHA: 783afb91a964f5d762f46846f9ef854902b48e95
  EVAL_P7_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-eval-p7:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EVAL_P7_CHECKOUT_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact authority and ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVAL_P7_CHECKOUT_SHA"
          git merge-base --is-ancestor "$EVAL_P7_BASE_MAIN_SHA" HEAD
          test "$(git merge-base "$EVAL_P7_BASE_MAIN_SHA" HEAD)" = "$EVAL_P7_BASE_MAIN_SHA"
          git merge-base --is-ancestor "$EVAL_P7_P5_MERGED_SHA" "$EVAL_P7_P6_MERGED_SHA"
          test -f docs/evidence/eval-p5-counterfactual-metamorphic-v1.md
          test -f docs/evidence/eval-p6-persona-regression-infrastructure-v1.md

      - name: Bounded EVAL-P7 change scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$EVAL_P7_BASE_MAIN_SHA")"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/eval-p7-catalog-product-fact-gap\.yml|fixtures/persona-evaluation/eval-p7-catalog-product-fact-gap-contract-v1\.json|scripts/verify-eval-p7-catalog-product-fact-gap-v1\.mjs|docs/evidence/eval-p7-catalog-product-fact-gap-v1\.md)$' || true)"
          test -z "$forbidden"

      - name: No Production Recommendation Product Fact or Hosted mutation
        run: |
          set -euo pipefail
          git diff --exit-code "$EVAL_P7_BASE_MAIN_SHA" -- lib app/api supabase/migrations
          test -z "$(git diff --name-only "$EVAL_P7_BASE_MAIN_SHA" -- package.json package-lock.json)"

      - name: Syntax and contract parse
        run: |
          node --check scripts/verify-eval-p7-catalog-product-fact-gap-v1.mjs
          node -e 'JSON.parse(require("fs").readFileSync("fixtures/persona-evaluation/eval-p7-catalog-product-fact-gap-contract-v1.json","utf8"))'

      - name: Prepare immutable P3 materialization source
        run: |
          set -euo pipefail
          rm -rf _reference/persona-p3
          git clone -q --no-hardlinks . _reference/persona-p3
          git -C _reference/persona-p3 checkout -q "$EVAL_P7_P3_SOURCE_SHA"

      - name: Revalidate EVAL-P4 locked source cohorts
        env:
          EVAL_P4_P3_REFERENCE_ROOT: _reference/persona-p3
          EVAL_P4_ARTIFACT_ROOT: artifacts/eval-p4-replay
        run: node scripts/verify-eval-p4-persona-cohort-freeze-v1.mjs

      - name: Prepare frozen Recommendation reference
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q "$EVAL_P7_RECOMMENDATION_REFERENCE_SHA"
          node -e 'const f=require("./_reference/recommendation/fixtures/recommendation-metadata/products-v1.json"); if(f.productCount!==164||f.categoryCounts?.sunscreen!==11) process.exit(1)'

      - name: Re-run EVAL-P5 metamorphic source-predicate evidence
        env:
          EVAL_P5_P3_REFERENCE_ROOT: _reference/persona-p3
          EVAL_P5_RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
          EVAL_P5_IMPLEMENTATION_SHA: ${{ env.EVAL_P7_CHECKOUT_SHA }}
          EVAL_P5_ARTIFACT_ROOT: artifacts/eval-p5-replay
        run: |
          node scripts/verify-eval-p5-counterfactual-metamorphic-v1.mjs
          node scripts/finalize-eval-p5-summary-v1.mjs

      - name: Run EVAL-P7 E4 gap evaluator pass A
        env:
          EVAL_P7_RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
          EVAL_P7_P5_ARTIFACT_ROOT: artifacts/eval-p5-replay
          EVAL_P7_ARTIFACT_ROOT: artifacts/eval-p7/pass-a
          EVAL_P7_IMPLEMENTATION_SHA: ${{ env.EVAL_P7_CHECKOUT_SHA }}
        run: node scripts/verify-eval-p7-catalog-product-fact-gap-v1.mjs

      - name: Run EVAL-P7 E4 gap evaluator pass B
        env:
          EVAL_P7_RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
          EVAL_P7_P5_ARTIFACT_ROOT: artifacts/eval-p5-replay
          EVAL_P7_ARTIFACT_ROOT: artifacts/eval-p7/pass-b
          EVAL_P7_IMPLEMENTATION_SHA: ${{ env.EVAL_P7_CHECKOUT_SHA }}
        run: node scripts/verify-eval-p7-catalog-product-fact-gap-v1.mjs

      - name: Verify EVAL-P7 deterministic semantic replay
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('artifacts/eval-p7/pass-a/catalog-product-fact-gap-summary-v1.json','utf8'));
          const b=JSON.parse(fs.readFileSync('artifacts/eval-p7/pass-b/catalog-product-fact-gap-summary-v1.json','utf8'));
          if(a.hashes.evidence_semantic_hash!==b.hashes.evidence_semantic_hash) throw new Error('P7 semantic replay mismatch');
          if(a.terminal_outcome!=='CATALOG_PRODUCT_FACT_GAP_TAXONOMY_ESTABLISHED_WITH_CATALOG_COVERAGE_NOT_ESTABLISHED') throw new Error('Unexpected P7 terminal');
          NODE

      - name: Prepare P6 baseline engine checkout
        run: |
          set -euo pipefail
          rm -rf _reference/eval-p6-baseline-engine
          git clone -q --no-hardlinks . _reference/eval-p6-baseline-engine
          git -C _reference/eval-p6-baseline-engine checkout -q "$EVAL_P7_P5_MERGED_SHA"

      - name: Replay P6 LOCKED regression cohort on baseline engine
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          cd _reference/eval-p6-baseline-engine
          EVAL_P6_ENGINE_ROOT="$PWD" \
          EVAL_P6_ENGINE_SHA="$EVAL_P7_P5_MERGED_SHA" \
          EVAL_P6_RUN_ROLE=BASELINE \
          EVAL_P6_P3_REFERENCE_ROOT="$root/_reference/persona-p3" \
          EVAL_P6_RECOMMENDATION_REFERENCE_ROOT="$root/_reference/recommendation" \
          EVAL_P6_P4_MANIFEST_PATH="$root/fixtures/persona-evaluation/eval-p4-cohort-freeze-manifest-v1.json" \
          EVAL_P6_COHORT_PATH="$root/fixtures/persona-evaluation/eval-p6-locked-regression-cohort-v1.json" \
          EVAL_P6_ARTIFACT_ROOT="$root/artifacts/eval-p6/baseline" \
          EVAL_P6_SIMULATION_RUN_ID=BASELINE_EXACT_REPLAY \
          node "$root/scripts/verify-eval-p6-persona-regression-v1.mjs"

      - name: Replay P6 LOCKED regression cohort on P7 candidate
        env:
          EVAL_P6_ENGINE_ROOT: ${{ github.workspace }}
          EVAL_P6_ENGINE_SHA: ${{ env.EVAL_P7_CHECKOUT_SHA }}
          EVAL_P6_RUN_ROLE: CANDIDATE
          EVAL_P6_P3_REFERENCE_ROOT: _reference/persona-p3
          EVAL_P6_RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
          EVAL_P6_P4_MANIFEST_PATH: fixtures/persona-evaluation/eval-p4-cohort-freeze-manifest-v1.json
          EVAL_P6_COHORT_PATH: fixtures/persona-evaluation/eval-p6-locked-regression-cohort-v1.json
          EVAL_P6_ARTIFACT_ROOT: artifacts/eval-p6/candidate
          EVAL_P6_SIMULATION_RUN_ID: CANDIDATE_EXACT_REPLAY
        run: node scripts/verify-eval-p6-persona-regression-v1.mjs

      - name: Verify P6 semantic zero-delta
        env:
          EVAL_P6_BASELINE_ARTIFACT_ROOT: artifacts/eval-p6/baseline
          EVAL_P6_CANDIDATE_ARTIFACT_ROOT: artifacts/eval-p6/candidate
          EVAL_P6_COMPARISON_ARTIFACT_ROOT: artifacts/eval-p6/comparison
          EVAL_P6_EXPECT_ZERO_DELTA: "1"
        run: node scripts/compare-eval-p6-persona-regression-v1.mjs

      - name: Verify frozen P6 baseline contract
        run: node scripts/verify-eval-p6-regression-baseline-v1.mjs

      - name: Re-run EVAL-P3 deterministic harness
        env:
          EVAL_P3_REFERENCE_ROOT: _reference/recommendation
          EVAL_P3_IMPLEMENTATION_SHA: ${{ env.EVAL_P7_CHECKOUT_SHA }}
          EVAL_P3_ARTIFACT_ROOT: artifacts/eval-p3-replay
        run: node scripts/verify-eval-p3-persona-simulation-v1.mjs

      - name: Historical 164x12 Recommendation replay
        env:
          RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
        run: node scripts/verify-skin-decision-recommendation-invariance.mjs

      - name: Production build
        run: npm run build

      - name: Upload EVAL-P7 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-p7-catalog-product-fact-gap-${{ env.EVAL_P7_CHECKOUT_SHA }}
          path: artifacts/eval-p7/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish exact-SHA CI attestation
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state="success"
          context="EVAL-P7 exact-head CI"
          description="EVAL-P7 exact-head CI passed"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            context="EVAL-P7 merged-main exact-SHA CI"
            description="EVAL-P7 merged-main exact-SHA CI passed"
          fi
          if [ "$PRIOR_JOB_STATUS" != "success" ]; then
            state="failure"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then description="EVAL-P7 merged-main exact-SHA CI failed"; else description="EVAL-P7 exact-head CI failed"; fi
          fi
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="$context" -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          test "$state" = "success"
