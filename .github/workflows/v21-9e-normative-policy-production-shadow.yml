name: V2.1-9E Normative Policy Production SHADOW

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-9e-normative-policy-production-shadow.yml'
      - 'app/api/internal/exfoliation-normative-policy-runtime-state/route.js'
      - 'lib/skin-match-decision-engine.js'
      - 'lib/exfoliation-normative-policy-production-shadow-observer.js'
      - 'lib/exfoliation-normative-policy-governed-runtime-authority.js'
      - 'lib/exfoliation-normative-policy-runtime-state-readback.js'
      - 'scripts/product-evidence/verify-exfoliation-normative-policy-production-shadow-wiring-v1.mjs'
      - 'scripts/product-evidence/build-exfoliation-normative-policy-production-shadow-wiring-v1.mjs'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-normative-policy-production-shadow-wiring-validation-v1.json'
      - 'scripts/product-evidence/verify-exfoliation-normative-policy-activation-authorization-runtime-safety-v1.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v21-9e-normative-policy-production-shadow.yml'
      - 'app/api/internal/exfoliation-normative-policy-runtime-state/route.js'
      - 'lib/skin-match-decision-engine.js'
      - 'lib/exfoliation-normative-policy-production-shadow-observer.js'
      - 'lib/exfoliation-normative-policy-governed-runtime-authority.js'
      - 'lib/exfoliation-normative-policy-runtime-state-readback.js'
      - 'scripts/product-evidence/verify-exfoliation-normative-policy-production-shadow-wiring-v1.mjs'
      - 'scripts/product-evidence/build-exfoliation-normative-policy-production-shadow-wiring-v1.mjs'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-normative-policy-production-shadow-wiring-validation-v1.json'
      - 'scripts/product-evidence/verify-exfoliation-normative-policy-activation-authorization-runtime-safety-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-v21-9e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      V21_9E_BASE_MAIN_SHA: 41c6e1a7a81d205b096ec504f39cccdbd04c5dfb
      V21_9E_ARTIFACT_SHA256: 5ec22e79667d7e32a20cb5512db99d739ce7f49b59807605deef8737e1c291e0
      V21_9E_RECOMMENDATION_REFERENCE_SHA: 783afb91a964f5d762f46846f9ef854902b48e95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Exact authority and hook scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$V21_9E_BASE_MAIN_SHA" HEAD
          test "$(grep -c 'observeExfoliationNormativePolicyProductionShadow' lib/skin-match-decision-engine.js)" = "1"
          grep -q 'POST_SCORE_POST_SORT_ELIGIBILITY_OVERLAY_BEFORE_RESULT_ASSEMBLY' lib/exfoliation-normative-policy-activation-runtime.js
          ! grep -q 'EXFOLIATION_NORMATIVE_POLICY_MODE.*ENFORCE' lib/exfoliation-normative-policy-production-shadow-observer.js
          test -f app/api/internal/exfoliation-normative-policy-runtime-state/route.js
          test -f lib/exfoliation-normative-policy-runtime-state-readback.js

      - name: Syntax and deterministic Build A B checked-in equality
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/exfoliation-normative-policy-governed-runtime-authority.js
          node --check lib/exfoliation-normative-policy-production-shadow-observer.js
          node --check lib/exfoliation-normative-policy-runtime-state-readback.js
          node --check scripts/product-evidence/build-exfoliation-normative-policy-production-shadow-wiring-v1.mjs
          node --check scripts/product-evidence/verify-exfoliation-normative-policy-production-shadow-wiring-v1.mjs
          rm -rf /tmp/v21-9e-a /tmp/v21-9e-b
          mkdir -p /tmp/v21-9e-a /tmp/v21-9e-b
          V21_9E_OUTPUT_DIR=/tmp/v21-9e-a node scripts/product-evidence/build-exfoliation-normative-policy-production-shadow-wiring-v1.mjs
          V21_9E_OUTPUT_DIR=/tmp/v21-9e-b node scripts/product-evidence/build-exfoliation-normative-policy-production-shadow-wiring-v1.mjs
          cmp /tmp/v21-9e-a/exfoliation-normative-policy-production-shadow-wiring-validation-v1.json /tmp/v21-9e-b/exfoliation-normative-policy-production-shadow-wiring-validation-v1.json
          cmp /tmp/v21-9e-a/exfoliation-normative-policy-production-shadow-wiring-validation-v1.json evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-normative-policy-production-shadow-wiring-validation-v1.json
          test "$(sha256sum /tmp/v21-9e-a/exfoliation-normative-policy-production-shadow-wiring-validation-v1.json | awk '{print $1}')" = "$V21_9E_ARTIFACT_SHA256"
          sha256sum /tmp/v21-9e-a/exfoliation-normative-policy-production-shadow-wiring-validation-v1.json

      - name: Focused V2.1-9E SHADOW verifier
        run: node --experimental-default-type=module scripts/product-evidence/verify-exfoliation-normative-policy-production-shadow-wiring-v1.mjs

      - name: Historical V2.1-9D safety verifier
        env:
          V21_9D_REQUIRE_CHECKED_IN: '1'
        run: node scripts/product-evidence/verify-exfoliation-normative-policy-activation-authorization-runtime-safety-v1.mjs

      - name: Prepare frozen 164 x 12 recommendation reference
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q "$V21_9E_RECOMMENDATION_REFERENCE_SHA"

      - name: Canonical 164 x 12 explicit-OFF production materialization
        shell: bash
        env:
          EXFOLIATION_NORMATIVE_POLICY_ENABLED: '0'
          EXFOLIATION_NORMATIVE_POLICY_KILL_SWITCH: '0'
          EXFOLIATION_NORMATIVE_POLICY_MODE: 'OFF'
          EXFOLIATION_NORMATIVE_POLICY_ACTIVATION_VERSION: exfoliation-non-numeric-pda-normative-production-policy-activation-v1
          EXFOLIATION_NORMATIVE_POLICY_CONTRACT_VERSION: exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1
          EXFOLIATION_NORMATIVE_POLICY_RUNTIME_VERSION: exfoliation-non-numeric-pda-normative-production-policy-shadow-v1
          EXFOLIATION_NORMATIVE_POLICY_SCOPE: POST_SCORE_POST_SORT_ELIGIBILITY_OVERLAY_BEFORE_RESULT_ASSEMBLY
        run: |
          set -euo pipefail
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation \
          RECOMMENDATION_ENGINE_SHA="${{ github.event.pull_request.head.sha || github.sha }}" \
          RECOMMENDATION_SEMANTIC_ARTIFACT_PATH=/tmp/v21-9e-off-semantic.json \
          node scripts/verify-skin-decision-recommendation-invariance.mjs

      - name: Canonical 164 x 12 SHADOW direct production invariance
        shell: bash
        env:
          EXFOLIATION_NORMATIVE_POLICY_ENABLED: '1'
          EXFOLIATION_NORMATIVE_POLICY_KILL_SWITCH: '0'
          EXFOLIATION_NORMATIVE_POLICY_MODE: 'SHADOW'
          EXFOLIATION_NORMATIVE_POLICY_ACTIVATION_VERSION: exfoliation-non-numeric-pda-normative-production-policy-activation-v1
          EXFOLIATION_NORMATIVE_POLICY_CONTRACT_VERSION: exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1
          EXFOLIATION_NORMATIVE_POLICY_RUNTIME_VERSION: exfoliation-non-numeric-pda-normative-production-policy-shadow-v1
          EXFOLIATION_NORMATIVE_POLICY_SCOPE: POST_SCORE_POST_SORT_ELIGIBILITY_OVERLAY_BEFORE_RESULT_ASSEMBLY
        run: |
          set -euo pipefail
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation \
          RECOMMENDATION_ENGINE_SHA="${{ github.event.pull_request.head.sha || github.sha }}" \
          RECOMMENDATION_SEMANTIC_ARTIFACT_PATH=/tmp/v21-9e-shadow-semantic.json \
          node scripts/verify-skin-decision-recommendation-invariance.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const off = JSON.parse(await readFile('/tmp/v21-9e-off-semantic.json', 'utf8'));
          const shadow = JSON.parse(await readFile('/tmp/v21-9e-shadow-semantic.json', 'utf8'));
          assert.equal(off.schema_version, 'historical-recommendation-semantic-invariance-v1');
          assert.equal(shadow.schema_version, off.schema_version);
          assert.equal(off.semantic_hash, shadow.semantic_hash, 'OFF vs SHADOW aggregate semantic hash');
          assert.equal(off.scenarios.length, 12);
          assert.equal(shadow.scenarios.length, off.scenarios.length);
          const shadowById = new Map(shadow.scenarios.map((scenario) => [scenario.id, scenario]));
          const fields = [
            'projection_hash',
            'score_hash',
            'ranking_hash',
            'top1_hash',
            'top3_hash',
            'eligibility_hash',
            'legacy_ranking_hash',
            'legacy_score_hash',
            'legacy_response_hash'
          ];
          for (const before of off.scenarios) {
            const after = shadowById.get(before.id);
            assert(after, `${before.id}: SHADOW scenario missing`);
            for (const field of fields) {
              assert.equal(after[field], before[field], `${before.id}: OFF vs SHADOW ${field}`);
            }
          }
          assert.equal(off.self_tests.presentation_only_projection_invariant, 'PASS');
          assert.equal(shadow.self_tests.presentation_only_projection_invariant, 'PASS');
          assert.equal(off.self_tests.real_semantic_delta_detected, 'DETECTED');
          assert.equal(shadow.self_tests.real_semantic_delta_detected, 'DETECTED');
          console.log(`V2.1-9E current OFF↔SHADOW direct invariance: PASS scenarios=${off.scenarios.length} semantic_hash=${off.semantic_hash}`);
          console.log('score_delta=0 ranking_delta=0 top1_delta=0 top3_delta=0 eligibility_delta=0 public_response_delta=0');
          NODE

      - name: Production build
        env:
          EXFOLIATION_NORMATIVE_POLICY_ENABLED: '0'
          EXFOLIATION_NORMATIVE_POLICY_KILL_SWITCH: '0'
          EXFOLIATION_NORMATIVE_POLICY_MODE: 'OFF'
          EXFOLIATION_NORMATIVE_POLICY_ACTIVATION_VERSION: exfoliation-non-numeric-pda-normative-production-policy-activation-v1
          EXFOLIATION_NORMATIVE_POLICY_CONTRACT_VERSION: exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1
          EXFOLIATION_NORMATIVE_POLICY_RUNTIME_VERSION: exfoliation-non-numeric-pda-normative-production-policy-shadow-v1
          EXFOLIATION_NORMATIVE_POLICY_SCOPE: POST_SCORE_POST_SORT_ELIGIBILITY_OVERLAY_BEFORE_RESULT_ASSEMBLY
        run: npm run build

      - name: Publish merged-main exact-SHA CI attestation
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          PRIOR_JOB_STATUS: '${{ job.status }}'
        run: |
          set -euo pipefail
          state="success"
          description="V2.1-9E merged-main exact-SHA CI passed"
          if [ "$PRIOR_JOB_STATUS" != "success" ]; then
            state="failure"
            description="V2.1-9E merged-main exact-SHA CI failed"
          fi
          payload=$(printf '{"state":"%s","context":"V2.1-9E merged-main exact-SHA CI","description":"%s","target_url":"%s/%s/actions/runs/%s"}' \
            "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null
          test "$state" = "success"
