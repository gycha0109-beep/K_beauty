name: Face Lab - Pointing04 Source Metadata
run-name: "[WT:face-research] Face Lab - Pointing04 Source Metadata"
# source-metadata-revision: figshare-v2

on:
  pull_request:
    paths:
      - "scripts/build-face-lab-pointing04-source-metadata.mjs"
      - "scripts/verify-face-lab-pointing04-source-metadata.mjs"
      - ".github/workflows/face-lab-pointing04-source-metadata.yml"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: "Optional CI Watchtower Track Key"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: face-lab-pointing04-source-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact Face Lab head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact event head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Discover official Pointing04 archive inventory
        run: |
          node scripts/build-face-lab-pointing04-source-metadata.mjs             "$RUNNER_TEMP/pointing04-source-metadata.json"

      - name: Verify metadata-only source inventory
        run: |
          node scripts/verify-face-lab-pointing04-source-metadata.mjs             "$RUNNER_TEMP/pointing04-source-metadata.json"

      - name: Upload metadata packet only
        uses: actions/upload-artifact@v7
        with:
          name: face-lab-pointing04-source-metadata-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pointing04-source-metadata.json
          if-no-files-found: error
          retention-days: 7
