name: Premium PR27 sequential decision debug

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/premium-pr27-debug.yml]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/premium-engine-main-sec-baseline
          fetch-depth: 0
      - name: Rebuild and commit reviewed PR27 merge tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/premium-route-storage-reentry-verification
          set +e
          git merge --no-ff --no-commit origin/agent/premium-route-storage-reentry-verification
          set -e
          python - <<'PY'
          from pathlib import Path
          import ast, base64, re, zlib
          workflow = Path('.github/workflows/premium-stack-merge-once.yml').read_text(encoding='utf-8')
          for name, target in [('full', 'app/api/full-report/route.js'), ('session', 'app/api/full-report/session/route.js')]:
              match = re.search(rf'^          {name} = (".*")$', workflow, re.MULTILINE)
              if not match:
                  raise SystemExit(f'missing embedded {name} payload')
              Path(target).write_bytes(zlib.decompress(base64.b64decode(ast.literal_eval(match.group(1)))))
          suite = Path('scripts/run-security-closeout-verifier-suite.mjs')
          text = suite.read_text(encoding='utf-8')
          entry = '  "verify-premium-route-storage-reentry.mjs",\n'
          if entry not in text:
              anchor = '  "verify-premium-report-reentry-contract.mjs",\n'
              suite.write_text(text.replace(anchor, anchor + entry, 1), encoding='utf-8')
          PY
          git add app/api/full-report/route.js app/api/full-report/session/route.js scripts/run-security-closeout-verifier-suite.mjs
          test -z "$(git diff --name-only --diff-filter=U)"
          rm .github/workflows/premium-stack-merge-once.yml .github/workflows/premium-pr27-debug.yml
          git add -A
          git commit -m "debug: reproduce sequential committed PR27 tree"
          npm ci
      - name: Run route verifier
        run: node scripts/verify-premium-route-storage-reentry.mjs
      - name: Run evaluation verifier
        run: node scripts/verify-premium-integrated-evaluation.mjs
      - name: Run reentry verifier
        run: node scripts/verify-premium-report-reentry-contract.mjs
      - name: Run decision verifier with evidence
        id: decision
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-premium-decision-state.mjs 2>&1 | tee pr27-sequential-decision.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-pr27-sequential-decision-debug
          path: pr27-sequential-decision.log
          if-no-files-found: error
          retention-days: 7
      - name: Report outcome
        run: echo "decision=${{ steps.decision.outcome }}"
