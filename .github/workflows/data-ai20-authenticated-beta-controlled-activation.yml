name: DATA-AI20 Authenticated Limited Beta Controlled Activation

on:
  pull_request:
    branches: [main]
    paths:
      - "vercel.json"
      - "app/api/my/product-query-beta/route.js"
      - "lib/product-query-authenticated-beta-runtime.mjs"
      - "lib/product-query-authenticated-beta-controlled-activation.mjs"
      - "scripts/verify-data-ai20-authenticated-beta-controlled-activation.mjs"
      - ".github/workflows/data-ai20-authenticated-beta-controlled-activation.yml"
  push:
    branches: [main]
    paths:
      - "vercel.json"
      - "app/api/my/product-query-beta/route.js"
      - "lib/product-query-authenticated-beta-runtime.mjs"
      - "lib/product-query-authenticated-beta-controlled-activation.mjs"
      - "scripts/verify-data-ai20-authenticated-beta-controlled-activation.mjs"
      - ".github/workflows/data-ai20-authenticated-beta-controlled-activation.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: data-ai20-authenticated-limited-beta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: DATA-AI20 controlled activation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify DATA-AI20 controlled activation
        run: node scripts/verify-data-ai20-authenticated-beta-controlled-activation.mjs

  production-acceptance:
    name: DATA-AI20 exact-deployment authenticated Production acceptance
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      DATA_AI_HOSTED_PREVIEW_ACCESS_TOKEN: ${{ secrets.DATA_AI_HOSTED_PREVIEW_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact activation SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Attest bounded activation manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.env.BEJEWELY_PRODUCT_QUERY_BETA_ENABLED' vercel.json)" = "true"
          test "$(jq -r '.env.BEJEWELY_PRODUCT_QUERY_BETA_RUNTIME_AUTHORIZED' vercel.json)" = "true"
          test "$(jq -r '.env.BEJEWELY_PRODUCT_QUERY_BETA_EMERGENCY_DISABLE' vercel.json)" = "false"
          test "$(jq -r '.env.BEJEWELY_PRODUCT_QUERY_BETA_AUTOMATIC_TRAFFIC_SAMPLING' vercel.json)" = "false"
          test "$(jq -r '.env.BEJEWELY_PRODUCT_QUERY_BETA_PUBLIC_SEARCH_CUTOVER' vercel.json)" = "false"
          test "$(jq -r '.env.BEJEWELY_PRODUCT_QUERY_BETA_PERSISTENCE' vercel.json)" = "none"
          hashes="$(jq -r '.env.BEJEWELY_PRODUCT_QUERY_BETA_APPROVED_ACCOUNT_HASHES' vercel.json)"
          HASHES="$hashes" node <<'NODE'
          const hashes = (process.env.HASHES || "").split(",").filter(Boolean);
          if (hashes.length < 1 || hashes.length > 3) throw new Error("cohort must contain 1..3 hashes");
          if (new Set(hashes).size !== hashes.length) throw new Error("duplicate cohort hash");
          if (hashes.some((x) => !/^[a-f0-9]{64}$/.test(x))) throw new Error("invalid cohort hash");
          NODE

      - name: Require fresh approved authenticated credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATA_AI_HOSTED_PREVIEW_ACCESS_TOKEN"
          echo "::add-mask::$DATA_AI_HOSTED_PREVIEW_ACCESS_TOKEN"
          approved="$(jq -r '.env.BEJEWELY_PRODUCT_QUERY_BETA_APPROVED_ACCOUNT_HASHES' vercel.json)"
          ACCESS_TOKEN="$DATA_AI_HOSTED_PREVIEW_ACCESS_TOKEN" APPROVED_HASHES="$approved" node <<'NODE'
          const crypto = require("node:crypto");
          const token = process.env.ACCESS_TOKEN || "";
          const parts = token.split(".");
          if (parts.length !== 3) throw new Error("credential is not a JWT");
          const payload = JSON.parse(
            Buffer.from(parts[1].replace(/-/g, "+").replace(/_/g, "/"), "base64").toString("utf8")
          );
          if (typeof payload.sub !== "string" || !payload.sub) throw new Error("JWT sub missing");
          if (!Number.isFinite(payload.exp) || payload.exp <= Math.floor(Date.now() / 1000)) {
            throw new Error("authenticated credential expired");
          }
          const hash = crypto.createHash("sha256").update(payload.sub, "utf8").digest("hex");
          const approved = (process.env.APPROVED_HASHES || "").split(",");
          if (!approved.includes(hash)) throw new Error("credential subject not approved");
          console.log("DATA_AI20_CREDENTIAL_ATTESTATION=PASS");
          console.log("RAW_SUB_RECORDED=false");
          console.log("RAW_TOKEN_RECORDED=false");
          NODE

      - name: Resolve exact successful Production deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url=""
          for attempt in $(seq 1 48); do
            ids="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&per_page=100" --jq '.[] | .id' || true)"
            for id in $ids; do
              deployment="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments/$id")"
              production="$(printf '%s' "$deployment" | jq -r '.production_environment // false')"
              environment="$(printf '%s' "$deployment" | jq -r '.environment // ""' | tr '[:upper:]' '[:lower:]')"
              if [ "$production" != "true" ] && [ "$environment" != "production" ]; then
                continue
              fi
              candidate="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success" and .environment_url != null)][0].environment_url // empty' || true)"
              if [ -n "$candidate" ]; then
                url="${candidate%/}"
                break
              fi
            done
            if [ -n "$url" ]; then break; fi
            sleep 5
          done
          test -n "$url"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Obtain Vercel trusted OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          trusted_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          trusted="$(printf '%s' "$trusted_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          echo "::add-mask::$trusted"
          printf 'trusted=%s\n' "$trusted" >> "$GITHUB_OUTPUT"

      - name: Assert anonymous traffic remains closed
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.trusted }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          status="$(curl --silent --show-error -o "$output" -w '%{http_code}' -X POST             -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN"             -H 'Content-Type: application/json'             --data '{"query":"data-ai20-anonymous-probe"}'             "$DEPLOYMENT_URL/api/my/product-query-beta")"
          test "$status" = "401"

      - name: Execute approved authenticated limited-beta request
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.trusted }}
        shell: bash
        run: |
          set -euo pipefail
          query='oily skin sunscreen no white cast non sticky'
          payload='{"query":"oily skin sunscreen no white cast non sticky"}'
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          status="$(curl --silent --show-error --retry 2 --retry-delay 2 --retry-all-errors             -o "$output" -w '%{http_code}' -X POST             -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN"             -H "Authorization: Bearer $DATA_AI_HOSTED_PREVIEW_ACCESS_TOKEN"             -H 'Content-Type: application/json'             --data "$payload"             "$DEPLOYMENT_URL/api/my/product-query-beta")"
          test "$status" = "200"
          if grep -Fq "$query" "$output"; then
            echo "raw query leaked in DATA-AI20 response" >&2
            exit 1
          fi
          node - "$output" <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (body?.ok !== true) throw new Error("limited beta did not return ok=true");
          if (body?.contractVersion !== "product-query-authenticated-beta-v1") {
            throw new Error("unexpected limited-beta contract");
          }
          if (body?.beta?.authenticatedOnly !== true ||
              body?.beta?.explicitServerSideBetaEligibilityRequired !== true ||
              body?.beta?.automaticTrafficSampling !== false ||
              body?.beta?.publicSearchCutover !== false ||
              body?.beta?.persisted !== false) {
            throw new Error("limited-beta safety boundary violated");
          }
          if (body?.result?.contractVersion !== "product-query-preview-v1" ||
              body?.result?.persisted !== false ||
              !Array.isArray(body?.result?.results) ||
              body.result.results.length > 5) {
            throw new Error("nested deterministic preview boundary violated");
          }
          const forbidden = new Set(["score", "matchedSignals", "provider", "model", "intent"]);
          const visit = (value) => {
            if (!value || typeof value !== "object") return;
            for (const [key, child] of Object.entries(value)) {
              if (forbidden.has(key)) throw new Error("forbidden response key: " + key);
              visit(child);
            }
          };
          visit(body);
          NODE
          echo "DATA_AI20_AUTHENTICATED_LIMITED_BETA=PASS"
