name: Face Lab - Provider Pilot Smoke

run-name: "${{ github.event.inputs.mode == 'full-pilot' && '[WT:face-research] Face Lab - Provider Full Pilot (MANUAL)' || '[WT:face-research] Face Lab - Provider Canary (MANUAL)' }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Paid OpenAI image run. Use canary unless a full 8-output pilot is explicitly required."
        required: true
        default: "canary"
        type: choice
        options:
          - canary
          - full-pilot

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "1"
      FACE_LAB_E2E_EMAIL_A: ${{ secrets.FACE_LAB_E2E_EMAIL_A }}
      FACE_LAB_E2E_PASSWORD_A: ${{ secrets.FACE_LAB_E2E_PASSWORD_A }}
      FACE_LAB_E2E_EMAIL_B: ${{ secrets.FACE_LAB_E2E_EMAIL_B }}
      FACE_LAB_E2E_PASSWORD_B: ${{ secrets.FACE_LAB_E2E_PASSWORD_B }}
      FACE_LAB_E2E_INTENTS: ${{ github.event.inputs.mode == 'full-pilot' && '4' || '1' }}
      FACE_LAB_E2E_GENERATIONS: ${{ github.event.inputs.mode == 'full-pilot' && '2' || '1' }}
      FACE_LAB_E2E_MAX_OUTPUTS: ${{ github.event.inputs.mode == 'full-pilot' && '8' || '1' }}
      FACE_LAB_E2E_LIVE_APPROVAL: "I_ACCEPT_OPENAI_IMAGE_COST"
      FACE_LAB_E2E_PERSIST_OUTPUTS: "0"
      FACE_LAB_E2E_BOOTSTRAP_USERS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify provider pilot E2E contract
        run: |
          node scripts/verify-face-lab-v2-simulation-provider-pilot-e2e.mjs
          node --check scripts/run-face-lab-v2-simulation-provider-pilot-e2e.mjs
      - name: Verify test account secrets are configured
        shell: bash
        run: |
          test -n "$FACE_LAB_E2E_EMAIL_A"
          test -n "$FACE_LAB_E2E_PASSWORD_A"
          test -n "$FACE_LAB_E2E_EMAIL_B"
          test -n "$FACE_LAB_E2E_PASSWORD_B"
      - name: Run paid provider pilot
        run: node scripts/run-face-lab-v2-simulation-provider-pilot-e2e.mjs
