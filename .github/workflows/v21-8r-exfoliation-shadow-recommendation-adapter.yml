name: V2.1-8R Exfoliation Shadow Recommendation Adapter

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-8r-exfoliation-shadow-recommendation-adapter.yml'
      - 'lib/exfoliation-non-numeric-pda-shadow-adapter.js'
      - 'lib/candidate-exposure-policy-shadow.js'
      - 'scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-adapter-implementation-v1.mjs'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-adapter-implementation-v1.json'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-adapter-validation-replay-v1.json'
      - 'docs/evidence/exfoliation-non-numeric-pda-shadow-recommendation-adapter-implementation-v1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-8r-exfoliation-shadow-recommendation-adapter.yml'
      - 'lib/exfoliation-non-numeric-pda-shadow-adapter.js'
      - 'lib/candidate-exposure-policy-shadow.js'
      - 'scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-adapter-implementation-v1.mjs'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-adapter-implementation-v1.json'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-adapter-validation-replay-v1.json'
      - 'docs/evidence/exfoliation-non-numeric-pda-shadow-recommendation-adapter-implementation-v1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-frozen-v21-8r:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      V21_8R_MERGED_MAIN_SHA: 053a963a14bf00d7deb731a2c5427a97f3172b9f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replay frozen V2.1-8R authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/v21-8r
          git clone -q --no-hardlinks . _reference/v21-8r
          git -C _reference/v21-8r checkout -q "$V21_8R_MERGED_MAIN_SHA"
          test "$(git -C _reference/v21-8r rev-parse HEAD)" = "$V21_8R_MERGED_MAIN_SHA"
          (cd _reference/v21-8r && node scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-adapter-implementation-v1.mjs)
          rm -rf _reference/v21-8r
