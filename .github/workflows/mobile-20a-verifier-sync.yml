name: BEJEWELY Mobile 20A Verifier Sync

on:
  push:
    branches: [mobile-20c-google-play-feature-graphic]
    paths:
      - ".github/workflows/mobile-20a-verifier-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-20a-verifier-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Align bounded KO frame verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: mobile-20c-google-play-feature-graphic
          fetch-depth: 0

      - name: Align verifier authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          verifier_path = Path('scripts/verify-mobile-20a-store-capture.mjs')
          verifier = verifier_path.read_text()
          runtime_path = Path('scripts/capture-mobile-store-assets.sh')
          runtime = runtime_path.read_text()

          old = '"KO_FRAME_POSITION_LIMIT=4",'
          new = '"KO_FRAME_POSITION_LIMIT=5",'
          if runtime.count('KO_FRAME_POSITION_LIMIT=5') != 1:
              raise SystemExit('runtime bounded KO retry authority is not exactly 5')
          if verifier.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy verifier marker, found {verifier.count(old)}')
          verifier = verifier.replace(old, new, 1)
          if 'KO_FRAME_POSITION_LIMIT=4' in verifier:
              raise SystemExit('legacy KO retry verifier marker remained')
          if verifier.count('KO_FRAME_POSITION_LIMIT=5') != 1:
              raise SystemExit('KO retry verifier marker is not singular')
          verifier_path.write_text(verifier)
          PY

      - name: Verify static MOBILE-20A contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-mobile-20a-store-capture.mjs

      - name: Remove one-shot workflow and commit verifier sync
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/mobile-20a-verifier-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-mobile-20a-store-capture.mjs .github/workflows/mobile-20a-verifier-sync.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'sync produced no diff'; exit 1; }
          git commit -m 'test(mobile): align 20A verifier with bounded KO frame retry'
          git push origin HEAD:mobile-20c-google-play-feature-graphic
