name: Verify current routine policy

on:
  pull_request:
    branches:
      - agent/routine-policy-single-source

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/verify-routine-policy-single-source.mjs
      - run: node scripts/verify-functional-policy-single-source.mjs
      - run: node scripts/verify-premium-decision-state.mjs
      - run: node scripts/verify-functional-plan-decision.mjs
      - run: node scripts/verify-current-product-findings.mjs
      - run: node scripts/verify-premium-report-reentry-contract.mjs
      - run: npm run architecture:guard
      - run: npm run build
      - run: git diff --check
