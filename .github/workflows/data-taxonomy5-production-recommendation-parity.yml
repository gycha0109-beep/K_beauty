name: DATA-TAXONOMY5 Production Recommendation Parity

on:
  pull_request:
    branches:
      - main
    paths:
      - "evidence/catalog-taxonomy-v1/data-taxonomy5-production-recommendation-parity-v1.json"
      - "supabase/migrations/20260913152500_data_taxonomy5_recommendation_shadow_replay_v1.sql"
      - "lib/catalog-taxonomy-recommendation-shadow-reader.js"
      - "lib/catalog-taxonomy-recommendation-shadow-replay.js"
      - "lib/catalog-taxonomy-recommendation-shadow-probe-oidc.js"
      - "app/api/internal/catalog-taxonomy-recommendation-shadow-replay/route.js"
      - "scripts/product-evidence/verify-data-taxonomy5-production-recommendation-parity-foundation-v1.mjs"
      - ".github/workflows/data-taxonomy5-production-recommendation-parity.yml"
      - "scripts/verify-current-main-health.mjs"
      - "lib/product-source.js"
      - "lib/recommendation-scoring.ts"
  push:
    branches:
      - main
    paths:
      - "evidence/catalog-taxonomy-v1/data-taxonomy5-production-recommendation-parity-v1.json"
      - "supabase/migrations/20260913152500_data_taxonomy5_recommendation_shadow_replay_v1.sql"
      - "lib/catalog-taxonomy-recommendation-shadow-reader.js"
      - "lib/catalog-taxonomy-recommendation-shadow-replay.js"
      - "lib/catalog-taxonomy-recommendation-shadow-probe-oidc.js"
      - "app/api/internal/catalog-taxonomy-recommendation-shadow-replay/route.js"
      - "scripts/product-evidence/verify-data-taxonomy5-production-recommendation-parity-foundation-v1.mjs"
      - ".github/workflows/data-taxonomy5-production-recommendation-parity.yml"
      - "scripts/verify-current-main-health.mjs"
      - "lib/product-source.js"
      - "lib/recommendation-scoring.ts"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: data-taxonomy5-production-recommendation-parity-${{ github.ref }}
  cancel-in-progress: false

env:
  DATA_TAXONOMY5_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  DATA_TAXONOMY5_OIDC_AUDIENCE: urn:bejewely:data-taxonomy5:production-recommendation-parity

jobs:
  verify-foundation:
    name: DATA-TAXONOMY5 foundation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_TAXONOMY5_EXACT_HEAD }}
          fetch-depth: 1

      - name: Attest exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$DATA_TAXONOMY5_EXACT_HEAD"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify DATA-TAXONOMY5 foundation
        run: node scripts/product-evidence/verify-data-taxonomy5-production-recommendation-parity-foundation-v1.mjs

      - name: Verify runtime module syntax
        shell: bash
        run: |
          node --check lib/catalog-taxonomy-recommendation-shadow-reader.js
          node --check lib/catalog-taxonomy-recommendation-shadow-replay.js
          node --check lib/catalog-taxonomy-recommendation-shadow-probe-oidc.js
          node --check app/api/internal/catalog-taxonomy-recommendation-shadow-replay/route.js

  runtime-replay:
    name: DATA-TAXONOMY5 deployed Production replay
    if: github.event_name == 'push'
    needs: verify-foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve exact Vercel deployment URL
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url=""
          for attempt in $(seq 1 72); do
            ids="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments?per_page=100" --jq ".[] | select(.sha == \"$GITHUB_SHA\") | .id" || true)"
            for id in $ids; do
              candidate="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success" and .environment_url != null)][0].environment_url // empty' || true)"
              if [ -n "$candidate" ]; then
                url="$candidate"
                break
              fi
            done
            if [ -n "$url" ]; then
              break
            fi
            sleep 5
          done
          test -n "$url"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Obtain short-lived GitHub OIDC tokens
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          custom_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${DATA_TAXONOMY5_OIDC_AUDIENCE}")"
          custom="$(printf '%s' "$custom_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          trusted_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          trusted="$(printf '%s' "$trusted_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          echo "::add-mask::$custom"
          echo "::add-mask::$trusted"
          printf 'custom=%s\ntrusted=%s\n' "$custom" "$trusted" >> "$GITHUB_OUTPUT"

      - name: Replay deployed Production Recommendation parity
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.custom }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.trusted }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors \
            -o "$response_file" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$DEPLOYMENT_URL/api/internal/catalog-taxonomy-recommendation-shadow-replay")"
          cat "$response_file"
          echo
          echo "DATA_TAXONOMY5_RUNTIME_REPLAY_HTTP_STATUS=$status"
          node - "$response_file" "$status" "$GITHUB_SHA" <<'NODE'
          const fs = require('fs');
          const [file, status, expectedSha] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          const safe = {
            result: payload.result || null,
            replayVersion: payload.replayVersion || null,
            deploymentSha: payload.deploymentSha || null,
            deploymentRef: payload.deploymentRef || null,
            expectedProductCount: payload.expectedProductCount ?? null,
            recommendationProductCount: payload.recommendationProductCount ?? null,
            overlayCount: payload.overlayCount ?? null,
            overlayOnlyCount: payload.overlayOnlyCount ?? null,
            duplicateOverlayCount: payload.duplicateOverlayCount ?? null,
            nonExactOverlayCount: payload.nonExactOverlayCount ?? null,
            invalidTaxonomyStateCount: payload.invalidTaxonomyStateCount ?? null,
            unmatchedProductCount: payload.unmatchedProductCount ?? null,
            legacyIdentityMismatchCount: payload.legacyIdentityMismatchCount ?? null,
            scenarioCount: payload.scenarioCount ?? null,
            scoreDeltaCount: payload.scoreDeltaCount ?? null,
            slotDeltaCount: payload.slotDeltaCount ?? null,
            fullOrderDeltaCount: payload.fullOrderDeltaCount ?? null,
            top1DeltaCount: payload.top1DeltaCount ?? null,
            top3DeltaCount: payload.top3DeltaCount ?? null,
            recommendationRuntimeCutover: payload.recommendationRuntimeCutover ?? null,
            secretValueExposed: payload.secretValueExposed ?? null,
          };
          console.log(`DATA_TAXONOMY5_DEPLOYED_EVIDENCE=${JSON.stringify(safe)}`);
          if (status !== '200') process.exit(1);
          if (payload.deploymentSha !== expectedSha || payload.deploymentRef !== 'main') process.exit(2);
          if (payload.result !== 'PASS') process.exit(3);
          if (payload.replayVersion !== 'data-taxonomy5-production-recommendation-parity-v1') process.exit(4);
          if (payload.expectedProductCount !== 165 || payload.recommendationProductCount !== 165 || payload.overlayCount !== 165) process.exit(5);
          for (const key of [
            'overlayOnlyCount',
            'duplicateOverlayCount',
            'nonExactOverlayCount',
            'invalidTaxonomyStateCount',
            'unmatchedProductCount',
            'legacyIdentityMismatchCount',
            'scoreDeltaCount',
            'slotDeltaCount',
            'fullOrderDeltaCount',
            'top1DeltaCount',
            'top3DeltaCount',
          ]) {
            if (payload[key] !== 0) process.exit(6);
          }
          if (payload.scenarioCount !== 8 || !Array.isArray(payload.scenarios) || payload.scenarios.length !== 8) process.exit(7);
          if (payload.scenarios.some((scenario) => scenario.fullOrderEqual !== true || scenario.top1Equal !== true || scenario.top3Equal !== true)) process.exit(8);
          if (payload.recommendationRuntimeCutover !== false || payload.secretValueExposed !== false) process.exit(9);
          NODE
          rm -f "$response_file"