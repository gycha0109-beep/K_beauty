name: BEJEWELY Mobile 17 Production Copy

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/app/index.tsx"
      - "apps/mobile/app/analyze.tsx"
      - "apps/mobile/components/ScreenShell.tsx"
      - "apps/mobile/lib/copy.ts"
      - "scripts/verify-mobile-android-smoke.sh"
      - "scripts/verify-mobile-17-production-copy.mjs"
      - ".github/workflows/mobile-17-production-copy.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/app/index.tsx"
      - "apps/mobile/app/analyze.tsx"
      - "apps/mobile/components/ScreenShell.tsx"
      - "apps/mobile/lib/copy.ts"
      - "scripts/verify-mobile-android-smoke.sh"
      - "scripts/verify-mobile-17-production-copy.mjs"
      - ".github/workflows/mobile-17-production-copy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-17-production-copy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-copy:
    name: Production Copy Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_17_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify production-facing copy boundary
        run: node scripts/verify-mobile-17-production-copy.mjs

      - name: Typecheck mobile client
        run: npm --prefix apps/mobile run typecheck
