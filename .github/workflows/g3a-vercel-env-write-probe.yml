name: G3A Vercel Env Write Probe

on:
  push:
    branches:
      - admission/g3a-cont-pf-authority-read
    paths:
      - .github/workflows/g3a-vercel-env-write-probe.yml

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_VHh3BMegmXFGwxgOJLlgFQjksmKA
      VERCEL_TEAM_ID: team_xuYA9OhCWlJETaYFOmeVodgS
    steps:
      - name: Create and remove non-secret transient env marker
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          response="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID" \
            --data '{"key":"G3A_TRANSIENT_ENV_WRITE_PROBE","value":"1","type":"plain","target":["preview"],"gitBranch":"admission/g3a-cont-pf-authority-read","comment":"temporary G3A capability probe"}')"
          env_id="$(printf '%s' "$response" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);const v=j.created?.id||j.id||j.created?.[0]?.id;if(!v)process.exit(1);process.stdout.write(v)})')"
          test -n "$env_id"
          curl --fail --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$env_id?teamId=$VERCEL_TEAM_ID" >/dev/null
          echo VERCEL_ENV_WRITE_PROBE_PASS

      - name: Publish env-write attestation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          description="Vercel env write/delete probe passed"
          if [ "$PRIOR_JOB_STATUS" != success ]; then
            state=failure
            description="Vercel env write/delete probe failed"
          fi
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="V2.1-ADMISSION-G3A Vercel env write probe" -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          test "$state" = success
