name: V21-8P Focused Verifier Patch
on:
  push:
    branches: [feat/v21-8p-exfoliation-non-numeric-pda-offline-shadow]
    paths: ['.github/workflows/v21-8p-focused-verifier-patch.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Narrow static runtime-path detector
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs')
          s=p.read_text()
          old='ok(!/(supabase|postgres|fetch\\s*\\(|axios|node:https|node:http|INSERT\\s+INTO|UPDATE\\s+product_fact|DELETE\\s+FROM|CREATE\\s+TABLE|ALTER\\s+TABLE)/i.test(mapperSource), "38 no live/network/write path");'
          new='ok(!/(from\\s+["\\\'](?:node:https|node:http|@supabase)|fetch\\s*\\(|axios|supabase\\.from|INSERT\\s+INTO|UPDATE\\s+product_fact|DELETE\\s+FROM|CREATE\\s+TABLE|ALTER\\s+TABLE)/i.test(mapperSource), "38 no live/network/write path");'
          if old not in s: raise SystemExit('expected verifier expression not found')
          p.write_text(s.replace(old,new))
          PY
          node --check scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs
          git diff --cached --check
          git commit -m "fix(v21-8p): narrow focused verifier runtime detector"
          git push origin HEAD:feat/v21-8p-exfoliation-non-numeric-pda-offline-shadow
