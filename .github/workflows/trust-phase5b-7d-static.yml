permissions:
  contents: read

concurrency:
  group: trust-phase5b-7d-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TRUST_STATIC_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: TRUST 5B-7D canonical static prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.TRUST_STATIC_EXACT_HEAD }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUST_STATIC_EXACT_HEAD"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify TRUST CI consolidation structure
        run: node scripts/verify-trust-5b-7d-ci-responsibility.mjs

      - name: Install dependencies once
        run: node scripts/security/install-product-dependencies.mjs --no-audit --no-fund
        env:
          SCA_PACKAGES_READ_TOKEN: ${{ secrets.SCA_PACKAGES_READ_TOKEN }}

      - name: Verify TRUST 5B-7D static prerequisites once
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-trust-phase5b-subject-registration.mjs
          node scripts/verify-trust-intake-readiness-v1.mjs
          node scripts/verify-trust-brand-official-frontier-v1.mjs
          node scripts/verify-trust-p2-official-discovery-v1.mjs
          node scripts/verify-trust-p2c-visible-identity-v1.mjs
          node scripts/verify-trust-p2d-five-brand-pilot.mjs
          node scripts/verify-trust-p3-official-extraction-v1.mjs
          node scripts/verify-trust-p3-primary-variant-gate-v1.mjs
          node scripts/verify-trust-p3-template-shape-v1.mjs
          node scripts/verify-trust-p3-root-colocation-diagnostic-v1.mjs
          node scripts/verify-trust-p3-strict-dom-primary-root-v1.mjs
          node scripts/verify-trust-p3-owned-selected-size-shadow-v1.mjs
          node scripts/verify-trust-p3-readonly-funnel-v1.mjs
          node scripts/verify-trust-p3-official-three-brand-pilot.mjs
          node scripts/verify-trust-p3-official-locator-revalidation.mjs
          node scripts/verify-trust-p2c-robots-smoke.mjs
          node scripts/verify-trust-p2c-known-product-smoke.mjs
          node scripts/verify-trust-p2b-official-observation-v1.mjs
          node scripts/verify-v21-admission-g4-a-subject-registration-reprocess-contract-v1.mjs
          node scripts/verify-product-fact-subject-registration-v1.mjs
          node scripts/verify-trust-subject-resolution.mjs
          node scripts/verify-trust-subject-resolution-presentation-hardening.mjs
          node scripts/verify-trust-phase5-admin-queue.mjs
          node scripts/verify-trust-phase6a-reentry.mjs
          node scripts/verify-trust-research-worker.mjs
          node scripts/verify-trust-phase4-controlled-evidence-adoption.mjs
          node scripts/verify-trust-phase7c-legacy-research-readiness.mjs
          node scripts/verify-trust-phase7c-phase4-legacy-compat.mjs
          node scripts/verify-product-fact-controlled-write-v1.mjs
          node scripts/verify-trust-phase7a-legacy-backfill-preflight.mjs
          node scripts/verify-trust-phase7b-legacy-backfill-materialization.mjs
          node scripts/verify-trust-phase7d-relational-adoption.mjs

      - name: Check exact-head and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUST_STATIC_EXACT_HEAD"
          git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}...$TRUST_STATIC_EXACT_HEAD" || git diff --check HEAD^

  p2d_five_brand_live:
    name: P2D guarded five-brand live source trial
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'P2D-LIVE-TRIAL')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run explicit one-time five-brand public official source probe
        env:
          TRUST_P2D_FIVE_BRAND_LIVE_ENABLED: "true"
        run: node scripts/trust-p2d-five-brand-pilot.mjs --execute
      - name: Keep no-content measurement report
        uses: actions/upload-artifact@v6
        with:
          name: trust-p2d-five-brand-results
          path: artifacts/trust-p2d-five-brand-result.json
          if-no-files-found: error
          retention-days: 30

  p2d_four_brand_live:
    name: P2D guarded four-brand live trial (DrG origin HOLD)
    # Explicit independent one-time marker; never overlaps P2D-LIVE-TRIAL.
    # The CLI also requires all four policy reviews AND a current approval window.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'P2D-FOUR-LIVE-TRIAL')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run four-origin guarded read-only trial with DrG never fetched
        env:
          TRUST_P2D_FOUR_BRAND_LIVE_ENABLED: "true"
        run: node scripts/trust-p2d-five-brand-pilot.mjs --execute-four
      - name: Preserve bounded metadata-only four-origin result
        uses: actions/upload-artifact@v6
        with:
          name: trust-p2d-four-brand-results
          path: artifacts/trust-p2d-four-brand-result.json
          if-no-files-found: error
          retention-days: 30

  p2d_owner_public_one_time:
    name: P2D user-authorized four-origin public robots-first observation
    # This is an independent owner-requested, one-off public-data observation.
    # Not the policy-manifest-controlled commercial ingestion trial.
    # It performs no source registration, database write, or SKU attestation.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'P2D-PUBLIC-ROBOTS-FIRST-ONCE-20261019')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: One-time read-only robots-first observation, 4 public origins
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { assertTrustP2DCohort,runTrustP2DFiveBrandPilot } from './scripts/trust-p2d-five-brand-pilot.mjs';
          import { trustP2LiveFetchers } from './lib/trust/official-product-discovery-p2-v1.mjs';
          const cohort=JSON.parse(fs.readFileSync('evidence/trust/p2d-five-brand-cohort-v2.json','utf8'));
          assertTrustP2DCohort(cohort);
          const targetBrands=['비플레인','아토팜','이즈앤트리','토리든'];
          const origins=new Map(cohort.targets.filter(t=>t.brand!=='닥터지').map(t=>[new URL(t.officialPeerUrl).origin,t.brand]));
          if(cohort.targets.length!==5||origins.size!==4||
            [...origins.values()].some(x=>!targetBrands.includes(x))||
            cohort.targets.filter(t=>t.brand==='닥터지').length!==1)
            throw Error('P2D_ONE_TIME_INVALID_COHORT');
          // 1 robots, 2 sitemaps, <=4 HTML requests (peer, homepage, 2 candidates).
          // Never allow new domains, fallback crawling, or unbounded retries.
          const limits={fetchRobots:1,fetchSitemap:2,fetchPage:4};
          const counters=new Map([...origins.keys()].map(origin=>[origin,{fetchRobots:0,fetchSitemap:0,fetchPage:0}]));
          const original=trustP2LiveFetchers();
          let lastAt=0;
          const safe={};
          for(const kind of Object.keys(limits)){
            safe[kind]=async (url,origin,...rest)=>{
              if(!origins.has(origin)||new URL(url).origin!==origin)throw Error('P2D_ONE_TIME_ORIGIN_BLOCKED');
              const count=counters.get(origin);
              if(++count[kind]>limits[kind])throw Error('P2D_ONE_TIME_REQUEST_LIMIT');
              const wait=Math.max(0,1200-(Date.now()-lastAt));
              if(wait)await new Promise(resolve=>setTimeout(resolve,wait));
              lastAt=Date.now();
              return original[kind](url,origin,...rest);
            };
          }
          const result=await runTrustP2DFiveBrandPilot({
            execute:true,cohort,holdRetiredDrG:true,
            approvedBrands:new Set(targetBrands),fetchers:safe,
          });
          if(result.items.length!==5||result.items[0].assessment.state!=='RETIRED_ORIGIN_HOLD'||
            result.summary.factWrites!==0||result.summary.dbWrites!==0||
            result.summary.confirmedExactSkuCount!==0||
            [...counters.values()].reduce((n,x)=>n+x.fetchRobots+x.fetchSitemap+x.fetchPage,0)>28)
            throw Error('P2D_ONE_TIME_RESULT_GUARD');
          const publicResult={
            observedAt:result.observedAt,mode:'ONE_TIME_PUBLIC_ROBOTS_FIRST_NO_WRITES',
            frozenDenominator:5,eligibleOrigins:4,
            counts:result.summary,items:result.items,
            requestCounts:[...origins.entries()].map(([origin,brand])=>({
              brand,origin,...counters.get(origin)
            })),
            externalConsentInferred:false,authoritativeSkuEvidence:false,
            sourceBindingAuthorized:false,
          };
          fs.mkdirSync('artifacts',{recursive:true});
          fs.writeFileSync('artifacts/trust-p2d-one-time-public-observation.json',
            JSON.stringify(publicResult,null,2)+'\n');
          console.log('TRUST_P2D_OWNER_PUBLIC_ROBOTS_FIRST_RESULT='+JSON.stringify({
            mode:publicResult.mode,summary:publicResult.counts,
            items:publicResult.items.map(x=>({
              brand:x.brand,assessment:x.assessment.state,
              reason:x.assessment.reason??null,
              site:x.assessment.sourceDiagnostics?.map(s=>({
                status:s.status,stage:s.stageDiagnosis?.reason,
                pages:s.pages?.map(p=>({status:p.status,url:p.url}))
              }))??[]
            })),
            requestCounts:publicResult.requestCounts,
          }));
          NODE
      - name: Preserve status-only one-time observation
        uses: actions/upload-artifact@v6
        with:
          name: trust-p2d-one-time-public-observation
          path: artifacts/trust-p2d-one-time-public-observation.json
          if-no-files-found: error
          retention-days: 30

  p2d_owner_fixed_locator_one_time:
    name: P2D owner-authorized four fixed-locator robots-gated check
    # Follow-up single-page checks at four index-discovered FIRST-PARTY locators.
    # Never a source binding, authoritative SKU decision or recurring crawl.
    if: github.event_name == 'push' && (((contains(github.event.head_commit.message, 'P2D-FIXED-URL-ROBOTS-ONCE-20261019') && !contains(github.event.head_commit.message, 'P2F6-PRE-RESOLVED-READONLY-ONCE-20261019')) || (!contains(github.event.head_commit.message, 'P2D-FIXED-URL-ROBOTS-ONCE-20261019') && contains(github.event.head_commit.message, 'P2F6-PRE-RESOLVED-READONLY-ONCE-20261019'))) || contains(github.event.head_commit.message, 'P2F7-TORRIDEN-ROOT-DIAGNOSTIC-ONCE-20261020'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: One-time first-party fixed URL identity/size observation
        if: contains(github.event.head_commit.message, 'P2D-FIXED-URL-ROBOTS-ONCE-20261019')
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {fetchOfficialBytes} from './lib/trust/official-source-fetch.mjs';
          import {strictOriginTransport,createTrustRobotsPolicy,
            classifyTrustOfficialCandidatePage} from './lib/trust/official-product-discovery-p2-v1.mjs';
          import {assertTrustP2DCohort} from './scripts/trust-p2d-five-brand-pilot.mjs';
          const cohort=JSON.parse(fs.readFileSync('evidence/trust/p2d-five-brand-cohort-v2.json','utf8'));
          assertTrustP2DCohort(cohort);
          const locators=[
            {brand:'비플레인',url:'https://www.beplain.co.kr/shop/shopdetail.html?GfDT=a2p3UQ%3D%3D&branduid=10739162&mcode=001&special=3&xcode=012'},
            {brand:'아토팜',url:'https://neopharmshop.co.kr/product/%EC%95%84%ED%86%A0%ED%8C%9C-mle-%EB%A1%9C%EC%85%98-300ml/2184'},
            {brand:'이즈앤트리',url:'https://isntree.com/product/%ED%99%94%ED%95%B4-1%EB%93%B1-%EC%B4%88%EC%A0%80%EB%B6%84%EC%9E%90-%ED%9E%88%EC%95%84%EB%A3%A8%EB%A1%A0%EC%82%B0-%ED%86%A0%EB%84%88-300ml/56/category/112/display/1/'},
            {brand:'토리든',url:'https://www.torriden.com/goods/goods_view.php?goodsNo=58'},
          ];
          if(cohort.targets.length!==5||locators.length!==4||
            cohort.targets.filter(x=>x.brand==='닥터지').length!==1||
            new Set(locators.map(x=>x.brand)).size!==4)
            throw Error('P2D_FIXED_INVALID_COHORT');
          let lastAt=0,total=0;
          const pace=async()=>{
            const delay=Math.max(0,1300-(Date.now()-lastAt));
            if(delay)await new Promise(resolve=>setTimeout(resolve,delay));
            lastAt=Date.now();
          };
          const out=[];
          for(const entry of locators){
            const target=cohort.targets.find(x=>x.brand===entry.brand);
            const origin=new URL(target?.officialPeerUrl??'').origin;
            if(!target||new URL(entry.url).origin!==origin||
              new URL(entry.url).protocol!=='https:')throw Error('P2D_FIXED_ORIGIN_MISMATCH');
            const report={brand:entry.brand,origin,productId:target.productId,
              expectedCatalogSizeMl:target.sizeMl,url:entry.url,
              robotsRequests:0,pageRequests:0,status:'NOT_STARTED',
              sourceBindingAuthorized:false,exactSkuVerified:false};
            out.push(report);
            let robots,policy;
            try{
              await pace();report.robotsRequests++;total++;
              robots=await fetchOfficialBytes(origin+'/robots.txt',strictOriginTransport(fetch,origin));
              policy=createTrustRobotsPolicy(robots.bytes);
            }catch{report.status='ROBOTS_UNAVAILABLE_HOLD';continue;}
            if(policy.delayBlocked){report.status='ROBOTS_PACING_HOLD';continue;}
            if(!policy.allowed(entry.url)){report.status='ROBOTS_DISALLOWED_HOLD';continue;}
            try{
              await pace();report.pageRequests++;total++;
              const page=await fetchOfficialBytes(entry.url,strictOriginTransport(fetch,origin,policy));
              if(new URL(page.finalUrl).origin!==origin||!policy.allowed(page.finalUrl))
                throw Error('P2D_FIXED_UNSAFE_REDIRECT');
              const product={id:target.productId,brand:target.brand,
                name:target.name,name_en:target.nameEn,
                normalized_name:target.normalizedName,size_ml:target.sizeMl};
              const classification=classifyTrustOfficialCandidatePage(page.bytes,product);
              report.status=classification.status;
              report.title=classification.title;
              report.identitySurface=classification.identitySurface;
              report.variantScope=classification.variantScope;
              report.sha256=classification.sha256;
              // Classified matches remain review-only, NEVER exact SKU evidence.
            }catch{report.status='PAGE_FETCH_BLOCKED_OR_FAILED';}
          }
          const data={contract:'trust-p2d-fixed-locator-public-observation-v1',
            observedAt:new Date().toISOString(),baselineProducts:5,checkedOrigins:4,
            retiredDrGNoRequests:true,requests:total,maxRequests:8,
            pageFetches:out.filter(x=>typeof x.sha256==='string').length,
            officialSkuVerifiedCount:0,subjectWrites:0,factWrites:0,dbWrites:0,
            originOutcomes:out};
          if(total>8||out.some(x=>x.robotsRequests>1||x.pageRequests>1||
            x.sourceBindingAuthorized!==false||x.exactSkuVerified!==false))
            throw Error('P2D_FIXED_RESULT_UNSAFE');
          fs.mkdirSync('artifacts',{recursive:true});
          fs.writeFileSync('artifacts/trust-p2d-fixed-public-observation.json',JSON.stringify(data,null,2)+'\n');
          console.log('TRUST_P2D_FIXED_PUBLIC_RESULT='+JSON.stringify(data));
          NODE
      - name: Pre-resolved read-only two-origin remeasurement
        if: contains(github.event.head_commit.message, 'P2F6-PRE-RESOLVED-READONLY-ONCE-20261019')
        env:
          TRUST_P2F6_ONE_TIME_LIVE_ENABLED: "true"
        run: node scripts/trust-p2f6-pre-resolved-readonly-once.mjs --execute

      - name: Preserve frozen-cohort P2-F6 status-only remeasurement
        if: contains(github.event.head_commit.message, 'P2F6-PRE-RESOLVED-READONLY-ONCE-20261019')
        uses: actions/upload-artifact@v6
        with:
          name: trust-p2f6-pre-resolved-readonly-result
          path: artifacts/trust-p2f6-pre-resolved-readonly-result.json
          if-no-files-found: error
          retention-days: 30

      - name: One-time Torriden official-root failure-stage observation (max two requests)
        if: contains(github.event.head_commit.message, 'P2F7-TORRIDEN-ROOT-DIAGNOSTIC-ONCE-20261020')
        env:
          TRUST_P2F7_TORRIDEN_ONE_TIME_LIVE_ENABLED: "true"
          TRUST_P2F7_MAIN_PUSH_MARKER: "P2F7-TORRIDEN-ROOT-DIAGNOSTIC-ONCE-20261020"
        run: node scripts/trust-p2f7-torriden-root-one-time.mjs --execute

      - name: Preserve bounded Torriden diagnostic metadata only
        if: contains(github.event.head_commit.message, 'P2F7-TORRIDEN-ROOT-DIAGNOSTIC-ONCE-20261020')
        uses: actions/upload-artifact@v6
        with:
          name: trust-p2f7-torriden-root-diagnostic
          path: artifacts/trust-p2f7-torriden-root-diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve fixed-locator status-only artifact
        if: contains(github.event.head_commit.message, 'P2D-FIXED-URL-ROBOTS-ONCE-20261019')
        uses: actions/upload-artifact@v6
        with:
          name: trust-p2d-fixed-public-observation
          path: artifacts/trust-p2d-fixed-public-observation.json
          if-no-files-found: error
          retention-days: 30

  p3_official_three_brand_live:
    name: P3 guarded existing-source 3-brand live observation
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'P3-LIVE-TRIAL')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run one-time robots-gated official three-source read-only measurement
        env:
          TRUST_P3_OFFICIAL_LIVE_ENABLED: "true"
        run: node scripts/trust-p3-official-three-brand-pilot.mjs --execute
      - name: Preserve metadata-only trial result
        uses: actions/upload-artifact@v6
        with:
          name: trust-p3-three-brand-results
          path: artifacts/trust-p3-official-three-brand-result.json
          if-no-files-found: error
          retention-days: 30

  p3_official_locator_live:
    name: P3 official fixed-locator read-only revalidation
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'P3-LOCATOR-LIVE-TRIAL')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run bounded four-origin six-locator robots-gated source freshness diagnostic
        env:
          TRUST_P3_LOCATOR_LIVE_ENABLED: "true"
        run: node scripts/trust-p3-official-locator-revalidation.mjs --execute
      - name: Preserve source metadata only
        uses: actions/upload-artifact@v6
        with:
          name: trust-p3-locator-revalidation
          path: artifacts/trust-p3-official-locator-freshness-result.json
          if-no-files-found: error
          retention-days: 30
