name: DATA-AI17 Authenticated Limited Beta Design

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/product-query-authenticated-limited-beta-design-contract.mjs"
      - "lib/product-query-post-canary-readiness-contract.mjs"
      - "lib/product-query-execution-contract.mjs"
      - "lib/server/product-query-intent-service.js"
      - "lib/server/product-query-shadow-service.js"
      - "lib/product-query-recommendation.js"
      - "scripts/verify-data-ai17-authenticated-limited-beta-design.mjs"
      - "vercel.json"
      - ".github/workflows/data-ai17-authenticated-limited-beta-design.yml"
  push:
    branches: [main]
    paths:
      - "lib/product-query-authenticated-limited-beta-design-contract.mjs"
      - "lib/product-query-post-canary-readiness-contract.mjs"
      - "lib/product-query-execution-contract.mjs"
      - "lib/server/product-query-intent-service.js"
      - "lib/server/product-query-shadow-service.js"
      - "lib/product-query-recommendation.js"
      - "scripts/verify-data-ai17-authenticated-limited-beta-design.mjs"
      - "vercel.json"
      - ".github/workflows/data-ai17-authenticated-limited-beta-design.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-ai17-authenticated-limited-beta-design-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: DATA-AI17 authenticated limited-beta design contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify DATA-AI17 design contract
        run: node scripts/verify-data-ai17-authenticated-limited-beta-design.mjs
