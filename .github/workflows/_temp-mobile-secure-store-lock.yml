name: TEMP Mobile SecureStore Lock Refresh

on:
  push:
    branches:
      - hardening/mobile-2-secure-session-storage
    paths:
      - "apps/mobile/package.json"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hardening/mobile-2-secure-session-storage
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lock
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- package-lock.json; then
            echo "TEMP_MOBILE_LOCK_REFRESH=NO_CHANGE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(mobile): refresh secure-store lock"
          git push origin HEAD:hardening/mobile-2-secure-session-storage
          echo "TEMP_MOBILE_LOCK_REFRESH=PASS"
