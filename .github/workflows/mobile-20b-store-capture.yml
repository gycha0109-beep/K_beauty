name: BEJEWELY Mobile 20B Store Capture

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/app/_layout.tsx"
      - "apps/mobile/app/store-capture.tsx"
      - "apps/mobile/app/my.tsx"
      - "apps/mobile/features/my/NativeMyDiaryView.tsx"
      - "apps/mobile/features/store-capture/**"
      - "apps/mobile/lib/mobile-shell.tsx"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/package.json"
      - "docs/store/mobile-store-listing-final.json"
      - "package-lock.json"
      - "scripts/capture-mobile-20b-store-assets.sh"
      - "scripts/verify-mobile-18-store-listing.mjs"
      - "scripts/verify-mobile-20b-store-capture.mjs"
      - ".github/workflows/mobile-20b-store-capture.yml"
  push:
    paths:
      - "apps/mobile/app/_layout.tsx"
      - "apps/mobile/app/store-capture.tsx"
      - "apps/mobile/app/my.tsx"
      - "apps/mobile/features/my/NativeMyDiaryView.tsx"
      - "apps/mobile/features/store-capture/**"
      - "apps/mobile/lib/mobile-shell.tsx"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/package.json"
      - "docs/store/mobile-store-listing-final.json"
      - "package-lock.json"
      - "scripts/capture-mobile-20b-store-assets.sh"
      - "scripts/verify-mobile-18-store-listing.mjs"
      - "scripts/verify-mobile-20b-store-capture.mjs"
      - ".github/workflows/mobile-20b-store-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-20b-store-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  store-capture:
    name: Android Store Capture
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_20B_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify MOBILE-20B source contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/capture-mobile-20b-store-assets.sh
          node scripts/verify-mobile-20b-store-capture.mjs source
          node scripts/verify-mobile-18-store-listing.mjs
          node scripts/verify-mobile-analyze-integration.mjs

      - name: Verify mobile types and Expo config
        shell: bash
        run: |
          set -euo pipefail
          npm run mobile:typecheck
          npm run mobile:config

      - name: Generate Android native project
        run: npm run mobile:prebuild:android

      - name: Verify generated Android contract
        run: npm run verify:mobile-native

      - name: Build installable debug APK
        run: npm run mobile:build:android:debug

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Results and Diary EN/KO candidates
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          avd-name: bejewely-mobile-20b-api35
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/capture-mobile-20b-store-assets.sh

      - name: Upload store capture candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bejewely-mobile-20b-store-capture-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            apps/mobile/.mobile-20b-store-artifacts/**
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
