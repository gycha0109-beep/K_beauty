name: BEJEWELY Mobile 20B Store Capture
run-name: "[WT:mobile] BEJEWELY Mobile 20B Store Capture"

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/app/_layout.tsx"
      - "apps/mobile/app/store-capture.tsx"
      - "apps/mobile/app/my.tsx"
      - "apps/mobile/features/my/NativeMyDiaryView.tsx"
      - "apps/mobile/features/store-capture/**"
      - "apps/mobile/lib/mobile-shell.tsx"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/package.json"
      - "docs/store/mobile-store-listing-final.json"
      - "scripts/capture-mobile-20b-store-assets.sh"
      - "scripts/verify-mobile-18-store-listing.mjs"
      - "scripts/verify-mobile-20b-store-capture.mjs"
      - "scripts/await-mobile-android-runtime.mjs"
      - ".github/workflows/mobile-20b-store-capture.yml"
      - ".github/workflows/mobile-android-runtime.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/app/_layout.tsx"
      - "apps/mobile/app/store-capture.tsx"
      - "apps/mobile/app/my.tsx"
      - "apps/mobile/features/my/NativeMyDiaryView.tsx"
      - "apps/mobile/features/store-capture/**"
      - "apps/mobile/lib/mobile-shell.tsx"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/package.json"
      - "docs/store/mobile-store-listing-final.json"
      - "scripts/capture-mobile-20b-store-assets.sh"
      - "scripts/verify-mobile-18-store-listing.mjs"
      - "scripts/verify-mobile-20b-store-capture.mjs"
      - "scripts/await-mobile-android-runtime.mjs"
      - ".github/workflows/mobile-20b-store-capture.yml"
      - ".github/workflows/mobile-android-runtime.yml"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string


permissions:
  actions: read
  contents: read

concurrency:
  group: mobile-20b-store-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  store-capture:
    name: Android Store Capture
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          printf 'MOBILE_20B_COMPAT_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1

      - name: Gate compatibility check on canonical Android Runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/await-mobile-android-runtime.mjs
