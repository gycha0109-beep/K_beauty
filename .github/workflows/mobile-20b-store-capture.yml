name: BEJEWELY Mobile 20B Store Capture
run-name: "[WT:mobile] BEJEWELY Mobile 20B Store Capture"

# Routine evidence is owned by .github/workflows/mobile-android-runtime.yml.
on:
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string
      producer_run_id:
        description: Completed canonical Android Runtime run ID for this exact ref
        required: true
        type: string
      producer_run_attempt:
        description: Latest completed producer attempt (rerun all jobs for a new attempt)
        required: true
        type: string
      producer_event:
        description: Original producer event
        required: true
        type: choice
        options: [pull_request, push, workflow_dispatch]


permissions:
  actions: read
  contents: read

concurrency:
  group: mobile-20b-store-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  store-capture:
    name: Android Store Capture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.sha }}
      MOBILE_RUNTIME_RUN_ID: ${{ inputs.producer_run_id }}
      MOBILE_RUNTIME_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
      MOBILE_RUNTIME_EXPECTED_EVENT: ${{ inputs.producer_event }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          printf 'MOBILE_20B_COMPAT_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1

      - name: Verify completed canonical Android Runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/await-mobile-android-runtime.mjs
