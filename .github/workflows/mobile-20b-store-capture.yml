name: BEJEWELY Mobile 20B Store Capture

on:
  push:
    paths:
      - "apps/mobile/package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-20b-store-capture.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-20b-store-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-lock:
    name: Regenerate MOBILE-20B lockfile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Regenerate and commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          git diff -- package-lock.json
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "LOCKFILE_UNCHANGED"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(mobile): lock Expo Router patch alignment"
          git push origin HEAD:${{ github.ref_name }}
