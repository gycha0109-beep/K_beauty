name: Face Lab Provider E2E

on:
  workflow_dispatch:
  push:
    paths:
      - "private/face-lab-e2e/run.trigger"

permissions:
  contents: read
  issues: write

concurrency:
  group: face-lab-provider-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provider-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUNDLE_PREFIX: private/face-lab-e2e/fixture-bundle-v2.tar.gz.enc.b64.part-
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FACE_LAB_E2E_FIXTURE_PASSPHRASE: ${{ secrets.FACE_LAB_E2E_FIXTURE_PASSPHRASE }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Face Lab Provider E2E package
        id: verify_package
        run: npm run face-lab:e2e:verify

      - name: Verify encrypted inputs and secrets
        id: verify_inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f "private/face-lab-e2e/run.trigger" || { echo "run_trigger_missing" >&2; exit 1; }
          shopt -s nullglob
          parts=( "${BUNDLE_PREFIX}"* )
          test "${#parts[@]}" -eq 3 || { echo "fixture_bundle_part_count_invalid:${#parts[@]}" >&2; exit 1; }
          test -n "${OPENAI_API_KEY}" || { echo "OPENAI_API_KEY_missing" >&2; exit 1; }
          test -n "${FACE_LAB_E2E_FIXTURE_PASSPHRASE}" || { echo "FACE_LAB_E2E_FIXTURE_PASSPHRASE_missing" >&2; exit 1; }

      - name: Decrypt bounded fixture bundle
        id: decrypt
        shell: bash
        run: |
          set -euo pipefail
          work_dir="tmp/face-lab-provider-e2e-input"
          encoded_path="${work_dir}/fixture-bundle.tar.gz.enc.b64"
          encrypted_path="${work_dir}/fixture-bundle.tar.gz.enc"
          archive_path="${work_dir}/fixture-bundle.tar.gz"
          mkdir -p "${work_dir}"
          shopt -s nullglob
          parts=( "${BUNDLE_PREFIX}"* )
          printf '%s\n' "${parts[@]}" | sort | xargs cat >"${encoded_path}"
          base64 --decode "${encoded_path}" >"${encrypted_path}"
          rm -f "${encoded_path}"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 210000 \
            -in "${encrypted_path}" \
            -out "${archive_path}" \
            -pass env:FACE_LAB_E2E_FIXTURE_PASSPHRASE
          rm -f "${encrypted_path}"

          actual_members="$(tar -tzf "${archive_path}" | sed 's#^\./##' | sort)"
          expected_members="$(printf '%s\n' \
            'manifest.local.json' \
            'private/face-lab-fixtures/subject-a/frontal-clear.jpg' \
            'private/face-lab-fixtures/subject-a/lower-face-occluded.jpg' | sort)"
          test "${actual_members}" = "${expected_members}" || {
            echo "fixture_bundle_member_contract_invalid" >&2
            exit 1
          }

          tar -xzf "${archive_path}" --no-same-owner --no-same-permissions -C .
          rm -f "${archive_path}"

      - name: Prepare isolated Local Supabase Replay
        id: prepare_db
        run: npm run db:replay:prepare

      - name: Start and reset isolated Local Supabase
        id: start_db
        shell: bash
        run: |
          set -euo pipefail
          diagnostics_dir="tmp/face-lab-provider-e2e"
          mkdir -p "${diagnostics_dir}"
          sanitize_log() {
            sed -E \
              -e '/(anon key|service[_ -]?role key|jwt secret|publishable key|secret key|database url|db url|access key|access key secret|ANON_KEY|SERVICE_ROLE_KEY|JWT_SECRET|DATABASE_URL|DB_URL)/Id' \
              -e 's#(postgres(ql)?://[^:/[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' \
              -e 's#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' \
              -e 's#eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}#[REDACTED_JWT]#g' \
              -e 's#[A-Za-z0-9_-]{96,}#[REDACTED_TOKEN]#g'
          }

          raw_log="$(mktemp)"
          if ! npx --yes supabase@2.82.0 start --workdir tmp/local-supabase-replay >"${raw_log}" 2>&1; then
            sanitize_log <"${raw_log}" | tail -n 200 >"${diagnostics_dir}/supabase-start.log"
            rm -f "${raw_log}"
            exit 1
          fi
          rm -f "${raw_log}"

          raw_log="$(mktemp)"
          if ! npx --yes supabase@2.82.0 db reset --workdir tmp/local-supabase-replay >"${raw_log}" 2>&1; then
            sanitize_log <"${raw_log}" | tail -n 200 >"${diagnostics_dir}/supabase-reset.log"
            rm -f "${raw_log}"
            exit 1
          fi
          rm -f "${raw_log}"

      - name: Export masked local runtime variables
        id: export_env
        shell: bash
        run: |
          set -euo pipefail
          api_url=""
          anon_key=""
          service_role_key=""
          while IFS='=' read -r name value; do
            value="${value#\"}"
            value="${value%\"}"
            case "${name}" in
              API_URL) api_url="${value}" ;;
              ANON_KEY) anon_key="${value}" ;;
              SERVICE_ROLE_KEY) service_role_key="${value}" ;;
            esac
          done < <(npx --yes supabase@2.82.0 status -o env --workdir tmp/local-supabase-replay)

          test -n "${api_url}"
          test -n "${anon_key}"
          test -n "${service_role_key}"
          case "${api_url}" in
            http://127.0.0.1:*|http://localhost:*) ;;
            *) echo "remote_supabase_url_rejected" >&2; exit 1 ;;
          esac

          guard_secret="$(openssl rand -hex 32)"
          grant_secret="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "${anon_key}"
          printf '::add-mask::%s\n' "${service_role_key}"
          printf '::add-mask::%s\n' "${guard_secret}"
          printf '::add-mask::%s\n' "${grant_secret}"
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "${api_url}"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "${anon_key}"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "${service_role_key}"
            printf 'ANALYSIS_REQUEST_GUARD_SECRET=%s\n' "${guard_secret}"
            printf 'ANONYMOUS_WRITE_GRANT_SECRET=%s\n' "${grant_secret}"
            printf 'NEXT_PUBLIC_PREMIUM_REPORT_ENABLED=false\n'
          } >>"${GITHUB_ENV}"

      - name: Run bounded Lane B then Lane A
        id: provider_smoke
        run: npm run face-lab:e2e:run -- --manifest manifest.local.json

      - name: Upload sanitized E2E report
        id: upload_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-lab-provider-e2e-report-${{ github.run_id }}
          path: |
            tmp/face-lab-provider-e2e/report.json
            tmp/face-lab-provider-e2e/report.md
            tmp/face-lab-provider-e2e/diagnostics.log
            tmp/face-lab-provider-e2e/supabase-start.log
            tmp/face-lab-provider-e2e/supabase-reset.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish sanitized PR status
        if: always()
        uses: actions/github-script@v7
        env:
          PACKAGE_OUTCOME: ${{ steps.verify_package.outcome }}
          INPUT_OUTCOME: ${{ steps.verify_inputs.outcome }}
          DECRYPT_OUTCOME: ${{ steps.decrypt.outcome }}
          PREPARE_DB_OUTCOME: ${{ steps.prepare_db.outcome }}
          START_DB_OUTCOME: ${{ steps.start_db.outcome }}
          EXPORT_ENV_OUTCOME: ${{ steps.export_env.outcome }}
          PROVIDER_OUTCOME: ${{ steps.provider_smoke.outcome }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- face-lab-provider-e2e-status -->";
            const reportPath = "tmp/face-lab-provider-e2e/report.md";
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, "utf8").slice(0, 8000)
              : [
                  "No runtime report was generated.",
                  "",
                  `- Package: ${process.env.PACKAGE_OUTCOME}`,
                  `- Inputs: ${process.env.INPUT_OUTCOME}`,
                  `- Decrypt: ${process.env.DECRYPT_OUTCOME}`,
                  `- Prepare DB: ${process.env.PREPARE_DB_OUTCOME}`,
                  `- Start DB: ${process.env.START_DB_OUTCOME}`,
                  `- Export env: ${process.env.EXPORT_ENV_OUTCOME}`,
                  `- Provider smoke: ${process.env.PROVIDER_OUTCOME}`,
                  "- Image-bearing attempts before Provider step: 0"
                ].join("\n");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n## Face Lab Provider E2E\n\n- Commit: \`${context.sha}\`\n- Run: ${runUrl}\n- Job status: **${{ job.status }}**\n\n${report}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 50,
              per_page: 100
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 50,
                body
              });
            }

      - name: Mandatory cleanup
        id: cleanup
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          rm -rf app/api/__face-lab-provider-e2e
          rm -f manifest.local.json
          rm -rf private/face-lab-fixtures
          rm -rf tmp/face-lab-provider-e2e-input
          if [ -d tmp/local-supabase-replay ]; then
            npx --yes supabase@2.82.0 stop \
              --workdir tmp/local-supabase-replay \
              --no-backup >/dev/null 2>&1
          fi
