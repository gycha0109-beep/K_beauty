name: TRUST-P24 Isntree KR Sunscreen Hosted Adoption Plan
on:
  pull_request:
    paths:
      - "evidence/product-fact-adoption-v1/trust-p24-isntree-kr-sunscreen-hosted-adoption-plan-v1.json"
      - "docs/evidence/trust-p24-isntree-kr-sunscreen-hosted-adoption-plan-v1.md"
      - "scripts/product-evidence/trust-p24-isntree-kr-sunscreen-hosted-adoption-plan-v1.mjs"
      - "scripts/product-evidence/verify-trust-p24-isntree-kr-sunscreen-hosted-adoption-plan-v1.mjs"
      - ".github/workflows/trust-p24-isntree-kr-sunscreen-hosted-adoption-plan.yml"
  push:
    branches: [main]
    paths:
      - "evidence/product-fact-adoption-v1/trust-p24-isntree-kr-sunscreen-hosted-adoption-plan-v1.json"
      - "docs/evidence/trust-p24-isntree-kr-sunscreen-hosted-adoption-plan-v1.md"
      - "scripts/product-evidence/trust-p24-isntree-kr-sunscreen-hosted-adoption-plan-v1.mjs"
      - "scripts/product-evidence/verify-trust-p24-isntree-kr-sunscreen-hosted-adoption-plan-v1.mjs"
      - ".github/workflows/trust-p24-isntree-kr-sunscreen-hosted-adoption-plan.yml"
permissions:
  contents: read
jobs:
  verify-trust-p24-isntree-kr-sunscreen-hosted-adoption-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Attest exact head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain)"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify TRUST-P24 deterministic hosted adoption plan
        run: node scripts/product-evidence/verify-trust-p24-isntree-kr-sunscreen-hosted-adoption-plan-v1.mjs
