name: DATA-AI5 Activation Readiness

on:
  push:
    branches: [main]
    paths:
      - "lib/product-query-intent-contract.mjs"
      - "lib/server/product-query-intent-service.js"
      - "lib/product-query-execution-contract.mjs"
      - "lib/product-query-recommendation.js"
      - "lib/server/product-query-shadow-service.js"
      - "lib/server/product-query-activation-readiness-service.js"
      - "lib/product-query-activation-readiness-oidc.js"
      - "app/api/internal/product-query-activation-readiness/route.js"
      - "scripts/verify-data-ai5-activation-readiness.mjs"
      - "scripts/validate-data-ai5-activation-readiness-runtime-response.mjs"
      - ".github/workflows/data-ai5-activation-readiness.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/product-query-intent-contract.mjs"
      - "lib/server/product-query-intent-service.js"
      - "lib/product-query-execution-contract.mjs"
      - "lib/product-query-recommendation.js"
      - "lib/server/product-query-shadow-service.js"
      - "lib/server/product-query-activation-readiness-service.js"
      - "lib/product-query-activation-readiness-oidc.js"
      - "app/api/internal/product-query-activation-readiness/route.js"
      - "scripts/verify-data-ai5-activation-readiness.mjs"
      - "scripts/validate-data-ai5-activation-readiness-runtime-response.mjs"
      - ".github/workflows/data-ai5-activation-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: data-ai5-activation-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATA_AI5_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  DATA_AI5_OIDC_AUDIENCE: urn:bejewely:data-ai5:activation-readiness

jobs:
  verify:
    name: DATA-AI5 static activation-readiness contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.DATA_AI5_EXACT_HEAD }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DATA_AI5_EXACT_HEAD"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify DATA-AI1 intent boundary
        run: node scripts/verify-data-ai1-product-query-intent.mjs

      - name: Verify DATA-AI2 deterministic execution
        run: node scripts/verify-data-ai2-product-query-execution.mjs

      - name: Verify DATA-AI3 real-corpus shadow boundary
        run: node scripts/verify-data-ai3-product-query-shadow.mjs

      - name: Verify DATA-AI4 provider-backed shadow boundary
        run: node scripts/verify-data-ai4-provider-shadow.mjs

      - name: Verify DATA-AI5 activation-readiness boundary
        run: |
          node --check scripts/validate-data-ai5-activation-readiness-runtime-response.mjs
          node scripts/verify-data-ai5-activation-readiness.mjs

      - name: Verify architecture boundaries
        env:
          ARCHITECTURE_GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: npm run architecture:guard

      - name: Build production application
        run: npm run build

      - name: Check exact-head and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DATA_AI5_EXACT_HEAD"
          git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}...$DATA_AI5_EXACT_HEAD" || git diff --check HEAD^

  runtime-probe:
    name: DATA-AI5 deployed activation-readiness probe
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact runtime probe SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ env.DATA_AI5_EXACT_HEAD }}

      - name: Verify runtime probe checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DATA_AI5_EXACT_HEAD"
          test -f scripts/validate-data-ai5-activation-readiness-runtime-response.mjs

      - name: Resolve exact Vercel deployment URL
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url=""
          for attempt in $(seq 1 72); do
            ids="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments?per_page=100" --jq ".[] | select(.sha == \"$GITHUB_SHA\") | .id" || true)"
            for id in $ids; do
              candidate="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success" and .environment_url != null)][0].environment_url // empty' || true)"
              if [ -n "$candidate" ]; then
                url="$candidate"
                break
              fi
            done
            if [ -n "$url" ]; then
              break
            fi
            sleep 5
          done
          test -n "$url"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Obtain short-lived GitHub OIDC tokens
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          custom_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${DATA_AI5_OIDC_AUDIENCE}")"
          custom="$(printf '%s' "$custom_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          trusted_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          trusted="$(printf '%s' "$trusted_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          echo "::add-mask::$custom"
          echo "::add-mask::$trusted"
          printf 'custom=%s\ntrusted=%s\n' "$custom" "$trusted" >> "$GITHUB_OUTPUT"

      - name: Probe activation-readiness cases twice
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.custom }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.trusted }}
        shell: bash
        run: |
          set -euo pipefail
          cases=(
            sun_pref_a
            sun_pref_b
            barrier_cream_a
            barrier_cream_b
            category_only_a
            category_only_b
            pregnancy_unresolved_a
            pregnancy_unresolved_b
            makeup_eye_sun_a
            makeup_eye_sun_b
            adversarial_selection_a
            adversarial_selection_b
          )

          pass_count=0
          for case_id in "${cases[@]}"; do
            for repeat in 1 2; do
              response_file="$(mktemp)"
              status="$(curl --silent --show-error --retry 1 --retry-delay 1 --retry-all-errors                 -o "$response_file"                 -w '%{http_code}'                 -X POST                 -H "Authorization: Bearer $OIDC_TOKEN"                 -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN"                 -H 'Content-Type: application/json'                 --data "{\"caseId\":\"${case_id}\"}"                 "$DEPLOYMENT_URL/api/internal/product-query-activation-readiness")"
              cat "$response_file"
              echo
              echo "DATA_AI5_RUNTIME_PROBE_HTTP_STATUS=${case_id}:repeat_${repeat}:${status}"

              node scripts/validate-data-ai5-activation-readiness-runtime-response.mjs                 "$response_file" "$GITHUB_SHA" "$status" "$case_id" "$repeat"
              pass_count=$((pass_count + 1))
              rm -f "$response_file"
            done
          done

          test "$pass_count" -eq 24
          echo "DATA_AI5_ACTIVATION_READINESS_PASS_COUNT=$pass_count"
