name: DATA-OFFER12 Torriden Product Binding Decision

on:
  pull_request:
    branches: [main]
    paths:
      - "evidence/data-offer12/torriden-136-product-binding-decision-v1.json"
      - "scripts/verify-data-offer12-torriden-binding-decision-v1.mjs"
      - "scripts/verify-current-main-health.mjs"
      - ".github/workflows/data-offer12-torriden-binding-decision.yml"
  push:
    branches: [main]
    paths:
      - "evidence/data-offer12/torriden-136-product-binding-decision-v1.json"
      - "scripts/verify-data-offer12-torriden-binding-decision-v1.mjs"
      - "scripts/verify-current-main-health.mjs"
      - ".github/workflows/data-offer12-torriden-binding-decision.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: DATA-OFFER12 Torriden Product Binding Decision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Attest exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'DATA_OFFER12_EXACT_HEAD=%s\n' "$EXPECTED_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify unresolved binding authority
        run: |
          node scripts/verify-data-offer12-torriden-binding-decision-v1.mjs
          node --check scripts/verify-data-offer12-torriden-binding-decision-v1.mjs

      - name: Check exact-head and diff hygiene
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse "${HEAD_SHA}^")"
          fi
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --check "${base}...${HEAD_SHA}"
