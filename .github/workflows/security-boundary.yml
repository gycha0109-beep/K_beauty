name: BEJEWELY Security Boundary
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.watchtower_track != '' && format('[WT:{0}] {1}', inputs.watchtower_track, github.workflow) || github.workflow }}

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/**"
      - "app/auth/**"
      - "components/account/**"
      - "components/result/**"
      - "lib/security/**"
      - "lib/auth/**"
      - "lib/supabase/**"
      - "lib/provider-runtime-log.js"
      - "lib/openai-env-diagnostics.js"
      - "lib/upload-validation.js"
      - "lib/write-access.js"
      - "supabase/migrations/**"
      - "scripts/check-sec11-site-origin-normalization.mjs"
      - "scripts/run-security-boundary-verifier-suite.mjs"
      - "scripts/verify-analysis-rls-contract.mjs"
      - "scripts/verify-anonymous-write-grant-v2.mjs"
      - "scripts/verify-current-repository-hygiene.mjs"
      - "scripts/verify-provider-runtime-log-sanitization.mjs"
      - "scripts/verify-sec*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security-boundary.yml"
      - "docs/ci/workflow-responsibility-map.json"
      - "docs/ci/workflow-responsibility-map.md"
  push:
    branches: [main]
    paths:
      - "app/api/**"
      - "app/auth/**"
      - "components/account/**"
      - "components/result/**"
      - "lib/security/**"
      - "lib/auth/**"
      - "lib/supabase/**"
      - "lib/provider-runtime-log.js"
      - "lib/openai-env-diagnostics.js"
      - "lib/upload-validation.js"
      - "lib/write-access.js"
      - "supabase/migrations/**"
      - "scripts/check-sec11-site-origin-normalization.mjs"
      - "scripts/run-security-boundary-verifier-suite.mjs"
      - "scripts/verify-analysis-rls-contract.mjs"
      - "scripts/verify-anonymous-write-grant-v2.mjs"
      - "scripts/verify-current-repository-hygiene.mjs"
      - "scripts/verify-provider-runtime-log-sanitization.mjs"
      - "scripts/verify-sec*.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/security-boundary.yml"
      - "docs/ci/workflow-responsibility-map.json"
      - "docs/ci/workflow-responsibility-map.md"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  application-boundaries:
    name: Security application boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical security boundary suite
        run: node scripts/run-security-boundary-verifier-suite.mjs

      - name: Check exact-head diff hygiene
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ && ! "${BASE_SHA}" =~ ^0+$ ]]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          else
            git diff --check HEAD^
          fi

  sec12-mutation-resistance:
    name: SEC-12 mutation resistance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prove SEC-12 verifier fails closed under mutations
        run: node scripts/verify-sec12-mutations.mjs
