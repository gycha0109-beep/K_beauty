name: V2.1-9E deterministic engine hook patch

on:
  push:
    branches:
      - activate/v21-9e-normative-policy-production-shadow

permissions:
  contents: write

jobs:
  patch-engine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activate/v21-9e-normative-policy-production-shadow
          fetch-depth: 0
      - name: Patch exact production hook
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/skin-match-decision-engine.js")
          source = path.read_text(encoding="utf-8")
          needle = '''  const topPick =\n    exposureProducts.find((product) => product.decision_meta?.slot === targetSlot) ||'''
          replacement = '''  try {\n    const normativePolicyObserverModule = await import(\n      "@/lib/exfoliation-normative-policy-production-shadow-observer"\n    );\n    await normativePolicyObserverModule.observeExfoliationNormativePolicyProductionShadow({\n      input,\n      candidates: exposureProducts,\n      priorityAxis: priority.axis,\n      scoreCard,\n      currentProductsReport\n    });\n  } catch {\n    console.warn(\n      "[exfoliation-normative-policy-runtime] observer_unavailable_legacy_preserved"\n    );\n  }\n\n  const topPick =\n    exposureProducts.find((product) => product.decision_meta?.slot === targetSlot) ||'''
          count = source.count(needle)
          if count != 1:
              raise SystemExit(f"expected exactly one hook needle, found {count}")
          patched = source.replace(needle, replacement, 1)
          if patched.count("observeExfoliationNormativePolicyProductionShadow") != 1:
              raise SystemExit("observer hook count mismatch after patch")
          path.write_text(patched, encoding="utf-8")
          PY
      - name: Commit exact hook
        run: |
          if git diff --quiet -- lib/skin-match-decision-engine.js; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/skin-match-decision-engine.js
          git commit -m "feat(v21-9e): wire normative production shadow observer"
          git push origin HEAD:activate/v21-9e-normative-policy-production-shadow
