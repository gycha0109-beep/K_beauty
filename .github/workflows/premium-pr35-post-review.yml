name: Premium PR35 post-integration review

on:
  pull_request:
    branches: [integration/premium-engine-main-sec-baseline]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/premium-pr35-post-review.yml
      - .github/scripts/premium-pr35-post-review.py

permissions:
  contents: write

concurrency:
  group: premium-pr35-post-integration-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/premium-browser-journey-main-sec-baseline
          fetch-depth: 0
      - name: Apply post-integration security review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/integration/premium-browser-journey-main-sec-baseline)"
          test "$(git merge-base HEAD origin/integration/premium-engine-main-sec-baseline)" = "219359714124e4a92360b77b4e11d79b2cbfd0d6"
          python .github/scripts/premium-pr35-post-review.py
          rm -f \
            .github/workflows/premium-pr35-post-review.yml \
            .github/scripts/premium-pr35-post-review.py
          git add -A
          node --check scripts/premium-browser-journey-core.mjs
          node --check scripts/run-premium-browser-journey.mjs
          node --check scripts/cleanup-premium-browser-journey.mjs
          node --check scripts/verify-premium-browser-journey-contract.mjs
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json' || true)"
          git commit -m "fix(security): harden premium journey cross-account cleanup boundary"
          npm ci
      - name: Verify browser journey contracts repeatedly
        shell: bash
        run: |
          set -euo pipefail
          for run in 1 2 3 4 5; do
            echo "post-review browser contract run ${run}/5"
            npm run verify:premium-browser-journey-contract
          done
      - name: Verify inherited Premium contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-premium-route-storage-reentry.mjs
          node scripts/verify-premium-report-reentry-contract.mjs
          node scripts/verify-premium-integrated-evaluation.mjs
          node scripts/verify-premium-decision-state.mjs
      - name: Verify security closeout
        run: node scripts/run-security-closeout-verifier-suite.mjs
      - name: Verify architecture
        run: npm run architecture:guard
      - name: Verify production build
        run: npm run build
      - name: Verify final hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
          test -z "$(git grep -nE '(Bearer [A-Za-z0-9._-]{20,}|sbp_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' -- scripts docs .codex || true)"
          test ! -e .github/workflows/premium-pr35-post-review.yml
          test ! -e .github/scripts/premium-pr35-post-review.py
      - name: Push reviewed integration
        run: git push origin HEAD:integration/premium-browser-journey-main-sec-baseline
