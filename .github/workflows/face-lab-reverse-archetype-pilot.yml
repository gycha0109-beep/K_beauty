permissions:
  contents: read

concurrency:
  group: face-lab-reverse-archetype-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify reverse archetype pilot boundary
        run: node scripts/verify-face-lab-reverse-archetype-pilot.mjs
      - name: Verify R-A2A collection plan CLI
        run: node scripts/face-lab-reverse-archetype-collection.mjs --plan > /dev/null
      - name: Verify R-A2A collection ledger CLI
        run: node scripts/face-lab-reverse-archetype-collection.mjs evidence/facelab/reverse-archetype/pilot-v1/collection-ledger.json > /dev/null
      - name: Verify R-A2A next-task CLI
        run: node scripts/face-lab-reverse-archetype-collection.mjs --next evidence/facelab/reverse-archetype/pilot-v1/collection-ledger.json > /dev/null
      - name: Verify FaceSpace3DAdapter v0 contract
        run: node scripts/verify-face-lab-face-space-3d-adapter.mjs
      - name: Verify photo geometry measurement bridge
        run: node scripts/verify-face-lab-photo-geometry-bridge.mjs
      - name: Verify MediaPipe metric geometry runtime parity
        run: node scripts/verify-face-lab-photo-geometry-runtime.mjs
      - name: Install actual-image Face Landmarker E2E harness
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ROOT="$RUNNER_TEMP/face-lab-image-e2e-runtime"
          mkdir -p "$RUNTIME_ROOT"
          npm install --prefix "$RUNTIME_ROOT" --ignore-scripts --no-audit --no-fund playwright-core@1.59.1
          echo "FACE_LAB_IMAGE_E2E_RUNTIME_ROOT=$RUNTIME_ROOT" >> "$GITHUB_ENV"
      - name: Verify actual-image Face Landmarker bridge
        run: node scripts/verify-face-lab-photo-geometry-image-e2e.mjs
      - name: Verify 14-fixture photo geometry coverage
        run: node scripts/verify-face-lab-photo-geometry-multi-fixture-coverage.mjs
      - name: Verify photo geometry stability contract
        run: node scripts/verify-face-lab-photo-geometry-stability-contract.mjs
      - name: Verify real-photo same-subject evidence gate
        run: node scripts/verify-face-lab-real-photo-stability-evidence.mjs
      - name: Verify real-photo stability adequacy boundary
        run: node scripts/verify-face-lab-real-photo-stability-adequacy.mjs
      - name: Verify real-photo stability review packet
        run: node scripts/verify-face-lab-real-photo-stability-review-packet.mjs
      - name: Verify real-photo stability run manifest boundary
        run: node scripts/verify-face-lab-real-photo-stability-run-manifest.mjs
      - name: Syntax check real-photo stability pair runner
        run: node --check scripts/run-face-lab-real-photo-stability-pairs.mjs
      - name: Verify actual-image nuisance stability harness
        run: node scripts/verify-face-lab-photo-geometry-stability.mjs
      - name: Verify Face Space normalization readiness
        run: node scripts/verify-face-lab-face-space-normalization-readiness.mjs
      - name: Verify Face Space general-face reference corpus boundary
        run: node scripts/verify-face-lab-face-space-reference-corpus.mjs
      - name: Verify Face Space reference corpus source manifest
        run: node scripts/verify-face-lab-reference-corpus-source-manifest.mjs
      - name: Verify Face Space reference corpus runner output
        run: node scripts/verify-face-lab-reference-corpus-run-output.mjs
      - name: Verify Face Space reference corpus adequacy boundary
        run: node scripts/verify-face-lab-reference-corpus-adequacy.mjs
      - name: Verify Face Space reference corpus review packet
        run: node scripts/verify-face-lab-reference-corpus-review-packet.mjs
      - name: Verify Face Lab London Set v5 source intake boundary
        run: node scripts/verify-face-lab-london-set-v5-source-intake.mjs
      - name: Verify Face Lab London Set v5 front intake planner
        run: node scripts/verify-face-lab-london-set-v5-intake.mjs
      - name: Verify Face Lab London Set v5 upstream front inventory
        run: node scripts/verify-face-lab-london-set-v5-upstream-inventory.mjs
      - name: Verify Face Lab London Set v5 frozen split plan
        run: node scripts/verify-face-lab-london-set-v5-split-plan.mjs
      - name: Syntax check London measurement manifest builder
        run: node --check scripts/build-face-lab-london-set-v5-measurement-manifests.mjs
      - name: Verify London real measurement evidence
        run: node scripts/verify-face-lab-london-set-v5-measurement-evidence.mjs
      - name: Syntax check London source receipt builder
        run: node --check scripts/build-face-lab-london-set-v5-front-receipts.mjs
      - name: Syntax check London source receipt verifier
        run: node --check scripts/verify-face-lab-london-set-v5-front-receipts.mjs
      - name: Verify Face Lab source manifest scaffold
        run: node scripts/verify-face-lab-source-manifest-scaffold.mjs
      - name: Syntax check Face Lab source manifest scaffold CLI
        run: node --check scripts/scaffold-face-lab-source-manifest.mjs
      - name: Smoke Face Lab research runner validate-only CLIs
        run: node scripts/verify-face-lab-runner-cli-contract.mjs
      - name: Verify Face Lab run-output review packet bridge
        run: node scripts/verify-face-lab-normalization-review-packet-run-output.mjs
      - name: Syntax check Face Lab review packet builder CLI
        run: node --check scripts/build-face-lab-normalization-review-packet.mjs
      - name: Syntax check Face Space reference corpus measurement runner
        run: node --check scripts/run-face-lab-reference-corpus-measurement.mjs
      - name: Verify Face Space reference statistics method boundary
        run: node scripts/verify-face-lab-reference-statistics-method.mjs
      - name: Verify Face Space reference statistics estimator
        run: node scripts/verify-face-lab-reference-statistics-estimator.mjs
      - name: Verify Face Space reference method comparison
        run: node scripts/verify-face-lab-reference-method-comparison.mjs
      - name: Verify Face Space reference method selection boundary
        run: node scripts/verify-face-lab-reference-method-selection.mjs
      - name: Verify Face Space normalization holdout diagnostic
        run: node scripts/verify-face-lab-normalization-holdout-diagnostic.mjs
      - name: Compile GNM v3 PoC runner
        run: python -m py_compile scripts/face-lab-gnm-v3-poc.py
