name: DATA-AI19 Authenticated Beta Activation Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - "vercel.json"
      - "lib/product-query-authenticated-beta-runtime.mjs"
      - "lib/product-query-authenticated-beta-activation-preflight.mjs"
      - "scripts/verify-data-ai19-authenticated-beta-activation-preflight.mjs"
      - ".github/workflows/data-ai19-authenticated-beta-activation-preflight.yml"
  push:
    branches: [main]
    paths:
      - "vercel.json"
      - "lib/product-query-authenticated-beta-runtime.mjs"
      - "lib/product-query-authenticated-beta-activation-preflight.mjs"
      - "scripts/verify-data-ai19-authenticated-beta-activation-preflight.mjs"
      - ".github/workflows/data-ai19-authenticated-beta-activation-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-ai19-authenticated-beta-activation-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: DATA-AI19 authenticated beta activation preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify DATA-AI19 activation preflight
        run: node scripts/verify-data-ai19-authenticated-beta-activation-preflight.mjs
