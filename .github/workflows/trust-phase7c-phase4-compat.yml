name: TRUST Phase 7C Phase4 Legacy Adoption Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*trust_phase7c_phase4_*.sql"
      - "tests/fixtures/trust-phase7c-phase4-compat/**"
      - "scripts/verify-trust-phase7c-phase4-legacy-compat.mjs"
      - "scripts/verify-current-main-health.mjs"
      - ".github/workflows/trust-phase7c-phase4-compat.yml"
  push:
    branches: [main, "feat/trust-phase7c-phase4-legacy-compat"]
    paths:
      - "supabase/migrations/*trust_phase7c_phase4_*.sql"
      - "tests/fixtures/trust-phase7c-phase4-compat/**"
      - "scripts/verify-trust-phase7c-phase4-legacy-compat.mjs"
      - "scripts/verify-current-main-health.mjs"
      - ".github/workflows/trust-phase7c-phase4-compat.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.117.0

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify static contracts
        run: |
          node scripts/verify-trust-phase4-controlled-evidence-adoption.mjs
          node scripts/verify-trust-phase7c-legacy-research-readiness.mjs
          node scripts/verify-trust-phase7c-phase4-legacy-compat.mjs
          node scripts/verify-product-fact-controlled-write-v1.mjs
          node scripts/verify-product-fact-subject-registration-v1.mjs

      - name: Materialize isolated Product Fact runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="${GITHUB_WORKSPACE}/tmp/trust-phase7c-phase4-runtime"
          echo "TRUST_RUNTIME_DIR=${runtime_dir}" >>"${GITHUB_ENV}"
          node scripts/materialize-product-fact-replay-baseline-v1.mjs --output="${runtime_dir}"
          sed -i 's/major_version = 15/major_version = 17/' "${runtime_dir}/supabase/config.toml"
          migration_dir="${runtime_dir}/supabase/migrations"
          cp supabase/migrations/20260809115932_product_fact_storage_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260810174410_product_fact_subject_registration_v1.sql "${migration_dir}/"
          cp tests/fixtures/trust-phase4-controlled-evidence-adoption/20260917194000_trust_phase4_fixture.sql "${migration_dir}/"
          cp supabase/migrations/20260917195000_trust_phase4_controlled_evidence_adoption_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260917195100_trust_phase4_controlled_evidence_adoption_fusion_hardening_v1.sql "${migration_dir}/"
          cp tests/fixtures/trust-phase7c-phase4-compat/20260921072900_trust_phase7c_phase4_compat_fixture.sql "${migration_dir}/"
          cp supabase/migrations/20260921094643_trust_phase7c_phase4_legacy_adoption_compat_v1.sql "${migration_dir}/"

      - name: Start isolated Supabase and verify compatibility
        shell: bash
        run: |
          set -euo pipefail
          start_log="${RUNNER_TEMP}/trust-phase7c-phase4-start.log"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" start \
            --workdir "${TRUST_RUNTIME_DIR}" \
            --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            >"${start_log}" 2>&1; then
            sed -E 's#(sb_(publishable|secret)_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+|postgresql://[^[:space:]]+)#[REDACTED]#g' "${start_log}" >&2
            exit 1
          fi
          rm -f "${start_log}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --workdir "${TRUST_RUNTIME_DIR}"
          DB_PORT="$(awk 'BEGIN{in_db=0} /^\[db\]/{in_db=1;next} /^\[/{in_db=0} in_db && /^port =/{gsub(/[^0-9]/,"",$0);print $0;exit}' "${TRUST_RUNTIME_DIR}/supabase/config.toml")"
          test -n "$DB_PORT"
          DB="postgresql://postgres:postgres@127.0.0.1:${DB_PORT}/postgres"
          psql "$DB" -qAt -v ON_ERROR_STOP=1 \
            -f tests/fixtures/trust-phase7c-phase4-compat/verify_trust_phase7c_phase4_compat_runtime.sql \
            | tee "${RUNNER_TEMP}/trust-phase7c-phase4-runtime.log"
          grep -q '^TRUST_PHASE7C_PHASE4_LEGACY_COMPAT_RUNTIME_VERIFIED$' "${RUNNER_TEMP}/trust-phase7c-phase4-runtime.log"

      - name: Check exact-head diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          git diff --check "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}...${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}" || git diff --check HEAD^

      - name: Stop isolated Supabase
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [[ -n "${TRUST_RUNTIME_DIR:-}" && -d "${TRUST_RUNTIME_DIR}/supabase" ]]; then
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --workdir "${TRUST_RUNTIME_DIR}" --no-backup
          fi
          rm -rf -- "${TRUST_RUNTIME_DIR:-${GITHUB_WORKSPACE}/tmp/trust-phase7c-phase4-runtime}"
