name: "[WT:trust] Commerce Link Health v1"

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/commerce/**"
      - "scripts/verify-commerce-link-health-v1.mjs"
      - "scripts/commerce-link-health-live-probe.mjs"
      - "tests/fixtures/commerce-link-health/**"
      - ".github/workflows/commerce-link-health-v1.yml"
  push:
    branches:
      - main
    paths:
      - "lib/commerce/**"
      - "scripts/verify-commerce-link-health-v1.mjs"
      - "scripts/commerce-link-health-live-probe.mjs"
      - "tests/fixtures/commerce-link-health/**"
      - ".github/workflows/commerce-link-health-v1.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify commerce link health contract
        run: node scripts/verify-commerce-link-health-v1.mjs

      - name: Run Olive Young DB-write-free canary
        run: node scripts/commerce-link-health-live-probe.mjs --delay-ms=750

      - name: Generate migration filename with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          before="$(find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort)"
          npx --yes supabase@2.109.1 migration new commerce_link_health_v1
          after="$(find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort)"
          comm -13 <(printf '%s\n' "${before}") <(printf '%s\n' "${after}") | sed 's/^/COMMERCE_LINK_HEALTH_MIGRATION_FILE=/'

      - name: Diff hygiene
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ ]] || [[ "${base}" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse "${HEAD_SHA}^")"
          fi
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          git diff --check "${base}...${HEAD_SHA}"
