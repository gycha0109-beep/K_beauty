name: "[WT:trust] Commerce Link Health v1"

on:
  pull_request:
    branches:
      - main
    paths:
      - "lib/commerce/**"
      - "scripts/verify-commerce-link-health-v1.mjs"
      - "scripts/commerce-link-health-live-probe.mjs"
      - "tests/fixtures/commerce-link-health/**"
      - "supabase/migrations/20260925105754_commerce_link_health_v1.sql"
      - ".github/workflows/commerce-link-health-v1.yml"
  push:
    branches:
      - main
    paths:
      - "lib/commerce/**"
      - "scripts/verify-commerce-link-health-v1.mjs"
      - "scripts/commerce-link-health-live-probe.mjs"
      - "tests/fixtures/commerce-link-health/**"
      - "supabase/migrations/20260925105754_commerce_link_health_v1.sql"
      - ".github/workflows/commerce-link-health-v1.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify commerce link health contract
        run: node scripts/verify-commerce-link-health-v1.mjs

      - name: Run Olive Young DB-write-free canary
        run: node scripts/commerce-link-health-live-probe.mjs --delay-ms=750

      - name: Prepare isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="${RUNNER_TEMP}/commerce-link-health-runtime"
          echo "COMMERCE_LINK_HEALTH_RUNTIME_DIR=${runtime_dir}" >>"${GITHUB_ENV}"
          npx --yes supabase@2.109.1 init --workdir "${runtime_dir}" --force
          migration_dir="${runtime_dir}/supabase/migrations"
          mkdir -p "${migration_dir}"
          cp tests/fixtures/product-offers/20260910102500_product_offers_runtime_seed.sql "${migration_dir}/"
          cp supabase/migrations/20260910103000_product_offers_shadow_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260925105754_commerce_link_health_v1.sql "${migration_dir}/"

      - name: Start and reset isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.109.1 start \
            --workdir "${COMMERCE_LINK_HEALTH_RUNTIME_DIR}" \
            --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          npx --yes supabase@2.109.1 db reset --workdir "${COMMERCE_LINK_HEALTH_RUNTIME_DIR}"

      - name: Verify governed DB runtime
        shell: bash
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/commerce-link-health.env"
          npx --yes supabase@2.109.1 status --workdir "${COMMERCE_LINK_HEALTH_RUNTIME_DIR}" -o env >"${env_file}"
          set -a
          source "${env_file}"
          set +a
          rm -f "${env_file}"
          psql "${DB_URL}" -v ON_ERROR_STOP=1 -f tests/fixtures/commerce-link-health/verify-commerce-link-health-db-runtime.sql

      - name: Stop isolated Supabase
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [[ -d "${COMMERCE_LINK_HEALTH_RUNTIME_DIR}/supabase" ]]; then
            npx --yes supabase@2.109.1 stop --workdir "${COMMERCE_LINK_HEALTH_RUNTIME_DIR}" --no-backup
          fi
          rm -rf -- "${COMMERCE_LINK_HEALTH_RUNTIME_DIR}"

      - name: Diff hygiene
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ ]] || [[ "${base}" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse "${HEAD_SHA}^")"
          fi
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          git diff --check "${base}...${HEAD_SHA}"
