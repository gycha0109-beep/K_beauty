name: Apply security closeout remediation

on:
  push:
    branches:
      - remediation/security-closeout-verifier-reproducibility

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(test): apply security closeout remediation payload'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation/security-closeout-verifier-reproducibility
          fetch-depth: 0
      - name: Apply reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          cat .codex/security-closeout-remediation.patch-* | git apply --whitespace=error -
          rm .codex/security-closeout-remediation.patch-*
          rm -f .codex/security-closeout-remediation.part-*
          rm .codex/security-closeout-remediation.trigger
          rm .github/workflows/remediation-source-snapshot.yml
          rm .github/workflows/apply-security-closeout-remediation.yml
          git diff --check
      - name: Commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(test): restore security closeout verifier reproducibility"
          git push origin HEAD:remediation/security-closeout-verifier-reproducibility
