name: V2.1-9I Score Scale Semantic Remediation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-9i-score-scale-semantic-remediation.yml'
      - 'lib/exfoliation-normative-policy-production-shadow-observer.js'
      - 'lib/exfoliation-normative-policy-skin-match-context.js'
      - 'scripts/product-evidence/verify-v21-9i-score-scale-semantic-remediation-v1.mjs'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/v21-9i-remediated-synthetic-contexts-v1.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-9i-score-scale-semantic-remediation.yml'
      - 'lib/exfoliation-normative-policy-production-shadow-observer.js'
      - 'lib/exfoliation-normative-policy-skin-match-context.js'
      - 'scripts/product-evidence/verify-v21-9i-score-scale-semantic-remediation-v1.mjs'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/v21-9i-remediated-synthetic-contexts-v1.json'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify-v21-9i-sr:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      V21_9I_SR_BASE_MAIN_SHA: 7a8e964a833e08047b3fda02ebef40b6f19e5979
      V21_9I_RECOMMENDATION_REFERENCE_SHA: 783afb91a964f5d762f46846f9ef854902b48e95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Exact authority and bounded semantic scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$V21_9I_SR_BASE_MAIN_SHA" HEAD
          test "$(git merge-base "$V21_9I_SR_BASE_MAIN_SHA" HEAD)" = "$V21_9I_SR_BASE_MAIN_SHA"
          git diff --exit-code "$V21_9I_SR_BASE_MAIN_SHA" -- \
            lib/shared-skin-decision-context.js \
            lib/shared-skin-decision-context-v4.js \
            lib/routine-policy.js \
            lib/skin-match-decision-engine.js
          grep -q 'buildExfoliationNormativePolicySkinMatchContext' lib/exfoliation-normative-policy-production-shadow-observer.js
          ! grep -q 'buildSharedSkinDecisionContext' lib/exfoliation-normative-policy-production-shadow-observer.js
          ! grep -q 'EXFOLIATION_NORMATIVE_POLICY_MODE.*ENFORCE' lib/exfoliation-normative-policy-production-shadow-observer.js

      - name: Syntax and source-scale contract
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/exfoliation-normative-policy-skin-match-context.js
          node --check lib/exfoliation-normative-policy-production-shadow-observer.js
          node --check scripts/product-evidence/verify-v21-9i-score-scale-semantic-remediation-v1.mjs
          grep -q 'RAW_SKIN_MATCH_HIGH_CONCERN_THRESHOLD = 18' lib/exfoliation-normative-policy-skin-match-context.js
          grep -q 'concernScoreScale: "skin_match_raw"' lib/exfoliation-normative-policy-skin-match-context.js

      - name: Prepare frozen canonical 164-product reference
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q "$V21_9I_RECOMMENDATION_REFERENCE_SHA"
          node -e 'const f=require("./_reference/recommendation/fixtures/recommendation-metadata/products-v1.json"); if(f.productCount!==164||f.products.length!==164) process.exit(1)'

      - name: Boundary, blocker contexts, and exact 28 x 164 replay
        env:
          V21_9I_REFERENCE_ROOT: _reference/recommendation
        run: node --experimental-default-type=module scripts/product-evidence/verify-v21-9i-score-scale-semantic-remediation-v1.mjs

      - name: Generic shared-context and routine regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-shared-skin-decision-context-v4.mjs
          node scripts/verify-routine-policy-single-source.mjs

      - name: Historical normative runtime safety
        env:
          V21_9D_REQUIRE_CHECKED_IN: '1'
        run: node scripts/product-evidence/verify-exfoliation-normative-policy-activation-authorization-runtime-safety-v1.mjs

      - name: Prepare frozen 164 x 12 recommendation reference
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation-invariance
          git clone -q --no-hardlinks . _reference/recommendation-invariance
          git -C _reference/recommendation-invariance checkout -q "$V21_9I_RECOMMENDATION_REFERENCE_SHA"

      - name: Canonical 164 x 12 OFF invariance
        shell: bash
        env:
          EXFOLIATION_NORMATIVE_POLICY_ENABLED: '0'
          EXFOLIATION_NORMATIVE_POLICY_KILL_SWITCH: '0'
          EXFOLIATION_NORMATIVE_POLICY_MODE: 'OFF'
          EXFOLIATION_NORMATIVE_POLICY_ACTIVATION_VERSION: exfoliation-non-numeric-pda-normative-production-policy-activation-v1
          EXFOLIATION_NORMATIVE_POLICY_CONTRACT_VERSION: exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1
          EXFOLIATION_NORMATIVE_POLICY_RUNTIME_VERSION: exfoliation-non-numeric-pda-normative-production-policy-shadow-v1
          EXFOLIATION_NORMATIVE_POLICY_SCOPE: POST_SCORE_POST_SORT_ELIGIBILITY_OVERLAY_BEFORE_RESULT_ASSEMBLY
        run: |
          set -euo pipefail
          V21_7_BASE_MAIN_SHA=e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87 RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation-invariance node scripts/verify-product-decision-axis-comparator-v1.mjs > /tmp/v21-9i-sr-off.log 2>&1
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation-invariance node scripts/verify-skin-decision-recommendation-invariance.mjs >> /tmp/v21-9i-sr-off.log 2>&1
          tail -n 30 /tmp/v21-9i-sr-off.log

      - name: Canonical 164 x 12 SHADOW invariance
        shell: bash
        env:
          EXFOLIATION_NORMATIVE_POLICY_ENABLED: '1'
          EXFOLIATION_NORMATIVE_POLICY_KILL_SWITCH: '0'
          EXFOLIATION_NORMATIVE_POLICY_MODE: 'SHADOW'
          EXFOLIATION_NORMATIVE_POLICY_ACTIVATION_VERSION: exfoliation-non-numeric-pda-normative-production-policy-activation-v1
          EXFOLIATION_NORMATIVE_POLICY_CONTRACT_VERSION: exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1
          EXFOLIATION_NORMATIVE_POLICY_RUNTIME_VERSION: exfoliation-non-numeric-pda-normative-production-policy-shadow-v1
          EXFOLIATION_NORMATIVE_POLICY_SCOPE: POST_SCORE_POST_SORT_ELIGIBILITY_OVERLAY_BEFORE_RESULT_ASSEMBLY
        run: |
          set -euo pipefail
          V21_7_BASE_MAIN_SHA=e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87 RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation-invariance node scripts/verify-product-decision-axis-comparator-v1.mjs > /tmp/v21-9i-sr-shadow.log 2>&1
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation-invariance node scripts/verify-skin-decision-recommendation-invariance.mjs >> /tmp/v21-9i-sr-shadow.log 2>&1
          tail -n 30 /tmp/v21-9i-sr-shadow.log

      - name: Production build
        env:
          EXFOLIATION_NORMATIVE_POLICY_ENABLED: '0'
          EXFOLIATION_NORMATIVE_POLICY_KILL_SWITCH: '0'
          EXFOLIATION_NORMATIVE_POLICY_MODE: 'OFF'
          EXFOLIATION_NORMATIVE_POLICY_ACTIVATION_VERSION: exfoliation-non-numeric-pda-normative-production-policy-activation-v1
          EXFOLIATION_NORMATIVE_POLICY_CONTRACT_VERSION: exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1
          EXFOLIATION_NORMATIVE_POLICY_RUNTIME_VERSION: exfoliation-non-numeric-pda-normative-production-policy-shadow-v1
          EXFOLIATION_NORMATIVE_POLICY_SCOPE: POST_SCORE_POST_SORT_ELIGIBILITY_OVERLAY_BEFORE_RESULT_ASSEMBLY
        run: npm run build

      - name: Publish merged-main exact-SHA CI attestation
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          PRIOR_JOB_STATUS: '${{ job.status }}'
        run: |
          set -euo pipefail
          state="success"
          description="V2.1-9I-SR merged-main exact-SHA CI passed"
          if [ "$PRIOR_JOB_STATUS" != "success" ]; then
            state="failure"
            description="V2.1-9I-SR merged-main exact-SHA CI failed"
          fi
          payload=$(printf '{"state":"%s","context":"V2.1-9I-SR merged-main exact-SHA CI","description":"%s","target_url":"%s/%s/actions/runs/%s"}' \
            "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null
          test "$state" = "success"
