name: PF-4B2 Hosted Product Fact PF-2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose dry-run first; execute re-runs the exact one-migration gate before push"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
      confirm:
        description: "For execute only, enter APPLY_PF2_PRODUCT_FACT_V1"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: pf4b2-hosted-product-fact-pf2
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.109.1
  TARGET_PROJECT_REF: bygrczggxfuisupcevaz
  EXECUTION_SHA: ff164fa2a022d01d472109fe18138a2a9176309b
  PRE_PF2_SHA: 0a0c11b0ee8c64766b730f70a859f2348b79cb5e
  PF2_PATH: supabase/migrations/20260809115932_product_fact_storage_v1.sql
  PF2_BLOB: 676afbc56bf90443a1198f93427382f067d19407
  PF2_SHA256: 1d23c706efa220d65cba98983636dd3d0ebb26a035593267a4a7c72cc52c8b4a

jobs:
  guarded-pf2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Validate dispatch authorization and credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.mode }}" == "execute" && "${{ inputs.confirm }}" != "APPLY_PF2_PRODUCT_FACT_V1" ]]; then
            echo "execute mode requires confirm=APPLY_PF2_PRODUCT_FACT_V1" >&2
            exit 1
          fi
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN" >&2; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD}" || { echo "Missing GitHub Actions secret: SUPABASE_DB_PASSWORD" >&2; exit 1; }

      - name: Checkout frozen PF-2 execution tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_SHA }}
          fetch-depth: 0

      - name: Verify exact PF-2 execution authority
        shell: bash
        run: |
          set -euo pipefail

          actual_head="$(git rev-parse HEAD)"
          if [[ "${actual_head}" != "${EXECUTION_SHA}" ]]; then
            echo "Execution HEAD mismatch: ${actual_head} != ${EXECUTION_SHA}" >&2
            exit 1
          fi

          dirty="$(git status --porcelain)"
          if [[ -n "${dirty}" ]]; then
            echo "Execution tree is not clean:" >&2
            printf '%s\n' "${dirty}" >&2
            exit 1
          fi

          count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          if [[ "${count}" != "36" ]]; then
            echo "Migration count mismatch: ${count} != 36" >&2
            exit 1
          fi

          last="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | LC_ALL=C sort | tail -n 1)"
          if [[ "${last}" != "20260809115932_product_fact_storage_v1.sql" ]]; then
            echo "Latest migration mismatch: ${last}" >&2
            exit 1
          fi

          actual_blob="$(git rev-parse "HEAD:${PF2_PATH}")"
          if [[ "${actual_blob}" != "${PF2_BLOB}" ]]; then
            echo "PF-2 blob mismatch: ${actual_blob} != ${PF2_BLOB}" >&2
            exit 1
          fi

          python3 - "${PF2_PATH}" "${PF2_BLOB}" "${PF2_SHA256}" <<'PY'
          import hashlib
          import pathlib
          import subprocess
          import sys

          path, blob_id, frozen_raw_sha = sys.argv[1:]
          worktree = pathlib.Path(path).read_bytes()
          blob = subprocess.check_output(["git", "cat-file", "blob", blob_id])

          def normalize_eol(value: bytes) -> bytes:
              return value.replace(b"\r\n", b"\n").replace(b"\r", b"\n")

          canonical = normalize_eol(blob)
          worktree_canonical = normalize_eol(worktree)
          if worktree_canonical != canonical:
              raise SystemExit("PF-2 working tree is not EOL-equivalent to the frozen Git blob")

          lf_sha = hashlib.sha256(canonical).hexdigest()
          crlf_sha = hashlib.sha256(canonical.replace(b"\n", b"\r\n")).hexdigest()
          worktree_sha = hashlib.sha256(worktree).hexdigest()

          if frozen_raw_sha not in {lf_sha, crlf_sha}:
              raise SystemExit(
                  "PF-2 frozen raw SHA is not an LF/CRLF rendering of the frozen Git blob: "
                  f"frozen={frozen_raw_sha} lf={lf_sha} crlf={crlf_sha} worktree={worktree_sha}"
              )

          print(
              "PF-2 EOL authority verified: "
              f"worktree_sha256={worktree_sha} lf_sha256={lf_sha} "
              f"crlf_sha256={crlf_sha} frozen_raw_sha256={frozen_raw_sha}"
          )
          PY

          if ! git cat-file -e "${PRE_PF2_SHA}^{commit}"; then
            echo "Pre-PF2 commit is missing from full checkout history: ${PRE_PF2_SHA}" >&2
            exit 1
          fi

          migration_delta="$(git diff --name-only "${PRE_PF2_SHA}" "${EXECUTION_SHA}" -- supabase/migrations)"
          if [[ "${migration_delta}" != "${PF2_PATH}" ]]; then
            echo "Unexpected migration delta between pre-PF2 and execution tree:" >&2
            printf '%s\n' "${migration_delta}" >&2
            exit 1
          fi

          echo "PF-2 execution authority verified: 36 migrations, PF-2 is the sole post-pre-PF2 migration."

      - name: Verify current main has no migration authority drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/pf4b2-main
          current_main="$(git rev-parse refs/remotes/origin/pf4b2-main)"

          git merge-base --is-ancestor "${EXECUTION_SHA}" "${current_main}"

          migration_delta="$(git diff --name-only "${EXECUTION_SHA}" "${current_main}" -- supabase/migrations)"
          if [[ -n "${migration_delta}" ]]; then
            echo "Migration authority drift since PF-4B2 execution anchor:" >&2
            printf '%s\n' "${migration_delta}" >&2
            exit 1
          fi

          current_pf2_blob="$(git rev-parse "${current_main}:${PF2_PATH}")"
          if [[ "${current_pf2_blob}" != "${PF2_BLOB}" ]]; then
            echo "Current-main PF-2 blob mismatch: ${current_pf2_blob} != ${PF2_BLOB}" >&2
            exit 1
          fi
          echo "current_main=${current_main}"

      - name: Verify Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          actual="$(npx --yes "supabase@${SUPABASE_CLI_VERSION}" --version)"
          echo "Supabase CLI ${actual}"

      - name: Link exact Hosted project
        shell: bash
        run: |
          set -euo pipefail
          raw="$(mktemp)"
          cleanup() { rm -f "${raw}"; }
          trap cleanup EXIT
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" link \
            --project-ref "${TARGET_PROJECT_REF}" \
            --password "${SUPABASE_DB_PASSWORD}" \
            >"${raw}" 2>&1; then
            sed -E \
              -e 's#(postgres(ql)?://[^:/[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' \
              -e 's#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' \
              "${raw}" >&2
            exit 1
          fi

      - name: Dry-run and enforce exact PF-2-only scope
        shell: bash
        run: |
          set -euo pipefail
          raw="$(mktemp)"
          clean="$(mktemp)"
          actual="$(mktemp)"
          expected="$(mktemp)"

          cleanup() { rm -f "${raw}" "${clean}" "${actual}" "${expected}"; }
          trap cleanup EXIT

          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" db push \
            --linked \
            --dry-run \
            --password "${SUPABASE_DB_PASSWORD}" \
            >"${raw}" 2>&1; then
            sed -E \
              -e 's#(postgres(ql)?://[^:/[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' \
              -e 's#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' \
              "${raw}" >&2
            exit 1
          fi

          sed -E \
            -e 's#(postgres(ql)?://[^:/[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' \
            -e 's#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' \
            "${raw}" >"${clean}"
          cat "${clean}"

          awk '/Would push these migrations:/{capture=1; next} /Finished supabase db push\./{capture=0} capture' "${clean}" \
            | grep -oE '[0-9]{14}_[[:alnum:]_]+\.sql' \
            >"${actual}" || true

          printf '%s\n' '20260809115932_product_fact_storage_v1.sql' >"${expected}"

          if ! diff -u "${expected}" "${actual}"; then
            echo "Dry-run scope is not exactly PF-2." >&2
            exit 1
          fi

          test "$(wc -l <"${actual}" | tr -d ' ')" = "1"
          echo "Exact PF-4B2 dry-run scope verified: PF-2 only."

      - name: Recheck authority immediately before Hosted write
        if: ${{ inputs.mode == 'execute' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/pf4b2-main-final
          current_main="$(git rev-parse refs/remotes/origin/pf4b2-main-final)"
          git merge-base --is-ancestor "${EXECUTION_SHA}" "${current_main}"

          migration_delta="$(git diff --name-only "${EXECUTION_SHA}" "${current_main}" -- supabase/migrations)"
          if [[ -n "${migration_delta}" ]]; then
            echo "Migration authority drift immediately before Hosted write:" >&2
            printf '%s\n' "${migration_delta}" >&2
            exit 1
          fi

          test "$(git rev-parse "${current_main}:${PF2_PATH}")" = "${PF2_BLOB}"
          test "$(git rev-parse HEAD)" = "${EXECUTION_SHA}"

          python3 - "${PF2_PATH}" "${PF2_BLOB}" "${PF2_SHA256}" <<'PY'
          import hashlib
          import pathlib
          import subprocess
          import sys

          path, blob_id, frozen_raw_sha = sys.argv[1:]
          worktree = pathlib.Path(path).read_bytes()
          blob = subprocess.check_output(["git", "cat-file", "blob", blob_id])

          def normalize_eol(value: bytes) -> bytes:
              return value.replace(b"\r\n", b"\n").replace(b"\r", b"\n")

          canonical = normalize_eol(blob)
          if normalize_eol(worktree) != canonical:
              raise SystemExit("PF-2 working tree lost EOL equivalence before Hosted write")

          lf_sha = hashlib.sha256(canonical).hexdigest()
          crlf_sha = hashlib.sha256(canonical.replace(b"\n", b"\r\n")).hexdigest()
          if frozen_raw_sha not in {lf_sha, crlf_sha}:
              raise SystemExit("PF-2 frozen raw SHA lost LF/CRLF equivalence before Hosted write")
          PY

      - name: Apply canonical PF-2 only
        if: ${{ inputs.mode == 'execute' }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$(mktemp)"
          cleanup() { rm -f "${raw}"; }
          trap cleanup EXIT

          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" db push \
            --linked \
            --password "${SUPABASE_DB_PASSWORD}" \
            >"${raw}" 2>&1; then
            sed -E \
              -e 's#(postgres(ql)?://[^:/[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' \
              -e 's#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' \
              "${raw}" >&2
            exit 1
          fi

          sed -E \
            -e 's#(postgres(ql)?://[^:/[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' \
            -e 's#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' \
            "${raw}"

      - name: Show migration history after execution
        if: ${{ inputs.mode == 'execute' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" migration list \
            --linked \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Confirm execution tree is fully applied
        if: ${{ inputs.mode == 'execute' }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$(mktemp)"
          cleanup() { rm -f "${raw}"; }
          trap cleanup EXIT

          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db push \
            --linked \
            --dry-run \
            --password "${SUPABASE_DB_PASSWORD}" \
            >"${raw}" 2>&1

          sed -E \
            -e 's#(postgres(ql)?://[^:/[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' \
            -e 's#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' \
            "${raw}"

          grep -q 'Remote database is up to date' "${raw}"
