name: V21-8K Exfoliation Load Calibration Wave 1

on:
  push:
    branches:
      - feat/v21-8k-exfoliation-load-calibration-wave-1
      - main
    paths:
      - '.github/workflows/v21-8k-exfoliation-load-calibration-wave-1.yml'
      - 'evidence/product-decision-axis-calibration-v1/**'
      - 'docs/evidence/exfoliation-load-offline-shadow-calibration-wave-1-v1.md'
      - 'scripts/product-evidence/exfoliation-load-calibration-wave-1-v1.mjs'
      - 'scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-8k-exfoliation-load-calibration-wave-1.yml'
      - 'evidence/product-decision-axis-calibration-v1/**'
      - 'docs/evidence/exfoliation-load-offline-shadow-calibration-wave-1-v1.md'
      - 'scripts/product-evidence/exfoliation-load-calibration-wave-1-v1.mjs'
      - 'scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      START_MAIN_SHA: c4d8c2273b21cd6453b123796222b62769736aeb
      INPUT: evidence/product-decision-axis-calibration-v1/exfoliation-load-calibration-wave-1-input-v1.json
      FEASIBILITY: evidence/product-decision-axis-calibration-v1/exfoliation-load-calibration-feasibility-v1.json
      RESULT: evidence/product-decision-axis-calibration-v1/exfoliation-load-calibration-wave-1-result-v1.json
      DOC: docs/evidence/exfoliation-load-offline-shadow-calibration-wave-1-v1.md

    steps:
      - name: Checkout exact V2.1-8K head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact head and execution authority
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$START_MAIN_SHA" HEAD
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            test "$PR_BASE_SHA" = "$START_MAIN_SHA"
            BASE="$PR_BASE_SHA"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            BASE="$START_MAIN_SHA"
          else
            BASE="$(git merge-base refs/remotes/origin/main HEAD)"
            test "$BASE" = "$START_MAIN_SHA"
          fi
          echo "DIFF_BASE_SHA=$BASE" >> "$GITHUB_ENV"
          printf 'start_main=%s\nbase=%s\nhead=%s\n' "$START_MAIN_SHA" "$BASE" "$(git rev-parse HEAD)" | tee /tmp/v21-8k-authority.txt

      - name: Upstream 8I and 8J authority hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum evidence/product-decision-axis-readiness-v1/product-decision-axis-input-snapshot-v1.json | awk '{print $1}')" = "fde7b6fd9902ff965424be43d3c5e5bc1845f5e0a2fa97d3860376859636f05b"
          test "$(sha256sum evidence/product-decision-axis-readiness-v1/product-decision-axis-input-coverage-audit-v1.json | awk '{print $1}')" = "589dafe9ab4db7849676aef69d26e5122b4c64aea7bd548a497e60b6a21d5057"
          test "$(sha256sum evidence/product-decision-axis-contract-v1/product-decision-axis-mapper-contract-v1.json | awk '{print $1}')" = "fcac5b422df3c3084eca20358e1a738796d159c8927a93e64e2f537371fe5cd2"
          test "$(sha256sum evidence/product-decision-axis-contract-v1/product-decision-axis-contract-replay-v1.json | awk '{print $1}')" = "fbd9b2102c64c68c6aa68f1e899523c8ca80575d13768dd504ff89926bbe25cd"
          node --input-type=module <<'NODE' | tee /tmp/v21-8k-upstream-authority.txt
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          function stable(value) {
            if (Array.isArray(value)) return value.map(stable);
            if (value && typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map((key)=>[key,stable(value[key])]));
            return value;
          }
          const contract=JSON.parse(fs.readFileSync('evidence/product-decision-axis-contract-v1/product-decision-axis-mapper-contract-v1.json','utf8'));
          const {contract_digest,contract_digest_semantics,...body}=contract;
          const digest=crypto.createHash('sha256').update(JSON.stringify(stable(body))).digest('hex');
          if (contract_digest !== 'ce137d8755f454ae10c46e5321c718f3adca9f2cbceafc221bc3d93600543386' || digest !== 'ce137d8755f454ae10c46e5321c718f3adca9f2cbceafc221bc3d93600543386') throw new Error('8J canonical body digest drift');
          console.log('v21_8i_v21_8j_authority=PASS contract_digest='+digest);
          NODE

      - name: Build A/B and focused V2.1-8K verifier
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/product-evidence/exfoliation-load-calibration-wave-1-v1.mjs
          node --check scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs
          for r in a b; do
            root="/tmp/v21-8k-$r"
            rm -rf "$root"
            V21_8K_OUTPUT_ROOT="$root" node scripts/product-evidence/exfoliation-load-calibration-wave-1-v1.mjs > "/tmp/v21-8k-build-$r.txt"
          done
          cmp -s "/tmp/v21-8k-a/$INPUT" "/tmp/v21-8k-b/$INPUT"
          cmp -s "/tmp/v21-8k-a/$FEASIBILITY" "/tmp/v21-8k-b/$FEASIBILITY"
          cmp -s "/tmp/v21-8k-a/$RESULT" "/tmp/v21-8k-b/$RESULT"
          cmp -s "/tmp/v21-8k-a/$DOC" "/tmp/v21-8k-b/$DOC"
          cmp -s "$INPUT" "/tmp/v21-8k-a/$INPUT"
          cmp -s "$FEASIBILITY" "/tmp/v21-8k-a/$FEASIBILITY"
          cmp -s "$RESULT" "/tmp/v21-8k-a/$RESULT"
          cmp -s "$DOC" "/tmp/v21-8k-a/$DOC"
          node scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs | tee /tmp/v21-8k-verifier.txt
          sha256sum "$INPUT" "$FEASIBILITY" "$RESULT" "$DOC" | tee /tmp/v21-8k-hashes.txt

      - name: V2.1-8I and V2.1-8J replay preservation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/product-evidence/verify-product-decision-axis-readiness-audit-v1.mjs | tee /tmp/v21-8k-v21-8i.txt
          node scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs | tee /tmp/v21-8k-v21-8j.txt

      - name: Historical mapper replay preservation
        shell: bash
        run: |
          set -euo pipefail
          run_hist(){
            d="$1"; commit="$2"; main="$3"; script="$4"
            rm -rf "/tmp/$d"
            git clone -q --no-hardlinks . "/tmp/$d"
            git -C "/tmp/$d" checkout -q "$commit"
            git -C "/tmp/$d" update-ref refs/remotes/origin/main "$main"
            (cd "/tmp/$d" && node "$script")
          }
          run_hist v21-5 4cb69354c3919f40c2b00acc070bcd0fb142f042 4dce99057ca44adb14dac549e8df6d468cf7f5e2 scripts/verify-product-decision-axis-cleanser-v1.mjs | tee /tmp/v21-8k-v21-5.txt
          run_hist v21-6 bd04f0924a74c8d36a935da8a4137dd3cf497117 45628d2c859ab0ba875b66f30b4c47c150ef3162 scripts/verify-product-decision-axis-cross-category-v1.mjs | tee /tmp/v21-8k-v21-6.txt

      - name: V2.1-7 shadow comparator and 164 x 12 production invariance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q 783afb91a964f5d762f46846f9ef854902b48e95
          V21_7_BASE_MAIN_SHA=e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87 RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-product-decision-axis-comparator-v1.mjs | tee /tmp/v21-8k-v21-7.txt
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-skin-decision-recommendation-invariance.mjs | tee /tmp/v21-8k-production.txt
          rm -rf _reference
          printf 'production_score_delta=0\nproduction_ranking_delta=0\nproduction_top1_delta=0\nproduction_top3_delta=0\nproduction_eligibility_delta=0\npublic_response_delta=0\npersistence_delta=0\ncandidate_policy_delta=0\nproduction_pda_consumption=NO\nrecommendation_activation=NO\n' | tee /tmp/v21-8k-production-invariance.txt

      - name: 8K-only scope and no mutation path
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$DIFF_BASE_SHA..HEAD" | sort)
          allowed='^(\.github/workflows/v21-8k-exfoliation-load-calibration-wave-1\.yml|docs/evidence/exfoliation-load-offline-shadow-calibration-wave-1-v1\.md|evidence/product-decision-axis-calibration-v1/exfoliation-load-calibration-wave-1-input-v1\.json|evidence/product-decision-axis-calibration-v1/exfoliation-load-calibration-feasibility-v1\.json|evidence/product-decision-axis-calibration-v1/exfoliation-load-calibration-wave-1-result-v1\.json|scripts/product-evidence/exfoliation-load-calibration-wave-1-v1\.mjs|scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1\.mjs)$'
          test "${#changed[@]}" -eq 7
          for file in "${changed[@]}"; do [[ "$file" =~ $allowed ]] || { echo "unexpected path: $file"; exit 1; }; done
          test -z "$(git diff --name-only "$DIFF_BASE_SHA..HEAD" -- app components lib supabase/migrations package.json package-lock.json)"
          git diff --check "$DIFF_BASE_SHA..HEAD"
          if grep -En 'admin_(register|ingest|prepare|preflight|confirm)_product_fact|INSERT[[:space:]]+INTO|UPDATE[[:space:]]+product_fact|DELETE[[:space:]]+FROM[[:space:]]+product_fact|CREATE[[:space:]]+TABLE|ALTER[[:space:]]+TABLE|supabase\.from\(' \
            scripts/product-evidence/exfoliation-load-calibration-wave-1-v1.mjs \
            scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs; then
            echo 'Hosted mutation or DDL path detected in V2.1-8K source files'
            exit 1
          fi
          if grep -R -n --include='*.js' --include='*.mjs' 'exfoliation-load-calibration-wave-1-v1' app lib components 2>/dev/null; then
            echo 'Production runtime imports V2.1-8K offline module'
            exit 1
          fi
          printf '%s\n' "${changed[@]}" | tee /tmp/v21-8k-changed.txt
          printf 'hosted_product_fact_writes=0\nexternal_product_evidence_research=0\nregistry_definition_delta=0\nmigration_delta=0\n' | tee /tmp/v21-8k-mutation-invariance.txt

      - name: Secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git diff -U0 "$DIFF_BASE_SHA..HEAD" | grep '^+' | grep -Ev '^\+\+\+' | grep -E 'sk-(proj-)?[A-Za-z0-9_-]{24,}|eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'; then
            echo 'Potential credential literal detected'
            exit 1
          fi

      - name: Upload V2.1-8K evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-8k-exfoliation-load-calibration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/v21-8k-*.txt
            evidence/product-decision-axis-calibration-v1/*.json
            docs/evidence/exfoliation-load-offline-shadow-calibration-wave-1-v1.md
          if-no-files-found: warn
          retention-days: 14
