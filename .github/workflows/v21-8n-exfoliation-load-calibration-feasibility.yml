name: V21-8N Exfoliation Load Calibration Feasibility
on:
  push:
    branches: [audit/v21-8n-exfoliation-load-calibration-feasibility, main]
    paths: ['.github/workflows/v21-8n-exfoliation-load-calibration-feasibility.yml','evidence/product-decision-axis-feasibility-v1/**','docs/evidence/exfoliation-load-calibration-feasibility-reassessment-v1.md','scripts/product-evidence/exfoliation-load-calibration-feasibility-reassessment-v1.mjs','scripts/product-evidence/verify-exfoliation-load-calibration-feasibility-reassessment-v1.mjs']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/v21-8n-exfoliation-load-calibration-feasibility.yml','evidence/product-decision-axis-feasibility-v1/**','docs/evidence/exfoliation-load-calibration-feasibility-reassessment-v1.md','scripts/product-evidence/exfoliation-load-calibration-feasibility-reassessment-v1.mjs','scripts/product-evidence/verify-exfoliation-load-calibration-feasibility-reassessment-v1.mjs']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env: {START_MAIN_SHA: a2536bac8def3b28dc71e02c0c09099c299633b1}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: '${{ github.event.pull_request.head.sha || github.sha }}'}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - name: Exact authority
        env: {PR_BASE_SHA: '${{ github.event.pull_request.base.sha }}'}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$START_MAIN_SHA" HEAD
          if [ "${{ github.event_name }}" = pull_request ]; then test "$PR_BASE_SHA" = "$START_MAIN_SHA"; fi
      - name: Frozen 8J-8M authority
        run: |
          set -euo pipefail
          test "$(sha256sum evidence/product-decision-axis-calibration-v1/exfoliation-load-calibration-wave-1-result-v1.json|awk '{print $1}')" = 6b79abb7b72292b16a4c6f8b1a5e420da24f2892dd4e09c7a9ca7ec22f58ffcc
          test "$(sha256sum evidence/product-decision-axis-anchor-contract-v1/exfoliation-load-numeric-anchor-evidence-contract-v1.json|awk '{print $1}')" = 07aa89c15039b77763a0e2bd411575279e5867468db7ed9ca1ac34b6f61740d8
          test "$(sha256sum evidence/product-decision-axis-anchor-research-v1/exfoliation-load-targeted-numeric-anchor-research-wave-1-v1.json|awk '{print $1}')" = f09b8f14b1f457bf2d5f1133a2c26119bf72ba120e2c5e2890a2ec5e4ffd4640
          node scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-anchor-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs
      - name: Deterministic 8N
        run: |
          set -euo pipefail
          node --check scripts/product-evidence/exfoliation-load-calibration-feasibility-reassessment-v1.mjs
          node --check scripts/product-evidence/verify-exfoliation-load-calibration-feasibility-reassessment-v1.mjs
          for x in a b; do rm -rf "/tmp/8n-$x"; V21_8N_OUTPUT_ROOT="/tmp/8n-$x" node scripts/product-evidence/exfoliation-load-calibration-feasibility-reassessment-v1.mjs > "/tmp/8n-$x.log"; done
          for f in evidence/product-decision-axis-feasibility-v1/*.json docs/evidence/exfoliation-load-calibration-feasibility-reassessment-v1.md; do cmp -s "/tmp/8n-a/$f" "/tmp/8n-b/$f"; cmp -s "$f" "/tmp/8n-a/$f"; done
          node scripts/product-evidence/verify-exfoliation-load-calibration-feasibility-reassessment-v1.mjs | tee /tmp/8n-verifier.log
          sha256sum evidence/product-decision-axis-feasibility-v1/*.json docs/evidence/exfoliation-load-calibration-feasibility-reassessment-v1.md | tee /tmp/8n-hashes.log
      - name: 164 x 12 production invariance
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q 783afb91a964f5d762f46846f9ef854902b48e95
          V21_7_BASE_MAIN_SHA=e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87 RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-product-decision-axis-comparator-v1.mjs
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-skin-decision-recommendation-invariance.mjs | tee /tmp/8n-production.log
          rm -rf _reference
      - name: Additive scope and zero mutation/research
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$START_MAIN_SHA..HEAD"|sort)
          test "${#changed[@]}" -eq 8
          test -z "$(git diff --name-only "$START_MAIN_SHA..HEAD" -- app components lib supabase/migrations package.json package-lock.json)"
          git diff --check "$START_MAIN_SHA..HEAD"
          if grep -En 'supabase\.from\(|INSERT[[:space:]]+INTO|UPDATE[[:space:]]+product_fact|CREATE[[:space:]]+TABLE|ALTER[[:space:]]+TABLE|node:https|node:http|fetch\(|axios|curl|wget' scripts/product-evidence/exfoliation-load-calibration-feasibility-reassessment-v1.mjs scripts/product-evidence/verify-exfoliation-load-calibration-feasibility-reassessment-v1.mjs; then exit 1; fi
          grep -q '"primary_terminal_outcome":"NON_NUMERIC_DECISION_REPRESENTATION_RECOMMENDED"' evidence/product-decision-axis-feasibility-v1/exfoliation-load-calibration-feasibility-reassessment-v1.json
