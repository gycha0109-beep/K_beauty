name: PR50 Whitespace Fix

on:
  push:
    branches:
      - design/unified-vision-observation-pipeline

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Vision branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: design/unified-vision-observation-pipeline

      - name: Remove trailing whitespace from affected document
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          target="docs/domain/facelab/unified-vision-observation-pipeline-design-20260719.md"
          perl -pi -e 's/[ \t]+$//' "${target}"
          git diff --check
          if git diff --quiet; then
            echo "no_whitespace_changes"
            exit 0
          fi
          git add "${target}"
          git commit -m "docs(vision): remove trailing whitespace"
          git push origin HEAD:design/unified-vision-observation-pipeline
