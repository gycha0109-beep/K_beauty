name: BEJEWELY AI Provider Runtime
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.watchtower_track != '' && format('[WT:{0}] {1}', inputs.watchtower_track, github.workflow) || github.workflow }}

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/analyze/**"
      - "app/api/face-reading/**"
      - "lib/server/openai-chat-runtime.js"
      - "lib/server/vision-observation-service.js"
      - "lib/vision-observation-contract.js"
      - "lib/vision-observation-normalizer.js"
      - "lib/provider-runtime-log.js"
      - "lib/security/error-redaction.js"
      - "scripts/verify-ai-provider-runtime-boundary.mjs"
      - "scripts/run-ai-provider-live-smoke.mjs"
      - "scripts/verify-unified-vision-pipeline.mjs"
      - "scripts/verify-provider-runtime-log-sanitization.mjs"
      - ".github/workflows/ai-provider-runtime.yml"
      - "docs/ci/workflow-responsibility-map.json"
      - "docs/ci/workflow-responsibility-map.md"
  push:
    branches: [main]
    paths:
      - "app/api/analyze/**"
      - "app/api/face-reading/**"
      - "lib/server/openai-chat-runtime.js"
      - "lib/server/vision-observation-service.js"
      - "lib/vision-observation-contract.js"
      - "lib/vision-observation-normalizer.js"
      - "lib/provider-runtime-log.js"
      - "lib/security/error-redaction.js"
      - "scripts/verify-ai-provider-runtime-boundary.mjs"
      - "scripts/run-ai-provider-live-smoke.mjs"
      - "scripts/verify-unified-vision-pipeline.mjs"
      - "scripts/verify-provider-runtime-log-sanitization.mjs"
      - ".github/workflows/ai-provider-runtime.yml"
      - "docs/ci/workflow-responsibility-map.json"
      - "docs/ci/workflow-responsibility-map.md"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string
      run_live_provider:
        description: Run the explicit non-persistent OpenAI smoke using the repository OPENAI_API_KEY secret
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  provider-runtime-contract:
    name: AI provider runtime boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify shared provider runtime boundary
        run: node scripts/verify-ai-provider-runtime-boundary.mjs

      - name: Verify unified Vision ownership
        run: node scripts/verify-unified-vision-pipeline.mjs

      - name: Verify provider log sanitization
        run: node scripts/verify-provider-runtime-log-sanitization.mjs

      - name: Check exact-head diff hygiene
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ && ! "${BASE_SHA}" =~ ^0+$ ]]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          else
            git diff --check HEAD^
          fi

  live-provider-smoke:
    name: Explicit live OpenAI smoke
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_provider
    needs: provider-runtime-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run fixed non-persistent live provider smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/run-ai-provider-live-smoke.mjs
