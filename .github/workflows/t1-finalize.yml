name: T1 Finalize And Self Review

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/t1-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/T1-synthetic-toolkit-workspace-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify workspace inventory
        run: npm ls --workspaces --depth=0

      - name: Run toolkit tests
        run: npm run synthetic:test

      - name: Run toolkit verifier
        run: npm run synthetic:verify

      - name: Run architecture guard
        run: npm run architecture:guard

      - name: Build production application
        run: npm run build

      - name: Append T1 work log and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cat >> .codex/AI_WORK_LOG.md <<'LOG'

          ### 2026-08-02 / Toolkit Track #T1 Workspace Foundation

          - Task type: Medium bounded execution. Production/build compatibility was checked; DB, Auth, RLS, Storage, Provider, Payment, Secret, API, UI, and Production execution were out of scope.
          - Base and branch: current `main` at task start → `feature/T1-synthetic-toolkit-workspace-foundation`. The stale `codex/survey-input-contract-refactor` prompt base was rejected because it had diverged substantially from current `main`.
          - Change: registered `packages/*` and `tools/*` npm workspaces; added contract-only `@bejewely/face-contracts`; added non-production `@bejewely/synthetic-evaluation`; added Node ESM workspace-resolution smoke tests; ignored `.synthetic-local/`.
          - Dependency direction: production code does not import or depend on `@bejewely/synthetic-evaluation`; the toolkit depends only on the local contract package. External dependencies added: 0.
          - Verification: npm lockfile synchronization produced workspace-only entries; `npm ci --ignore-scripts`, workspace inventory, `synthetic:test`, `synthetic:verify`, `architecture:guard`, and production `build` passed in GitHub Actions on Node 20.
          - Boundaries: no synthetic images or evaluation data, Provider call, DB/migration, API route, UI, runtime scoring, GenerationSpec, prompt compiler, import, observation, judgment, or promotion implementation was added.
          - Remaining risk: T1 proves package/install/build isolation only. Domain contracts and generation behavior remain intentionally absent until Toolkit Track #T2.
          - Follow-up: Toolkit Track #T2 — Generation Contract & Prompt Compiler.
          LOG
          rm .github/workflows/t1-finalize.yml

      - name: Verify final allowed-path boundary and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          unexpected=0
          while IFS= read -r path; do
            case "$path" in
              package.json|package-lock.json|.gitignore|.codex/AI_WORK_LOG.md|packages/face-contracts/*|tools/synthetic-evaluation/*)
                ;;
              *)
                echo "unexpected final path: $path" >&2
                unexpected=1
                ;;
            esac
          done < <(git diff --name-only origin/main)
          test "$unexpected" -eq 0
          git diff --check origin/main

      - name: Commit final work log and workflow removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .codex/AI_WORK_LOG.md .github/workflows/t1-finalize.yml
          git commit -m "docs(toolkit): [T1] record verified workspace foundation"
          git push origin HEAD:feature/T1-synthetic-toolkit-workspace-foundation
