name: T1 Lockfile Metadata Review

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/t1-lockfile-metadata-review.yml

permissions:
  contents: write

jobs:
  review-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/T1-synthetic-toolkit-workspace-foundation
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Synchronize lockfile with current development runtime
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Assert bounded lockfile metadata delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const base = JSON.parse(execFileSync("git", ["show", "origin/main:package-lock.json"], { encoding: "utf8" }));
          const current = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));

          assert.deepEqual(current.packages[""].workspaces, ["packages/*", "tools/*"]);

          for (const [key, value] of Object.entries(base.packages)) {
            if (key === "") {
              const { workspaces: _ignored, ...currentRoot } = current.packages[""];
              assert.deepEqual(currentRoot, value, "root lock metadata changed outside workspaces");
              continue;
            }

            if (key === "node_modules/postcss") {
              const { dev: _baseDev, ...basePostcss } = value;
              assert.equal(_baseDev, true);
              assert.deepEqual(current.packages[key], basePostcss, "unexpected postcss metadata change");
              continue;
            }

            assert.deepEqual(current.packages[key], value, `existing lock package changed: ${key}`);
          }

          assert.deepEqual(current.packages["node_modules/@bejewely/face-contracts"], {
            resolved: "packages/face-contracts",
            link: true
          });
          assert.deepEqual(current.packages["node_modules/@bejewely/synthetic-evaluation"], {
            resolved: "tools/synthetic-evaluation",
            link: true
          });
          assert.deepEqual(current.packages["packages/face-contracts"], {
            name: "@bejewely/face-contracts",
            version: "0.0.0"
          });
          assert.deepEqual(current.packages["tools/synthetic-evaluation"], {
            name: "@bejewely/synthetic-evaluation",
            version: "0.0.0",
            dependencies: { "@bejewely/face-contracts": "0.0.0" }
          });
          NODE

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify workspace and production boundaries
        run: |
          npm ls --workspaces --depth=0
          npm run synthetic:test
          npm run synthetic:verify
          npm run architecture:guard
          npm run build

      - name: Correct work log verification note and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('.codex/AI_WORK_LOG.md')
          text = path.read_text(encoding='utf-8')
          old = '- Verification: npm lockfile synchronization produced workspace-only entries; `npm ci --ignore-scripts`, workspace inventory, `synthetic:test`, `synthetic:verify`, `architecture:guard`, and production `build` passed in GitHub Actions on Node 20.'
          new = '- Verification: Node 20 first proved install, workspace inventory, toolkit tests, architecture guard, and production build. Node 24 then regenerated and structurally compared the lockfile: all existing package versions, resolved URLs, integrity hashes, and package entries remained unchanged except npm removed the pre-existing `dev: true` classification from `node_modules/postcss`; root workspace metadata and four local workspace/link entries were added. The same install, toolkit, architecture, and build checks passed on Node 24.'
          if old not in text:
            raise SystemExit('expected T1 verification line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/t1-lockfile-metadata-review.yml

      - name: Verify final diff boundary
        shell: bash
        run: |
          set -euo pipefail
          unexpected=0
          while IFS= read -r path; do
            case "$path" in
              package.json|package-lock.json|.gitignore|.codex/AI_WORK_LOG.md|packages/face-contracts/*|tools/synthetic-evaluation/*)
                ;;
              *)
                echo "unexpected final path: $path" >&2
                unexpected=1
                ;;
            esac
          done < <(git diff --name-only origin/main)
          test "$unexpected" -eq 0
          git diff --check origin/main

      - name: Commit reviewed lockfile and work log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .codex/AI_WORK_LOG.md .github/workflows/t1-lockfile-metadata-review.yml
          git commit -m "fix(toolkit): [T1] review workspace lockfile metadata"
          git push origin HEAD:feature/T1-synthetic-toolkit-workspace-foundation
