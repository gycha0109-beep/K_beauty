name: V21-8J Product Decision Axis Mapper Contract

on:
  push:
    branches:
      - feat/v21-8j-product-decision-axis-contract
      - main
    paths:
      - '.github/workflows/v21-8j-product-decision-axis-contract.yml'
      - 'evidence/product-decision-axis-contract-v1/**'
      - 'docs/evidence/product-decision-axis-mapper-contract-v1.md'
      - 'scripts/product-evidence/product-decision-axis-mapper-contract-v1.mjs'
      - 'scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-8j-product-decision-axis-contract.yml'
      - 'evidence/product-decision-axis-contract-v1/**'
      - 'docs/evidence/product-decision-axis-mapper-contract-v1.md'
      - 'scripts/product-evidence/product-decision-axis-mapper-contract-v1.mjs'
      - 'scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      START_MAIN_SHA: 6f573b632824be13dfe208f29c796aa3306b4984
      SNAPSHOT: evidence/product-decision-axis-readiness-v1/product-decision-axis-input-snapshot-v1.json
      CONTRACT: evidence/product-decision-axis-contract-v1/product-decision-axis-mapper-contract-v1.json
      REPLAY: evidence/product-decision-axis-contract-v1/product-decision-axis-contract-replay-v1.json
      DOC: docs/evidence/product-decision-axis-mapper-contract-v1.md

    steps:
      - name: Checkout exact V2.1-8J head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact head and authority ancestry
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$START_MAIN_SHA" HEAD
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            test "$PR_BASE_SHA" = "$START_MAIN_SHA"
            BASE="$PR_BASE_SHA"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            BASE="$START_MAIN_SHA"
          else
            BASE="$(git merge-base refs/remotes/origin/main HEAD)"
            test "$BASE" = "$START_MAIN_SHA"
          fi
          printf 'start_main=%s\nbase=%s\nhead=%s\n' "$START_MAIN_SHA" "$BASE" "$(git rev-parse HEAD)" | tee /tmp/v21-8j-authority.txt

      - name: Contract build, verifier, and Build A/B determinism
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/product-evidence/product-decision-axis-mapper-contract-v1.mjs
          node --check scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs
          node scripts/product-evidence/product-decision-axis-mapper-contract-v1.mjs | tee /tmp/v21-8j-build.txt
          node scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs | tee /tmp/v21-8j-verifier.txt
          for r in a b; do
            root="/tmp/v21-8j-$r"
            rm -rf "$root"
            V21_8J_OUTPUT_ROOT="$root" node scripts/product-evidence/product-decision-axis-mapper-contract-v1.mjs > "/tmp/v21-8j-build-$r.txt"
          done
          cmp -s "/tmp/v21-8j-a/$CONTRACT" "/tmp/v21-8j-b/$CONTRACT"
          cmp -s "/tmp/v21-8j-a/$REPLAY" "/tmp/v21-8j-b/$REPLAY"
          cmp -s "/tmp/v21-8j-a/$DOC" "/tmp/v21-8j-b/$DOC"
          cmp -s "$CONTRACT" "/tmp/v21-8j-a/$CONTRACT"
          cmp -s "$REPLAY" "/tmp/v21-8j-a/$REPLAY"
          cmp -s "$DOC" "/tmp/v21-8j-a/$DOC"
          sha256sum "$SNAPSHOT" "$CONTRACT" "$REPLAY" "$DOC" | tee /tmp/v21-8j-hashes.txt

      - name: V2.1-8I authority replay and historical mapper replay
        shell: bash
        run: |
          set -euo pipefail
          node scripts/product-evidence/verify-product-decision-axis-readiness-audit-v1.mjs | tee /tmp/v21-8j-v21-8i.txt
          run_hist(){
            d="$1"; commit="$2"; main="$3"; script="$4"
            rm -rf "/tmp/$d"
            git clone -q --no-hardlinks . "/tmp/$d"
            git -C "/tmp/$d" checkout -q "$commit"
            git -C "/tmp/$d" update-ref refs/remotes/origin/main "$main"
            (cd "/tmp/$d" && node "$script")
          }
          run_hist v21-5 4cb69354c3919f40c2b00acc070bcd0fb142f042 4dce99057ca44adb14dac549e8df6d468cf7f5e2 scripts/verify-product-decision-axis-cleanser-v1.mjs | tee /tmp/v21-8j-cleanser-v1.txt
          run_hist v21-6 bd04f0924a74c8d36a935da8a4137dd3cf497117 45628d2c859ab0ba875b66f30b4c47c150ef3162 scripts/verify-product-decision-axis-cross-category-v1.mjs | tee /tmp/v21-8j-cross-category-v1.txt
          node scripts/verify-product-fact-catalog-hosted-adoption-wave-1-v1.mjs | tee /tmp/v21-8j-v21-8h.txt

      - name: V2.1-7 shadow and 164 x 12 production invariance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q 783afb91a964f5d762f46846f9ef854902b48e95
          V21_7_BASE_MAIN_SHA=e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87 RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-product-decision-axis-comparator-v1.mjs | tee /tmp/v21-8j-v21-7.txt
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-skin-decision-recommendation-invariance.mjs | tee /tmp/v21-8j-production.txt
          rm -rf _reference

      - name: Contract-only scope and mutation-path hygiene
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="$PR_BASE_SHA"; elif [ "${{ github.ref_name }}" = "main" ]; then BASE="$START_MAIN_SHA"; else BASE="$(git merge-base refs/remotes/origin/main HEAD)"; fi
          mapfile -t changed < <(git diff --name-only "$BASE..HEAD" | sort)
          allowed='^(\.github/workflows/v21-8j-product-decision-axis-contract\.yml|docs/evidence/product-decision-axis-mapper-contract-v1\.md|evidence/product-decision-axis-contract-v1/product-decision-axis-mapper-contract-v1\.json|evidence/product-decision-axis-contract-v1/product-decision-axis-contract-replay-v1\.json|scripts/product-evidence/product-decision-axis-mapper-contract-v1\.mjs|scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1\.mjs)$'
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "feat/v21-8j-product-decision-axis-contract" ]; then
            test "${#changed[@]}" -eq 3 -o "${#changed[@]}" -eq 6
          else
            test "${#changed[@]}" -eq 6
          fi
          for file in "${changed[@]}"; do [[ "$file" =~ $allowed ]] || { echo "unexpected path: $file"; exit 1; }; done
          test -z "$(git diff --name-only "$BASE..HEAD" -- app components lib supabase/migrations package.json package-lock.json)"
          git diff --check "$BASE..HEAD"
          if grep -En 'admin_(register|ingest|prepare|preflight|confirm)_product_fact|INSERT[[:space:]]+INTO|UPDATE[[:space:]]+product_fact|DELETE[[:space:]]+FROM[[:space:]]+product_fact|CREATE[[:space:]]+TABLE|ALTER[[:space:]]+TABLE' \
            scripts/product-evidence/product-decision-axis-mapper-contract-v1.mjs \
            scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs; then
            echo 'Hosted mutation or DDL path detected in V2.1-8J source files'
            exit 1
          fi
          if git diff -U0 "$BASE..HEAD" | grep '^+' | grep -Ev '^\+\+\+' | grep -E 'sk-(proj-)?[A-Za-z0-9_-]{24,}|eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'; then
            echo 'Potential credential literal detected'
            exit 1
          fi
          printf '%s\n' "${changed[@]}" | tee /tmp/v21-8j-changed.txt

      - name: Freeze canonical V2.1-8J contract outputs
        if: github.event_name == 'push' && github.ref_name == 'feat/v21-8j-product-decision-axis-contract'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CONTRACT" "$REPLAY" "$DOC"
          if ! git diff --cached --quiet; then
            git commit -m 'feat(v21-8j): freeze mapper contract artifacts'
            git push origin HEAD:feat/v21-8j-product-decision-axis-contract
          fi

      - name: Upload V2.1-8J evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-8j-product-decision-axis-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/v21-8j-*.txt
            evidence/product-decision-axis-contract-v1/product-decision-axis-mapper-contract-v1.json
            evidence/product-decision-axis-contract-v1/product-decision-axis-contract-replay-v1.json
            docs/evidence/product-decision-axis-mapper-contract-v1.md
          if-no-files-found: warn
          retention-days: 14
