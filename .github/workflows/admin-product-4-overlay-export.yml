name: ADMIN PRODUCT 4 Recovery Source Export

on:
  pull_request:
    branches:
      - feature/admin-product-review-import-confirm

permissions:
  contents: read

jobs:
  export-recovery-source:
    if: github.head_ref == 'automation/admin-product-4-implement'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout helper head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Collect recovery source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/admin-product-4-recovery-source"
          mkdir -p "$out"
          cp .github/workflows/admin-product-4-precommit-publish.yml "$out/"

      - name: Upload recovery source
        uses: actions/upload-artifact@v4
        with:
          name: admin-product-4-recovery-source
          path: ${{ runner.temp }}/admin-product-4-recovery-source
          if-no-files-found: error
          retention-days: 1
