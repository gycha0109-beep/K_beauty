name: ADMIN PRODUCT 4 Hidden Source Export

on:
  pull_request:
    branches:
      - feature/admin-product-review-import-confirm

permissions:
  contents: read

jobs:
  export-hidden-source:
    if: github.head_ref == 'automation/admin-product-4-implement'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative base
        uses: actions/checkout@v4
        with:
          ref: feature/admin-product-review-import-confirm
          fetch-depth: 1

      - name: Collect hidden source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/admin-product-4-hidden-source"
          mkdir -p "$out"
          cp -a .github "$out/.github"
          cp -a .codex "$out/.codex"

      - name: Upload hidden source
        uses: actions/upload-artifact@v4
        with:
          name: admin-product-4-hidden-source
          path: ${{ runner.temp }}/admin-product-4-hidden-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
