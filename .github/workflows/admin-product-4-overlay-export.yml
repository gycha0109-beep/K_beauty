name: ADMIN PRODUCT 4 Base Source Export

on:
  pull_request:
    branches:
      - feature/admin-product-review-import-confirm

permissions:
  contents: read

jobs:
  export-base-source:
    if: github.head_ref == 'automation/admin-product-4-implement'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative base
        uses: actions/checkout@v4
        with:
          ref: feature/admin-product-review-import-confirm
          fetch-depth: 1

      - name: Assert authoritative base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e174f80f79fa9ce5d62c742f440c9e18e602929a"
          test -z "$(git status --short)"

      - name: Collect base source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/admin-product-4-base-source"
          mkdir -p "$out"
          git archive --format=tar HEAD | tar -xf - -C "$out"

      - name: Upload base source
        uses: actions/upload-artifact@v4
        with:
          name: admin-product-4-base-source
          path: ${{ runner.temp }}/admin-product-4-base-source
          if-no-files-found: error
          retention-days: 1
