name: ADMIN PRODUCT 4 Overlay Export

on:
  pull_request:
    branches:
      - feature/admin-product-review-import-confirm

permissions:
  contents: read

jobs:
  export-overlay:
    if: github.head_ref == 'automation/admin-product-4-implement'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout helper head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Export raw implementation overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admin-product-4-export"
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/admin-product-4-precommit-publish.yml').read_text(encoding='utf-8')
          encoded_line = next(line.strip() for line in workflow.splitlines() if line.strip().startswith('H4sI'))
          output = Path('/tmp/admin-product-4-overlay.b64')
          output.write_text(encoded_line, encoding='ascii')
          print(f'overlay characters: {len(encoded_line)}')
          print(f'padding markers: {encoded_line.count("=")}')
          PY
          cp /tmp/admin-product-4-overlay.b64 "$RUNNER_TEMP/admin-product-4-export/overlay.b64"

      - name: Upload raw implementation overlay
        uses: actions/upload-artifact@v4
        with:
          name: admin-product-4-raw-overlay
          path: ${{ runner.temp }}/admin-product-4-export/overlay.b64
          if-no-files-found: error
          retention-days: 1
