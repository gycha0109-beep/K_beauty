name: ADMIN PRODUCT 4 Overlay Export

on:
  pull_request:
    branches:
      - feature/admin-product-review-import-confirm

permissions:
  contents: read

jobs:
  export-overlay:
    if: github.head_ref == 'automation/admin-product-4-implement'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout helper head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Extract implementation overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/admin-product-4-export"
          python - <<'PY'
          import base64
          import io
          import re
          import tarfile
          from pathlib import Path

          workflow = Path('.github/workflows/admin-product-4-precommit-publish.yml').read_text(encoding='utf-8')
          encoded_line = next(line.strip() for line in workflow.splitlines() if line.strip().startswith('H4sI'))
          chunks = re.findall(r'H4sI[A-Za-z0-9+/]+={1,2}', encoded_line)
          if not chunks:
              raise RuntimeError('implementation overlay chunks not found')
          destination = Path('/tmp/admin-product-4-export')
          destination.mkdir(parents=True, exist_ok=True)
          for index, encoded in enumerate(chunks, start=1):
              payload = base64.b64decode(encoded, validate=True)
              with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
                  archive.extractall(destination)
              print(f'extracted overlay chunk {index}/{len(chunks)}')
          PY
          cp -a /tmp/admin-product-4-export/. "$RUNNER_TEMP/admin-product-4-export/"
          find "$RUNNER_TEMP/admin-product-4-export" -type f -print | sort

      - name: Upload implementation overlay
        uses: actions/upload-artifact@v4
        with:
          name: admin-product-4-implementation-overlay
          path: ${{ runner.temp }}/admin-product-4-export
          if-no-files-found: error
          retention-days: 1
