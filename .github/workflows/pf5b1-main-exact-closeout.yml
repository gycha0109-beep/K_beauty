name: PF5B1 Main Exact-SHA Static Closeout

on:
  push:
    branches:
      - verify/pf5b1-main-exact-closeout

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ab3da7b1cd3fb1bbaeec5f38f16b1518b45cd73b
          fetch-depth: 0
          persist-credentials: false

      - name: Verify repository prerequisite and exact target
        shell: bash
        run: |
          set -euo pipefail
          TARGET=ab3da7b1cd3fb1bbaeec5f38f16b1518b45cd73b
          test "$(git rev-parse --is-inside-work-tree)" = "true"
          test -d "$(git rev-parse --git-dir)"
          test "$(git rev-parse HEAD)" = "$TARGET"
          git cat-file -e "$TARGET^{commit}"
          ORIGIN="$(git remote get-url origin)"
          printf 'inside_work_tree=%s\norigin=%s\ngit_dir=%s\nhead=%s\n' \
            "$(git rev-parse --is-inside-work-tree)" "$ORIGIN" "$(git rev-parse --git-dir)" "$(git rev-parse HEAD)" \
            | tee "$RUNNER_TEMP/repository-prerequisite.txt"
          printf '%s\n' "$TARGET" | tee "$RUNNER_TEMP/target-sha.txt"

      - name: Verify exact blobs
        shell: bash
        run: |
          set -euo pipefail
          TARGET=ab3da7b1cd3fb1bbaeec5f38f16b1518b45cd73b
          : > "$RUNNER_TEMP/blob-verification.txt"
          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git rev-parse "$TARGET:$path")"
            printf '%s=%s\n' "$path" "$actual" | tee -a "$RUNNER_TEMP/blob-verification.txt"
            test "$actual" = "$expected"
          }
          check_blob scripts/verify-product-fact-controlled-write-v1.mjs 5a80a16b9d9a2b221ccffad0b385edd012b92cf2
          check_blob scripts/verify-product-fact-subject-registration-v1.mjs cf470e9d0150ededef012fbbbb2d936e689447ae
          check_blob supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql 03523a01322170e6b0fca2ff4cc77b8be581f19e
          check_blob supabase/migrations/20260810174410_product_fact_subject_registration_v1.sql a08651d4ea5825e33f2dc94fe98c5b7643d32532
          check_blob supabase/migrations/20260809115932_product_fact_storage_v1.sql 676afbc56bf90443a1198f93427382f067d19407
          check_blob docs/architecture/candidate-policy-main-integration-blob-manifest-v1.json 37d60570f5a79cbc0baad114cfc1f7b4ca9e7440

      - name: Run controlled-write static verifier
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-product-fact-controlled-write-v1.mjs | tee "$RUNNER_TEMP/controlled-write-static.json"
          node - "$RUNNER_TEMP/controlled-write-static.json" <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (j.status !== 'PASS') throw new Error(`status=${j.status}`);
          if (j.assertions !== 117) throw new Error(`assertions=${j.assertions}`);
          if (j.negative_mutation_cases !== 12) throw new Error(`negative_mutation_cases=${j.negative_mutation_cases}`);
          if (j.static_verification_scope !== 'TEXTUAL_CONTRACT_ONLY') throw new Error(`static_verification_scope=${j.static_verification_scope}`);
          if (j.postgres_compile_verification !== 'NOT_PERFORMED_BY_STATIC_VERIFIER') throw new Error(`postgres_compile_verification=${j.postgres_compile_verification}`);
          if (j.runtime_database_replay !== 'NOT_PERFORMED_BY_STATIC_VERIFIER') throw new Error(`runtime_database_replay=${j.runtime_database_replay}`);
          NODE

      - name: Run subject-registration static verifier
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-product-fact-subject-registration-v1.mjs | tee "$RUNNER_TEMP/subject-registration-static.json"
          node - "$RUNNER_TEMP/subject-registration-static.json" <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (j.status !== 'PASS') throw new Error(`status=${j.status}`);
          if (j.assertions !== 38) throw new Error(`assertions=${j.assertions}`);
          if (j.negative_mutation_cases !== 7) throw new Error(`negative_mutation_cases=${j.negative_mutation_cases}`);
          if (j.runtime_database_replay !== 'NOT_PERFORMED_BY_STATIC_VERIFIER') throw new Error(`runtime_database_replay=${j.runtime_database_replay}`);
          NODE

      - name: Write machine-readable closeout evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pf5b1-main-exact-static-closeout.json" <<'JSON'
          {
            "phase": "PF5B1_MAIN_EXACT_SHA_STATIC_CLOSEOUT",
            "target_sha": "ab3da7b1cd3fb1bbaeec5f38f16b1518b45cd73b",
            "controlled_write": {
              "status": "PASS",
              "assertions": 117,
              "negative_mutation_cases": 12
            },
            "subject_registration": {
              "status": "PASS",
              "assertions": 38,
              "negative_mutation_cases": 7
            }
          }
          JSON

      - name: Post-run repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          TARGET=ab3da7b1cd3fb1bbaeec5f38f16b1518b45cd73b
          STATUS="$(git status --short)"
          printf '%s' "$STATUS" | tee "$RUNNER_TEMP/git-status-short.txt"
          test -z "$STATUS"
          test "$(git rev-parse HEAD)" = "$TARGET"
          git rev-parse HEAD | tee "$RUNNER_TEMP/post-run-head.txt"

      - name: Upload exact-main static evidence
        uses: actions/upload-artifact@v4
        with:
          name: pf5b1-main-exact-static-evidence
          path: |
            ${{ runner.temp }}/repository-prerequisite.txt
            ${{ runner.temp }}/target-sha.txt
            ${{ runner.temp }}/blob-verification.txt
            ${{ runner.temp }}/controlled-write-static.json
            ${{ runner.temp }}/subject-registration-static.json
            ${{ runner.temp }}/pf5b1-main-exact-static-closeout.json
            ${{ runner.temp }}/git-status-short.txt
            ${{ runner.temp }}/post-run-head.txt
          if-no-files-found: error
          retention-days: 90
