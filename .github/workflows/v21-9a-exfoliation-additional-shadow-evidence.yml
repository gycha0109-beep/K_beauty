name: V2.1-9A Exfoliation Additional Shadow Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-9a-exfoliation-additional-shadow-evidence.yml'
      - 'docs/evidence/exfoliation-non-numeric-pda-additional-shadow-evidence-v1.md'
      - 'scripts/product-evidence/build-exfoliation-non-numeric-pda-additional-shadow-evidence-v1.mjs'
      - 'scripts/product-evidence/verify-exfoliation-non-numeric-pda-additional-shadow-evidence-v1.mjs'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-additional-shadow-*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-9a-exfoliation-additional-shadow-evidence.yml'
      - 'docs/evidence/exfoliation-non-numeric-pda-additional-shadow-evidence-v1.md'
      - 'scripts/product-evidence/build-exfoliation-non-numeric-pda-additional-shadow-evidence-v1.mjs'
      - 'scripts/product-evidence/verify-exfoliation-non-numeric-pda-additional-shadow-evidence-v1.mjs'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-additional-shadow-*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v21-9a:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      V21_9A_BASE_MAIN_SHA: 57211ec9c2c99ea02da74c4f8d2c707ca89aa597
      FROZEN_8Z_MAIN_SHA: 57211ec9c2c99ea02da74c4f8d2c707ca89aa597
      FROZEN_8Y_MAIN_SHA: 5ce7195670eab6f2e9a2aff7810d4f48c9b6f688
      FROZEN_8X_MAIN_SHA: 7dd6f3566ca3a680627eb64430ca8d34178b53bd
      FROZEN_8W_MAIN_SHA: fc5da448cc97572547e14c4a796b57773aa0b8d0
      FROZEN_8V_MAIN_SHA: d85ed057cb01923d3f3beef18b08e820fb7d7e22
      FROZEN_8U_MAIN_SHA: a34b5d67dd233629c01568114fea6ebb312fd130
      FROZEN_8T_MAIN_SHA: d988f33664e3086250e2595b55319aa18e127608
      FROZEN_8S_MAIN_SHA: c3a844ff3aec6a89456aeba9e86a3479239f2974
      FROZEN_8R_MAIN_SHA: 053a963a14bf00d7deb731a2c5427a97f3172b9f
      FROZEN_8Q_MAIN_SHA: e812ee6a7eae6b98940adfe7b10471687e5cad1a
      FROZEN_8X_CONTRACT_BLOB_SHA: 5eed23e9b85e4997087663d792a82ecca34d8ad0
      FROZEN_8Y_RUNTIME_BLOB_SHA: 827f3b69f4ad288ea1f791893d8c9fb921fa0226
      FROZEN_8Z_READINESS_BLOB_SHA: 1f67f548fd0f4781296390ab0ee34e890f069efb
      V21_9A_REQUIRE_CHECKED_IN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Exact authority and frozen 8X 8Y 8Z bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$V21_9A_BASE_MAIN_SHA" HEAD
          test "$(git hash-object evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1.json)" = "$FROZEN_8X_CONTRACT_BLOB_SHA"
          test "$(git hash-object lib/exfoliation-non-numeric-pda-normative-production-policy-shadow.js)" = "$FROZEN_8Y_RUNTIME_BLOB_SHA"
          test "$(git hash-object evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-activation-readiness-contract-v1.json)" = "$FROZEN_8Z_READINESS_BLOB_SHA"
      - name: Prepare frozen 164 x 12 recommendation reference
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q 783afb91a964f5d762f46846f9ef854902b48e95
      - name: Generate deterministic Build A B
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/product-evidence/build-exfoliation-non-numeric-pda-additional-shadow-evidence-v1.mjs
          node --check scripts/product-evidence/verify-exfoliation-non-numeric-pda-additional-shadow-evidence-v1.mjs
          rm -rf /tmp/v21-9a-a /tmp/v21-9a-b
          mkdir -p /tmp/v21-9a-a /tmp/v21-9a-b
          for mode in summary corpus distribution actions divergence impact gaps rows; do
            RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/product-evidence/build-exfoliation-non-numeric-pda-additional-shadow-evidence-v1.mjs "$mode" > "/tmp/v21-9a-a/$mode.json"
            RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/product-evidence/build-exfoliation-non-numeric-pda-additional-shadow-evidence-v1.mjs "$mode" > "/tmp/v21-9a-b/$mode.json"
            cmp "/tmp/v21-9a-a/$mode.json" "/tmp/v21-9a-b/$mode.json"
          done
          sha256sum /tmp/v21-9a-a/*.json
      - name: Upload generated 9A evidence
        uses: actions/upload-artifact@v4
        with:
          name: v21-9a-generated-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/v21-9a-a/*.json
          retention-days: 3
      - name: Focused V2.1-9A verifier and checked-in byte equality
        shell: bash
        run: |
          set -euo pipefail
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/product-evidence/verify-exfoliation-non-numeric-pda-additional-shadow-evidence-v1.mjs | tee /tmp/v21-9a-verifier.json
      - name: Historical V2.1-8J through V2.1-8P replay
        shell: bash
        run: |
          set -euo pipefail
          node scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-anchor-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs
          node scripts/product-evidence/verify-exfoliation-load-calibration-feasibility-reassessment-v1.mjs
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs
      - name: Historical V2.1-8Q through V2.1-8Z replay at exact frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            "v21-8q:$FROZEN_8Q_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumption-v1.mjs" \
            "v21-8r:$FROZEN_8R_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-adapter-implementation-v1.mjs" \
            "v21-8s:$FROZEN_8S_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumer-v1.mjs" \
            "v21-8t:$FROZEN_8T_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-divergence-readiness-v1.mjs" \
            "v21-8u:$FROZEN_8U_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-consumption-contract-v1.mjs" \
            "v21-8v:$FROZEN_8V_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-consumption-shadow-v1.mjs" \
            "v21-8w:$FROZEN_8W_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-policy-mapping-v1.mjs" \
            "v21-8x:$FROZEN_8X_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs" \
            "v21-8y:$FROZEN_8Y_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-normative-production-policy-shadow-v1.mjs" \
            "v21-8z:$FROZEN_8Z_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-normative-production-policy-activation-readiness-v1.mjs"; do
            IFS=: read -r name sha verifier <<< "$pair"
            rm -rf "_reference/$name"
            git clone -q --no-hardlinks . "_reference/$name"
            git -C "_reference/$name" checkout -q "$sha"
            (cd "_reference/$name" && node "$verifier")
            rm -rf "_reference/$name"
          done
      - name: Canonical 164 x 12 production invariance
        shell: bash
        run: |
          set -euo pipefail
          V21_7_BASE_MAIN_SHA=e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87 RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-product-decision-axis-comparator-v1.mjs
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-skin-decision-recommendation-invariance.mjs
      - name: Exact V2.1-9A additive scope and frozen non-mutation
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            .github/workflows/v21-9a-exfoliation-additional-shadow-evidence.yml
            docs/evidence/exfoliation-non-numeric-pda-additional-shadow-evidence-v1.md
            scripts/product-evidence/build-exfoliation-non-numeric-pda-additional-shadow-evidence-v1.mjs
            scripts/product-evidence/verify-exfoliation-non-numeric-pda-additional-shadow-evidence-v1.mjs
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-additional-shadow-evidence-summary-v1.json
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-additional-shadow-distribution-v1.json
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-additional-shadow-action-distribution-v1.json
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-additional-shadow-divergence-distribution-v1.json
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-additional-shadow-hypothetical-restrict-impact-v1.json
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-additional-shadow-readiness-gap-reassessment-v1.json
          )
          mapfile -t actual < <(git diff --name-only "$V21_9A_BASE_MAIN_SHA..HEAD" | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${wanted[@]}")"
          test -z "$(git diff --name-only "$V21_9A_BASE_MAIN_SHA..HEAD" -- app package.json package-lock.json supabase/migrations lib/skin-match-decision-engine.js lib/candidate-exposure-policy.js lib/candidate-exposure-policy-contract.js lib/routine-policy.js lib/recent-instability-guard-policy.js lib/functional-ranking-contract.js lib/product-functional-profile.js lib/exfoliation-non-numeric-pda-normative-production-policy-shadow.js evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1.json evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-activation-readiness-contract-v1.json)"
          git diff --check "$V21_9A_BASE_MAIN_SHA..HEAD"
          rm -rf _reference/recommendation
