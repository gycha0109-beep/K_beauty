name: Premium PR27 gate diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/premium-pr27-gate-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/premium-engine-main-sec-baseline
          fetch-depth: 0
      - name: Build exact reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/premium-route-storage-reentry-verification
          set +e
          git merge --no-ff --no-commit origin/agent/premium-route-storage-reentry-verification
          set -e
          python - <<'PY'
          from pathlib import Path
          import ast, base64, re, zlib
          workflow = Path('.github/workflows/premium-stack-merge-once.yml').read_text(encoding='utf-8')
          for name, target in [('full','app/api/full-report/route.js'),('session','app/api/full-report/session/route.js')]:
              m=re.search(rf'^          {name} = (".*")$',workflow,re.MULTILINE)
              Path(target).write_bytes(zlib.decompress(base64.b64decode(ast.literal_eval(m.group(1)))))
          suite=Path('scripts/run-security-closeout-verifier-suite.mjs'); text=suite.read_text(encoding='utf-8')
          entry='  "verify-premium-route-storage-reentry.mjs",\n'; anchor='  "verify-premium-report-reentry-contract.mjs",\n'
          if entry not in text: suite.write_text(text.replace(anchor,anchor+entry,1),encoding='utf-8')
          PY
          git add app/api/full-report/route.js app/api/full-report/session/route.js scripts/run-security-closeout-verifier-suite.mjs
          git commit -m diagnostic
          npm ci
      - {name: Route, id: route, continue-on-error: true, run: 'node scripts/verify-premium-route-storage-reentry.mjs'}
      - {name: Evaluation, id: evaluation, continue-on-error: true, run: 'node scripts/verify-premium-integrated-evaluation.mjs'}
      - {name: Reentry, id: reentry, continue-on-error: true, run: 'node scripts/verify-premium-report-reentry-contract.mjs'}
      - {name: Decision, id: decision, continue-on-error: true, run: 'node scripts/verify-premium-decision-state.mjs'}
      - {name: Cross domain, id: cross, continue-on-error: true, run: 'node scripts/verify-cross-domain-consistency.mjs'}
      - {name: Condition, id: condition, continue-on-error: true, run: 'node scripts/verify-condition-policy-single-source.mjs'}
      - {name: Routine, id: routine, continue-on-error: true, run: 'node scripts/verify-routine-policy-single-source.mjs'}
      - {name: Functional, id: functional, continue-on-error: true, run: 'node scripts/verify-functional-policy-single-source.mjs'}
      - name: Security suite
        id: security
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-security-closeout-verifier-suite.mjs 2>&1 | tee security.log
      - {name: Architecture, id: architecture, continue-on-error: true, run: 'npm run architecture:guard'}
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-pr27-gate-diagnostic
          path: |
            security.log
            build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Report
        run: |
          echo route=${{ steps.route.outcome }}
          echo evaluation=${{ steps.evaluation.outcome }}
          echo reentry=${{ steps.reentry.outcome }}
          echo decision=${{ steps.decision.outcome }}
          echo cross=${{ steps.cross.outcome }}
          echo condition=${{ steps.condition.outcome }}
          echo routine=${{ steps.routine.outcome }}
          echo functional=${{ steps.functional.outcome }}
          echo security=${{ steps.security.outcome }}
          echo architecture=${{ steps.architecture.outcome }}
          echo build=${{ steps.build.outcome }}
          test "${{ steps.route.outcome }}${{ steps.evaluation.outcome }}${{ steps.reentry.outcome }}${{ steps.decision.outcome }}${{ steps.cross.outcome }}${{ steps.condition.outcome }}${{ steps.routine.outcome }}${{ steps.functional.outcome }}${{ steps.security.outcome }}${{ steps.architecture.outcome }}${{ steps.build.outcome }}" = "successsuccesssuccesssuccesssuccesssuccesssuccesssuccesssuccesssuccesssuccess"
