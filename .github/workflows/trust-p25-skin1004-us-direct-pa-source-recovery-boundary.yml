name: TRUST-P25 SKIN1004 US Direct PA Source Recovery Boundary

on:
  pull_request:
    paths:
      - "evidence/product-fact-subject-coverage-v1/trust-p25-skin1004-us-direct-pa-source-recovery-boundary-v1.json"
      - "docs/evidence/trust-p25-skin1004-us-direct-pa-source-recovery-boundary-v1.md"
      - "scripts/product-evidence/verify-trust-p25-skin1004-us-direct-pa-source-recovery-boundary-v1.mjs"
      - ".github/workflows/trust-p25-skin1004-us-direct-pa-source-recovery-boundary.yml"
  push:
    branches:
      - main
    paths:
      - "evidence/product-fact-subject-coverage-v1/trust-p25-skin1004-us-direct-pa-source-recovery-boundary-v1.json"
      - "docs/evidence/trust-p25-skin1004-us-direct-pa-source-recovery-boundary-v1.md"
      - "scripts/product-evidence/verify-trust-p25-skin1004-us-direct-pa-source-recovery-boundary-v1.mjs"
      - ".github/workflows/trust-p25-skin1004-us-direct-pa-source-recovery-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-trust-p25-skin1004-us-direct-pa-source-recovery-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Attest exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify TRUST-P25 SKIN1004 US PA source-recovery boundary
        run: node scripts/product-evidence/verify-trust-p25-skin1004-us-direct-pa-source-recovery-boundary-v1.mjs
