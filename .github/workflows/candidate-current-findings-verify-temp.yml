name: Candidate current findings temporary verification

on:
  push:
    branches:
      - codex/candidate-policy-current-findings-integration

permissions:
  contents: read
  statuses: write

concurrency:
  group: candidate-current-findings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Mark verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"Candidate Current Findings Verification","description":"Focused verifiers, security baseline, and build are running"}'

      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run and report verification suite
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          post_status() {
            local state="$1"
            local context="$2"
            local description="$3"
            local payload
            payload=$(jq -n \
              --arg state "${state}" \
              --arg context "${context}" \
              --arg description "${description}" \
              '{state:$state,context:$context,description:$description}')
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "${payload}" >/dev/null
          }

          run_check() {
            local label="$1"
            shift
            local log="/tmp/candidate-current-findings-${label}.log"
            local status
            local location
            local detail
            echo "==> ${label}"
            "$@" >"${log}" 2>&1
            status=$?
            cat "${log}"
            if [[ ${status} -eq 0 ]]; then
              post_status success "Verify ${label}" "${label} passed"
              return 0
            fi
            location=$(grep -Eo 'verify-[a-z0-9-]+\.mjs:[0-9]+:[0-9]+' "${log}" | head -n 1 || true)
            detail=$(grep -E 'AssertionError|Error:|ERR_|expected|actual' "${log}" | head -n 4 | tr '\n' ' ' | tr -cd '[:alnum:] _.,:;()\[\]/=-' | cut -c1-110)
            if [[ -z "${detail}" ]]; then
              detail=$(tail -n 3 "${log}" | tr '\n' ' ' | tr -cd '[:alnum:] _.,:;()\[\]/=-' | cut -c1-110)
            fi
            post_status failure "FAIL ${label} ${location}: ${detail}" "${label} failed"
            return "${status}"
          }

          run_security_baseline() {
            local log="/tmp/candidate-current-findings-security-closeout.log"
            local command_status
            local validation_status
            npm run verify:security-closeout >"${log}" 2>&1
            command_status=$?
            cat "${log}"
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "tmp/security-closeout-verifier-suite.json";
          if (!fs.existsSync(path)) {
            console.error("security closeout output missing");
            process.exit(1);
          }
          const result = JSON.parse(fs.readFileSync(path, "utf8"));
          const failed = (Array.isArray(result.results) ? result.results : [])
            .filter((item) => item.phase === "verification")
            .filter((item) => item.status !== 0 || item.signal || item.error)
            .map((item) => item.name);
          const exactManifest = result.expectedVerifierCount === 56 && result.executedVerifierCount === 56;
          const fullPass = result.passedVerifierCount === 56 && result.failedVerifierCount === 0 && failed.length === 0;
          const knownBaseline = result.passedVerifierCount === 55 && result.failedVerifierCount === 1 &&
            failed.length === 1 && failed[0] === "verify-sec06-saved-report-boundary.mjs";
          if (!exactManifest || (!fullPass && !knownBaseline)) {
            console.error(JSON.stringify({
              expectedVerifierCount: result.expectedVerifierCount,
              executedVerifierCount: result.executedVerifierCount,
              passedVerifierCount: result.passedVerifierCount,
              failedVerifierCount: result.failedVerifierCount,
              failed
            }));
            process.exit(1);
          }
          console.log(fullPass ? "56/56 PASS" : "55/56 PASS; existing SEC-06 only");
          NODE
            validation_status=$?
            if [[ ${validation_status} -eq 0 ]]; then
              post_status success "Verify security-closeout-baseline" "Exact manifest 56; new verifier passed; SEC-06 baseline preserved"
              return 0
            fi
            post_status failure "FAIL security-closeout-baseline" "Security exact manifest or failure baseline changed"
            return "${command_status:-1}"
          }

          run_check current-findings npm run verify:candidate-policy-current-findings || exit $?
          run_check goal-alignment npm run verify:candidate-policy-goal-alignment || exit $?
          run_check runtime-safety npm run verify:candidate-policy-runtime-safety || exit $?
          run_check candidate-baseline npm run verify:candidate-policy-baseline || exit $?
          run_check current-product-transport npm run verify:current-product-snapshot-transport || exit $?
          run_security_baseline || exit $?
          run_check architecture npm run architecture:guard || exit $?
          run_check production-build npm run build || exit $?
          run_check tracked-mutation git diff --exit-code || exit $?

      - name: Report verification success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"Candidate Current Findings Verification","description":"CandidatePolicy, security baseline, transport, architecture, and build passed"}'

      - name: Report verification failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"Candidate Current Findings Verification","description":"Focused verification, security baseline, or build failed"}'
