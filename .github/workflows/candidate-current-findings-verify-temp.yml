name: Candidate current findings temporary verification

on:
  push:
    branches:
      - codex/candidate-policy-current-findings-integration

permissions:
  contents: read
  statuses: write

concurrency:
  group: candidate-current-findings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"Candidate Current Findings Verification","description":"Focused verifiers and build are running"}'

      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify CandidatePolicy baseline
        run: npm run verify:candidate-policy-baseline

      - name: Verify current-product snapshot transport
        run: npm run verify:current-product-snapshot-transport

      - name: Verify architecture
        run: npm run architecture:guard

      - name: Build production bundle
        run: npm run build

      - name: Check tracked mutation
        run: git diff --exit-code

      - name: Report verification success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"Candidate Current Findings Verification","description":"CandidatePolicy, transport, architecture, and build passed"}'

      - name: Report verification failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"Candidate Current Findings Verification","description":"Focused verification or build failed"}'
