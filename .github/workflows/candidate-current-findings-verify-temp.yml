name: Candidate current findings temporary verification

on:
  push:
    branches:
      - codex/candidate-policy-current-findings-integration

permissions:
  contents: read
  statuses: write
  issues: write

concurrency:
  group: candidate-current-findings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"Candidate Current Findings Verification","description":"Focused verifiers and build are running"}'

      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused verification suite
        shell: bash
        run: |
          set -uo pipefail
          run_check() {
            local label="$1"
            shift
            local log="/tmp/candidate-current-findings-${label}.log"
            local status
            echo "==> ${label}"
            "$@" >"${log}" 2>&1
            status=$?
            cat "${log}"
            if [[ ${status} -eq 0 ]]; then
              return 0
            fi
            printf '%s' "${label}" > /tmp/candidate-current-findings-failure-label
            tail -c 6000 "${log}" > /tmp/candidate-current-findings-failure.log
            return "${status}"
          }

          run_check candidate-policy-baseline npm run verify:candidate-policy-baseline || exit $?
          run_check current-product-transport npm run verify:current-product-snapshot-transport || exit $?
          run_check architecture npm run architecture:guard || exit $?
          run_check production-build npm run build || exit $?
          run_check tracked-mutation git diff --exit-code || exit $?

      - name: Comment verification failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          label=$(cat /tmp/candidate-current-findings-failure-label 2>/dev/null || printf '%s' unknown-step)
          log=$(cat /tmp/candidate-current-findings-failure.log 2>/dev/null || printf '%s' 'No captured command log. Inspect setup/install steps.')
          body=$(jq -n --arg label "${label}" --arg log "${log}" \
            '{body:("Temporary exact-head verification failed at `" + $label + "`.\n\n```text\n" + $log + "\n```")}' )
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/82/comments" \
            -d "${body}"

      - name: Report verification success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"Candidate Current Findings Verification","description":"CandidatePolicy, transport, architecture, and build passed"}'

      - name: Report verification failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"Candidate Current Findings Verification","description":"Focused verification or build failed"}'
