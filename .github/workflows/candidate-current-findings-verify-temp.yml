name: Candidate current findings temporary verification

on:
  push:
    branches:
      - codex/candidate-policy-current-findings-integration

permissions:
  contents: write
  statuses: write

concurrency:
  group: candidate-current-findings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mark verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"Candidate Current Findings Verification","description":"Focused verifiers and build are running"}'

      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: codex/candidate-policy-current-findings-integration

      - name: Align sunscreen completeness resolver
        id: repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/product-functional-profile.js')
          text = path.read_text(encoding='utf-8')
          old = 'return SUNSCREEN_METADATA_FIELDS.some((field) => {'
          new = 'return SUNSCREEN_METADATA_FIELDS.every((field) => {'
          count = text.count(old)
          if count == 1:
              path.write_text(text.replace(old, new), encoding='utf-8')
              print('repair_applied=true')
          elif count == 0 and new in text:
              print('repair_applied=false')
          else:
              raise SystemExit(f'unexpected sunscreen completeness resolver count: {count}')
          PY
          if git diff --quiet -- lib/product-functional-profile.js; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/product-functional-profile.js
            git commit -m "fix(candidate-policy): require complete sunscreen protection metadata"
            git push origin HEAD:codex/candidate-policy-current-findings-integration
            echo "applied=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run and report verification suite
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          post_status() {
            local state="$1"
            local context="$2"
            local description="$3"
            local payload
            payload=$(jq -n \
              --arg state "${state}" \
              --arg context "${context}" \
              --arg description "${description}" \
              '{state:$state,context:$context,description:$description}')
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -d "${payload}" >/dev/null
          }

          run_check() {
            local label="$1"
            shift
            local log="/tmp/candidate-current-findings-${label}.log"
            local status
            local location
            local detail
            echo "==> ${label}"
            "$@" >"${log}" 2>&1
            status=$?
            cat "${log}"
            if [[ ${status} -eq 0 ]]; then
              post_status success "Verify ${label}" "${label} passed"
              return 0
            fi
            location=$(grep -Eo 'verify-candidate-policy-current-findings-integration\.mjs:[0-9]+:[0-9]+' "${log}" | head -n 1 || true)
            detail=$(grep -E 'AssertionError|Error:|ERR_|expected|actual' "${log}" | head -n 4 | tr '\n' ' ' | tr -cd '[:alnum:] _.,:;()\[\]/=-' | cut -c1-110)
            if [[ -z "${detail}" ]]; then
              detail=$(tail -n 3 "${log}" | tr '\n' ' ' | tr -cd '[:alnum:] _.,:;()\[\]/=-' | cut -c1-110)
            fi
            post_status failure "FAIL ${label} ${location}: ${detail}" "${label} failed"
            return "${status}"
          }

          run_check current-findings npm run verify:candidate-policy-current-findings || exit $?
          run_check goal-alignment npm run verify:candidate-policy-goal-alignment || exit $?
          run_check runtime-safety npm run verify:candidate-policy-runtime-safety || exit $?
          run_check candidate-baseline npm run verify:candidate-policy-baseline || exit $?
          run_check current-product-transport npm run verify:current-product-snapshot-transport || exit $?
          run_check architecture npm run architecture:guard || exit $?
          run_check production-build npm run build || exit $?
          run_check tracked-mutation git diff --exit-code || exit $?

      - name: Report verification success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"Candidate Current Findings Verification","description":"CandidatePolicy, transport, architecture, and build passed"}'

      - name: Report verification failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"Candidate Current Findings Verification","description":"Focused verification or build failed"}'
