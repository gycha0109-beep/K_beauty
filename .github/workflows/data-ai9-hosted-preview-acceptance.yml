name: Product Query AI - Historical Hosted Preview Evidence

on:
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: data-ai9-historical-hosted-preview
  cancel-in-progress: true

jobs:
  historical-evidence:
    name: DATA-AI9 historical hosted Preview evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact selected ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify frozen DATA-AI9 evidence contract
        run: node scripts/verify-data-ai9-hosted-preview-acceptance.mjs

      - name: Report supersession
        run: echo "DATA_AI9_HOSTED_PREVIEW_ACCEPTANCE=HISTORICAL_EVIDENCE_FROZEN_BY_DATA_AI10"
