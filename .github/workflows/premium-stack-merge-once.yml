name: Premium PR22 stack merge executor

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/premium-stack-merge-once.yml]

permissions:
  contents: write

concurrency:
  group: premium-pr22-stack-merge-executor
  cancel-in-progress: false

jobs:
  merge-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/premium-engine-main-sec-baseline
          fetch-depth: 0
      - name: Merge reviewed PR22 head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/premium-integrated-evaluation-pack
          test "$(git rev-parse origin/agent/premium-integrated-evaluation-pack)" = "b2d89bc4009b2cc00b2ff2d0f0da08a4c9e37d77"
          git merge --no-ff --no-commit origin/agent/premium-integrated-evaluation-pack
          test -z "$(git diff --name-only --diff-filter=U)"
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/run-security-closeout-verifier-suite.mjs")
          text = path.read_text(encoding="utf-8")
          entry = '  "verify-premium-integrated-evaluation.mjs",\n'
          if entry not in text:
              anchor = '  "verify-premium-decision-state.mjs",\n'
              if text.count(anchor) != 1:
                  raise SystemExit("security closeout premium verifier anchor mismatch")
              text = text.replace(anchor, anchor + entry, 1)
              path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/premium-stack-merge-once.yml
          git add -A
          git diff --cached --check
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json' || true)"
          git commit -m "merge(premium): integrate evaluation pack layer"
      - run: npm ci
      - name: Verify integrated evaluation layer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-premium-integrated-evaluation.mjs
          node scripts/verify-product-data-sufficiency-audit.mjs
          node scripts/verify-product-category-normalizer.mjs
          node scripts/verify-product-functional-profile.mjs
          node scripts/verify-current-product-findings.mjs
          node scripts/verify-premium-decision-state.mjs
          node scripts/verify-cross-domain-consistency.mjs
          node scripts/verify-functional-policy-single-source.mjs
          node scripts/verify-routine-policy-single-source.mjs
          node scripts/verify-condition-policy-single-source.mjs
      - name: Verify main security baseline
        run: node scripts/run-security-closeout-verifier-suite.mjs
      - name: Verify architecture and build
        shell: bash
        run: |
          set -euo pipefail
          npm run architecture:guard
          npm run build
          git diff --check
      - name: Push reviewed commit
        run: git push origin HEAD:integration/premium-engine-main-sec-baseline
