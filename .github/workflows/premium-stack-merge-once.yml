name: Premium PR14 stack merge executor

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/premium-stack-merge-once.yml]

permissions:
  contents: write

concurrency:
  group: premium-pr14-stack-merge-executor
  cancel-in-progress: false

jobs:
  merge-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/premium-engine-main-sec-baseline
          fetch-depth: 0
      - name: Merge and resolve PR14
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/condition-policy-single-source
          test "$(git rev-parse origin/agent/condition-policy-single-source)" = "f0045d816003523c46b63715291c57fe958d68ef"
          set +e
          git merge --no-ff --no-commit origin/agent/condition-policy-single-source
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U | sort)
          test "${#CONFLICTS[@]}" -eq 1
          test "${CONFLICTS[0]}" = "app/api/analyze/route.js"
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/api/analyze/route.js")
          text = path.read_text(encoding="utf-8")
          text, count1 = re.subn(
              r'<<<<<<< HEAD\n=======\nimport \{ rebuildPremiumDecisionState \} from "@/lib/premium-decision-state";\nimport \{ appendSurveyInputContractDevAuditEvent \} from "@/lib/survey-input-contract-dev-audit";\n>>>>>>> origin/agent/condition-policy-single-source\n',
              'import { rebuildPremiumDecisionState } from "@/lib/premium-decision-state";\n',
              text,
              count=1,
          )
          second = r'''<<<<<<< HEAD
    const premiumReport = sanitizePremiumReport\(decision\.premiumReport\);
    const premiumSessionReport = premiumReport
      \? sanitizePremiumReportProductImages\(
          sanitizePremiumReportPurchaseLinks\(\{
            \.\.\.premiumReport,
            freeResult: publicDecision
          \}\)
        \)
=======
    const premiumDecisionSource = decision\.premiumReport
      \? \{
          \.\.\.decision\.premiumReport,
          freeResult: publicDecision
        \}
>>>>>>> origin/agent/condition-policy-single-source
      : null;
    const premiumSessionReport = premiumDecisionSource
      \? sanitizePremiumReport\(rebuildPremiumDecisionState\(premiumDecisionSource, \{
          locale,
          source: "api_analyze_initial_session"
        \}\)\)
      : null;'''
          replacement = '''    const premiumDecisionSource = decision.premiumReport
      ? {
          ...decision.premiumReport,
          freeResult: publicDecision
        }
      : null;
    const premiumSessionReport = premiumDecisionSource
      ? sanitizePremiumReportProductImages(
          sanitizePremiumReportPurchaseLinks(
            sanitizePremiumReport(rebuildPremiumDecisionState(premiumDecisionSource, {
              locale,
              source: "api_analyze_initial_session"
            }))
          )
        )
      : null;'''
          text, count2 = re.subn(second, replacement, text, count=1)
          if count1 != 1 or count2 != 1:
              raise SystemExit(f"analyze conflict resolution mismatch: imports={count1} body={count2}")
          if any(marker in text for marker in ("<<<<<<<", "=======", ">>>>>>>")):
              raise SystemExit("conflict marker remains in analyze route")
          path.write_text(text, encoding="utf-8")
          PY
          git add app/api/analyze/route.js
          test -z "$(git diff --name-only --diff-filter=U)"
          rm .github/workflows/premium-stack-merge-once.yml
          git add -A
          git diff --cached --check
      - run: npm ci
      - name: Verify PR14 condition policy layer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-condition-policy-single-source.mjs
          node scripts/verify-routine-policy-single-source.mjs
          node scripts/verify-functional-policy-single-source.mjs
          node scripts/verify-premium-decision-state.mjs
          node scripts/verify-premium-report-reentry-contract.mjs
      - name: Verify main security baseline
        run: node scripts/run-security-closeout-verifier-suite.mjs
      - name: Verify architecture and build
        shell: bash
        run: |
          set -euo pipefail
          npm run architecture:guard
          npm run build
          git diff --cached --check
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "merge(premium): integrate condition policy stack layer"
          git push origin HEAD:integration/premium-engine-main-sec-baseline
