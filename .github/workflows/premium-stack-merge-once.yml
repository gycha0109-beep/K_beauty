name: Premium PR11 stack merge diagnostic

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/premium-stack-merge-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/premium-engine-main-sec-baseline
          fetch-depth: 0

      - name: Merge PR11 head without committing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/routine-policy-single-source
          test "$(git rev-parse origin/agent/routine-policy-single-source)" = "2e5cf6c24bf166544a7ad57c1cec90a3ec9807b8"
          mkdir -p tmp/premium-stack-merge-diagnostic/conflicts
          set +e
          git merge --no-ff --no-commit origin/agent/routine-policy-single-source > tmp/premium-stack-merge-diagnostic/merge.log 2>&1
          STATUS=$?
          set -e
          mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U | sort)
          printf '%s\n' "${CONFLICTS[@]}" > tmp/premium-stack-merge-diagnostic/conflicts.txt
          printf '{\n  "mergeStatus": %s,\n  "conflictCount": %s,\n  "conflicts": [' "$STATUS" "${#CONFLICTS[@]}" > tmp/premium-stack-merge-diagnostic/summary.json
          for i in "${!CONFLICTS[@]}"; do
            path="${CONFLICTS[$i]}"
            safe=$(printf '%s' "$path" | sed 's#[^A-Za-z0-9._-]#_#g')
            git show ":1:$path" > "tmp/premium-stack-merge-diagnostic/conflicts/${safe}.base" || true
            git show ":2:$path" > "tmp/premium-stack-merge-diagnostic/conflicts/${safe}.ours" || true
            git show ":3:$path" > "tmp/premium-stack-merge-diagnostic/conflicts/${safe}.theirs" || true
            comma=','
            if [ "$i" -eq "$((${#CONFLICTS[@]} - 1))" ]; then comma=''; fi
            printf '\n    "%s"%s' "$path" "$comma" >> tmp/premium-stack-merge-diagnostic/summary.json
          done
          printf '\n  ]\n}\n' >> tmp/premium-stack-merge-diagnostic/summary.json
          git status --short > tmp/premium-stack-merge-diagnostic/status.txt
          cat tmp/premium-stack-merge-diagnostic/merge.log
          cat tmp/premium-stack-merge-diagnostic/summary.json

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: premium-stack-merge-diagnostic-pr11
          path: tmp/premium-stack-merge-diagnostic
          if-no-files-found: error
          retention-days: 7
