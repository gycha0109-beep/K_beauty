name: Premium PR19 stack merge executor

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/premium-stack-merge-once.yml]

permissions:
  contents: write

concurrency:
  group: premium-pr19-stack-merge-executor
  cancel-in-progress: false

jobs:
  merge-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/premium-engine-main-sec-baseline
          fetch-depth: 0
      - name: Merge reviewed PR19 head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/product-data-sufficiency-audit
          test "$(git rev-parse origin/agent/product-data-sufficiency-audit)" = "97fff9a5f914ae561526af91b56eb8446f61a379"
          git merge --no-ff --no-commit origin/agent/product-data-sufficiency-audit
          test -z "$(git diff --name-only --diff-filter=U)"
          rm .github/workflows/premium-stack-merge-once.yml
          git add -A
          git diff --cached --check
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json' || true)"
          git commit -m "merge(premium): integrate product data sufficiency audit"
      - run: npm ci
      - name: Verify product data sufficiency layer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-product-data-sufficiency-audit.mjs
          node scripts/verify-product-category-normalizer.mjs
          node scripts/verify-product-functional-profile.mjs
          node scripts/verify-current-product-findings.mjs
          node scripts/verify-cross-domain-consistency.mjs
          node scripts/verify-premium-decision-state.mjs
      - name: Verify main security baseline
        run: node scripts/run-security-closeout-verifier-suite.mjs
      - name: Verify architecture and build
        shell: bash
        run: |
          set -euo pipefail
          npm run architecture:guard
          npm run build
          git diff --check
      - name: Push reviewed commit
        run: git push origin HEAD:integration/premium-engine-main-sec-baseline
