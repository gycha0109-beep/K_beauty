name: Premium PR17 stack merge executor

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/premium-stack-merge-once.yml]

permissions:
  contents: write

concurrency:
  group: premium-pr17-stack-merge-executor
  cancel-in-progress: false

jobs:
  merge-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/premium-engine-main-sec-baseline
          fetch-depth: 0
      - name: Merge reviewed PR17 head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/cross-domain-consistency
          test "$(git rev-parse origin/agent/cross-domain-consistency)" = "4a60cfac1f643e5a0c6ba117a01433cfab57e7e6"
          git merge --no-ff --no-commit origin/agent/cross-domain-consistency
          test -z "$(git diff --name-only --diff-filter=U)"
          rm .github/workflows/premium-stack-merge-once.yml
          git add -A
          git diff --cached --check
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json' || true)"
          git commit -m "merge(premium): integrate cross-domain consistency layer"
      - run: npm ci
      - name: Verify cross-domain policy stack
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-cross-domain-consistency.mjs
          node scripts/verify-condition-policy-single-source.mjs
          node scripts/verify-routine-policy-single-source.mjs
          node scripts/verify-functional-policy-single-source.mjs
          node scripts/verify-premium-decision-state.mjs
          node scripts/verify-premium-report-reentry-contract.mjs
      - name: Verify main security baseline
        run: node scripts/run-security-closeout-verifier-suite.mjs
      - name: Verify architecture and build
        shell: bash
        run: |
          set -euo pipefail
          npm run architecture:guard
          npm run build
          git diff --check
      - name: Push reviewed commit
        run: git push origin HEAD:integration/premium-engine-main-sec-baseline
