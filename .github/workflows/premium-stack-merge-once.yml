name: Premium PR11 stack merge executor

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/premium-stack-merge-once.yml

permissions:
  contents: write

concurrency:
  group: premium-pr11-stack-merge-executor
  cancel-in-progress: false

jobs:
  merge-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/premium-engine-main-sec-baseline
          fetch-depth: 0

      - name: Merge reviewed PR11 head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/routine-policy-single-source
          test "$(git rev-parse origin/agent/routine-policy-single-source)" = "2e5cf6c24bf166544a7ad57c1cec90a3ec9807b8"
          git merge --no-ff --no-commit origin/agent/routine-policy-single-source
          test -z "$(git diff --name-only --diff-filter=U)"
          rm .github/workflows/premium-stack-merge-once.yml
          git add -A
          git diff --cached --check
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json' || true)"

      - name: Install dependencies
        run: npm ci

      - name: Verify PR11 routine policy layer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-routine-policy-single-source.mjs
          node scripts/verify-functional-policy-single-source.mjs
          node scripts/verify-premium-decision-state.mjs
          node scripts/verify-functional-plan-decision.mjs
          node scripts/verify-current-product-findings.mjs
          node scripts/verify-premium-report-reentry-contract.mjs

      - name: Verify main security baseline
        run: node scripts/run-security-closeout-verifier-suite.mjs

      - name: Verify architecture and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run architecture:guard
          npm run build
          git diff --cached --check

      - name: Commit and push reviewed merge
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "merge(premium): integrate routine policy stack layer"
          git push origin HEAD:integration/premium-engine-main-sec-baseline
