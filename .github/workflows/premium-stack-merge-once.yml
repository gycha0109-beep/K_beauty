name: Premium PR14 stack merge executor

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/premium-stack-merge-once.yml]

permissions:
  contents: write

concurrency:
  group: premium-pr14-stack-merge-executor
  cancel-in-progress: false

jobs:
  merge-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/premium-engine-main-sec-baseline
          fetch-depth: 0
      - name: Merge and resolve PR14
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/condition-policy-single-source
          test "$(git rev-parse origin/agent/condition-policy-single-source)" = "f0045d816003523c46b63715291c57fe958d68ef"
          set +e
          git merge --no-ff --no-commit origin/agent/condition-policy-single-source
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U | sort)
          test "${#CONFLICTS[@]}" -eq 1
          test "${CONFLICTS[0]}" = "app/api/analyze/route.js"
          git checkout --ours -- app/api/analyze/route.js
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path("app/api/analyze/route.js")
          text = path.read_text(encoding="utf-8")
          anchor = 'import { buildSkinMatchDecisionBundle } from "@/lib/skin-match-decision-engine";\n'
          if text.count(anchor) != 1:
              raise SystemExit("analyze import anchor mismatch")
          text = text.replace(anchor, anchor + 'import { rebuildPremiumDecisionState } from "@/lib/premium-decision-state";\n', 1)
          old = base64.b64decode("").decode()
          new = base64.b64decode("").decode()
          if text.count(old) != 1:
              raise SystemExit("analyze premium session anchor mismatch")
          text = text.replace(old, new, 1)
          function_block = base64.b64decode("").decode()
          function_anchor = "function sanitizePremiumReport(report) {\n"
          if text.count(function_anchor) != 1:
              raise SystemExit("canonical sanitizer anchor mismatch")
          text = text.replace(function_anchor, function_block + function_anchor, 1)
          fields = base64.b64decode("").decode()
          fields_anchor = "    conditionResponses: sanitizeConditionResponsesForPremium(report.conditionResponses),\n"
          if text.count(fields_anchor) != 1:
              raise SystemExit("canonical fields anchor mismatch")
          text = text.replace(fields_anchor, fields_anchor + fields, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git add app/api/analyze/route.js
          test -z "$(git diff --name-only --diff-filter=U)"
          rm .github/workflows/premium-stack-merge-once.yml
          git add -A
          git diff --cached --check
      - run: npm ci
      - name: Verify condition policy
        run: node scripts/verify-condition-policy-single-source.mjs
      - name: Verify routine policy
        run: node scripts/verify-routine-policy-single-source.mjs
      - name: Verify functional policy
        run: node scripts/verify-functional-policy-single-source.mjs
      - name: Verify premium decision state
        run: node scripts/verify-premium-decision-state.mjs
      - name: Verify premium report reentry
        run: node scripts/verify-premium-report-reentry-contract.mjs
      - name: Verify main security baseline
        run: node scripts/run-security-closeout-verifier-suite.mjs
      - name: Verify architecture and build
        shell: bash
        run: |
          set -euo pipefail
          npm run architecture:guard
          npm run build
          git diff --cached --check
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "merge(premium): integrate condition policy stack layer"
          git push origin HEAD:integration/premium-engine-main-sec-baseline
