              $line = @($out | Where-Object { $_ -match '^\{.*"status":"D8K13_DISPOSABLE_PG17_PUBLIC_DATA_RESTORE_PASS_LIMITED"' })
              if ($line.Count -ne 1) { throw 'D8K13_PUBLIC_FK_PASS_JSON_MISSING' }
