            $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
            $out = & pwsh -NoProfile -File $script -BackupZip $zip -ExpectedZipBytes $size -Mode RestorePublicDataWithSecurityBodySignals 2>&1
            $exit = $LASTEXITCODE
            $safeText = (($out | Out-String) -join '')
            if ($kind -eq 'valid') {
