          if ($proc.ExitCode -ne 3) { throw 'D8K13_OTHER_SQLSTATE_EXIT_MUST_BE_3' }
          $stderr = Get-Content -LiteralPath $err -Raw
          if ($stderr -notmatch 'D8K13_LOCAL_RESTORE_SCHEMA_SQLSTATE_22012_LINE_[0-9]+_FAILED_EXIT_3') { throw 'D8K13_OTHER_SQLSTATE_LINE_NOT_REPORTED' }
          if ($stderr -match 'SELECT 1/0|COPY public\.products|CREATE TABLE') { throw 'D8K13_SQL_CONTENT_LEAKED' }
          Write-Host 'D8K13_SYNTHETIC_OTHER_SQLSTATE_SAFE_DIAGNOSTIC_PASS'
      - name: Reject wrong-size archive, no backups in CI artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $wrong = [long]$env:ZIP_BYTES + 1
          $output = & pwsh -NoProfile -File ./scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1 -BackupZip $env:ZIP_PATH -ExpectedZipBytes $wrong -Mode Inspect 2>$null
          if ($LASTEXITCODE -ne 3) { throw 'D8K13_BAD_SIZE_MUST_EXIT_3' }
          Write-Host 'D8K13_LOCAL_ZIP_FAIL_CLOSED_WRONG_SIZE_PASS'
          exit 0 # The deliberate child exit=3 must not fail the test step.
