                  $r.publicToPublicForeignKeyAudit.publicFkConstraintsChecked -ne 2 -or
                  $r.publicSequenceSourceStateVerified -ne $true -or
                  $r.publicSequenceSourceStateAudit.sourceSetvalsChecked -ne 2 -or
                  $r.publicSecurityCatalogInventoryCollected -ne $true -or
                  $r.publicSecurityCatalogInventory.publicTables -ne 5 -or
                  $r.publicSecurityCatalogInventory.rlsEnabledTables -ne 1 -or
                  $r.publicSecurityCatalogInventory.rlsDisabledTables -ne 4 -or
                  $r.publicSecurityCatalogInventory.publicPolicies -ne 1 -or
                  $r.publicSecurityCatalogInventory.publicFunctions -ne 4 -or
                  $r.publicSecurityCatalogInventory.publicViews -ne 1 -or
                  $r.publicSecurityCatalogInventory.securityDefinerFunctions -ne 3 -or
                  $r.publicSecurityCatalogInventory.securityDefinerNullAclDefaults -ne 2 -or
                  $r.publicSecurityCatalogInventory.securityDefinerExplicitAcl -ne 1 -or
                  $r.publicSecurityCatalogInventory.securityDefinerDefaultPublicExecute -ne 2 -or
                  $r.publicSecurityCatalogInventory.securityDefinerExplicitPublicExecute -ne 0 -or
                  $r.publicSecurityCatalogInventory.securityDefinerExplicitAuthenticatedExecute -ne 1 -or
                  $r.publicSecurityCatalogInventory.securityDefinerEffectivePublicExecute -ne 2 -or
                  $r.publicSecurityCatalogInventory.securityDefinerExplicitSearchPath -ne 2 -or
                  $r.publicSecurityCatalogInventory.securityDefinerNoExplicitSearchPath -ne 1 -or
                  $r.publicSecurityDefinerBodySignalsCollected -ne $true -or
                  $r.publicSecurityDefinerBodySignals.scannedSecurityDefinerFunctions -ne 3 -or
                  $r.publicSecurityDefinerBodySignals.languagePlpgsql -ne 1 -or
                  $r.publicSecurityDefinerBodySignals.languageSql -ne 2 -or
                  $r.publicSecurityDefinerBodySignals.otherOrUnsupportedLanguage -ne 0 -or
                  $r.publicSecurityDefinerBodySignals.bodyMentionsAuthOrJwtSignals -ne 1 -or
                  $r.publicSecurityDefinerBodySignals.bodyNoLexicalAuthOrJwtSignal -ne 2 -or
                  $r.publicSecurityDefinerBodySignals.plpgsqlBodiesMentionExecuteKeyword -ne 1 -or
                  $r.publicSecurityDefinerBodySignals.plpgsqlBodiesMentionExecuteAndFormat -ne 1 -or
                  $r.publicSecurityDefinerBodySignals.executeCandidatesWithPercentRaw -ne 1 -or
                  $r.publicSecurityDefinerBodySignals.executeCandidatesWithPercentIdentifier -ne 0 -or
                  $r.publicSecurityDefinerBodySignals.executeCandidatesWithFunctionArgs -ne 0 -or
                  @($r.publicSecurityDefinerBodySignals.anonymousExecuteCandidates).Count -ne 1 -or
                  $r.publicSecurityDefinerBodySignals.anonymousExecuteCandidates[0].caseOrdinal -ne 1 -or
                  $r.publicSecurityDefinerBodySignals.anonymousExecuteCandidates[0].mentionsRawPlaceholder -ne $true -or
                  $r.publicSecurityDefinerBodySignals.anonymousExecuteCandidates[0].executeFormatAdjacentLexical -ne $true -or
                  $r.publicSecurityDefinerBodySignals.anonymousExecuteCandidates[0].rawPlaceholderInsideExecuteFormatWindowLexical -ne $true -or
                  $r.publicSecurityDefinerBodySignals.anonymousExecuteCandidates[0].identifierPlaceholderInsideExecuteFormatWindowLexical -ne $false -or
                  $r.publicSecurityDefinerBodySignals.anonymousExecuteCandidates[0].executeStatementConcatenationLexical -ne $false -or
                  $r.publicSecurityDefinerBodySignals.inputTaintOrControlFlowAnalyzed -ne $false -or
                  $r.publicSecurityDefinerBodySignals.executeFormatWindowMayIncludeQuotedSqlAndComments -ne $true -or
                  $r.publicSecurityDefinerBodySignals.anonymousExecuteCandidates[0].mentionsDirectAuthHelper -ne $true -or
                  $r.publicSecurityDefinerBodySignals.candidateCasesAreEphemeralAndNonIdentifying -ne $true -or
                  $r.publicSecurityDefinerBodySignals.searchPathIncludesPgTemp -ne 1 -or
                  $r.publicSecurityDefinerBodySignals.searchPathEndsWithPgTemp -ne 1 -or
                  $r.publicSecurityDefinerBodySignals.searchPathNoExplicitPgTemp -ne 2 -or
                  $r.publicSecurityDefinerBodySignals.bodyMentionsRaiseException -ne 1 -or
                  $r.publicSecurityDefinerBodySignals.staticOnlyLexicalSignals -ne $true -or
                  $r.publicSecurityDefinerBodySignals.perFunctionAuthSemanticsProven -ne $false -or
                  $r.publicSecurityDefinerBodySignals.rawFunctionBodyOrNamesReturned -ne $false -or
                  $r.publicSecurityCatalogInventory.executePrivilegeProvenanceClassified -ne $true -or
                  $r.publicSecurityCatalogInventory.productionParityVerified -ne $false -or
                  $r.rlsPolicyParityVerified -ne $false -or
                  $r.ownerAndAclParityVerified -ne $false -or
                  $r.publicSequenceSourceStateAudit.nextvalActuallyCalled -ne $false -or
                  $r.publicSequenceSourceStateAudit.sourceLastValueAndIsCalledMatch -ne $true -or
                  $r.publicToPublicForeignKeyAudit.publicFkViolatingConstraints -ne 0 -or
                  $r.publicToPublicForeignKeyAudit.publicFkViolatingRows -ne 0 -or
                  $r.publicToPublicForeignKeyAudit.nonPublicParentConstraintsSkipped -ne 1 -or
                  $r.publicToPublicForeignKeyAudit.unsupportedConstraints -ne 0 -or
                  $r.foreignKeyReferentialParityVerified -ne $false -or
                  $r.authDataRestored -ne $false -or $r.releaseAuthorized -ne $false) {
                throw 'D8K13_PUBLIC_FK_PASS_CONTRACT_MISMATCH'
              }
            } else {
              if ($exit -eq 0 -or -not $safeText.Contains('D8K13_PUBLIC_FK_REFERENTIAL_VIOLATIONS')) {
                throw 'D8K13_PUBLIC_FK_BAD_REFERENCE_NOT_REJECTED'
              }
            }
            if ($safeText -match 'synthetic only|COPY public|fk_child|fk_parent|MATCH FULL') {
              throw 'D8K13_PUBLIC_FK_SOURCE_SQL_OR_ROWS_LEAKED'
            }
            if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $hash) {
              throw 'D8K13_PUBLIC_FK_SOURCE_ZIP_CHANGED'
            }
          }
          Write-Host 'D8K13_SYNTHETIC_DEFINER_BODY_TRIAGE_FK_SEQUENCE_PASS'
          # Negative fixture deliberately exits nonzero; clear pwsh's native exit status.
          exit 0

      - name: Reject unsupported SQL data commands before isolated partial restore
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'd8k13-public-reject'
          $sql=Join-Path $dir 'sql'
          New-Item -ItemType Directory -Path $sql -Force | Out-Null
          $base=Join-Path $env:RUNNER_TEMP 'd8k13-local-fixture/sql'
          Copy-Item (Join-Path $base 'roles.sql') (Join-Path $sql 'roles.sql')
          Copy-Item (Join-Path $base 'schema.sql') (Join-Path $sql 'schema.sql')
          $data=@'
          COPY public.products (id, name) FROM stdin;
          74	synthetic
          \.
          INSERT INTO public.products VALUES (75, 'unsupported_command');
          '@
          [System.IO.File]::WriteAllText((Join-Path $sql 'data.sql'),$data,[System.Text.UTF8Encoding]::new($false))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=Join-Path $dir 'fixture.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory($sql,$zip)
          $size=[long](Get-Item -LiteralPath $zip).Length
          $out=& pwsh -NoProfile -File ./scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1 -BackupZip $zip -ExpectedZipBytes $size -Mode RestorePublicData 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'D8K13_PUBLIC_UNSUPPORTED_COMMAND_ACCEPTED' }
          $safeText=$out -join [Environment]::NewLine
          if (-not $safeText.Contains('D8K13_PUBLIC_DATA_UNEXPECTED_SOURCE_COMMAND_LINE_4')) {
            throw 'D8K13_PUBLIC_UNSUPPORTED_COMMAND_WRONG_FAILURE'
          }
          if ($safeText -match 'unsupported_command|INSERT INTO|synthetic') {
            throw 'D8K13_PUBLIC_UNSUPPORTED_COMMAND_SOURCE_LEAKED'
          }
          Write-Host 'D8K13_SYNTHETIC_PUBLIC_UNSUPPORTED_SQL_FAIL_CLOSED_PASS'
          # GitHub pwsh wrapper propagates the last native exit code even after an expected rejection.
          $global:LASTEXITCODE=0
      - name: Reject nonterminal RESET ALL before any synthetic public import
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'd8k13-public-reset-nonterminal'
          $sql=Join-Path $dir 'sql'
          New-Item -ItemType Directory -Path $sql -Force | Out-Null
          $base=Join-Path $env:RUNNER_TEMP 'd8k13-local-fixture/sql'
          Copy-Item (Join-Path $base 'roles.sql') (Join-Path $sql 'roles.sql')
          Copy-Item (Join-Path $base 'schema.sql') (Join-Path $sql 'schema.sql')
          $data=@'
          COPY public.products (id, name) FROM stdin;
          101	synthetic
          \.
          RESET ALL;
          COPY public.products (id, name) FROM stdin;
          102	synthetic
          \.
          '@
          [System.IO.File]::WriteAllText((Join-Path $sql 'data.sql'),$data,[System.Text.UTF8Encoding]::new($false))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=Join-Path $dir 'fixture.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory($sql,$zip)
          $size=[long](Get-Item -LiteralPath $zip).Length
          $out=& pwsh -NoProfile -File ./scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1 -BackupZip $zip -ExpectedZipBytes $size -Mode RestorePublicData 2>&1
          if ($LASTEXITCODE -eq 0) { throw 'D8K13_NONTERMINAL_RESET_ALL_ACCEPTED' }
          $safeText=$out -join [Environment]::NewLine
          if (-not $safeText.Contains('D8K13_PUBLIC_DATA_COMMAND_AFTER_RESET_ALL_LINE_5')) {
            throw 'D8K13_NONTERMINAL_RESET_ALL_WRONG_FAILURE'
          }
          if ($safeText -match 'COPY public|101|102|synthetic') {
            throw 'D8K13_NONTERMINAL_RESET_ALL_SOURCE_LEAKED'
          }
          $global:LASTEXITCODE=0
          Write-Host 'D8K13_SYNTHETIC_NONTERMINAL_RESET_ALL_REJECTED_PASS'
      - name: Aggregate multiple undefined functions in one privacy-safe isolated schema audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'd8k13-no-public/sql'
          $target = Join-Path $env:RUNNER_TEMP 'd8k13-audit-many/sql'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item (Join-Path $source 'roles.sql') (Join-Path $target 'roles.sql')
          Copy-Item (Join-Path $source 'data.sql') (Join-Path $target 'data.sql')
          $schema = [System.IO.File]::ReadAllText((Join-Path $source 'schema.sql'))
          $schema += "`nSELECT d8k13_absent_synthetic_function();`n"
          $schema += "COMMENT ON FUNCTION public.d8k13_absent_synthetic_function() IS 'synthetic only';`n"
          [System.IO.File]::WriteAllText((Join-Path $target 'schema.sql'),$schema,[System.Text.UTF8Encoding]::new($false))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $env:RUNNER_TEMP 'd8k13-audit-many/audit.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory($target,$zip)
          $bytes = [long](Get-Item -LiteralPath $zip).Length
          $out = & pwsh -NoProfile -File ./scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1 -BackupZip $zip -ExpectedZipBytes $bytes -Mode AuditSchema
          if ($LASTEXITCODE -ne 0) { throw 'D8K13_SYNTHETIC_SCHEMA_AUDIT_EXEC_FAILED' }
          $resultLine = @($out | Where-Object { $_ -match '^\{.*"status":"D8K13_DISPOSABLE_PG17_SCHEMA_AUDIT_ONLY_NOT_RESTORE"' })
          if ($resultLine.Count -ne 1) { throw 'D8K13_SYNTHETIC_SCHEMA_AUDIT_MISSING_RESULT' }
          $result = $resultLine[0] | ConvertFrom-Json
          if ($result.schemaErrorCount -lt 2 -or $result.dataSqlExecuted -ne $false -or
              $result.releaseAuthorized -ne $false -or $result.rawSqlOrRowsReturned -ne $false -or
              $result.networkDisabled -ne $true) { throw 'D8K13_SYNTHETIC_SCHEMA_AUDIT_SAFETY_FAILED' }
          if (@($result.sampledErrors | Where-Object { $_.sqlstate -eq '42883' }).Count -lt 2) { throw 'D8K13_SYNTHETIC_SCHEMA_AUDIT_MISSING_42883' }
          if (@($result.sqlstateCounts | Where-Object { $_.sqlstate -eq '42883' -and $_.count -ge 2 }).Count -ne 1) {
            throw 'D8K13_SYNTHETIC_SCHEMA_AUDIT_AGGREGATION_FAILED'
          }
          if (($resultLine -join '') -match 'd8k13_absent_synthetic_function|COMMENT ON FUNCTION|SELECT d8k13_absent') {
            throw 'D8K13_SYNTHETIC_SCHEMA_AUDIT_SQL_LEAK'
          }
          Write-Host 'D8K13_SYNTHETIC_SCHEMA_AUDIT_MULTI_ERROR_PRIVACY_PASS'
      - name: Refuse missing unknown schema and print name only without SQL content
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [long](Get-Item -LiteralPath $env:D8K13_MISSING_SCHEMA_ZIP).Length
          $err = Join-Path $env:RUNNER_TEMP 'd8k13-missing-schema-error.txt'
          $out = Join-Path $env:RUNNER_TEMP 'd8k13-missing-schema-out.txt'
          $proc = Start-Process -FilePath 'pwsh' -ArgumentList @('-NoProfile','-File','./scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1','-BackupZip',$env:D8K13_MISSING_SCHEMA_ZIP,'-ExpectedZipBytes',"$bytes",'-Mode','Restore') -Wait -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          if ($proc.ExitCode -ne 3) { throw 'D8K13_UNKNOWN_MISSING_SCHEMA_EXIT_MUST_BE_3' }
          $stderr = Get-Content -LiteralPath $err -Raw
          if ($stderr -notmatch 'D8K13_LOCAL_RESTORE_SCHEMA_SQLSTATE_3F000_LINE_[0-9]+_FAILED_EXIT_3') { throw 'D8K13_MISSING_SCHEMA_SQLSTATE_LINE_NOT_REPORTED' }
          if ($stderr -match 'GRANT USAGE ON SCHEMA|COPY public\.products|CREATE TABLE') { throw 'D8K13_SQL_CONTENT_LEAKED' }
          Write-Host 'D8K13_SYNTHETIC_MISSING_SCHEMA_NAME_ONLY_FAIL_CLOSED_PASS'
      - name: Convert formerly-OTHER SQL error to safe SQLSTATE and exact line
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [long](Get-Item -LiteralPath $env:D8K13_UNEXPECTED_SQLSTATE_ZIP).Length
          $err = Join-Path $env:RUNNER_TEMP 'd8k13-unknown-error.txt'
          $out = Join-Path $env:RUNNER_TEMP 'd8k13-unknown-out.txt'
