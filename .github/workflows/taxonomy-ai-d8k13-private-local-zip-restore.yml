            $schema += @'
          CREATE TABLE public.fk_parent(id integer PRIMARY KEY);
          CREATE TABLE public.fk_child(id integer PRIMARY KEY, parent_id integer REFERENCES public.fk_parent(id));
          CREATE TABLE public.fk_parent_pair(a integer, b integer, PRIMARY KEY(a,b));
          CREATE TABLE public.fk_child_pair(id integer PRIMARY KEY, a integer, b integer,
            CONSTRAINT fk_pair_full FOREIGN KEY(a,b) REFERENCES public.fk_parent_pair(a,b) MATCH FULL);
          CREATE SEQUENCE public.d8k13_seq_called;
          CREATE SEQUENCE public.d8k13_seq_uncalled;
          CREATE FUNCTION public.d8k13_definer_default() RETURNS boolean
            LANGUAGE sql SECURITY DEFINER AS 'SELECT true';
          CREATE FUNCTION public.d8k13_definer_locked() RETURNS boolean
            LANGUAGE sql SECURITY DEFINER SET search_path = pg_catalog AS 'SELECT true';
          REVOKE ALL ON FUNCTION public.d8k13_definer_locked() FROM PUBLIC;
          GRANT EXECUTE ON FUNCTION public.d8k13_definer_locked() TO authenticated;
          CREATE FUNCTION public.d8k13_definer_with_cues() RETURNS boolean
            LANGUAGE plpgsql SECURITY DEFINER SET search_path = public, pg_temp
            AS $d8k13_body$
          DECLARE v integer;
          BEGIN
            EXECUTE format('SELECT %s', 1) INTO v;
            IF auth.uid() IS NULL THEN
              RAISE EXCEPTION 'synthetic only';
            END IF;
            RETURN v = 1;
          END;
          $d8k13_body$;
          '@
            [System.IO.File]::WriteAllText((Join-Path $sql 'schema.sql'),$schema,[System.Text.UTF8Encoding]::new($false))
            $single = if ($kind -eq 'orphan') { '11' + [char]9 + '999' } else { '11' + [char]9 + '1' }
            $pair = if ($kind -eq 'partial-null') { '22' + [char]9 + '\N' + [char]9 + '2' } else { '22' + [char]9 + '\N' + [char]9 + '\N' }
            $data = @"
          COPY public.products (id, name) FROM stdin;
          73	synthetic only
          \.
          COPY public.fk_parent (id) FROM stdin;
          1
          \.
          COPY public.fk_child (id, parent_id) FROM stdin;
          $single
          \.
          COPY public.fk_parent_pair (a, b) FROM stdin;
          1	2
          \.
          COPY public.fk_child_pair (id, a, b) FROM stdin;
          21	1	2
          $pair
          \.
          SELECT pg_catalog.setval('public.d8k13_seq_called', 97, true);
          SELECT pg_catalog.setval('public.d8k13_seq_uncalled'::regclass, 103, false);
          RESET ALL;
          "@
            [System.IO.File]::WriteAllText((Join-Path $sql 'data.sql'),$data,[System.Text.UTF8Encoding]::new($false))
            $zip = Join-Path $dir 'fixture.zip'
