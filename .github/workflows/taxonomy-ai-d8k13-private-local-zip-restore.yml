name: "[WT:taxonomy-ai] D8K13 Private Local ZIP Restore Contract"
on:
  push:
    branches:
      - feat/taxonomy-ai/d8k13-legacy-self-review-reconciliation-design-20261016
    paths:
      - scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1
      - scripts/product-evidence/audit-d8k13-definer-format-owner-local.py
      - scripts/product-evidence/diagnose-d8k13-private-backup-schema-line-local.ps1
      - .github/workflows/taxonomy-ai-d8k13-private-local-zip-restore.yml
permissions:
  contents: read
concurrency:
  group: d8k13-private-local-zip-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    name: "Synthetic ZIP: inspect / isolated PG17 restore / reject bad archive"
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate redacted local Python EXECUTE-format source scanner
        shell: bash
        run: |
          python3 -m py_compile scripts/product-evidence/audit-d8k13-definer-format-owner-local.py
          python3 scripts/product-evidence/audit-d8k13-definer-format-owner-local.py --self-test
      - name: Parse local owner PowerShell script before any Docker work
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('./scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1',[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'D8K13_LOCAL_RESTORE_SCRIPT_PARSER_FAILED' }
          Write-Host 'D8K13_LOCAL_RESTORE_SCRIPT_PARSE_PASS'
      - name: Validate metadata-only schema source-line classifier with synthetic ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('./scripts/product-evidence/diagnose-d8k13-private-backup-schema-line-local.ps1',[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw 'D8K13_LINE_CLASSIFIER_PARSE_FAILED' }
          $root = Join-Path $env:RUNNER_TEMP 'd8k13-lexical-fixture'
          $sqlDir = Join-Path $root 'sql'
          New-Item -ItemType Directory -Path $sqlDir -Force | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $sqlDir 'roles.sql'),"CREATE ROLE synthetic_role NOLOGIN;`nCREATE ROLE local_fixture_role NOLOGIN;",[System.Text.UTF8Encoding]::new($false))
          # Satisfy the real-backup archive minimum size using SYNTHETIC entropy only.
          $entropy = New-Object byte[] 4096
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($entropy) } finally { $rng.Dispose() }
          [System.IO.File]::AppendAllText((Join-Path $sqlDir 'roles.sql'),("`n-- " + [Convert]::ToBase64String($entropy) + "`n"))
          [System.IO.File]::WriteAllText((Join-Path $sqlDir 'data.sql'),"SELECT 1;",[System.Text.UTF8Encoding]::new($false))
          $fixtureSql = @'
          -- SECRET_CANARY_NEVER_OUTPUT fake
          CREATE SCHEMA private;
          CREATE FUNCTION private.fixture() RETURNS boolean LANGUAGE sql AS 'SELECT true';
          ALTER FUNCTION private.fixture() OWNER TO product_offer_link_health_recorder_owner;
          GRANT EXECUTE ON FUNCTION private.fixture() TO authenticated;
          ALTER TABLE public.fake
            OWNER TO postgres;
          ALTER FUNCTION public.more() OWNER TO "local_fixture_role";
          ALTER FUNCTION recommendation_shadow.more() OWNER TO authenticated;
          ALTER FUNCTION public.more() OWNER TO "bad-role";
          '@
          [System.IO.File]::WriteAllText((Join-Path $sqlDir 'schema.sql'),$fixtureSql,[System.Text.UTF8Encoding]::new($false))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $root 'synthetic.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory($sqlDir,$zip)
          $bytes = [long](Get-Item -LiteralPath $zip).Length
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          $script = './scripts/product-evidence/diagnose-d8k13-private-backup-schema-line-local.ps1'
          $result = & pwsh -NoProfile -File $script -BackupZip $zip -ExpectedZipBytes $bytes -ExpectedSha256 $sha -LineNumber 4
          if ($LASTEXITCODE -ne 0) { throw 'D8K13_LINE_CLASSIFIER_EXEC_FAILED' }
          $json = $result | ConvertFrom-Json
          if ($json.status -ne 'D8K13_LOCAL_SCHEMA_LINE_CLASSIFIED_METADATA_ONLY' -or
              $json.verb -ne 'ALTER' -or $json.objectKind -ne 'FUNCTION' -or
              $json.operation -ne 'OWNER_TO' -or -not $json.mentionsKnownPrivateSchema -or
              -not $json.mentionsKnownFunctionOwnerRole) { throw 'D8K13_LINE_CLASSIFIER_FUNCTION_OWNER_RESULT_WRONG' }
          if (($result -join '') -match 'SECRET_CANARY|fixture|synthetic_role|CREATE FUNCTION|ALTER FUNCTION|product_offer_link_health_recorder_owner') {
            throw 'D8K13_LINE_CLASSIFIER_SOURCE_CONTENT_LEAKED'
          }
          $grantResult = & pwsh -NoProfile -File $script -BackupZip $zip -ExpectedZipBytes $bytes -ExpectedSha256 $sha -LineNumber 5
          if ($LASTEXITCODE -ne 0) { throw 'D8K13_LINE_CLASSIFIER_GRANT_FAILED' }
          $grant = $grantResult | ConvertFrom-Json
          if ($grant.verb -ne 'GRANT' -or $grant.operation -ne 'GRANT' -or $grant.objectKind -ne 'FUNCTION') {
            throw 'D8K13_LINE_CLASSIFIER_GRANT_WRONG'
          }
          $ownerResult = & pwsh -NoProfile -File $script -BackupZip $zip -ExpectedZipBytes $bytes -ExpectedSha256 $sha -LineNumber 7
          $owner = $ownerResult | ConvertFrom-Json
          if ($owner.objectKind -ne 'TABLE' -or $owner.operation -ne 'OWNER_TO') {
            throw 'D8K13_LINE_CLASSIFIER_MULTILINE_OWNER_WRONG'
          }
          if ($json.ownerTransferStatementShape -ne 'QUALIFIED_SINGLE_LINE' -or
              $json.ownerRoleSourceClass -ne 'NOT_DECLARED_OR_EXTERNALLY_MANAGED' -or
              $json.functionSchemaClass -ne 'PRIVATE') { throw 'D8K13_OWNER_CLASSIFIER_PRIVATE_PROVENANCE_WRONG' }
          $declaredResult = & pwsh -NoProfile -File $script -BackupZip $zip -ExpectedZipBytes $bytes -ExpectedSha256 $sha -LineNumber 8
          if ($LASTEXITCODE -ne 0) { throw 'D8K13_OWNER_CLASSIFIER_DECLARED_ROLE_EXEC_FAILED' }
          $declared = $declaredResult | ConvertFrom-Json
          if ($declared.ownerRoleSourceClass -ne 'DECLARED_IN_ROLES_SQL' -or
              $declared.functionSchemaClass -ne 'PUBLIC' -or
              $declared.ownerTransferStatementShape -ne 'QUALIFIED_SINGLE_LINE') { throw 'D8K13_OWNER_CLASSIFIER_DECLARED_ROLE_WRONG' }
          $managedResult = & pwsh -NoProfile -File $script -BackupZip $zip -ExpectedZipBytes $bytes -ExpectedSha256 $sha -LineNumber 9
          if ($LASTEXITCODE -ne 0) { throw 'D8K13_OWNER_CLASSIFIER_MANAGED_ROLE_EXEC_FAILED' }
          $managed = $managedResult | ConvertFrom-Json
          if ($managed.ownerRoleSourceClass -ne 'KNOWN_SUPABASE_BASELINE' -or
              $managed.functionSchemaClass -ne 'OTHER_CUSTOM') { throw 'D8K13_OWNER_CLASSIFIER_MANAGED_ROLE_WRONG' }
          $unsupportedResult = & pwsh -NoProfile -File $script -BackupZip $zip -ExpectedZipBytes $bytes -ExpectedSha256 $sha -LineNumber 10
          if ($LASTEXITCODE -ne 0) { throw 'D8K13_OWNER_CLASSIFIER_UNSUPPORTED_EXEC_FAILED' }
          $unsupported = $unsupportedResult | ConvertFrom-Json
          if ($unsupported.ownerTransferStatementShape -ne 'UNPARSEABLE' -or
              $unsupported.ownerRoleSourceClass -ne 'UNDETERMINED') { throw 'D8K13_OWNER_CLASSIFIER_UNSUPPORTED_DID_NOT_FAIL_CLOSED' }
          $allClassifications = @($result,$declaredResult,$managedResult,$unsupportedResult) -join ' '
          if ($allClassifications -match 'SECRET_CANARY|fixture|synthetic_role|local_fixture_role|product_offer_link_health_recorder_owner|CREATE FUNCTION|ALTER FUNCTION|bad-role') {
            throw 'D8K13_OWNER_CLASSIFIER_ROLE_OR_RAW_SQL_LEAKED'
          }
          $bad = & pwsh -NoProfile -File $script -BackupZip $zip -ExpectedZipBytes $bytes -ExpectedSha256 ('0'*64) -LineNumber 4 2>&1
          if ($LASTEXITCODE -ne 3 -or (($bad -join '') -notmatch 'D8K13_LOCAL_SCHEMA_LINE_CLASSIFICATION_FAILED')) {
            throw 'D8K13_LINE_CLASSIFIER_BAD_HASH_NOT_REJECTED'
          }
          Write-Host 'D8K13_LOCAL_SCHEMA_LINE_METADATA_ONLY_SYNTHETIC_PASS'
          exit 0 # Deliberate negative child exit=3 must not fail the parent step.
      - name: Test offline policy reference inventory on 20 synthetic policies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = './scripts/product-evidence/diagnose-d8k13-policy-dependencies-local.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw 'D8K13_POLICY_INVENTORY_PARSE_FAILED' }
          $root = Join-Path $env:RUNNER_TEMP 'policy-reference-synthetic'
          $sql = Join-Path $root 'sql'
          New-Item -ItemType Directory -Path $sql -Force | Out-Null
          $lines = New-Object 'System.Collections.Generic.List[string]'
          $lines.Add("CREATE FUNCTION public.my_helper() RETURNS boolean LANGUAGE sql AS 'SELECT true';")
          $lines.Add('CREATE TABLE public.products(id integer);')
          for ($i=1; $i -le 20; $i++) {
            $lines.Add("CREATE POLICY fixture_$i")
            $lines.Add('  ON public.products')
            $lines.Add('  FOR SELECT')
            $lines.Add('  USING ("auth"."uid"() IS NOT NULL AND "public"."my_helper"() AND missing_local_helper());')
          }
          [System.IO.File]::WriteAllLines((Join-Path $sql 'schema.sql'),$lines,[System.Text.UTF8Encoding]::new($false))
          $entropy = New-Object byte[] 4096
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($entropy) } finally { $rng.Dispose() }
          [System.IO.File]::WriteAllText((Join-Path $sql 'roles.sql'),[Convert]::ToBase64String($entropy))
          [System.IO.File]::WriteAllText((Join-Path $sql 'data.sql'),'SELECT 1;')
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Join-Path $root 'synthetic.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory($sql,$archive)
          $bytes = [long](Get-Item -LiteralPath $archive).Length
          $sha = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          $out = & pwsh -NoProfile -File $script -BackupZip $archive -ExpectedZipBytes $bytes -ExpectedSha256 $sha -FirstErrorLine 6 -ErrorCount 20 -ErrorLineStep 4
          if ($LASTEXITCODE -ne 0) { throw 'D8K13_POLICY_INVENTORY_EXEC_FAILED' }
          $result = $out | ConvertFrom-Json
          if ($result.inspectedPolicyCount -ne 20 -or $result.rawSqlReturned -ne $false -or
              $result.dataSqlExecuted -ne $false -or $result.functionExistsInIsolatedRuntimeVerified -ne $false) {
            throw 'D8K13_POLICY_INVENTORY_SAFETY_FAILED'
          }
          if (@($result.references | Where-Object { $_.functionIdentifier -eq 'auth.uid' -and
            $_.referencedByPolicies -eq 20 -and -not $_.declaredInSourceSchemaDump }).Count -ne 1) {
            throw 'D8K13_POLICY_INVENTORY_AUTH_REFERENCE_FAILED'
          }
          if (@($result.references | Where-Object { $_.functionIdentifier -eq 'public.my_helper' -and
            $_.referencedByPolicies -eq 20 -and $_.declaredInSourceSchemaDump }).Count -ne 1) {
            throw 'D8K13_POLICY_INVENTORY_DECLARED_HELPER_FAILED'
          }
          if ($result.uniqueQualifiedReferenceCount -ne 2 -or
              $result.uniqueUnqualifiedReferenceCount -ne 1 -or
              $result.quotedIdentifiersObserved -ne $true -or
              $result.lexicalReferencesAreNotProofOfMissingFunctions -ne $true) {
            throw 'D8K13_POLICY_QUOTED_UNQUALIFIED_REFERENCE_CLASSIFICATION_FAILED'
          }
          if (@($result.references | Where-Object {
            $_.functionIdentifier -eq 'missing_local_helper' -and
            $_.referencedByPolicies -eq 20 -and -not $_.declaredInSourceSchemaDump -and
            $_.namespaceFamily -eq 'UNQUALIFIED_OR_SEARCH_PATH'
          }).Count -ne 1) { throw 'D8K13_POLICY_UNQUALIFIED_HELPER_INVENTORY_FAILED' }
          if (($out -join '') -match 'CREATE POLICY|USING \(|CREATE TABLE|SELECT true') {
            throw 'D8K13_POLICY_INVENTORY_SOURCE_SQL_LEAKED'
          }
          Write-Host 'D8K13_SYNTHETIC_POLICY_REFERENCE_INVENTORY_PASS'
      - name: Generate non-sensitive synthetic Supabase-shaped ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d8k13-local-fixture/sql"
          cat > "$RUNNER_TEMP/d8k13-local-fixture/sql/roles.sql" <<'SQL'
          -- Synthetic, not copied from production.
          CREATE ROLE d8k13_local_fixture_role NOLOGIN;
          CREATE ROLE "product_offer_link_health_recorder_owner";
          CREATE ROLE d8k13_public_fixture_owner NOLOGIN;
          ALTER ROLE "product_offer_link_health_recorder_owner" WITH NOLOGIN;
          GRANT anon TO d8k13_local_fixture_role;
          GRANT authenticated TO d8k13_local_fixture_role;
          SQL
          # Synthetic entropy, so compressed ZIP resembles a real nontrivial archive.
          printf '%s' '-- ' >> "$RUNNER_TEMP/d8k13-local-fixture/sql/roles.sql"
          head -c 4096 /dev/urandom | base64 -w0 >> "$RUNNER_TEMP/d8k13-local-fixture/sql/roles.sql"
          printf '\n' >> "$RUNNER_TEMP/d8k13-local-fixture/sql/roles.sql"
          cat > "$RUNNER_TEMP/d8k13-local-fixture/sql/schema.sql" <<'SQL'
          -- Synthetic, not copied from production.
          CREATE SCHEMA public;
          CREATE TABLE public.products(id integer PRIMARY KEY, name text NOT NULL, owner_id uuid REFERENCES auth.users(id));
          CREATE FUNCTION public.d8k13_public_fixture() RETURNS boolean LANGUAGE sql AS 'SELECT true';
          ALTER FUNCTION public.d8k13_public_fixture() OWNER TO d8k13_public_fixture_owner;
          CREATE VIEW public.product_names AS SELECT name FROM public.products;
          ALTER TABLE public.products ENABLE ROW LEVEL SECURITY;
          CREATE POLICY fixture_select ON public.products FOR SELECT TO authenticated USING (owner_id = (select auth.uid()) AND coalesce((auth.jwt() ->> 'role'), 'authenticated') = 'authenticated');
          -- Both custom namespaces intentionally omitted from CREATE SCHEMA.
          -- This reproduces references in real dumps to schemas absent in bare image.
          CREATE FUNCTION private.fixture_probe() RETURNS boolean LANGUAGE sql AS 'SELECT true';
          ALTER FUNCTION private.fixture_probe() OWNER TO "product_offer_link_health_recorder_owner";
          CREATE FUNCTION recommendation_shadow.fixture_probe() RETURNS integer LANGUAGE sql AS 'SELECT 42';
          ALTER DEFAULT PRIVILEGES IN SCHEMA private GRANT SELECT ON TABLES TO authenticated;
          SQL
          cat > "$RUNNER_TEMP/d8k13-local-fixture/sql/data.sql" <<'SQL'
          -- Synthetic, not copied from production.
          COPY public.products (id, name) FROM stdin;
          1	synthetic only
          \.
          SQL
          pwsh -NoProfile -Command 'Add-Type -AssemblyName System.IO.Compression.FileSystem; [System.IO.Compression.ZipFile]::CreateFromDirectory((Join-Path $env:RUNNER_TEMP "d8k13-local-fixture/sql"),(Join-Path $env:RUNNER_TEMP "d8k13-local-fixture/synthetic.zip"))'
          echo "ZIP_PATH=$RUNNER_TEMP/d8k13-local-fixture/synthetic.zip" >> "$GITHUB_ENV"
          echo "ZIP_BYTES=$(stat -c%s "$RUNNER_TEMP/d8k13-local-fixture/synthetic.zip")" >> "$GITHUB_ENV"
      - name: Inspect three-file synthetic archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & pwsh -NoProfile -File ./scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1 -BackupZip $env:ZIP_PATH -ExpectedZipBytes ([long]$env:ZIP_BYTES) -Mode Inspect
          if ($LASTEXITCODE -ne 0) { Write-Host ($output -join "`n"); throw 'D8K13_SYNTHETIC_INSPECTION_FAILED' }
          if (-not ($output | Select-String -SimpleMatch 'D8K13_LOCAL_ZIP_INSPECTION_PASS')) { throw 'D8K13_SYNTHETIC_INSPECTION_MARKER_MISSING' }
          Write-Host 'D8K13_SYNTHETIC_LOCAL_ZIP_INSPECTION_PASS'
      - name: Classify all synthetic data commands without Docker or source text output
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:RUNNER_TEMP 'd8k13-command-families/sql'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $base=Join-Path $env:RUNNER_TEMP 'd8k13-local-fixture/sql'
          Copy-Item (Join-Path $base 'roles.sql') (Join-Path $target 'roles.sql')
          Copy-Item (Join-Path $base 'schema.sql') (Join-Path $target 'schema.sql')
          $data=@'
          -- No real backup SQL is included.
          SET client_encoding = 'UTF8';
          COPY public.products (id, name) FROM stdin;
          21	SELECT value only inside COPY, never executable
          \.
          SELECT pg_catalog.setval('public.local_dummy_sequence', 5, true);
          SELECT pg_catalog.setval('public.local_dummy_sequence'::regclass, 5, true);
          SELECT something_synthetic_and_unexpected();
          ALTER TABLE public.products ENABLE TRIGGER ALL;
          \unexpected_guard synthetic-only
          COPY auth.synthetic_service_object (id, value) FROM stdin;
          22	synthetic managed payload
          \.
          RESET ALL;
          '@
          [System.IO.File]::WriteAllText((Join-Path $target 'data.sql'),$data,[System.Text.UTF8Encoding]::new($false))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=Join-Path $env:RUNNER_TEMP 'd8k13-command-families/fixture.zip'
          [System.IO.Compression.ZipFile]::CreateFromDirectory($target,$zip)
          $bytes=[long](Get-Item -LiteralPath $zip).Length
          $original=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          $output=& pwsh -NoProfile -File ./scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1 -BackupZip $zip -ExpectedZipBytes $bytes -Mode AuditDataCommands
          if ($LASTEXITCODE -ne 0) { throw 'D8K13_DATA_COMMAND_FAMILIES_AUDIT_SCRIPT_FAILED' }
          $match=@($output | Where-Object { $_ -match '"status":"D8K13_LOCAL_DATA_COMMAND_FAMILY_AUDIT_ONLY_NO_RESTORE"' })
          if ($match.Count -ne 1) { throw 'D8K13_DATA_COMMAND_FAMILIES_AUDIT_MISSING' }
          $result=$match[0] | ConvertFrom-Json
          if ($result.copyHeaders -ne 2 -or $result.unexpectedCommandCount -ne 3 -or
              @($result.unexpectedSamples).Count -ne 3 -or
              $result.copyPayloadLinesNotInspected -ne 2 -or
              $result.noDockerStarted -ne $true -or $result.dataRowsImported -ne $false -or
              $result.originalZipModified -ne $false -or $result.rawSqlOrDataReturned -ne $false -or
              $result.productionDatabaseConnections -ne 0 -or $result.releaseAuthorized -ne $false) {
            throw 'D8K13_DATA_COMMAND_FAMILIES_AUDIT_CONTRACT_FAILED'
          }
          if (@($result.recognizedClasses | Where-Object { $_.commandClass -eq 'RESET_ALL_SYNTAX_RECOGNIZED' -and $_.count -eq 1 }).Count -ne 1) {
            throw 'D8K13_COMMAND_AUDIT_RESET_ALL_TRAILER_MISSING'
          }
          foreach($klass in @('SELECT_OTHER','ALTER_OTHER','PSQL_META_OTHER')) {
            if (@($result.unexpectedSamples | Where-Object { $_.commandClass -eq $klass }).Count -ne 1) {
              throw 'D8K13_DATA_COMMAND_CLASS_UNEXPECTED_OR_MISSING'
            }
          }
          if ($match[0] -match 'SELECT something_synthetic|ALTER TABLE public|synthetic managed payload|unexpected_guard|COPY auth') {
            throw 'D8K13_DATA_COMMAND_AUDIT_LEAKED_SQL_OR_ROW'
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash -ne $original) {
            throw 'D8K13_DATA_COMMAND_AUDIT_MODIFIED_ZIP'
          }
          Write-Host 'D8K13_SYNTHETIC_ALL_DATA_COMMAND_CLASSES_NO_DOCKER_PASS'
      - name: Check clean Supabase/Postgres image schema prerequisites (no owner ZIP)
        shell: bash
        run: |
          set -euo pipefail
          c="d8k13-schema-doctor-$RANDOM"
          trap 'docker rm -f "$c" >/dev/null 2>&1 || true' EXIT
          docker run --detach --rm --name "$c" --network none \
            -e POSTGRES_PASSWORD=d8k13_ci_fixture_only \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_HOST=/var/run/postgresql \
            -e PGPORT=5432 \
            -e POSTGRES_PORT=5432 \
            -e PGPASSWORD=d8k13_ci_fixture_only \
            -e JWT_SECRET=d8k13_ci_fixture_only_long_test_string \
            -e JWT_EXP=3600 \
            supabase/postgres:17.6.1.136 postgres \
            -c config_file=/etc/postgresql/postgresql.conf >/dev/null
          # pg_isready succeeds before Supabase's init SQL finishes.
          # Wait for its managed roles/schemas/extension prerequisites.
          ready=""
          previous=""
          stable=0
          for n in {1..90}; do
            probe="$(docker exec -u postgres "$c" psql -X -q -t -A -U postgres -d postgres -v ON_ERROR_STOP=1 -c "SELECT CASE WHEN (SELECT count(*) FROM pg_roles WHERE rolname IN ('anon','authenticated','service_role','supabase_admin'))=4 AND to_regclass('auth.users') IS NOT NULL AND EXISTS(SELECT 1 FROM pg_namespace WHERE nspname='storage') AND EXISTS(SELECT 1 FROM pg_extension WHERE extname='supabase_vault') AND EXISTS(SELECT 1 FROM pg_namespace WHERE nspname='extensions') THEN floor(extract(epoch FROM pg_postmaster_start_time()))::bigint::text ELSE '0' END" 2>/dev/null || true)"
            if [[ "$probe" =~ ^[0-9]{10}$ && "$probe" = "$previous" ]]; then
              stable=$((stable+1))
            else
              stable=0
            fi
            previous="$probe"
            if [ "$stable" -ge 6 ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          docker exec -u postgres "$c" psql -X -q -t -A \
            -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT 'D8K13_SUPABASE_IMAGE_BASELINE_SCHEMA_' || x.name || '_' || CASE WHEN n.oid IS NULL THEN 'MISSING' ELSE 'PRESENT' END FROM (VALUES('auth'),('storage'),('vault'),('extensions'),('private'),('recommendation_shadow'),('realtime'),('graphql'),('graphql_public'),('pgbouncer'),('supabase_migrations')) AS x(name) LEFT JOIN pg_namespace n ON n.nspname=x.name ORDER BY x.name;" \
            | tee "$RUNNER_TEMP/d8k13-image-schemas.txt"
          test -s "$RUNNER_TEMP/d8k13-image-schemas.txt"
          docker exec -u postgres "$c" psql -X -q -t -A \
            -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT 'D8K13_SUPABASE_IMAGE_BASELINE_EXTENSION_' || x.name || '_' || CASE WHEN e.oid IS NULL THEN 'MISSING' ELSE 'PRESENT' END FROM (VALUES('supabase_vault'),('pgcrypto'),('pg_stat_statements'),('uuid-ossp')) AS x(name) LEFT JOIN pg_extension e ON e.extname=x.name ORDER BY x.name;"
      - name: Simulate first-run host with no cached Supabase PostgreSQL image
        shell: bash
        run: |
          set -euo pipefail
          docker image rm --force supabase/postgres:17.6.1.136 >/dev/null 2>&1 || true
          if docker image inspect supabase/postgres:17.6.1.136 >/dev/null 2>&1; then
            echo D8K13_SYNTHETIC_COLD_IMAGE_NOT_REMOVED >&2
            exit 1
          fi
          echo D8K13_SYNTHETIC_COLD_IMAGE_PRECONDITION_PASS
      - name: Restore synthetic backup with built-in Supabase auth roles in no-network PostgreSQL 17
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & pwsh -NoProfile -File ./scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1 -BackupZip $env:ZIP_PATH -ExpectedZipBytes ([long]$env:ZIP_BYTES) -Mode Restore
          if ($LASTEXITCODE -ne 0) { throw 'D8K13_SYNTHETIC_RESTORE_FAILED' }
