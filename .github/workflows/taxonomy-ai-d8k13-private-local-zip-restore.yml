name: "[WT:taxonomy-ai] D8K13 Private Local ZIP Restore Contract"
on:
  push:
    branches:
      - feat/taxonomy-ai/d8k13-legacy-self-review-reconciliation-design-20261016
    paths:
      - scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1
      - .github/workflows/taxonomy-ai-d8k13-private-local-zip-restore.yml
permissions:
  contents: read
concurrency:
  group: d8k13-private-local-zip-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    name: "Synthetic ZIP: inspect / isolated PG17 restore / reject bad archive"
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generate non-sensitive synthetic Supabase-shaped ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d8k13-local-fixture/sql"
          cat > "$RUNNER_TEMP/d8k13-local-fixture/sql/roles.sql" <<'SQL'
          -- Synthetic, not copied from production.
          CREATE ROLE d8k13_local_fixture_role NOLOGIN;
          GRANT anon TO d8k13_local_fixture_role;
          GRANT authenticated TO d8k13_local_fixture_role;
          SQL
          # Synthetic entropy, so compressed ZIP resembles a real nontrivial archive.
          printf '%s' '-- ' >> "$RUNNER_TEMP/d8k13-local-fixture/sql/roles.sql"
          head -c 4096 /dev/urandom | base64 -w0 >> "$RUNNER_TEMP/d8k13-local-fixture/sql/roles.sql"
          printf '\n' >> "$RUNNER_TEMP/d8k13-local-fixture/sql/roles.sql"
          cat > "$RUNNER_TEMP/d8k13-local-fixture/sql/schema.sql" <<'SQL'
          -- Synthetic, not copied from production.
          CREATE SCHEMA public;
          CREATE TABLE public.products(id integer PRIMARY KEY, name text NOT NULL, owner_id uuid REFERENCES auth.users(id));
          CREATE VIEW public.product_names AS SELECT name FROM public.products;
          ALTER TABLE public.products ENABLE ROW LEVEL SECURITY;
          CREATE POLICY fixture_select ON public.products FOR SELECT TO authenticated USING (owner_id = (select auth.uid()));
          SQL
          cat > "$RUNNER_TEMP/d8k13-local-fixture/sql/data.sql" <<'SQL'
          -- Synthetic, not copied from production.
          COPY public.products (id, name) FROM stdin;
          1	synthetic only
          \.
          SQL
          pwsh -NoProfile -Command 'Add-Type -AssemblyName System.IO.Compression.FileSystem; [System.IO.Compression.ZipFile]::CreateFromDirectory((Join-Path $env:RUNNER_TEMP "d8k13-local-fixture/sql"),(Join-Path $env:RUNNER_TEMP "d8k13-local-fixture/synthetic.zip"))'
          echo "ZIP_PATH=$RUNNER_TEMP/d8k13-local-fixture/synthetic.zip" >> "$GITHUB_ENV"
          echo "ZIP_BYTES=$(stat -c%s "$RUNNER_TEMP/d8k13-local-fixture/synthetic.zip")" >> "$GITHUB_ENV"
      - name: Inspect three-file synthetic archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & pwsh -NoProfile -File ./scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1 -BackupZip $env:ZIP_PATH -ExpectedZipBytes ([long]$env:ZIP_BYTES) -Mode Inspect
          if ($LASTEXITCODE -ne 0) { Write-Host ($output -join "`n"); throw 'D8K13_SYNTHETIC_INSPECTION_FAILED' }
          if (-not ($output | Select-String -SimpleMatch 'D8K13_LOCAL_ZIP_INSPECTION_PASS')) { throw 'D8K13_SYNTHETIC_INSPECTION_MARKER_MISSING' }
          Write-Host 'D8K13_SYNTHETIC_LOCAL_ZIP_INSPECTION_PASS'
      - name: Restore synthetic backup with built-in Supabase auth roles in no-network PostgreSQL 17
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & pwsh -NoProfile -File ./scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1 -BackupZip $env:ZIP_PATH -ExpectedZipBytes ([long]$env:ZIP_BYTES) -Mode Restore
          if ($LASTEXITCODE -ne 0) { throw 'D8K13_SYNTHETIC_RESTORE_FAILED' }
          if (-not ($output | Select-String -SimpleMatch 'D8K13_DISPOSABLE_PG17_SQL_RESTORE_PASS_LIMITED')) { throw 'D8K13_SYNTHETIC_RESTORE_MARKER_MISSING' }
          Write-Host 'D8K13_SYNTHETIC_LOCAL_ZIP_PG17_RESTORE_PASS_HOLD'
      - name: Reject wrong-size archive, no backups in CI artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $wrong = [long]$env:ZIP_BYTES + 1
          $output = & pwsh -NoProfile -File ./scripts/product-evidence/verify-d8k13-private-backup-zip-local.ps1 -BackupZip $env:ZIP_PATH -ExpectedZipBytes $wrong -Mode Inspect 2>$null
          if ($LASTEXITCODE -ne 3) { throw 'D8K13_BAD_SIZE_MUST_EXIT_3' }
          Write-Host 'D8K13_LOCAL_ZIP_FAIL_CLOSED_WRONG_SIZE_PASS'
          exit 0 # The deliberate child exit=3 must not fail the test step.
