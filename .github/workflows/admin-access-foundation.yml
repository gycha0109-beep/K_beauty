name: Admin Access Foundation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/admin/**"
      - "lib/admin/**"
      - "lib/supabase/middleware.js"
      - "supabase/migrations/*_admin_access_foundation.sql"
      - "scripts/verify-admin-access-foundation.mjs"
      - "docs/architecture/admin-access-foundation-v1.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-access-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify admin access contracts
        run: npm run verify:admin-access-foundation

      - name: Verify architecture boundaries
        run: npm run architecture:guard

      - name: Build production application
        run: npm run build

      - name: Check changed-file whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
