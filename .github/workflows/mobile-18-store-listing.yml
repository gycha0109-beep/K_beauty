name: BEJEWELY Mobile 18 Store Listing Metadata

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/store/mobile-store-listing-final.json"
      - "docs/store/mobile-listing-claims-readiness.json"
      - "apps/mobile/google-play-health-apps-declaration.json"
      - "scripts/verify-mobile-18-store-listing.mjs"
      - ".github/workflows/mobile-18-store-listing.yml"
  push:
    branches: [main]
    paths:
      - "docs/store/mobile-store-listing-final.json"
      - "docs/store/mobile-listing-claims-readiness.json"
      - "apps/mobile/google-play-health-apps-declaration.json"
      - "scripts/verify-mobile-18-store-listing.mjs"
      - ".github/workflows/mobile-18-store-listing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-18-store-listing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  store-listing-metadata:
    name: Store Listing Metadata Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_18_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1

      - name: Verify final store listing metadata
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-mobile-18-store-listing.mjs
          node scripts/verify-mobile-18-store-listing.mjs
