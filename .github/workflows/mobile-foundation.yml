name: BEJEWELY Mobile Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-mobile-architecture-foundation.mjs"
      - ".github/workflows/mobile-foundation.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-mobile-architecture-foundation.mjs"
      - ".github/workflows/mobile-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-foundation:
    name: BEJEWELY Mobile Foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_FOUNDATION_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify mobile architecture boundary
        run: npm run verify:mobile-foundation

      - name: Run mobile static lint
        run: npm run mobile:lint

      - name: Run mobile TypeScript check
        run: npm run mobile:typecheck

      - name: Validate Expo public config
        run: npm run mobile:config

      - name: Export Android JS bundle
        run: npm run mobile:export:android
