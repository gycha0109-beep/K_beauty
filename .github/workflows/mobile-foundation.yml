name: BEJEWELY Mobile Foundation

# Canonical lightweight Mobile product gate.
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "!apps/mobile/store-readiness.json"
      - "!apps/mobile/google-play-data-safety.json"
      - "!apps/mobile/google-play-health-apps-declaration.json"
      - "packages/shared/**"
      - "app/api/analyze/**"
      - "app/api/results/**"
      - "app/api/full-report/**"
      - "app/api/my/dashboard/**"
      - "app/api/premium/access/**"
      - "app/api/current-products/products/**"
      - "lib/analysis-result-access.js"
      - "lib/analysis-results.js"
      - "lib/my/dashboard.js"
      - "lib/premium-access.js"
      - "lib/premium-report-session.js"
      - "lib/premium-route-context.js"
      - "lib/premium-current-products.js"
      - "lib/current-products.js"
      - "lib/security/analysis-request-guard*.js"
      - "lib/security/public-result-read-guard*.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-mobile-architecture-foundation.mjs"
      - "scripts/verify-mobile-camera-foundation.mjs"
      - "scripts/verify-mobile-face-guidance.mjs"
      - "scripts/verify-mobile-analyze-integration.mjs"
      - "scripts/verify-mobile-auth-foundation.mjs"
      - "scripts/verify-mobile-my-skin-diary.mjs"
      - "scripts/verify-mobile-saved-report-reentry.mjs"
      - "scripts/verify-mobile-public-share.mjs"
      - "scripts/verify-mobile-public-result-deep-link.mjs"
      - "scripts/verify-mobile-premium-entry.mjs"
      - "scripts/verify-mobile-android-smoke.sh"
      - ".github/workflows/mobile-foundation.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "!apps/mobile/store-readiness.json"
      - "!apps/mobile/google-play-data-safety.json"
      - "!apps/mobile/google-play-health-apps-declaration.json"
      - "packages/shared/**"
      - "app/api/analyze/**"
      - "app/api/results/**"
      - "app/api/full-report/**"
      - "app/api/my/dashboard/**"
      - "app/api/premium/access/**"
      - "app/api/current-products/products/**"
      - "lib/analysis-result-access.js"
      - "lib/analysis-results.js"
      - "lib/my/dashboard.js"
      - "lib/premium-access.js"
      - "lib/premium-report-session.js"
      - "lib/premium-route-context.js"
      - "lib/premium-current-products.js"
      - "lib/current-products.js"
      - "lib/security/analysis-request-guard*.js"
      - "lib/security/public-result-read-guard*.js"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-mobile-architecture-foundation.mjs"
      - "scripts/verify-mobile-camera-foundation.mjs"
      - "scripts/verify-mobile-face-guidance.mjs"
      - "scripts/verify-mobile-analyze-integration.mjs"
      - "scripts/verify-mobile-auth-foundation.mjs"
      - "scripts/verify-mobile-my-skin-diary.mjs"
      - "scripts/verify-mobile-saved-report-reentry.mjs"
      - "scripts/verify-mobile-public-share.mjs"
      - "scripts/verify-mobile-public-result-deep-link.mjs"
      - "scripts/verify-mobile-premium-entry.mjs"
      - "scripts/verify-mobile-android-smoke.sh"
      - ".github/workflows/mobile-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-foundation:
    name: BEJEWELY Mobile Foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_FOUNDATION_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify Android smoke shell syntax
        run: bash -n scripts/verify-mobile-android-smoke.sh

      - name: Verify Mobile product contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-mobile-camera-foundation.mjs
          node scripts/verify-mobile-face-guidance.mjs
          node scripts/verify-mobile-analyze-integration.mjs
          node scripts/verify-mobile-auth-foundation.mjs
          node scripts/verify-mobile-my-skin-diary.mjs
          node scripts/verify-mobile-saved-report-reentry.mjs
          node scripts/verify-mobile-public-share.mjs
          node scripts/verify-mobile-public-result-deep-link.mjs
          node scripts/verify-mobile-premium-entry.mjs

      - name: Verify mobile architecture boundary
        run: npm run verify:mobile-foundation

      - name: Run mobile static lint
        run: npm run mobile:lint

      - name: Run mobile TypeScript check
        run: npm run mobile:typecheck

      - name: Validate Expo public config
        run: npm run mobile:config

      - name: Export Android JS bundle
        run: npm run mobile:export:android
