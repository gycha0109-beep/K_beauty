name: Resolve Hosted Preview GitHub Deployment ID 6e85fb

on:
  pull_request:
    branches:
      - validation/premium-hosted-preview-deployment-id-6e85fb
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  deployments: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve exact Preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 6e85fb7ed73256baa0ff1ec3434758b8c7a9b45a
        run: |
          set -euo pipefail
          payload="$(gh api --paginate "repos/gycha0109-beep/K_beauty/deployments?sha=${EXPECTED_SHA}")"
          matches="$(printf '%s' "$payload" | jq -c '[.[] | select((.environment | ascii_downcase) == "preview" and .sha == env.EXPECTED_SHA)]')"
          count="$(printf '%s' "$matches" | jq 'length')"
          test "$count" -ge 1
          printf '%s' "$matches" | jq -c '.[] | {id, sha, ref, environment, created_at, updated_at}'
