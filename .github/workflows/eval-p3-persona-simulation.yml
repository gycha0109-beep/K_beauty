name: EVAL-P3 Deterministic Persona Simulation PoC

on:
  push:
    branches:
      - eval/p3-deterministic-persona-simulation-poc
      - main
  pull_request:
    paths:
      - ".github/workflows/eval-p3-persona-simulation.yml"
      - "scripts/persona-evaluation/**"
      - "scripts/verify-eval-p3-persona-simulation-v1.mjs"
      - "docs/evidence/eval-p3-persona-simulation-poc-v1.md"
      - "evidence/persona-simulation/eval-p3/**"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: eval-p3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  EVAL_P3_BASE_MAIN_SHA: 524ea7ff96616259b725ecdc9ac1a3f22133e6dc
  EVAL_P3_RECOMMENDATION_REFERENCE_SHA: 783afb91a964f5d762f46846f9ef854902b48e95
  EVAL_P3_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-eval-p3:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EVAL_P3_CHECKOUT_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact authority and ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVAL_P3_CHECKOUT_SHA"
          git merge-base --is-ancestor "$EVAL_P3_BASE_MAIN_SHA" HEAD
          test "$(git merge-base "$EVAL_P3_BASE_MAIN_SHA" HEAD)" = "$EVAL_P3_BASE_MAIN_SHA"
          test -f docs/evidence/eval-p2-persona-contract-freeze-v1.md

      - name: Bounded EVAL-P3 change scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$EVAL_P3_BASE_MAIN_SHA")"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/eval-p3-persona-simulation\.yml|scripts/persona-evaluation/.*|scripts/verify-eval-p3-persona-simulation-v1\.mjs|docs/evidence/eval-p3-persona-simulation-poc-v1\.md|evidence/persona-simulation/eval-p3/.*)$' || true)"
          test -z "$forbidden"

      - name: No Production Recommendation Product Fact or Hosted semantic mutation
        run: |
          set -euo pipefail
          git diff --exit-code "$EVAL_P3_BASE_MAIN_SHA" -- lib app/api supabase/migrations
          test -z "$(git diff --name-only "$EVAL_P3_BASE_MAIN_SHA" -- package.json package-lock.json)"

      - name: Syntax check
        run: |
          node --check scripts/persona-evaluation/eval-p3-contracts.mjs
          node --check scripts/verify-eval-p3-persona-simulation-v1.mjs

      - name: Prepare frozen Recommendation reference
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q "$EVAL_P3_RECOMMENDATION_REFERENCE_SHA"
          node -e 'const f=require("./_reference/recommendation/fixtures/recommendation-metadata/products-v1.json"); if(f.productCount!==164||f.categoryCounts?.sunscreen!==11) process.exit(1)'

      - name: EVAL-P3 deterministic Persona harness
        env:
          EVAL_P3_REFERENCE_ROOT: _reference/recommendation
          EVAL_P3_IMPLEMENTATION_SHA: ${{ env.EVAL_P3_CHECKOUT_SHA }}
          EVAL_P3_ARTIFACT_ROOT: artifacts/eval-p3
        run: node scripts/verify-eval-p3-persona-simulation-v1.mjs

      - name: Historical 164x12 Recommendation replay
        env:
          RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
        run: node scripts/verify-skin-decision-recommendation-invariance.mjs

      - name: Production build
        run: npm run build

      - name: Upload EVAL-P3 evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-p3-persona-simulation-${{ env.EVAL_P3_CHECKOUT_SHA }}
          path: artifacts/eval-p3/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish exact-SHA CI attestation
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state="success"
          context="EVAL-P3 exact-head CI"
          description="EVAL-P3 exact-head CI passed"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            context="EVAL-P3 merged-main exact-SHA CI"
            description="EVAL-P3 merged-main exact-SHA CI passed"
          fi
          if [ "$PRIOR_JOB_STATUS" != "success" ]; then
            state="failure"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              description="EVAL-P3 merged-main exact-SHA CI failed"
            else
              description="EVAL-P3 exact-head CI failed"
            fi
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="$context" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          test "$state" = "success"
