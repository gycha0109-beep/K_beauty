name: TRUST Data Governance - Phase 8H Source Frontier Audit
run-name: "[WT:trust] TRUST Data Governance - Phase 8H Source Frontier Audit"

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/trust-source-frontier-audit.mjs"
      - "scripts/verify-trust-source-frontier-audit.mjs"
      - "docs/evidence/trust-phase8h-source-frontier-inventory-v1.json"
      - "docs/evidence/trust-phase8h-source-frontier-audit-v1.md"
      - "docs/evidence/trust-phase8h-source-rediscovery-contract-v1.md"
      - "lib/trust/official-source-fetch.mjs"
      - "lib/trust/official-source-identity-qualification.mjs"
      - "lib/trust/official-source-rediscovery.mjs"
      - "scripts/trust-source-rediscovery.mjs"
      - "scripts/verify-trust-source-rediscovery.mjs"
      - "docs/evidence/trust-phase8h-boj-rediscovery-canary-v1.json"
      - "docs/evidence/trust-phase8h-boj-rediscovery-live-summary-v1.json"
      - "docs/evidence/trust-phase8h-boj-bounded-rediscovery-contract-v1.md"
      - "lib/trust/official-source-relocation-preflight.mjs"
      - "scripts/verify-trust-source-relocation-preflight.mjs"
      - "docs/evidence/trust-phase8h-dermafactory-relocation-preflight-v1.json"
      - "docs/evidence/trust-phase8h-governed-relocation-preflight-contract-v1.md"
      - "lib/trust/official-source-relocation-confirmation-request.mjs"
      - "scripts/verify-trust-source-relocation-confirmation-contract.mjs"
      - "docs/evidence/trust-phase8h-dermafactory-relocation-confirmation-request-v1.json"
      - "docs/evidence/trust-phase8h-governed-relocation-confirmation-contract-v1.md"
      - "scripts/trust-source-identity-qualification.mjs"
      - "scripts/verify-trust-source-identity-qualification.mjs"
      - "fixtures/trust-phase8h-source-identity-qualification-v1.json"
      - "docs/evidence/trust-phase8h-source-identity-qualification-canary-v1.json"
      - "docs/evidence/trust-phase8h-source-identity-qualification-live-summary-v1.json"
      - "docs/evidence/trust-phase8h-source-identity-qualification-contract-v1.md"
      - ".github/workflows/trust-phase8h-source-frontier-audit.yml"
  push:
    branches: [main, "feat/trust-phase8h-source-frontier-audit", "feat/trust-phase8h-source-identity-qualification", "feat/trust-phase8h-boj-bounded-rediscovery", "feat/trust-phase8h-governed-relocation-confirmation-contract"]
    paths:
      - "scripts/trust-source-frontier-audit.mjs"
      - "scripts/verify-trust-source-frontier-audit.mjs"
      - "docs/evidence/trust-phase8h-source-frontier-inventory-v1.json"
      - "docs/evidence/trust-phase8h-source-frontier-audit-v1.md"
      - "docs/evidence/trust-phase8h-source-rediscovery-contract-v1.md"
      - "lib/trust/official-source-fetch.mjs"
      - "lib/trust/official-source-identity-qualification.mjs"
      - "lib/trust/official-source-rediscovery.mjs"
      - "scripts/trust-source-rediscovery.mjs"
      - "scripts/verify-trust-source-rediscovery.mjs"
      - "docs/evidence/trust-phase8h-boj-rediscovery-canary-v1.json"
      - "docs/evidence/trust-phase8h-boj-rediscovery-live-summary-v1.json"
      - "docs/evidence/trust-phase8h-boj-bounded-rediscovery-contract-v1.md"
      - "lib/trust/official-source-relocation-preflight.mjs"
      - "scripts/verify-trust-source-relocation-preflight.mjs"
      - "docs/evidence/trust-phase8h-dermafactory-relocation-preflight-v1.json"
      - "docs/evidence/trust-phase8h-governed-relocation-preflight-contract-v1.md"
      - "lib/trust/official-source-relocation-confirmation-request.mjs"
      - "scripts/verify-trust-source-relocation-confirmation-contract.mjs"
      - "docs/evidence/trust-phase8h-dermafactory-relocation-confirmation-request-v1.json"
      - "docs/evidence/trust-phase8h-governed-relocation-confirmation-contract-v1.md"
      - "scripts/trust-source-identity-qualification.mjs"
      - "scripts/verify-trust-source-identity-qualification.mjs"
      - "fixtures/trust-phase8h-source-identity-qualification-v1.json"
      - "docs/evidence/trust-phase8h-source-identity-qualification-canary-v1.json"
      - "docs/evidence/trust-phase8h-source-identity-qualification-live-summary-v1.json"
      - "docs/evidence/trust-phase8h-source-identity-qualification-contract-v1.md"
      - ".github/workflows/trust-phase8h-source-frontier-audit.yml"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string
      live_audit:
        description: Run bounded live official-source frontier probes
        required: false
        default: false
        type: boolean
      live_qualification:
        description: Run bounded live exact-identity qualification canary
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Phase 8H-0 contract
        run: |
          node --check scripts/trust-source-frontier-audit.mjs
          node --check scripts/verify-trust-source-frontier-audit.mjs
          node scripts/verify-trust-source-frontier-audit.mjs

      - name: Verify Phase 8H-1 exact identity qualification
        run: |
          node --check lib/trust/official-source-identity-qualification.mjs
          node --check scripts/trust-source-identity-qualification.mjs
          node --check scripts/verify-trust-source-identity-qualification.mjs
          node scripts/verify-trust-source-identity-qualification.mjs

      - name: Verify Phase 8H-1B bounded official-source rediscovery
        run: |
          node --check lib/trust/official-source-rediscovery.mjs
          node --check scripts/trust-source-rediscovery.mjs
          node --check scripts/verify-trust-source-rediscovery.mjs
          node scripts/verify-trust-source-rediscovery.mjs

      - name: Verify Phase 8H-2A governed relocation preflight
        run: |
          node --check lib/trust/official-source-relocation-preflight.mjs
          node --check scripts/verify-trust-source-relocation-preflight.mjs
          node scripts/verify-trust-source-relocation-preflight.mjs

      - name: Verify Phase 8H-2B governed relocation confirmation request contract
        run: |
          node --check lib/trust/official-source-relocation-confirmation-request.mjs
          node --check scripts/verify-trust-source-relocation-confirmation-contract.mjs
          node scripts/verify-trust-source-relocation-confirmation-contract.mjs

      - name: Run optional live read-only frontier audit
        if: github.event_name == 'workflow_dispatch' && inputs.live_audit == true
        run: |
          mkdir -p tmp/trust-phase8h
          node scripts/trust-source-frontier-audit.mjs             --input=docs/evidence/trust-phase8h-source-frontier-inventory-v1.json             --output=tmp/trust-phase8h/source-frontier-audit.json             --concurrency=4

      - name: Upload optional live audit artifact
        if: github.event_name == 'workflow_dispatch' && inputs.live_audit == true
        uses: actions/upload-artifact@v7
        with:
          name: trust-phase8h-source-frontier-audit
          path: tmp/trust-phase8h/source-frontier-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Run optional live read-only identity qualification
        if: github.event_name == 'workflow_dispatch' && inputs.live_qualification == true
        run: |
          mkdir -p tmp/trust-phase8h
          node scripts/trust-source-identity-qualification.mjs \
            --input=docs/evidence/trust-phase8h-source-identity-qualification-canary-v1.json \
            --output=tmp/trust-phase8h/source-identity-qualification.json \
            --concurrency=3
          cat tmp/trust-phase8h/source-identity-qualification.json

      - name: Upload optional live qualification artifact
        if: github.event_name == 'workflow_dispatch' && inputs.live_qualification == true
        uses: actions/upload-artifact@v7
        with:
          name: trust-phase8h-source-identity-qualification
          path: tmp/trust-phase8h/source-identity-qualification.json
          if-no-files-found: error
          retention-days: 14

      - name: Check exact-head diff hygiene
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}...${HEAD_SHA}"


  qualification-canary:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run live read-only qualification canary
        run: |
          mkdir -p tmp/trust-phase8h
          node scripts/trust-source-identity-qualification.mjs \
            --input=docs/evidence/trust-phase8h-source-identity-qualification-canary-v1.json \
            --output=tmp/trust-phase8h/source-identity-qualification.json \
            --concurrency=3
          cat tmp/trust-phase8h/source-identity-qualification.json

      - name: Upload live qualification artifact
        uses: actions/upload-artifact@v7
        with:
          name: trust-phase8h-source-identity-qualification
          path: tmp/trust-phase8h/source-identity-qualification.json
          if-no-files-found: error
          retention-days: 14


  rediscovery-canary:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run bounded BOJ rediscovery and qualification
        run: |
          mkdir -p tmp/trust-phase8h
          node scripts/trust-source-rediscovery.mjs \
            --input=docs/evidence/trust-phase8h-boj-rediscovery-canary-v1.json \
            --output=tmp/trust-phase8h/boj-rediscovery-qualification.json
          cat tmp/trust-phase8h/boj-rediscovery-qualification.json

      - name: Upload BOJ rediscovery artifact
        uses: actions/upload-artifact@v7
        with:
          name: trust-phase8h-boj-rediscovery-qualification
          path: tmp/trust-phase8h/boj-rediscovery-qualification.json
          if-no-files-found: error
          retention-days: 14
