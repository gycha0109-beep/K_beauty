name: TRUST Data Governance - Phase 8H Source Frontier Audit
run-name: "[WT:trust] TRUST Data Governance - Phase 8H Source Frontier Audit"

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/trust-source-frontier-audit.mjs"
      - "scripts/verify-trust-source-frontier-audit.mjs"
      - "docs/evidence/trust-phase8h-source-frontier-inventory-v1.json"
      - "docs/evidence/trust-phase8h-source-frontier-audit-v1.md"
      - "docs/evidence/trust-phase8h-source-rediscovery-contract-v1.md"
      - "lib/trust/official-source-fetch.mjs"
      - ".github/workflows/trust-phase8h-source-frontier-audit.yml"
  push:
    branches: [main, "feat/trust-phase8h-source-frontier-audit", "audit/trust-phase8h-live-*"]
    paths:
      - "scripts/trust-source-frontier-audit.mjs"
      - "scripts/verify-trust-source-frontier-audit.mjs"
      - "docs/evidence/trust-phase8h-source-frontier-inventory-v1.json"
      - "docs/evidence/trust-phase8h-source-frontier-audit-v1.md"
      - "docs/evidence/trust-phase8h-source-rediscovery-contract-v1.md"
      - "lib/trust/official-source-fetch.mjs"
      - ".github/workflows/trust-phase8h-source-frontier-audit.yml"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string
      live_audit:
        description: Run bounded live official-source frontier probes
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Phase 8H-0 contract
        run: |
          node --check scripts/trust-source-frontier-audit.mjs
          node --check scripts/verify-trust-source-frontier-audit.mjs
          node scripts/verify-trust-source-frontier-audit.mjs

      - name: Run optional live read-only frontier audit
        if: (github.event_name == 'workflow_dispatch' && inputs.live_audit == true) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/audit/trust-phase8h-live-'))
        run: |
          mkdir -p tmp/trust-phase8h
          node scripts/trust-source-frontier-audit.mjs             --input=docs/evidence/trust-phase8h-source-frontier-inventory-v1.json             --output=tmp/trust-phase8h/source-frontier-audit.json             --concurrency=4

      - name: Upload optional live audit artifact
        if: (github.event_name == 'workflow_dispatch' && inputs.live_audit == true) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/audit/trust-phase8h-live-'))
        uses: actions/upload-artifact@v7
        with:
          name: trust-phase8h-source-frontier-audit
          path: tmp/trust-phase8h/source-frontier-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Check exact-head diff hygiene
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}...${HEAD_SHA}"
