name: Repair MediaPipe lockfile

on:
  push:
    branches:
      - feature/mediapipe-face-guide
    paths:
      - package.json
      - .github/workflows/repair-mediapipe-lock.yml

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate synchronized lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install contract
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Upload synchronized lockfile
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
