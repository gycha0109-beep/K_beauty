name: Repair MediaPipe lockfile

on:
  push:
    branches:
      - feature/mediapipe-face-guide
    paths:
      - package.json
      - .github/workflows/repair-mediapipe-lock.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mediapipe-face-guide
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate synchronized lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install contract
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): sync MediaPipe lockfile"
          git push origin HEAD:feature/mediapipe-face-guide
