name: NPM CI Diagnostic

on:
  pull_request:
    paths:
      - "private/face-lab-e2e/run.trigger"

permissions:
  contents: read

jobs:
  npm-ci-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run npm ci and capture diagnostics
        id: npm_ci
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p tmp/npm-ci-diagnostic
          npm cache clean --force >tmp/npm-ci-diagnostic/npm-ci.log 2>&1
          npm ci --no-audit --no-fund >>tmp/npm-ci-diagnostic/npm-ci.log 2>&1
          status=$?
          printf '%s\n' "${status}" >tmp/npm-ci-diagnostic/exit-code.txt
          exit "${status}"

      - name: Upload npm diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-ci-diagnostic-${{ github.run_id }}
          path: tmp/npm-ci-diagnostic
          retention-days: 1

      - name: Fail on npm ci error
        if: steps.npm_ci.outcome == 'failure'
        run: exit 1
