name: DATA-TAXONOMY10 Catalog-only Product Promotion Eligibility

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/data-taxonomy10-catalog-only-product-promotion-eligibility.yml"
      - "lib/catalog-only-product-promotion-eligibility.mjs"
      - "evidence/catalog-taxonomy-v1/data-taxonomy10-catalog-only-product-promotion-eligibility-v1.json"
      - "scripts/product-evidence/verify-data-taxonomy10-catalog-only-product-promotion-eligibility-v1.mjs"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/data-taxonomy10-catalog-only-product-promotion-eligibility.yml"
      - "lib/catalog-only-product-promotion-eligibility.mjs"
      - "evidence/catalog-taxonomy-v1/data-taxonomy10-catalog-only-product-promotion-eligibility-v1.json"
      - "scripts/product-evidence/verify-data-taxonomy10-catalog-only-product-promotion-eligibility-v1.mjs"

permissions:
  contents: read

env:
  DATA_TAXONOMY10_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  eligibility:
    name: Catalog-only Product promotion eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_TAXONOMY10_CHECKOUT_SHA }}
          fetch-depth: 1
      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$DATA_TAXONOMY10_CHECKOUT_SHA"
      - name: Verify DATA-TAXONOMY10 eligibility contract
        run: node scripts/product-evidence/verify-data-taxonomy10-catalog-only-product-promotion-eligibility-v1.mjs
