name: V2.1-8S Exfoliation Shadow Decision Consumer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-8s-exfoliation-shadow-decision-consumer.yml'
      - '.github/workflows/v21-8r-exfoliation-shadow-recommendation-adapter.yml'
      - 'lib/exfoliation-non-numeric-pda-shadow-consumer.js'
      - 'lib/candidate-exposure-policy-shadow.js'
      - 'scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumer-v1.mjs'
      - 'scripts/verify-candidate-policy-main-integration.mjs'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-consumer-implementation-v1.json'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-consumer-validation-replay-v1.json'
      - 'docs/evidence/exfoliation-non-numeric-pda-shadow-decision-consumer-evaluation-v1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-8s-exfoliation-shadow-decision-consumer.yml'
      - '.github/workflows/v21-8r-exfoliation-shadow-recommendation-adapter.yml'
      - 'lib/exfoliation-non-numeric-pda-shadow-consumer.js'
      - 'lib/candidate-exposure-policy-shadow.js'
      - 'scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumer-v1.mjs'
      - 'scripts/verify-candidate-policy-main-integration.mjs'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-consumer-implementation-v1.json'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-consumer-validation-replay-v1.json'
      - 'docs/evidence/exfoliation-non-numeric-pda-shadow-decision-consumer-evaluation-v1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v21-8s:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      V21_8S_BASE_MAIN_SHA: 053a963a14bf00d7deb731a2c5427a97f3172b9f
      V21_8Q_MERGED_MAIN_SHA: e812ee6a7eae6b98940adfe7b10471687e5cad1a
      V21_8R_SHADOW_BLOB: 020e93901b0b7cdfe28040703111674fc233206f
      V21_8R_ADAPTER_BLOB: 5a4d2ead5b1f35075a4aa64ff90a4323f3f88733
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Exact authority and frozen upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$V21_8S_BASE_MAIN_SHA" HEAD
          test "$(git rev-parse "$V21_8S_BASE_MAIN_SHA:lib/candidate-exposure-policy-shadow.js")" = "$V21_8R_SHADOW_BLOB"
          test "$(git hash-object lib/exfoliation-non-numeric-pda-shadow-adapter.js)" = "$V21_8R_ADAPTER_BLOB"
      - name: Deterministic Build A B and focused verifier
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/exfoliation-non-numeric-pda-shadow-consumer.js
          node --check lib/candidate-exposure-policy-shadow.js
          node --check scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumer-v1.mjs
          node - <<'NODE'
          const fs = require('fs');
          const stable = (v) => Array.isArray(v) ? v.map(stable) : v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, stable(v[k])])) : v;
          for (const f of [
            'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-consumer-implementation-v1.json',
            'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-consumer-validation-replay-v1.json'
          ]) {
            const parsed = JSON.parse(fs.readFileSync(f, 'utf8'));
            const buildA = JSON.stringify(stable(parsed)) + '\n';
            const buildB = JSON.stringify(stable(parsed)) + '\n';
            if (buildA !== buildB || fs.readFileSync(f, 'utf8') !== buildA) process.exit(1);
          }
          NODE
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumer-v1.mjs | tee /tmp/8s-focused.log
          sha256sum evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-consumer-implementation-v1.json evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-consumer-validation-replay-v1.json docs/evidence/exfoliation-non-numeric-pda-shadow-decision-consumer-evaluation-v1.md | tee /tmp/8s-hashes.log
      - name: Existing candidate exposure shadow regression
        run: |
          npm run verify:candidate-exposure-policy-shadow
          npm run verify:candidate-exposure-policy-shadow-evaluation
          node scripts/verify-candidate-policy-main-integration.mjs
      - name: Historical V2.1-8J through V2.1-8P replay
        run: |
          node scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-anchor-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs
          node scripts/product-evidence/verify-exfoliation-load-calibration-feasibility-reassessment-v1.mjs
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs
      - name: Historical V2.1-8Q through V2.1-8R replay at frozen authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/v21-8q _reference/v21-8r
          git clone -q --no-hardlinks . _reference/v21-8q
          git -C _reference/v21-8q checkout -q "$V21_8Q_MERGED_MAIN_SHA"
          (cd _reference/v21-8q && node scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumption-v1.mjs)
          git clone -q --no-hardlinks . _reference/v21-8r
          git -C _reference/v21-8r checkout -q "$V21_8S_BASE_MAIN_SHA"
          (cd _reference/v21-8r && node scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-adapter-implementation-v1.mjs)
          rm -rf _reference/v21-8q _reference/v21-8r
      - name: 164 x 12 production invariance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q 783afb91a964f5d762f46846f9ef854902b48e95
          V21_7_BASE_MAIN_SHA=e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87 RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-product-decision-axis-comparator-v1.mjs
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-skin-decision-recommendation-invariance.mjs | tee /tmp/8s-production.log
          rm -rf _reference/recommendation
      - name: Exact V2.1-8S scope and frozen non-mutation
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            .github/workflows/v21-8r-exfoliation-shadow-recommendation-adapter.yml
            .github/workflows/v21-8s-exfoliation-shadow-decision-consumer.yml
            docs/evidence/exfoliation-non-numeric-pda-shadow-decision-consumer-evaluation-v1.md
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-consumer-implementation-v1.json
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-consumer-validation-replay-v1.json
            lib/candidate-exposure-policy-shadow.js
            lib/exfoliation-non-numeric-pda-shadow-consumer.js
            scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumer-v1.mjs
            scripts/verify-candidate-policy-main-integration.mjs
          )
          mapfile -t actual < <(git diff --name-only "$V21_8S_BASE_MAIN_SHA..HEAD" | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          test -z "$(git diff --name-only "$V21_8S_BASE_MAIN_SHA..HEAD" -- evidence/product-decision-axis-non-numeric-contract-v1 evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-adapter-contract-v1.json evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-offline-shadow-output-v1.json evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-adapter-implementation-v1.json evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-adapter-validation-replay-v1.json app/api/analyze/route.js lib/candidate-exposure-policy.js lib/candidate-exposure-policy-evaluator-adapter.js lib/routine-policy.js lib/functional-policy.js lib/recent-instability-guard-policy.js package.json package-lock.json supabase/migrations)"
          git diff --check "$V21_8S_BASE_MAIN_SHA..HEAD"
