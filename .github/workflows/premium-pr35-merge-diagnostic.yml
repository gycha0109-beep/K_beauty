name: Premium PR35 merge diagnostic

on:
  pull_request:
    branches: [integration/premium-engine-main-sec-baseline]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/premium-pr35-merge-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/premium-browser-journey-main-sec-baseline
          fetch-depth: 0
      - name: Build and transform merge tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/premium-browser-journey-verification
          test "$(git rev-parse origin/agent/premium-browser-journey-verification)" = "f28dbd8bd3f08b2aa6b8b1ab3281b4053cda0f6f"
          git merge --no-ff --no-commit origin/agent/premium-browser-journey-verification
          mkdir -p diagnostic/scripts diagnostic/docs/verification diagnostic/.codex/work-logs
          set +e
          python .github/scripts/premium-pr35-integrate.py . > diagnostic/transform.log 2>&1
          STATUS=$?
          set -e
          echo "$STATUS" > diagnostic/transform-status.txt
          cp scripts/premium-browser-journey-core.mjs diagnostic/scripts/
          if [ -f scripts/run-premium-browser-journey.mjs ]; then cp scripts/run-premium-browser-journey.mjs diagnostic/scripts/; fi
          if [ -f scripts/verify-premium-browser-journey.mjs ]; then cp scripts/verify-premium-browser-journey.mjs diagnostic/scripts/; fi
          cp scripts/cleanup-premium-browser-journey.mjs diagnostic/scripts/
          cp scripts/verify-premium-browser-journey-contract.mjs diagnostic/scripts/
          cp scripts/run-security-closeout-verifier-suite.mjs diagnostic/scripts/
          cp package.json diagnostic/
          cp docs/verification/premium-authenticated-browser-journey-v1.md diagnostic/docs/verification/
          cp .codex/work-logs/2026-07-17-premium-browser-journey-verification.md diagnostic/.codex/work-logs/
          git status --short > diagnostic/git-status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: premium-pr35-transform-diagnostic
          path: diagnostic
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
