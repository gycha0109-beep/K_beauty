name: PF5B1 parser diagnosis

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'test/pf5b1f-parser-diagnosis-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMPLEMENTATION_SHA: ba312ba165eebf6ce83c8f8f5d0645fcafea6e09
      SUPABASE_CLI_VERSION: 2.109.1
      REPLAY_DIR: tmp/pf5b1f-diagnosis
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify exact defective authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${IMPLEMENTATION_SHA}:supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql")" = "b6095f1fb2ee2e648770ff619067031791382933"
          test "$(git rev-parse "${IMPLEMENTATION_SHA}:supabase/migrations/20260810174410_product_fact_subject_registration_v1.sql")" = "a08651d4ea5825e33f2dc94fe98c5b7643d32532"
      - name: Materialize governed pre-PF2 baseline
        run: node scripts/materialize-product-fact-replay-baseline-v1.mjs --output="${REPLAY_DIR}"
      - name: Prepare PostgreSQL 17 PF2-only replay
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/major_version = 15/major_version = 17/' "${REPLAY_DIR}/supabase/config.toml"
          cp supabase/migrations/20260809115932_product_fact_storage_v1.sql "${REPLAY_DIR}/supabase/migrations/"
      - name: Start isolated Supabase through PF2
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" start \
            --workdir "${REPLAY_DIR}" \
            --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Install controlled-write prefix only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql').read_text()
          marker = 'create or replace function public.admin_ingest_product_fact_evidence_v1('
          start = src.index(marker)
          prefix = src[:start].rstrip() + '\ncommit;\n'
          Path('/tmp/pf5b1-prefix.sql').write_text(prefix)
          PY
          psql 'postgresql://postgres:postgres@127.0.0.1:57422/postgres' -v ON_ERROR_STOP=1 -f /tmp/pf5b1-prefix.sql
      - name: Extract exact failing function
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql').read_text()
          start_marker = 'create or replace function public.admin_ingest_product_fact_evidence_v1('
          end_marker = 'create or replace function public.admin_prepare_product_fact_review_v1('
          start = src.index(start_marker)
          end = src.index(end_marker, start)
          Path('/tmp/pf5b1-ingest.sql').write_text(src[start:end].strip() + '\n')
          PY
      - name: Reproduce isolated function parser error
        shell: bash
        run: |
          set -euo pipefail
          set +e
          psql 'postgresql://postgres:postgres@127.0.0.1:57422/postgres' -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f /tmp/pf5b1-ingest.sql > /tmp/pf5b1-ingest.out 2>&1
          status=$?
          set -e
          cat /tmp/pf5b1-ingest.out
          test "$status" -ne 0
          grep -q '42601' /tmp/pf5b1-ingest.out
          grep -q "case when v_source -> 'published_at' = 'null'::jsonb" /tmp/pf5b1-ingest.out
      - name: Focus published_at IS DISTINCT FROM CASE variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('/tmp/pf5b1-ingest.sql').read_text()
          broken = (
              "      or v_source_row.published_at is distinct from\n"
              "        case when v_source -> 'published_at' = 'null'::jsonb\n"
              "          then null else (v_source ->> 'published_at')::timestamptz end\n"
          )
          grouped = (
              "      or v_source_row.published_at is distinct from (\n"
              "        case when v_source -> 'published_at' = 'null'::jsonb\n"
              "          then null else (v_source ->> 'published_at')::timestamptz end\n"
              "      )\n"
          )
          if src.count(broken) != 1:
              raise SystemExit(f'expected one broken predicate, got {src.count(broken)}')
          Path('/tmp/pf5b1-ingest-grouped.sql').write_text(src.replace(broken, grouped))
          Path('/tmp/pf5b1-ingest-predicate-removed.sql').write_text(src.replace(broken, "      or false\n"))
          PY
          for variant in grouped predicate-removed; do
            file="/tmp/pf5b1-ingest-${variant}.sql"
            set +e
            psql 'postgresql://postgres:postgres@127.0.0.1:57422/postgres' -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -f "$file" >"/tmp/${variant}.out" 2>&1
            status=$?
            set -e
            echo "FOCUSED_VARIANT ${variant} STATUS ${status}"
            cat "/tmp/${variant}.out"
            test "$status" -eq 0
          done
      - name: Confirm grouping-only delta
        shell: bash
        run: |
          set -euo pipefail
          diff -u /tmp/pf5b1-ingest.sql /tmp/pf5b1-ingest-grouped.sql || true
      - name: Stop isolated Supabase
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [[ -d "${REPLAY_DIR}/supabase" ]]; then
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --workdir "${REPLAY_DIR}" --no-backup
          fi
          rm -rf -- "${REPLAY_DIR}"
