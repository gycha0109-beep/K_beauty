name: PF5B1 repair candidate verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-candidate:
    if: github.head_ref == 'test/pf5b1f-parser-diagnosis-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      IMPLEMENTATION_SHA: ba312ba165eebf6ce83c8f8f5d0645fcafea6e09
      CANDIDATE_BRANCH: test/pf5b1f-repair-candidate-v1
      FAILURE_EVIDENCE_SHA: 62f042cfee0e00de9f29deeb303da220eb9ab713
      SUPABASE_CLI_VERSION: 2.109.1
      REPLAY_DIR: tmp/pf5b1f-repair
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recheck immutable authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/product-fact-controlled-write-v1 test/product-fact-controlled-write-runtime-v1 "${CANDIDATE_BRANCH}"
          test "$(git rev-parse origin/feat/product-fact-controlled-write-v1)" = "${IMPLEMENTATION_SHA}"
          test "$(git rev-parse origin/test/product-fact-controlled-write-runtime-v1)" = "${FAILURE_EVIDENCE_SHA}"
          test "$(git rev-parse "${IMPLEMENTATION_SHA}:supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql")" = "b6095f1fb2ee2e648770ff619067031791382933"
          test "$(git rev-parse "${IMPLEMENTATION_SHA}:supabase/migrations/20260810174410_product_fact_subject_registration_v1.sql")" = "a08651d4ea5825e33f2dc94fe98c5b7643d32532"
      - name: Build minimal repair from defective head
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B pf5b1f-repair-work "${IMPLEMENTATION_SHA}"
          python - <<'PY'
          from pathlib import Path

          migration_path = Path('supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql')
          migration = migration_path.read_text()
          broken = (
              "      or v_source_row.published_at is distinct from\n"
              "        case when v_source -> 'published_at' = 'null'::jsonb\n"
              "          then null else (v_source ->> 'published_at')::timestamptz end\n"
          )
          grouped = (
              "      or v_source_row.published_at is distinct from (\n"
              "        case when v_source -> 'published_at' = 'null'::jsonb\n"
              "          then null else (v_source ->> 'published_at')::timestamptz end\n"
              "      )\n"
          )
          if migration.count(broken) != 1:
              raise SystemExit(f'expected one parser-defective predicate, got {migration.count(broken)}')
          migration_path.write_text(migration.replace(broken, grouped))

          verifier_path = Path('scripts/verify-product-fact-controlled-write-v1.mjs')
          verifier = verifier_path.read_text()
          evidence_anchor = "  check(evidence.includes(\"'admin.products.review'\"), \"evidence_operation_capability_missing\");\n"
          evidence_guard = evidence_anchor + (
              "  check(\n"
              "    /v_source_row\\.published_at\\s+is\\s+distinct\\s+from\\s*\\(\\s*case\\s+when\\s+v_source\\s*->\\s*'published_at'\\s*=\\s*'null'::jsonb\\s+then\\s+null\\s+else\\s+\\(v_source\\s*->>\\s*'published_at'\\)::timestamptz\\s+end\\s*\\)/i.test(evidence),\n"
              "    \"evidence_source_published_at_case_grouping_missing\"\n"
              "  );\n"
          )
          if verifier.count(evidence_anchor) != 1:
              raise SystemExit('evidence verifier anchor mismatch')
          verifier = verifier.replace(evidence_anchor, evidence_guard)

          mutations_anchor = "const mutations = [\n"
          regression_mutation = (
              "const mutations = [\n"
              "  {\n"
              "    code: \"evidence_source_published_at_case_grouping_missing\",\n"
              "    sql: migrationSql.replace(\n"
              "      \"      or v_source_row.published_at is distinct from (\\n        case when v_source -> 'published_at' = 'null'::jsonb\\n          then null else (v_source ->> 'published_at')::timestamptz end\\n      )\",\n"
              "      \"      or v_source_row.published_at is distinct from\\n        case when v_source -> 'published_at' = 'null'::jsonb\\n          then null else (v_source ->> 'published_at')::timestamptz end\"\n"
              "    )\n"
              "  },\n"
          )
          if verifier.count(mutations_anchor) != 1:
              raise SystemExit('mutation verifier anchor mismatch')
          verifier = verifier.replace(mutations_anchor, regression_mutation)

          runtime_anchor = '  runtime_database_replay: "NOT_PERFORMED_BY_STATIC_VERIFIER",\n'
          runtime_scope = (
              '  static_verification_scope: "TEXTUAL_CONTRACT_ONLY",\n'
              '  postgres_compile_verification: "NOT_PERFORMED_BY_STATIC_VERIFIER",\n'
              '  runtime_database_replay: "NOT_PERFORMED_BY_STATIC_VERIFIER",\n'
          )
          if verifier.count(runtime_anchor) != 1:
              raise SystemExit('runtime scope anchor mismatch')
          verifier = verifier.replace(runtime_anchor, ''.join(runtime_scope))
          verifier_path.write_text(verifier)
          PY
          git diff --check "${IMPLEMENTATION_SHA}"
          mapfile -t changed < <(git diff --name-only "${IMPLEMENTATION_SHA}" | sort)
          printf 'REPAIR_CHANGED_FILES\n%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "scripts/verify-product-fact-controlled-write-v1.mjs"
          test "${changed[1]}" = "supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql"
          git diff --unified=3 "${IMPLEMENTATION_SHA}" -- supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql scripts/verify-product-fact-controlled-write-v1.mjs
      - name: Static verifier and exact defect mutation regression
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-product-fact-controlled-write-v1.mjs | tee /tmp/pf5b1f-static.json
          node scripts/verify-product-fact-subject-registration-v1.mjs | tee /tmp/pf5b1f-subject-static.json
          grep -q '"status": "PASS"' /tmp/pf5b1f-static.json
          grep -q '"negative_mutation_cases": 12' /tmp/pf5b1f-static.json
          grep -q '"postgres_compile_verification": "NOT_PERFORMED_BY_STATIC_VERIFIER"' /tmp/pf5b1f-static.json
      - name: Materialize governed replay and append repaired migrations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-product-fact-replay-baseline-v1.mjs --output="${REPLAY_DIR}"
          sed -i 's/major_version = 15/major_version = 17/' "${REPLAY_DIR}/supabase/config.toml"
          migration_dir="${REPLAY_DIR}/supabase/migrations"
          cp supabase/migrations/20260809115932_product_fact_storage_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260810174410_product_fact_subject_registration_v1.sql "${migration_dir}/"
          printf 'REPLAY_TAIL\n'
          find "${migration_dir}" -maxdepth 1 -name '*.sql' -printf '%f\n' | sort | tail -n 7
      - name: Apply full Product Fact chain on PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/pf5b1f-start.log"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" start \
            --workdir "${REPLAY_DIR}" \
            --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            >"${log}" 2>&1; then
            grep -Ein -B 8 -A 30 'ERROR|SQLSTATE|syntax error|Applying migration|failed' "${log}" | tail -n 260 >&2 || true
            exit 1
          fi
          grep -E 'Applying migration (20260809115932|20260810174400|20260810174410)' "${log}" || true
          rm -f "${log}"
      - name: Verify compile/apply postconditions
        shell: bash
        run: |
          set -euo pipefail
          DB='postgresql://postgres:postgres@127.0.0.1:57422/postgres'
          echo 'POSTGRES_VERSION'
          psql "$DB" -Atqc 'show server_version'
          echo 'MIGRATION_LEDGER'
          psql "$DB" -Atqc "select version from supabase_migrations.schema_migrations where version in ('20260809115932','20260810174400','20260810174410') order by version"
          test "$(psql "$DB" -Atqc "select count(*) from supabase_migrations.schema_migrations where version in ('20260809115932','20260810174400','20260810174410')")" = "3"
          echo 'REQUIRED_FUNCTION_COUNT'
          function_count="$(psql "$DB" -Atqc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('admin_publish_product_fact_registry_v1','admin_ingest_product_fact_evidence_v1','admin_prepare_product_fact_review_v1','product_fact_controlled_build_preflight_v1','admin_preflight_product_fact_confirmation_v1','admin_confirm_product_fact_v1','admin_register_product_fact_subject_v1')")"
          echo "$function_count"
          test "$function_count" = "7"
          pf2_tables="$(psql "$DB" -Atqc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relname in ('product_fact_registry_versions','product_fact_definition_snapshots','product_fact_subjects','product_evidence_sources','product_evidence_source_subject_bindings','product_evidence_records','product_fact_instances','product_fact_evidence_links','product_fact_confirmations','product_fact_current','product_fact_review_assignments','product_fact_review_events')")"
          echo "PF2_TABLES=$pf2_tables"
          test "$pf2_tables" = "12"
          rls_count="$(psql "$DB" -Atqc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('product_fact_registry_versions','product_fact_definition_snapshots','product_fact_subjects','product_evidence_sources','product_evidence_source_subject_bindings','product_evidence_records','product_fact_instances','product_fact_evidence_links','product_fact_confirmations','product_fact_current','product_fact_review_assignments','product_fact_review_events') and c.relrowsecurity")"
          echo "PF2_RLS=$rls_count"
          test "$rls_count" = "12"
          write_grants="$(psql "$DB" -Atqc "select count(*) from information_schema.role_table_grants where table_schema='public' and table_name in ('product_fact_registry_versions','product_fact_definition_snapshots','product_fact_subjects','product_evidence_sources','product_evidence_source_subject_bindings','product_evidence_records','product_fact_instances','product_fact_evidence_links','product_fact_confirmations','product_fact_current','product_fact_review_assignments','product_fact_review_events') and grantee in ('PUBLIC','anon','authenticated','service_role') and privilege_type in ('INSERT','UPDATE','DELETE','TRUNCATE')")"
          echo "BROAD_WRITE_GRANTS=$write_grants"
          test "$write_grants" = "0"
          row_json="$(psql "$DB" -Atqc "select jsonb_build_object('registry',(select count(*) from public.product_fact_registry_versions),'definitions',(select count(*) from public.product_fact_definition_snapshots),'subjects',(select count(*) from public.product_fact_subjects),'sources',(select count(*) from public.product_evidence_sources),'bindings',(select count(*) from public.product_evidence_source_subject_bindings),'evidence',(select count(*) from public.product_evidence_records),'facts',(select count(*) from public.product_fact_instances),'links',(select count(*) from public.product_fact_evidence_links),'confirmations',(select count(*) from public.product_fact_confirmations),'current',(select count(*) from public.product_fact_current),'assignments',(select count(*) from public.product_fact_review_assignments),'review_events',(select count(*) from public.product_fact_review_events))")"
          echo "PRODUCT_FACT_ROWS=$row_json"
          test "$(psql "$DB" -Atqc "select (select count(*) from public.product_fact_registry_versions)+(select count(*) from public.product_fact_definition_snapshots)+(select count(*) from public.product_fact_subjects)+(select count(*) from public.product_evidence_sources)+(select count(*) from public.product_evidence_source_subject_bindings)+(select count(*) from public.product_evidence_records)+(select count(*) from public.product_fact_instances)+(select count(*) from public.product_fact_evidence_links)+(select count(*) from public.product_fact_confirmations)+(select count(*) from public.product_fact_current)+(select count(*) from public.product_fact_review_assignments)+(select count(*) from public.product_fact_review_events)")" = "0"
      - name: Stop disposable Supabase
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [[ -d "${REPLAY_DIR}/supabase" ]]; then
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --workdir "${REPLAY_DIR}" --no-backup >/dev/null 2>&1 || true
          fi
          rm -rf -- "${REPLAY_DIR}"
      - name: Freeze verified repair candidate
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql scripts/verify-product-fact-controlled-write-v1.mjs
          git commit -m 'fix(storage): repair Product Fact controlled write compile'
          candidate_sha="$(git rev-parse HEAD)"
          echo "CORRECTED_CANDIDATE_SHA=${candidate_sha}"
          echo "NEW_MIGRATION_BLOB=$(git rev-parse HEAD:supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql)"
          echo "NEW_VERIFIER_BLOB=$(git rev-parse HEAD:scripts/verify-product-fact-controlled-write-v1.mjs)"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
