name: Security closeout verifiers

on:
  pull_request:
    branches:
      - feature/premium-beta-flow
      - main
    types:
      - edited
      - reopened
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".codex/**"
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch or ref used for diff hygiene
        required: false
        default: main

concurrency:
  group: security-closeout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.body || '', '<!-- run-full-validation -->')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Security closeout verifier suite
        run: node scripts/run-security-closeout-verifier-suite.mjs
      - name: SEC-11 site origin normalization
        run: npm run check:sec11-origin-normalization
      - name: JavaScript syntax gate
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find app lib scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
      - name: Production build
        run: npm run build
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            git fetch --no-tags origin "${{ inputs.base_ref }}"
            git diff --check "origin/${{ inputs.base_ref }}...HEAD"
          fi
      - name: Upload verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-closeout-verifier-evidence
          path: tmp/security-closeout-verifier-suite.json
          if-no-files-found: error
          retention-days: 1
