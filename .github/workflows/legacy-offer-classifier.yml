name: Legacy Offer Classifier

on:
  pull_request:
    branches:
      - main
    paths:
      - "crawler/lib/offers/legacy-offer-classifier.ts"
      - "crawler/config/offer-source-rules.json"
      - "crawler/legacy-offer-migration-report.ts"
      - "crawler/test-legacy-offer-classifier.ts"
      - "crawler/package.json"
      - ".github/workflows/legacy-offer-classifier.yml"
  push:
    branches:
      - main
    paths:
      - "crawler/lib/offers/legacy-offer-classifier.ts"
      - "crawler/config/offer-source-rules.json"
      - "crawler/legacy-offer-migration-report.ts"
      - "crawler/test-legacy-offer-classifier.ts"
      - "crawler/package.json"
      - ".github/workflows/legacy-offer-classifier.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crawler/package-lock.json

      - name: Install crawler dependencies
        working-directory: crawler
        run: npm ci --no-audit --no-fund

      - name: Verify legacy offer classifier
        working-directory: crawler
        run: npm run verify:legacy-offer-classifier

      - name: Typecheck crawler
        working-directory: crawler
        run: npm run typecheck

      - name: Check exact-head and diff hygiene
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ ]] || [[ "${base}" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse "${HEAD_SHA}^")"
          fi
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          git diff --check "${base}...${HEAD_SHA}"
