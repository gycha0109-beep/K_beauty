      - name: Verify DATA-AI29C-D2 sunscreen initial admission authority
        run: node scripts/verify-data-ai29c-d2-sunscreen-initial-admission.mjs

      - name: Verify DATA-AI29C-D3 integrated sunscreen Recommendation shadow
        run: node --experimental-strip-types scripts/verify-data-ai29c-d3-integrated-sunscreen-shadow.mjs

      - name: Verify DATA-AI29C-D3R1 feature-gated sunscreen shadow
