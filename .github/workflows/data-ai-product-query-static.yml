        run: node scripts/verify-data-ai29c-water-b-evidence-frontier.mjs

      - name: Verify DATA-AI29C-WATER-B1 governed JCIA label mapping
        run: node scripts/verify-data-ai29c-water-b1-governed-label-mapping.mjs

      - name: Verify DATA-AI29C-WATER-C ANESSA controlled adoption
        run: node scripts/verify-data-ai29c-water-c-anessa-controlled-adoption.mjs

      - name: Verify DATA-AI29C-WATER-C-R1 cardinality-one guard
        run: node scripts/verify-data-ai29c-water-c-r1-cardinality-guard.mjs

      - name: Verify DATA-AI29C-WATER-C-R1 Production validation
        run: node scripts/verify-data-ai29c-water-c-r1-production-validation.mjs

      - name: Verify DATA-AI29C-WATER-D1 Day Dew controlled expansion
        run: node scripts/verify-data-ai29c-water-d1-day-dew-controlled-expansion.mjs

      - name: Verify DATA-AI29C-WATER-D2A frozen-20 authority recon
        run: node scripts/verify-data-ai29c-water-d2a-frozen20-authority-recon.mjs

      - name: Verify DATA-AI29C-D5A SPF runtime gate
        run: node --experimental-strip-types scripts/verify-data-ai29c-d5a-spf-runtime-gate.mjs

      - name: Verify DATA-AI29C-D5B SPF Production shadow
        run: node --experimental-strip-types scripts/verify-data-ai29c-d5b-spf-production-shadow.mjs

      - name: Verify DATA-AI29C-D5C bounded internal SPF canary
        run: |
          node --check scripts/validate-data-ai29c-d5c-spf-canary-runtime-response.mjs
          node --experimental-strip-types scripts/verify-data-ai29c-d5c-bounded-internal-canary.mjs

      - name: Verify DATA-AI29C-D5D SPF Production activation
        run: |
          node --check scripts/validate-data-ai29c-d5d-spf-production-activation-response.mjs
          node --experimental-strip-types scripts/verify-data-ai29c-d5d-spf-production-activation.mjs

      - name: Verify DATA-AI29C-D5D-R1 recovery
        run: node --experimental-strip-types scripts/verify-data-ai29c-d5d-r1-recovery.mjs

      - name: Verify DATA-AI28E bounded incomplete retry
        run: node scripts/verify-data-ai28e-bounded-incomplete-retry.mjs

      - name: Verify DATA-AI3 real-corpus shadow boundary
        run: node scripts/verify-data-ai3-product-query-shadow.mjs

      - name: Verify DATA-AI4 provider-backed shadow boundary
        run: |
          node --check scripts/validate-data-ai4-provider-shadow-runtime-response.mjs
          node scripts/verify-data-ai4-provider-shadow.mjs

      - name: Verify DATA-AI5 activation-readiness boundary
        run: |
          node --check scripts/validate-data-ai5-activation-readiness-runtime-response.mjs
          node scripts/verify-data-ai5-activation-readiness.mjs

      - name: Verify architecture boundaries
        env:
          ARCHITECTURE_GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: npm run architecture:guard

      - name: Build production application once
        run: npm run build

      - name: Check exact-head and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DATA_AI_STATIC_EXACT_HEAD"
          git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}...$DATA_AI_STATIC_EXACT_HEAD" || git diff --check HEAD^
