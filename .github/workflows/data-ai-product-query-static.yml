    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: data-ai-product-query-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATA_AI_STATIC_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: DATA-AI1-5 canonical static contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.DATA_AI_STATIC_EXACT_HEAD }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DATA_AI_STATIC_EXACT_HEAD"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify CI consolidation structure
        run: node scripts/verify-data-ai3-5-ci-consolidation.mjs

      - name: Install dependencies once
        run: npm ci --no-audit --no-fund

      - name: Verify DATA-AI1 intent boundary
        run: node scripts/verify-data-ai1-product-query-intent.mjs

      - name: Verify DATA-AI2 deterministic execution
        run: node scripts/verify-data-ai2-product-query-execution.mjs

      - name: Verify DATA-AI29A semantic and explanation quality
        run: node scripts/verify-data-ai29a-product-query-quality.mjs

      - name: Verify DATA-AI29B ranking calibration and score-grounded reasons
        run: node scripts/verify-data-ai29b-product-query-ranking.mjs

      - name: Verify DATA-AI29C-A sunscreen protection authority
        run: node scripts/verify-data-ai29c-a-protection-authority.mjs

      - name: Verify DATA-AI29C-A sunscreen protection corpus audit
        run: node scripts/verify-data-ai29c-a-protection-audit.mjs

      - name: Verify DATA-AI29C-B protection-aware shadow boundary
        run: node scripts/verify-data-ai29c-b-protection-shadow.mjs

      - name: Verify DATA-AI29C-C protection recovery boundary
        run: |
          node scripts/verify-data-ai29c-c-protection-recovery.mjs
          node scripts/verify-trust-research-worker.mjs

      - name: Verify DATA-AI29C-C5 protection expansion planning
        run: node scripts/verify-data-ai29c-protection-expansion-wave-v1.mjs

      - name: Verify DATA-AI29C-C5B Subject presentation identity correction
        run: node scripts/verify-data-ai29c-c5b-subject-presentation-correction.mjs

      - name: Verify DATA-AI29C-C5C catalog-only water recovery enqueue
        run: node scripts/verify-data-ai29c-c5c-catalog-only-water-enqueue.mjs

      - name: Verify DATA-AI29C-C5D governed official source projection
        run: node scripts/verify-data-ai29c-c5d-catalog-official-source-projection.mjs

      - name: Verify DATA-AI29C-C5E authoritative post-expansion protection audit
        run: node scripts/verify-data-ai29c-c5e-post-expansion-protection-audit.mjs

      - name: Verify DATA-AI29C-C6 discrimination-first wave 2
        run: node scripts/verify-data-ai29c-c6-discrimination-wave2.mjs

      - name: Verify DATA-AI29C-C6F prospective protection axis readiness
        run: node scripts/verify-data-ai29c-c6f-prospective-axis-readiness.mjs

      - name: Verify DATA-AI29C-C6G prospective expanded-corpus protection shadow
        run: node scripts/verify-data-ai29c-c6g-prospective-protection-shadow.mjs

      - name: Verify DATA-AI29C-D-R1 staged sunscreen activation redesign
        run: node scripts/verify-data-ai29c-d-r1-staged-activation-redesign.mjs

      - name: Verify DATA-AI29C-D1 sunscreen Recommendation semantic authority
        run: node scripts/verify-data-ai29c-d1-sunscreen-semantic-authority.mjs

      - name: Verify DATA-AI29C-D1A unresolved Product Fact re-research
        run: node scripts/verify-data-ai29c-d1a-unresolved-fact-reresearch.mjs

      - name: Verify DATA-AI29C-D1B fail-closed sunscreen semantic projection
