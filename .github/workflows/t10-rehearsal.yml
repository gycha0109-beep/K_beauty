name: T10 Full Rehearsal

on:
  pull_request:
    paths:
      - "tools/synthetic-evaluation/**"
      - "packages/face-contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/t10-rehearsal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t10-rehearsal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node24-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run synthetic:rehearsal -- --full --failure-matrix --report t10-rehearsal-report-node24.json
      - run: npm run synthetic:test
      - run: npm run synthetic:verify
      - uses: actions/upload-artifact@v4
        with:
          name: t10-rehearsal-node24
          path: tools/synthetic-evaluation/t10-rehearsal-report-node24.json
          if-no-files-found: error

  node20-full:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run synthetic:rehearsal -- --full --failure-matrix --report t10-rehearsal-report-node20.json
      - run: npm run synthetic:test
      - run: npm run synthetic:verify
      - run: npm run architecture:guard
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: t10-rehearsal-node20
          path: tools/synthetic-evaluation/t10-rehearsal-report-node20.json
          if-no-files-found: error
