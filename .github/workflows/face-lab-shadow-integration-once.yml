name: Face Lab shadow integration once

on:
  push:
    branches:
      - codex/survey-input-contract-refactor
    paths:
      - .github/workflows/face-lab-shadow-integration-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/survey-input-contract-refactor
          fetch-depth: 0

      - name: Alias canonical builder in route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/face-reading/route.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '  buildFaceLabObservationAnalysis,\n',
                  '  buildFaceLabObservationAnalysis as buildObservationAnalysis,\n'
              ),
              (
                  '      const analysis = buildFaceLabObservationAnalysis(\n',
                  '      const analysis = buildObservationAnalysis(\n'
              )
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected 1 match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          node --check app/api/face-reading/route.js
          node scripts/verify-face-lab-observation-contract.mjs
          node scripts/verify-face-lab-route-shadow-integration.mjs
          git diff --check

      - name: Commit compatibility alias
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/face-reading/route.js
          git commit -m "refactor: alias Face Lab shadow builder"
          git push origin HEAD:codex/survey-input-contract-refactor
