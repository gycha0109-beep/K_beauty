name: Face Lab shadow integration once

on:
  push:
    branches:
      - codex/survey-input-contract-refactor
    paths:
      - .github/workflows/face-lab-shadow-integration-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/survey-input-contract-refactor
          fetch-depth: 0

      - name: Resolve prompt language contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/face-reading/route.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'systemLanguage: "Output must be entirely in Korean.",',
                  'systemLanguage: "Write base_data and features in Korean. Keep eligibility and observation_analysis keys, enum values, and evidence in English.",'
              ),
              (
                  'systemLanguage: "Output must be entirely in English.",',
                  'systemLanguage: "Write base_data and features in English. Keep eligibility and observation_analysis keys, enum values, and evidence in English.",'
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected 1 match for {old!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node --check app/api/face-reading/route.js
          git diff --check

      - name: Commit prompt correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/face-reading/route.js
          git commit -m "fix: align Face Lab prompt language contract"
          git push origin HEAD:codex/survey-input-contract-refactor
