name: Face Lab shadow integration once

on:
  push:
    branches:
      - codex/survey-input-contract-refactor
    paths:
      - .github/workflows/face-lab-shadow-integration-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/survey-input-contract-refactor
          fetch-depth: 0

      - name: Update observation verifier expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/verify-face-lab-observation-contract.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''const routeSource = readFileSync("app/api/face-reading/route.js", "utf8");
assert.equal(
  routeSource.includes("buildFaceLabObservationAnalysis"),
  false,
  "route shadow integration remains a separate reviewed change"
);
'''
          new = '''const routeSource = readFileSync("app/api/face-reading/route.js", "utf8");
assert.equal(
  routeSource.includes("buildFaceLabObservationAnalysis"),
  true,
  "route must build the normalized shadow analysis"
);
assert.equal(
  routeSource.includes("createFaceLabLegacyInsufficientPayload"),
  true,
  "legacy insufficient responses must use the allowlisted projection"
);
assert.equal(routeSource.includes("max_tokens: 3000"), true);
assert.equal(routeSource.includes("...parsed,\\n                structured"), false);
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected 1 verifier block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          node --check scripts/verify-face-lab-observation-contract.mjs
          node --check scripts/verify-face-lab-route-shadow-integration.mjs
          git diff --check

      - name: Commit verifier correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-face-lab-observation-contract.mjs
          git commit -m "test: align Face Lab observation verifier"
          git push origin HEAD:codex/survey-input-contract-refactor
