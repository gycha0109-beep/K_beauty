name: DATA-TAXONOMY4 Recommendation Taxonomy Shadow Parity

on:
  pull_request:
    paths:
      - "evidence/catalog-taxonomy-v1/data-taxonomy4-recommendation-shadow-parity-v1.json"
      - "docs/evidence/data-taxonomy4-recommendation-shadow-parity-v1.md"
      - "scripts/product-evidence/verify-data-taxonomy4-recommendation-shadow-parity-v1.mjs"
      - ".github/workflows/data-taxonomy4-recommendation-shadow-parity.yml"
      - "lib/recommendation-scoring.ts"
      - "lib/product-category-normalizer.js"
  push:
    branches:
      - main
    paths:
      - "evidence/catalog-taxonomy-v1/data-taxonomy4-recommendation-shadow-parity-v1.json"
      - "docs/evidence/data-taxonomy4-recommendation-shadow-parity-v1.md"
      - "scripts/product-evidence/verify-data-taxonomy4-recommendation-shadow-parity-v1.mjs"
      - ".github/workflows/data-taxonomy4-recommendation-shadow-parity.yml"
      - "lib/recommendation-scoring.ts"
      - "lib/product-category-normalizer.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-data-taxonomy4-recommendation-shadow-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Attest exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Recommendation taxonomy shadow parity
        run: node --experimental-strip-types scripts/product-evidence/verify-data-taxonomy4-recommendation-shadow-parity-v1.mjs
