# EPHEMERAL research workflow: remove immediately after the single billed run.
# No user images, no external artifact upload, no retries and no production credentials.
name: Face Lab Skin KEY2 nonhuman Vision pair
run-name: "[WT:face-research] Skin S1-B nonhuman Vision v1/v2 one-shot"

on:
  push:
    branches:
      - face-lab/research-skin-key2-nonface-vision-pair-20261015
    paths:
      - .github/workflows/face-lab-skin-key2-nonface-pair-once.yml

permissions:
  contents: read

concurrency:
  group: face-lab-skin-key2-nonface-pair-one-shot
  cancel-in-progress: false

jobs:
  key2-nonhuman-paired-vision:
    if: github.repository == 'gycha0109-beep/K_beauty' && github.ref == 'refs/heads/face-lab/research-skin-key2-nonface-vision-pair-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify mock-only image/secret privacy bounds
        run: node scripts/facelab/skin/verify-skin-key2-nonface-vision-pair.mjs
      - name: Call v1 and v2 once each on synthetic nonhuman PNG
        env:
          OPENAI_API_KEY2: ${{ secrets.OPENAI_API_KEY2 }}
        run: node scripts/facelab/skin/run-skin-key2-nonface-pair.mjs --live-nonface-pair
