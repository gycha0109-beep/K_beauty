name: PR92 Integrated Evaluation V2 Gate

on:
  push:
    branches:
      - codex/skin-decision-integrated-evaluation-v2

permissions:
  contents: write

concurrency:
  group: pr92-integrated-evaluation-v2
  cancel-in-progress: true

jobs:
  exact-head-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply reviewed verifier corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          integrated = Path("scripts/verify-premium-integrated-evaluation-v2.mjs")
          text = integrated.read_text(encoding="utf-8")
          hold_old = '  equal(state.functionalPolicy.planMode, "HOLD", "functional hold");\n'
          hold_new = (
              '  equal(state.functionalPolicy.planMode, "START", "support policy starts");\n'
              '  equal(state.functionalPolicy.allowedIntensity, "support_only", "support intensity only");\n'
          )
          if hold_old not in text and hold_new not in text:
              raise SystemExit("S03 verifier contract target missing")
          text = text.replace(hold_old, hold_new)
          text = text.replace(
              '  koLocaleState = build(report(), "ko", "locale-ko");\n',
              '  koLocaleState = build(report(), "ko", "locale-parity");\n'
          )
          text = text.replace(
              '  enLocaleState = build(report(), "en", "locale-en");\n',
              '  enLocaleState = build(report(), "en", "locale-parity");\n'
          )
          integrated.write_text(text, encoding="utf-8")

          runtime = Path("scripts/verify-candidate-policy-runtime-safety-hardening.mjs")
          text = runtime.read_text(encoding="utf-8")
          import_old = 'import { buildCandidatePolicyGoalContext } from "../lib/candidate-policy-goal-context.js";\n'
          import_new = (
              'import { buildCandidatePolicyGoalContext } from "../lib/candidate-policy-goal-context.js";\n'
              'import { SHARED_SKIN_DECISION_CONTEXT_VERSION } from "../lib/shared-skin-decision-context-v4.js";\n'
          )
          if import_new not in text:
              if import_old not in text:
                  raise SystemExit("runtime-safety import target missing")
              text = text.replace(import_old, import_new)
          literal = '      version: "shared-skin-decision-context-v3",\n'
          replacement = '      version: SHARED_SKIN_DECISION_CONTEXT_VERSION,\n'
          if literal not in text and replacement not in text:
              raise SystemExit("runtime-safety version target missing")
          runtime.write_text(text.replace(literal, replacement), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-premium-integrated-evaluation-v2.mjs scripts/verify-candidate-policy-runtime-safety-hardening.mjs
          if ! git diff --cached --quiet; then
            git commit -m "test(skin-decision): align PR92 verifier contracts"
            git push
          fi

      - name: Execute exact-head gate
        id: gate
        shell: bash
        run: |
          set +e
          mkdir -p docs/verification
          RESULT=docs/verification/pr92-integrated-evaluation-v2-result.md
          LOG=/tmp/pr92-gate.log
          STATUS=0
          : > "$LOG"
          {
            echo "# PR92 Integrated Evaluation V2 Gate"
            echo
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- Runner: \`$RUNNER_OS\`"
            echo "- Node target: \`24\`"
            echo
          } > "$RESULT"

          run_gate() {
            NAME="$1"
            shift
            echo "## $NAME" >> "$RESULT"
            echo >> "$RESULT"
            echo "### $NAME" >> "$LOG"
            if "$@" >> "$LOG" 2>&1; then
              echo "PASS" >> "$RESULT"
            else
              CODE=$?
              echo "FAIL (exit $CODE)" >> "$RESULT"
              STATUS=1
            fi
            echo >> "$RESULT"
          }

          run_gate "npm ci" npm ci
          run_gate "syntax" bash -lc 'node --check lib/candidate-policy-current-findings-context.js && node --check lib/candidate-policy-goal-context.js && node --check scripts/verify-candidate-policy-runtime-safety-hardening.mjs && node --check scripts/verify-premium-integrated-evaluation-v2.mjs'
          run_gate "integrated evaluation v2" npm run verify:premium-integrated-evaluation-v2
          run_gate "shared context" npm run verify:shared-skin-decision-context
          run_gate "functional policy" node scripts/verify-functional-policy-single-source.mjs
          run_gate "routine policy" node scripts/verify-routine-policy-single-source.mjs
          run_gate "condition policy" node scripts/verify-condition-policy-single-source.mjs
          run_gate "cross-domain consistency" node scripts/verify-cross-domain-consistency.mjs
          run_gate "premium decision state" node scripts/verify-premium-decision-state.mjs
          run_gate "premium report reentry" node scripts/verify-premium-report-reentry-contract.mjs
          run_gate "candidate runtime safety" npm run verify:candidate-policy-runtime-safety
          run_gate "candidate goal alignment" npm run verify:candidate-policy-goal-alignment
          run_gate "candidate current findings" npm run verify:candidate-policy-current-findings
          run_gate "architecture guard" npm run architecture:guard
          run_gate "optimized build" npm run build
          run_gate "diff hygiene" bash -lc 'git diff --check 3f697f3e5c2ae607c9d86af3f16bdfe2cdb43037...HEAD && test -z "$(git status --short --untracked-files=no)"'

          echo "## Result" >> "$RESULT"
          echo >> "$RESULT"
          if [ "$STATUS" -eq 0 ]; then
            echo "PR92_INTEGRATED_EVALUATION_V2_GATE_PASS" >> "$RESULT"
          else
            echo "PR92_INTEGRATED_EVALUATION_V2_GATE_FAIL" >> "$RESULT"
          fi
          echo >> "$RESULT"
          echo "## Log tail" >> "$RESULT"
          echo >> "$RESULT"
          echo '```text' >> "$RESULT"
          tail -n 220 "$LOG" >> "$RESULT"
          echo '```' >> "$RESULT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Commit gate result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verification/pr92-integrated-evaluation-v2-result.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(skin-decision): record PR92 exact-head gate result"
          git push
