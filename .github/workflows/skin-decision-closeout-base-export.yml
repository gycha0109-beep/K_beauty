name: Skin Decision Closeout Base Artifact Cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/skin-decision-closeout-base-export.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete temporary base artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/delete-response.json --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/8947122102")
          if [ "$code" != "204" ] && [ "$code" != "404" ]; then
            cat /tmp/delete-response.json
            exit 1
          fi
