name: Unified Vision Static Guard

on:
  pull_request:
    paths:
      - "app/api/analyze/**"
      - "app/api/face-reading/**"
      - "app/page.js"
      - "lib/face-lab-archetype-*.js"
      - "lib/face-lab-observation-projector.js"
      - "lib/openai-env-diagnostics.js"
      - "lib/recommendation-feature-*.js"
      - "lib/skin-quantization-calibration.js"
      - "lib/server/vision-observation-service.js"
      - "lib/skin-observation-projector.js"
      - "lib/vision-observation-contract.js"
      - "lib/vision-observation-normalizer.js"
      - "scripts/evaluate-face-lab-archetype-calibration*.mjs"
      - "scripts/face-lab-provider-e2e/**"
      - "scripts/fixtures/face-lab-archetype-calibration-*.json"
      - "scripts/fixtures/skin-quantization-calibration-*.json"
      - "scripts/verify-analysis-request-guard.mjs"
      - "scripts/verify-anonymous-write-grant-v2.mjs"
      - "scripts/verify-analysis-rls-contract.mjs"
      - "scripts/verify-face-lab-*.mjs"
      - "scripts/verify-provider-runtime-log-sanitization.mjs"
      - "scripts/verify-recommendation-feature-*.mjs"
      - "scripts/verify-skin-quantization-calibration.mjs"
      - "scripts/verify-unified-vision-pipeline.mjs"
      - "docs/domain/recommendation/**"
      - "docs/verification/recommendation-feature-*.json"
      - "docs/verification/skin-quantization-*.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/face-lab-provider-e2e.yml"
      - ".github/workflows/unified-vision-static-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify unified Vision pipeline
        run: npm run verify:unified-vision-pipeline

      - name: Verify Face Lab archetype shadow scoring
        run: npm run verify:face-lab-archetype-scoring

      - name: Verify Face Lab archetype calibration harness
        run: npm run verify:face-lab-archetype-calibration

      - name: Verify Recommendation Feature V1 enums
        run: node scripts/verify-recommendation-feature-contract.mjs --section=enums

      - name: Verify Recommendation Feature V1 field envelope
        run: node scripts/verify-recommendation-feature-contract.mjs --section=field

      - name: Verify Recommendation Feature V1 Skin cue invariants
        run: node scripts/verify-recommendation-feature-contract.mjs --section=skin

      - name: Verify Recommendation Feature V1 bundle
        run: node scripts/verify-recommendation-feature-contract.mjs --section=bundle

      - name: Verify Recommendation Feature V1 derived features
        run: npm run verify:recommendation-feature-derived

      - name: Verify Recommendation Feature V1 adapters
        run: npm run verify:recommendation-feature-adapters

      - name: Verify Skin quantization calibration governance
        run: npm run verify:skin-quantization-calibration

      - name: Verify Face Lab evaluation contracts
        run: npm run face-lab:eval:verify

      - name: Verify Face Lab Provider E2E package
        run: npm run face-lab:e2e:verify

      - name: Verify analysis request guard
        run: node scripts/verify-analysis-request-guard.mjs

      - name: Verify Provider log sanitization
        run: node scripts/verify-provider-runtime-log-sanitization.mjs

      - name: Verify anonymous write grant
        run: node scripts/verify-anonymous-write-grant-v2.mjs

      - name: Verify analysis RLS contract
        run: node scripts/verify-analysis-rls-contract.mjs

      - name: Verify architecture guard
        run: npm run architecture:guard

      - name: Build production application
        run: npm run build

      - name: Check changed-file whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && [ -n "${HEAD_SHA}" ]; then
            git diff --check "${BASE_SHA}" "${HEAD_SHA}"
          else
            git diff --check HEAD^
          fi
