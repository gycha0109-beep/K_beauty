name: Crawler Controlled Operational Activation Closeout v1

on:
  push:
    branches:
      - crawler/controlled-operational-activation-v1
      - main
    paths:
      - ".github/workflows/crawler-controlled-operational-activation-v1.yml"
      - ".github/workflows/crawler-controlled-operational-activation-closeout-v1.yml"
      - "crawler/config/controlled-operational-activation-v1.json"
      - "crawler/image-source-policy-loader.mjs"
      - "crawler/package.json"
      - "crawler/test-security-policy-runtime-import.ts"
      - "docs/evidence/crawler-controlled-operational-activation-v1.md"
      - "evidence/crawler-controlled-operational-activation-v1.json"
      - "scripts/verify-crawler-controlled-operational-activation-v1.mjs"
  pull_request:
    paths:
      - ".github/workflows/crawler-controlled-operational-activation-v1.yml"
      - ".github/workflows/crawler-controlled-operational-activation-closeout-v1.yml"
      - "crawler/config/controlled-operational-activation-v1.json"
      - "crawler/image-source-policy-loader.mjs"
      - "crawler/package.json"
      - "crawler/test-security-policy-runtime-import.ts"
      - "docs/evidence/crawler-controlled-operational-activation-v1.md"
      - "evidence/crawler-controlled-operational-activation-v1.json"
      - "scripts/verify-crawler-controlled-operational-activation-v1.mjs"

permissions:
  contents: read
  statuses: write

concurrency:
  group: crawler-controlled-operational-activation-closeout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  STAGE_BASE_SHA: 4b6dfaf6d90826728f8029bcaa3be3fcde77c3f5
  RECOMMENDATION_REFERENCE_SHA: 783afb91a964f5d762f46846f9ef854902b48e95
  CLOSEOUT_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001
  NEXT_PUBLIC_SUPABASE_URL: https://bygrczggxfuisupcevaz.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

jobs:
  verify-closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CLOSEOUT_CHECKOUT_SHA }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Exact-head and bounded repository scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CLOSEOUT_CHECKOUT_SHA"
          git merge-base --is-ancestor "$STAGE_BASE_SHA" HEAD

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            scope_base="$(git rev-parse HEAD^1)"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            scope_base="$(git merge-base origin/main HEAD)"
          else
            scope_base="$STAGE_BASE_SHA"
          fi

          changed="$(git diff --name-only "$scope_base" HEAD)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/crawler-controlled-operational-activation-v1\.yml|\.github/workflows/crawler-controlled-operational-activation-closeout-v1\.yml|crawler/config/controlled-operational-activation-v1\.json|crawler/image-source-policy-loader\.mjs|crawler/package\.json|crawler/test-security-policy-runtime-import\.ts|docs/evidence/crawler-controlled-operational-activation-v1\.md|evidence/crawler-controlled-operational-activation-v1\.json|scripts/verify-crawler-controlled-operational-activation-v1\.mjs)$' || true)"
          test -z "$forbidden"

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install crawler dependencies
        working-directory: crawler
        run: npm ci --no-audit --no-fund

      - name: Verify frozen Stage evidence and ceilings
        run: node scripts/verify-crawler-controlled-operational-activation-v1.mjs

      - name: Verify crawler runtime and ranking idempotency contracts
        working-directory: crawler
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run verify:security-policy-runtime-import
          npm run test:ranking-ingest
          npm run test:ranking-review-rules

      - name: Revalidate frozen G3 G3A G2 PDA authority
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-v21-admission-g3-production-candidate-gate-v1.mjs
          node scripts/verify-v21-admission-g3a-pf-authority-reader-v1.mjs
          node scripts/product-evidence/verify-initial-admission-grant-policy-v1.mjs
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-contract-v1.mjs

      - name: CandidatePolicy invariance
        run: npm run verify:candidate-exposure-policy-shadow

      - name: Prepare immutable Recommendation reference
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q "$RECOMMENDATION_REFERENCE_SHA"
          node -e 'const f=require("./_reference/recommendation/fixtures/recommendation-metadata/products-v1.json"); if(f.productCount!==164) process.exit(1)'

      - name: Historical canonical 164x12 Recommendation invariance
        env:
          RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
        run: node scripts/verify-skin-decision-recommendation-invariance.mjs

      - name: Scheduler auto-adoption and authority shortcut guards
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const v=require("./vercel.json"); if(Object.prototype.hasOwnProperty.call(v,"crons")) process.exit(1)'
          ! grep -R -n -E '^  schedule:|^    - cron:' .github/workflows/*crawler*.yml
          ! git grep -n -E 'read_recommendation_admission_authority_v1|INITIAL_ADMISSION_GRANT|product_fact_current|product_fact_confirmations|product_fact_instances' -- 'crawler/**'

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            scope_base="$(git rev-parse HEAD^1)"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            scope_base="$(git merge-base origin/main HEAD)"
          else
            scope_base="$STAGE_BASE_SHA"
          fi
          added="$(git diff --unified=0 "$scope_base" HEAD -- . ':!docs/**' ':!evidence/**' || true)"
          ! printf '%s\n' "$added" | grep -E '^\+.*(sb_secret_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{40,}|postgres(ql)?://[^[:space:]]+:[^[:space:]@]+@)'

      - name: Production build
        run: npm run build

      - name: Publish exact-SHA closeout attestation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=success
          context="Crawler controlled activation exact-head closeout CI"
          description="Controlled activation exact-head closeout passed"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            context="Crawler controlled activation merged-main exact-SHA CI"
            description="Controlled activation merged-main exact-SHA CI passed"
          fi
          if [ "$PRIOR_JOB_STATUS" != success ]; then
            state=failure
            description="${context} failed"
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${CLOSEOUT_CHECKOUT_SHA}" \
            -f state="$state" \
            -f context="$context" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          test "$state" = success
