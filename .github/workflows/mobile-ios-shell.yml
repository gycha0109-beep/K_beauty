name: BEJEWELY Mobile iOS Shell

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/components/**"
      - "apps/mobile/features/**"
      - "apps/mobile/lib/**"
      - "apps/mobile/modules/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "apps/mobile/tsconfig.json"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-mobile-architecture-foundation.mjs"
      - "scripts/apply-expo-modules-jsi-xcode26-compat.mjs"
      - "scripts/verify-mobile-ios-shell.mjs"
      - "scripts/verify-mobile-ios-smoke.sh"
      - ".github/workflows/mobile-ios-shell.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/components/**"
      - "apps/mobile/features/**"
      - "apps/mobile/lib/**"
      - "apps/mobile/modules/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "apps/mobile/tsconfig.json"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-mobile-architecture-foundation.mjs"
      - "scripts/apply-expo-modules-jsi-xcode26-compat.mjs"
      - "scripts/verify-mobile-ios-shell.mjs"
      - "scripts/verify-mobile-ios-smoke.sh"
      - ".github/workflows/mobile-ios-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ios-shell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-native-shell:
    name: iOS Native Shell
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_IOS_SHA=%s\n' "$actual"

      - name: Verify Xcode 26.2 toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.2"
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-version
          printf 'MOBILE_IOS_XCODE_26_2=PASS\n'

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Apply bounded Expo Modules JSI Xcode 26.2 compatibility shim
        run: node scripts/apply-expo-modules-jsi-xcode26-compat.mjs

      - name: Verify platform boundary and types
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:mobile-foundation
          npm run mobile:typecheck
          npm run mobile:config

      - name: Generate iOS native project
        run: npm run prebuild:ios --workspace @bejewely/mobile

      - name: Verify generated iOS contract
        run: node scripts/verify-mobile-ios-shell.mjs

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -euo pipefail
          pod --version
          cd apps/mobile/ios
          pod install

      - name: Build, install, and verify iOS Simulator shell
        shell: bash
        run: bash scripts/verify-mobile-ios-smoke.sh

      - name: Upload iOS Simulator app and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bejewely-mobile-ios-shell-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: apps/mobile/.mobile-ios-artifacts/**
