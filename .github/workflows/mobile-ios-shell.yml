      - "apps/mobile/lib/request-scope.ts"
      - "apps/mobile/lib/photo-cache.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/resolve-mobile-ci-impact.mjs"
      - "scripts/test-mobile-ci-impact.mjs"
      - "apps/mobile/modules/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "apps/mobile/app/_layout.tsx"
      - "apps/mobile/app/index.tsx"
      - "apps/mobile/features/camera/NativeFaceCamera.tsx"
      - "apps/mobile/lib/auth.ts"
      - "apps/mobile/lib/env.ts"
      - "apps/mobile/lib/my.ts"
      - "apps/mobile/lib/supabase.ts"
