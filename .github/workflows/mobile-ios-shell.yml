      - "scripts/apply-expo-modules-jsi-xcode26-compat.mjs"
      - "scripts/verify-mobile-ios-shell.mjs"
      - "scripts/verify-mobile-ios-smoke.sh"
      - "scripts/test-mobile-ios-runtime-observer.mjs"
      - ".github/workflows/mobile-ios-shell.yml"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-ios-shell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-impact-plan:
    name: iOS Mobile Impact Shadow Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.plan.outputs.candidate_sha }}
      run_android: ${{ steps.plan.outputs.run_android }}
      run_ios: ${{ steps.plan.outputs.run_ios }}
      shadow: ${{ steps.plan.outputs.shadow }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
      - name: Record conservative mobile impact plan
        id: plan
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MOBILE_CI_EVENT: ${{ github.event_name }}
          MOBILE_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/resolve-mobile-ci-impact.mjs

  ios-native-shell:
    name: iOS Native Shell
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_IOS_SHA=%s\n' "$actual"

      - name: Verify Xcode 26.6 toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"
          xcodebuild -version
          swift --version
          xcrun --sdk iphonesimulator --show-sdk-version
          printf 'MOBILE_IOS_XCODE_26_6=PASS\n'

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Apply bounded Expo Modules JSI Xcode 26 compatibility shim
        run: node scripts/apply-expo-modules-jsi-xcode26-compat.mjs

      - name: Verify platform boundary and types
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/test-mobile-ios-runtime-observer.mjs
          npm run verify:mobile-foundation
          npm run verify:mobile-entry-routing
          npm run mobile:typecheck
          npm run mobile:config

      - name: Generate iOS native project
        run: npm run prebuild:ios --workspace @bejewely/mobile

      - name: Verify generated iOS contract
        run: node scripts/verify-mobile-ios-shell.mjs

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -euo pipefail
          pod --version
          cd apps/mobile/ios
          pod install

      - name: Build, install, and verify iOS Simulator shell
        shell: bash
        run: bash scripts/verify-mobile-ios-smoke.sh

      - name: Upload iOS Simulator app and runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bejewely-mobile-ios-shell-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: apps/mobile/.mobile-ios-artifacts/**

  mobile-impact-verify:
    name: iOS Selected Native Verification
    if: always()
    needs: [mobile-impact-plan, ios-native-shell]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
      - name: Reject failed planner or selected native jobs
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MOBILE_CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/resolve-mobile-ci-impact.mjs verify ios
