      - "apps/mobile/app/my.tsx"
      - "apps/mobile/app/premium.tsx"
      - "apps/mobile/app/privacy-account.tsx"
      - "apps/mobile/app/saved-report.tsx"
      - "apps/mobile/components/NativePrivacyLinks.tsx"
      - "apps/mobile/components/NativeAccountDeletionCard.tsx"
      - "apps/mobile/components/ScreenShell.tsx"
      - "apps/mobile/features/analyze/NativeAnalyzeResult.tsx"
      - "apps/mobile/features/analyze/NativeAnalyzeSurvey.tsx"
      - "apps/mobile/features/analyze/analyze-client.ts"
      - "apps/mobile/features/my/NativeMyDiaryView.tsx"
      - "apps/mobile/features/premium/NativeCurrentProductsSelector.tsx"
      - "apps/mobile/features/premium/premium-client.ts"
      - "apps/mobile/features/reports/NativeSavedReport.tsx"
      - "apps/mobile/features/reports/public-result-client.ts"
      - "apps/mobile/features/reports/public-share-client.ts"
      - "apps/mobile/features/reports/saved-report-client.ts"
      - "apps/mobile/lib/auth-callback.ts"
      - "apps/mobile/lib/mobile-shell.tsx"
      - "apps/mobile/lib/account-deletion.ts"
