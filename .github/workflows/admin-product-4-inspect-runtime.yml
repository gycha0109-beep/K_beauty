name: ADMIN PRODUCT 4 Inspect Runtime

on:
  push:
    branches:
      - automation/admin-product-4-inspect

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: admin-product-4-authoritative-runtime
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BASE_SHA: e174f80f79fa9ce5d62c742f440c9e18e602929a
      BASE_BRANCH: feature/admin-product-review-import-confirm
      TARGET_BRANCH: feature/admin-product-review-import-ui
      SUPABASE_CLI_VERSION: 2.109.1
      ADMIN_PRODUCT_REVIEW_IMPORT_RUNTIME_DIR: ${{ runner.temp }}/admin-product-review-import-ui-precommit
      REVIEW_IMPORT_PACKAGE_DIR: data/review-batches/admin-product-review-import-ui-precommit
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout registered helper
        uses: actions/checkout@v4
        with:
          ref: automation/admin-product-4-inspect
          fetch-depth: 20
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare reviewed validator
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/admin-product-4-run-validation.sh "$RUNNER_TEMP/admin-product-4-run-validation.sh"
          cat > "$RUNNER_TEMP/admin-product-4-latest.patch" <<'PATCH'
          diff --git a/lib/admin/product-review-import/http-handlers.js b/lib/admin/product-review-import/http-handlers.js
          --- a/lib/admin/product-review-import/http-handlers.js
          +++ b/lib/admin/product-review-import/http-handlers.js
          @@ -64,11 +64,20 @@ export function createProductReviewImportDryRunHandler({
             executeDryRun
           }) {
             return async function POST(request) {
          -    const access = await resolveAccess();
          +    let access;
          +    try {
          +      access = await resolveAccess();
          +    } catch {
          +      return failure({ code: "unexpected_error", status: 500 }, "unexpected_error");
          +    }
               const denied = accessError(access);
               if (denied) return denied;
          -    if (!isAllowedOrigin(request)) {
          -      return failure({ code: "invalid_origin", status: 403 }, "invalid_origin");
          +    try {
          +      if (!isAllowedOrigin(request)) {
          +        return failure({ code: "invalid_origin", status: 403 }, "invalid_origin");
          +      }
          +    } catch {
          +      return failure({ code: "unexpected_error", status: 500 }, "unexpected_error");
               }
           
               try {
          @@ -89,11 +98,20 @@ export function createProductReviewImportConfirmHandler({
             executeConfirm
           }) {
             return async function POST(request) {
          -    const access = await resolveAccess();
          +    let access;
          +    try {
          +      access = await resolveAccess();
          +    } catch {
          +      return failure({ code: "unexpected_error", status: 500 }, "unexpected_error");
          +    }
               const denied = accessError(access);
               if (denied) return denied;
          -    if (!isAllowedOrigin(request)) {
          -      return failure({ code: "invalid_origin", status: 403 }, "invalid_origin");
          +    try {
          +      if (!isAllowedOrigin(request)) {
          +        return failure({ code: "invalid_origin", status: 403 }, "invalid_origin");
          +      }
          +    } catch {
          +      return failure({ code: "unexpected_error", status: 500 }, "unexpected_error");
               }
           
               try {
          diff --git a/scripts/verify-admin-product-review-import-routes.mjs b/scripts/verify-admin-product-review-import-routes.mjs
          --- a/scripts/verify-admin-product-review-import-routes.mjs
          +++ b/scripts/verify-admin-product-review-import-routes.mjs
          @@ -180,6 +180,42 @@ const originHandler = createProductReviewImportDryRunHandler({
           });
           assert.equal((await payload(await originHandler(new Request(URL)))).error, "invalid_origin");
           
          +const accessFailureHandler = createProductReviewImportDryRunHandler({
          +  resolveAccess: async () => {
          +    throw new Error("session provider raw failure");
          +  },
          +  isAllowedOrigin: () => true,
          +  parseMultipart: () => {
          +    throw new Error("must_not_parse");
          +  },
          +  parsePackage,
          +  executeDryRun: async () => ({})
          +});
          +const accessFailureResponse = await accessFailureHandler(new Request(URL));
          +assert.equal(accessFailureResponse.status, 500);
          +assert.equal(accessFailureResponse.headers.get("cache-control"), "private, no-store, max-age=0");
          +assert.deepEqual(await payload(accessFailureResponse), {
          +  ok: false,
          +  status: "invalid",
          +  error: "unexpected_error",
          +  message: "관리자 import 작업을 완료하지 못했습니다."
          +});
          +
          +const originFailureHandler = createProductReviewImportDryRunHandler({
          +  resolveAccess: allowedAccess,
          +  isAllowedOrigin: () => {
          +    throw new Error("origin policy raw failure");
          +  },
          +  parseMultipart: () => {
          +    throw new Error("must_not_parse");
          +  },
          +  parsePackage,
          +  executeDryRun: async () => ({})
          +});
          +const originFailureResponse = await originFailureHandler(new Request(URL));
          +assert.equal(originFailureResponse.status, 500);
          +assert.equal((await payload(originFailureResponse)).error, "unexpected_error");
          +
           let boundActor = null;
           const confirmHandler = createProductReviewImportConfirmHandler({
             resolveAccess: allowedAccess,
          PATCH
          python - <<'PY'
          from pathlib import Path
          path = Path("/tmp/admin-product-4-run-validation.sh")
          text = path.read_text()
          marker = 'cat > "$RUNNER_TEMP/admin-product-4-intended.txt" <<\'FILES\''
          replacement = 'git apply "$RUNNER_TEMP/admin-product-4-latest.patch"\n\n' + marker
          if text.count(marker) != 1:
              raise SystemExit("validator insertion marker not found once")
          path.write_text(text.replace(marker, replacement, 1))
          PY
          chmod +x "$RUNNER_TEMP/admin-product-4-run-validation.sh"

      - name: Validate implementation and create feature commit
        run: bash "$RUNNER_TEMP/admin-product-4-run-validation.sh"

      - name: Publish validated target branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
          test "$(git log -1 --pretty=%s)" = "feat(admin): add product review import workbench"
          remote_target="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote_target}" = "${BASE_SHA}"
          feature_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          gh pr comment 146 --repo "$GITHUB_REPOSITORY" --body "ADMIN-PRODUCT-4 feature commit published after authoritative validation.
          Run ID: $GITHUB_RUN_ID
          Feature SHA: ${feature_sha}
          Target: ${TARGET_BRANCH}"
