name: ADMIN PRODUCT 4 Inspect Runtime

on:
  push:
    branches:
      - automation/admin-product-4-inspect

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query status validator runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(gh run list --repo "$GITHUB_REPOSITORY" --branch automation/admin-product-4-status --limit 20 --json databaseId,name,headSha,status,conclusion,createdAt,updatedAt,url,jobs)"
          gh pr comment 142 --repo "$GITHUB_REPOSITORY" --body "ADMIN-PRODUCT-4 status validator snapshot:\n\`\`\`json\n${result}\n\`\`\`"
