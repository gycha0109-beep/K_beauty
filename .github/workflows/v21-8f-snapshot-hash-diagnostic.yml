name: V21-8F Snapshot Hash Diagnostic

on:
  push:
    branches: [research/product-fact-catalog-expansion-wave-1-planning-v1]

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Print frozen partition hashes
        shell: bash
        run: |
          set -euo pipefail
          for f in evidence/product-fact-catalog-expansion-v1/hosted-selection-snapshot-v1/*.json; do
            printf '%s sha256=' "$f"
            sha256sum "$f" | awk '{print $1}'
            printf '%s git_blob=' "$f"
            git hash-object "$f"
          done
