name: DATA-AI14 Historical Production Canary Guard

on:
  push:
    branches: [main]
    paths:
      - "vercel.json"
      - ".github/workflows/data-ai14-production-canary.yml"
      - "scripts/verify-data-ai14-production-canary-harness.mjs"
  pull_request:
    branches: [main]
    paths:
      - "vercel.json"
      - ".github/workflows/data-ai14-production-canary.yml"
      - "scripts/verify-data-ai14-production-canary-harness.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-ai14-historical-canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  historical-guard:
    name: DATA-AI14 historical canary remains closed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Assert superseded Production canary manifest remains absent
        shell: bash
        run: |
          set -euo pipefail
          for key in             BEJEWELY_PRODUCT_QUERY_PRODUCTION_ACTIVATION_ENABLED             BEJEWELY_PRODUCT_QUERY_PRODUCTION_CANARY_MODE             BEJEWELY_PRODUCT_QUERY_PRODUCTION_KILL_SWITCH             BEJEWELY_PRODUCT_QUERY_PRODUCTION_COHORT             BEJEWELY_PRODUCT_QUERY_PRODUCTION_SAMPLE_BPS             BEJEWELY_PRODUCT_QUERY_PRODUCTION_APPROVED_SAMPLE_BPS             BEJEWELY_PRODUCT_QUERY_PRODUCTION_APPROVED_ACCOUNT_HASHES             BEJEWELY_PRODUCT_QUERY_PRODUCTION_WINDOW_START_UTC             BEJEWELY_PRODUCT_QUERY_PRODUCTION_WINDOW_END_UTC             BEJEWELY_PRODUCT_QUERY_PRODUCTION_ENV_MUTATION_AUTHORIZED             BEJEWELY_PRODUCT_QUERY_PRODUCTION_RUNTIME_AUTHORIZED
          do
            test "$(jq -r --arg key "$key" '.env | has($key)' vercel.json)" = "false"
          done
          echo "DATA_AI14_HISTORICAL_CANARY=SUPERSEDED_BY_DATA_AI16"
