name: Face Lab M0 Capture Browser Acceptance
run-name: "[WT:face-research] Face Lab M0 Capture Browser Acceptance"

on:
  pull_request:
    paths:
      - "components/onboarding/PhotoUploadStep.js"
      - "tests/e2e/mobile-camera.spec.ts"
      - ".github/workflows/face-lab-m0-capture-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: face-lab-m0-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture-browser:
    name: Face Lab M0 Browser Capture (Mock)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run M0 notice and responsive browser tests
        run: npx playwright test tests/e2e/mobile-camera.spec.ts --project=chromium -g "shared Face Lab|narrow widths"
      - name: Upload failed test trace only
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: face-lab-m0-browser-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
