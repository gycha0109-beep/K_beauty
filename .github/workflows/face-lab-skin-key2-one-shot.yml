# S1-B nonproduction research. A single synthetic text-only test call.
# Safe on PR branch push only; changes to application code do not trigger paid calls.
name: Face Lab Skin - KEY2 Single Synthetic Smoke
run-name: "[WT:face-research] Face Lab Skin KEY2 isolated one-shot smoke"

on:
  push:
    branches:
      - face-lab/research-skin-key2-provider-smoke-20261015
    paths:
      - .github/workflows/face-lab-skin-key2-one-shot.yml

permissions:
  contents: read

concurrency:
  group: face-lab-skin-key2-one-shot
  cancel-in-progress: false

jobs:
  synthetic-provider-smoke:
    if: github.repository == 'gycha0109-beep/K_beauty' && github.ref == 'refs/heads/face-lab/research-skin-key2-provider-smoke-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout this exact commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run mock-only security and contract verification
        run: node scripts/facelab/skin/verify-skin-key2-synthetic-provider-smoke.mjs
      - name: Run ONE text-only provider call via repository test secret
        env:
          OPENAI_API_KEY2: ${{ secrets.OPENAI_API_KEY2 }}
        run: node scripts/facelab/skin/run-skin-key2-smoke.mjs --live-synthetic-text
