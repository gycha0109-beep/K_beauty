name: DATA-TAXONOMY1 Shadow Catalog Taxonomy Foundation

on:
  pull_request:
    paths:
      - "supabase/migrations/20260913201050_data_taxonomy1_shadow_catalog_taxonomy_foundation_v1.sql"
      - "supabase/migrations/20260913201324_data_taxonomy1_shadow_catalog_taxonomy_hardening_v1.sql"
      - "docs/evidence/data-taxonomy1-shadow-catalog-taxonomy-foundation-v1.md"
      - "scripts/verify-data-taxonomy1-shadow-catalog-taxonomy-foundation-v1.mjs"
      - ".github/workflows/data-taxonomy1-shadow-catalog-taxonomy-foundation-v1.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260913201050_data_taxonomy1_shadow_catalog_taxonomy_foundation_v1.sql"
      - "supabase/migrations/20260913201324_data_taxonomy1_shadow_catalog_taxonomy_hardening_v1.sql"
      - "docs/evidence/data-taxonomy1-shadow-catalog-taxonomy-foundation-v1.md"
      - "scripts/verify-data-taxonomy1-shadow-catalog-taxonomy-foundation-v1.mjs"
      - ".github/workflows/data-taxonomy1-shadow-catalog-taxonomy-foundation-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify exact DATA-TAXONOMY1 change scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          while IFS= read -r path; do
            case "$path" in
              supabase/migrations/20260913201050_data_taxonomy1_shadow_catalog_taxonomy_foundation_v1.sql|\
              supabase/migrations/20260913201324_data_taxonomy1_shadow_catalog_taxonomy_hardening_v1.sql|\
              docs/evidence/data-taxonomy1-shadow-catalog-taxonomy-foundation-v1.md|\
              scripts/verify-data-taxonomy1-shadow-catalog-taxonomy-foundation-v1.mjs|\
              .github/workflows/data-taxonomy1-shadow-catalog-taxonomy-foundation-v1.yml)
                ;;
              *)
                echo "Unexpected DATA-TAXONOMY1 path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

      - name: Verify shadow taxonomy contract
        run: node scripts/verify-data-taxonomy1-shadow-catalog-taxonomy-foundation-v1.mjs
