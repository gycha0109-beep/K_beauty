name: TRUST-P13 Isntree KR Market Formulation Fact Source Research

on:
  pull_request:
    paths:
      - "evidence/product-fact-subject-coverage-v1/trust-p13-isntree-kr-market-formulation-fact-source-research-v1.json"
      - "docs/evidence/trust-p13-isntree-kr-market-formulation-fact-source-research-v1.md"
      - "scripts/product-evidence/verify-trust-p13-isntree-kr-market-formulation-fact-source-research-v1.mjs"
      - ".github/workflows/trust-p13-isntree-kr-market-formulation-fact-source-research.yml"
  push:
    branches:
      - main
    paths:
      - "evidence/product-fact-subject-coverage-v1/trust-p13-isntree-kr-market-formulation-fact-source-research-v1.json"
      - "docs/evidence/trust-p13-isntree-kr-market-formulation-fact-source-research-v1.md"
      - "scripts/product-evidence/verify-trust-p13-isntree-kr-market-formulation-fact-source-research-v1.mjs"
      - ".github/workflows/trust-p13-isntree-kr-market-formulation-fact-source-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-trust-p13-isntree-kr-market-formulation-fact-source-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Attest exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify TRUST-P13 research freeze
        run: node scripts/product-evidence/verify-trust-p13-isntree-kr-market-formulation-fact-source-research-v1.mjs
