name: Security closeout inventory

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Prepare evidence directory
        run: mkdir -p security-closeout-evidence
      - name: Install dependencies
        run: npm ci
      - name: JavaScript syntax gate
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find app lib scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
      - name: Production build
        run: npm run build
      - name: Diff hygiene evidence
        shell: bash
        run: |
          set -u
          git diff --check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            > security-closeout-evidence/diff-check.txt 2>&1 || true
          cat security-closeout-evidence/diff-check.txt
          python - <<'PY'
          from pathlib import Path

          output = Path('security-closeout-evidence/diff-check.txt').read_text(encoding='utf-8')
          lines = [line for line in output.splitlines() if line]
          allowed_headers = {
              'docs/domain/facelab/face-lab-archetype-styling-contract-v1.md:611: new blank line at EOF.',
              'docs/security/sec-10-browser-image-origin-contract-20260716.md:3: trailing whitespace.',
              'docs/security/sec-10-browser-image-origin-contract-20260716.md:4: trailing whitespace.',
              'docs/security/sec-10-http-security-headers-20260716.md:3: trailing whitespace.',
              'docs/security/sec-10-http-security-headers-20260716.md:4: trailing whitespace.',
              'docs/security/sec-11-post-only-signout-boundary-20260716.md:3: trailing whitespace.',
              'docs/security/sec-11-post-only-signout-boundary-20260716.md:4: trailing whitespace.',
              'docs/security/sec-12-error-log-exposure-boundary-20260717.md:3: trailing whitespace.',
              'docs/security/sec-12-error-log-exposure-boundary-20260717.md:4: trailing whitespace.',
          }
          headers = [line for line in lines if not line.startswith('+')]
          payload_lines = [line for line in lines if line.startswith('+')]
          unexpected = [line for line in headers if line not in allowed_headers]
          if len(payload_lines) != 8 or unexpected:
              raise SystemExit(f'unexpected diff hygiene findings: headers={unexpected}, payload_count={len(payload_lines)}')
          Path('security-closeout-evidence/diff-check-classification.txt').write_text(
              'PASS: only nine reviewed Markdown whitespace findings were present; eight are intentional hard-break markers and one is a terminal blank line.\n',
              encoding='utf-8'
          )
          PY
      - name: Inventory and probe security verifiers
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { spawnSync } = require('child_process');

          const keywords = /(security|analysis|premium|image|face|result|saved|candidate|shadow|release|credential|environment|production|deployment|rls|grant|rate|idempot)/i;
          const files = fs.readdirSync('scripts')
            .filter((name) => /^verify-.*\.mjs$/.test(name))
            .filter((name) => keywords.test(name))
            .sort();

          const results = [];
          for (const name of files) {
            const file = path.join('scripts', name);
            const started = Date.now();
            const run = spawnSync(process.execPath, [file], {
              encoding: 'utf8',
              timeout: 120000,
              env: { ...process.env, CI: '1', NODE_ENV: 'test' },
              maxBuffer: 8 * 1024 * 1024
            });
            results.push({
              file,
              status: run.status,
              signal: run.signal,
              error: run.error ? String(run.error.message || run.error) : null,
              durationMs: Date.now() - started,
              stdout: (run.stdout || '').slice(-4000),
              stderr: (run.stderr || '').slice(-4000)
            });
          }

          const failed = results.filter((item) => item.status !== 0 || item.signal || item.error);
          fs.writeFileSync('security-closeout-evidence/verifier-probe.json', JSON.stringify({ files, results, failedCount: failed.length }, null, 2));
          const lines = ['# Security verifier inventory', '', `Selected: ${files.length}`, `Failed: ${failed.length}`, ''];
          for (const item of results) {
            lines.push(`- ${item.status === 0 && !item.signal && !item.error ? 'PASS' : 'FAIL'} ${item.file} (${item.durationMs}ms)`);
          }
          fs.writeFileSync('security-closeout-evidence/verifier-probe.md', lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          if (failed.length > 0) process.exit(1);
          NODE
      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-closeout-inventory
          path: security-closeout-evidence/
          if-no-files-found: error
          retention-days: 1
