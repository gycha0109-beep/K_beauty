name: BEJEWELY Current Main Health

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-main-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-main-health:
    name: BEJEWELY Current Main Health
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'CURRENT_MAIN_HEALTH_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install crawler dependencies
        run: npm --prefix crawler ci

      - name: Run canonical current-main verification
        run: npm run verify:current
