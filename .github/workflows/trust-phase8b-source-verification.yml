name: TRUST Phase 8B Source Verification Ledger

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*trust_phase8b_*.sql"
      - "tests/fixtures/trust-phase8b-source-verification/**"
      - "scripts/verify-trust-phase8b-source-verification.mjs"
      - ".github/workflows/trust-phase8b-source-verification.yml"
  push:
    branches: [main, "feat/trust-phase8b-source-verification-ledger"]
    paths:
      - "supabase/migrations/*trust_phase8b_*.sql"
      - "tests/fixtures/trust-phase8b-source-verification/**"
      - "scripts/verify-trust-phase8b-source-verification.mjs"
      - ".github/workflows/trust-phase8b-source-verification.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.117.0

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Phase 8B static contract
        run: node scripts/verify-trust-phase8b-source-verification.mjs

      - name: Materialize isolated Product Fact runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="${GITHUB_WORKSPACE}/tmp/trust-phase8b-runtime"
          echo "TRUST_RUNTIME_DIR=${runtime_dir}" >>"${GITHUB_ENV}"
          node scripts/materialize-product-fact-replay-baseline-v1.mjs --output="${runtime_dir}"
          sed -i 's/major_version = 15/major_version = 17/' "${runtime_dir}/supabase/config.toml"
          migration_dir="${runtime_dir}/supabase/migrations"
          cp supabase/migrations/20260809115932_product_fact_storage_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260922010000_trust_phase8b_source_verification_ledger_v1.sql "${migration_dir}/"

      - name: Start isolated Supabase and verify source ledger
        shell: bash
        run: |
          set -euo pipefail
          start_log="${RUNNER_TEMP}/trust-phase8b-start.log"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" start             --workdir "${TRUST_RUNTIME_DIR}"             --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor             >"${start_log}" 2>&1; then
            sed -E 's#(sb_(publishable|secret)_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+|postgresql://[^[:space:]]+)#[REDACTED]#g' "${start_log}" >&2
            exit 1
          fi
          rm -f "${start_log}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --workdir "${TRUST_RUNTIME_DIR}"
          DB_PORT="$(awk 'BEGIN{in_db=0} /^\[db\]/{in_db=1;next} /^\[/{in_db=0} in_db && /^port =/{gsub(/[^0-9]/,"",$0);print $0;exit}' "${TRUST_RUNTIME_DIR}/supabase/config.toml")"
          test -n "${DB_PORT}"
          DB="postgresql://postgres:postgres@127.0.0.1:${DB_PORT}/postgres"
          psql "${DB}" -qAt -v ON_ERROR_STOP=1             -f tests/fixtures/trust-phase8b-source-verification/verify_trust_phase8b_source_verification_runtime.sql             | tee "${RUNNER_TEMP}/trust-phase8b-runtime.log"
          grep -q '^TRUST_PHASE8B_SOURCE_VERIFICATION_RUNTIME_VERIFIED$' "${RUNNER_TEMP}/trust-phase8b-runtime.log"

      - name: Check exact-head diff hygiene
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}...${HEAD_SHA}"

      - name: Stop isolated Supabase
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [[ -n "${TRUST_RUNTIME_DIR:-}" && -d "${TRUST_RUNTIME_DIR}/supabase" ]]; then
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --workdir "${TRUST_RUNTIME_DIR}" --no-backup
          fi
          rm -rf -- "${TRUST_RUNTIME_DIR:-${GITHUB_WORKSPACE}/tmp/trust-phase8b-runtime}"
