name: BEJEWELY Mobile 16F Store Listing Claims

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/store/mobile-listing-claims-readiness.json"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/google-play-health-apps-declaration.json"
      - "apps/mobile/app/analyze.tsx"
      - "lib/vision-observation-contract.js"
      - "scripts/verify-mobile-16f-store-listing-claims.mjs"
      - ".github/workflows/mobile-16f-store-listing-claims.yml"
  push:
    branches: [main]
    paths:
      - "docs/store/mobile-listing-claims-readiness.json"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/google-play-health-apps-declaration.json"
      - "apps/mobile/app/analyze.tsx"
      - "lib/vision-observation-contract.js"
      - "scripts/verify-mobile-16f-store-listing-claims.mjs"
      - ".github/workflows/mobile-16f-store-listing-claims.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-16f-store-listing-claims-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  store-listing-claims:
    name: Store Listing Claim Boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_16F_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify store listing claim boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-mobile-16f-store-listing-claims.mjs
          node scripts/verify-mobile-16f-store-listing-claims.mjs

      - name: Typecheck mobile client
        run: npm run mobile:typecheck
