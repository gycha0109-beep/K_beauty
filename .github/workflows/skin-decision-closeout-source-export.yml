name: Skin Decision Closeout Artifact Cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/skin-decision-closeout-source-export.yml

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete temporary source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for artifact_id in 8946925895 8946970252; do
            code=$(curl --silent --show-error --output /tmp/delete-response.json --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/artifacts/${artifact_id}")
            if [ "$code" != "204" ] && [ "$code" != "404" ]; then
              cat /tmp/delete-response.json
              exit 1
            fi
          done
