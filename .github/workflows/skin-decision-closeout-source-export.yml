name: Skin Decision Closeout Source Export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/skin-decision-closeout-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Record exact source SHA
        run: |
          set -euo pipefail
          git rev-parse HEAD > CLOSEOUT_SOURCE_SHA.txt
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: skin-decision-closeout-source-${{ github.event.pull_request.head.sha }}
          path: |
            .github
            app
            components
            docs
            lib
            scripts
            tests
            package.json
            package-lock.json
            next.config.js
            jsconfig.json
            vercel.json
            CLOSEOUT_SOURCE_SHA.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
