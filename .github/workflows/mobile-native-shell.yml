name: BEJEWELY Mobile Native Shell

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-mobile-architecture-foundation.mjs"
      - "scripts/verify-mobile-native-shell.mjs"
      - "scripts/verify-mobile-android-smoke.sh"
      - ".github/workflows/mobile-foundation.yml"
      - ".github/workflows/mobile-native-shell.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-mobile-architecture-foundation.mjs"
      - "scripts/verify-mobile-native-shell.mjs"
      - "scripts/verify-mobile-android-smoke.sh"
      - ".github/workflows/mobile-foundation.yml"
      - ".github/workflows/mobile-native-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-shell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-native-shell:
    name: Android Native Shell
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_NATIVE_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify platform boundary and types
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:mobile-foundation
          npm run mobile:typecheck
          npm run mobile:config

      - name: Generate Android native project
        run: npm run mobile:prebuild:android

      - name: Verify generated Android contract
        run: npm run verify:mobile-native

      - name: Build installable debug APK
        run: npm run mobile:build:android:debug

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install APK, and verify rendered shell
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          avd-name: bejewely-mobile-api35
          force-avd-creation: true
          disable-animations: true
          pre-emulator-launch-script: |
            config="$HOME/.android/avd/bejewely-mobile-api35.avd/config.ini"; test -f "$config"; if grep -q '^hw\.camera\.front' "$config"; then sed -i 's/^hw\.camera\.front.*/hw.camera.front=emulated/' "$config"; else printf '\nhw.camera.front=emulated\n' >> "$config"; fi; grep -q '^hw\.camera\.front=emulated$' "$config"; printf 'MOBILE_ANDROID_FRONT_CAMERA_AVD_CONFIG=PASS\n'
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated -camera-back none
          script: bash scripts/verify-mobile-android-smoke.sh

      - name: Upload APK and native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bejewely-mobile-native-shell-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/.mobile-native-artifacts/**
