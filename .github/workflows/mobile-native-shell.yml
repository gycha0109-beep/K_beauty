name: BEJEWELY Mobile Native Shell
run-name: "[WT:mobile] BEJEWELY Mobile Native Shell"

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/modules/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "scripts/verify-mobile-native-shell.mjs"
      - "scripts/verify-mobile-android-smoke.sh"
      - "scripts/await-mobile-android-runtime.mjs"
      - ".github/workflows/mobile-native-shell.yml"
      - ".github/workflows/mobile-android-runtime.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/modules/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "scripts/verify-mobile-native-shell.mjs"
      - "scripts/verify-mobile-android-smoke.sh"
      - "scripts/await-mobile-android-runtime.mjs"
      - ".github/workflows/mobile-native-shell.yml"
      - ".github/workflows/mobile-android-runtime.yml"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string


permissions:
  actions: read
  contents: read

concurrency:
  group: mobile-native-shell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-native-shell:
    name: Android Native Shell
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          printf 'MOBILE_NATIVE_COMPAT_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1

      - name: Gate compatibility check on canonical Android Runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/await-mobile-android-runtime.mjs
