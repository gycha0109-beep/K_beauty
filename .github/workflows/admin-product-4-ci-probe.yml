name: ADMIN-PRODUCT-4 CI Probe

on:
  push:
    branches:
      - feature/admin-product-review-import-ui

permissions:
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish run identity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="ADMIN-PRODUCT-4 CI probe: target ${GITHUB_SHA}, run ${GITHUB_RUN_ID}."
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/163/comments" \
            -d "$(printf '%s' "${body}" | jq -Rs '{body:.}')" >/dev/null
