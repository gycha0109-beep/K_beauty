name: EVAL-R1 Bootstrap Exact Production Patch

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

jobs:
  bootstrap-production-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact EVAL-R1 branch
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: eval/r1-persona-explanation-grounding-remediation

      - name: Apply frozen two-hunk correction and push
        id: patch
        continue-on-error: true
        env:
          EXPECTED_HEAD: f21d0a429752d2f87e4ca53c4aa10a0a44ba8208
          EXPECTED_PRE_BLOB: 5028688320264596a3eed31526f04a937abd8b94
          EXPECTED_POST_BLOB: 28ee297a6184a269fb7167fe462366e0c25ca47d
          EXPECTED_POST_SHA256: 5236e182eaa600036fbe5562f7a2807c1787c1556e4efb3460c60857c9d8a79c
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object lib/skin-match-decision-engine.js)" = "$EXPECTED_PRE_BLOB"
          test "$(wc -l < lib/skin-match-decision-engine.js | tr -d ' ')" = "3100"
          cp lib/skin-match-decision-engine.js /tmp/skin-match-decision-engine.before.js
          python - <<'PY'
          from pathlib import Path
          p = Path("lib/skin-match-decision-engine.js")
          s = p.read_text(encoding="utf-8")
          old1 = '"예민함과 붉은기가 같이 잡힌 피부라면, 세럼 단계에서 진정과 컨디션 회복을 먼저 챙기는 편이 맞습니다."'
          new1 = '"예민함이나 붉은기가 같이 잡힌 피부라면, 세럼 단계에서 진정과 컨디션 회복을 먼저 챙기는 편이 맞습니다."'
          old2 = '''const leadSentence = sensitiveState || priorityAxis === "barrier"
      ? explicitHighSensitivity
        ? "장벽 부담과 높은 민감도가 함께 잡힌 피부라면, 보습 단계에서는 기능을 더 얹기보다 편안함이 오래 남는 쪽을 먼저 보는 편이 맞습니다."
        : groundedSensitivity
          ? "장벽 부담과 예민함이 함께 잡힌 피부라면, 보습 단계에서는 기능을 더 얹기보다 편안함이 오래 남는 쪽을 먼저 보는 편이 맞습니다."
          : "장벽 부담 신호가 큰 피부라면, 보습 단계에서는 기능을 더 얹기보다 편안함이 오래 남는 쪽을 먼저 보는 편이 맞습니다."'''
          new2 = '''const leadSentence = sensitiveState || priorityAxis === "barrier"
      ? "장벽과 예민함이 함께 잡힌 피부라면, 보습 단계에서는 기능을 더 얹기보다 편안함이 오래 남는 쪽을 먼저 보는 편이 맞습니다."'''
          assert s.count(old1) == 1, s.count(old1)
          assert s.count(old2) == 1, s.count(old2)
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding="utf-8")
          PY
          test "$(git hash-object lib/skin-match-decision-engine.js)" = "$EXPECTED_POST_BLOB"
          test "$(sha256sum lib/skin-match-decision-engine.js | awk '{print $1}')" = "$EXPECTED_POST_SHA256"
          test "$(wc -l < lib/skin-match-decision-engine.js | tr -d ' ')" = "3096"
          node --check lib/skin-match-decision-engine.js
          git diff --check -- lib/skin-match-decision-engine.js
          git diff --unified=0 -- lib/skin-match-decision-engine.js > /tmp/eval-r1.diff
          cat /tmp/eval-r1.diff
          test "$(grep -c '^@@' /tmp/eval-r1.diff)" = "2"
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "lib/skin-match-decision-engine.js"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/skin-match-decision-engine.js
          git commit -m "fix(eval-r1): narrow explanation grounding remediation"
          git push origin HEAD:eval/r1-persona-explanation-grounding-remediation

      - name: Publish bootstrap attestation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description="EVAL-R1 bootstrap patch failed"
          if [ "$PATCH_OUTCOME" = "success" ]; then
            state=success
            description="EVAL-R1 exact two-hunk bootstrap patch committed"
          fi
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="EVAL-R1 bootstrap patch" -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          test "$state" = success
