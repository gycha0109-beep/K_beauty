name: EVAL-R1 Persona Explanation Grounding Remediation

on:
  pull_request:
    paths:
      - "lib/skin-match-decision-engine.js"
      - ".github/workflows/eval-r1-persona-explanation-grounding-remediation.yml"
      - "fixtures/persona-evaluation/eval-r1-explanation-grounding-remediation-v1.json"
      - "scripts/verify-eval-r1-explanation-grounding-v1.mjs"
      - "scripts/verify-eval-r1-grounding-probes-v1.mjs"
      - "docs/evidence/eval-r1-persona-explanation-grounding-remediation-v1.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-engine:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: eval/r1-persona-explanation-grounding-remediation
          fetch-depth: 0

      - name: Verify pre-mutation authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git hash-object lib/skin-match-decision-engine.js)" = "5028688320264596a3eed31526f04a937abd8b94"
          test "$(wc -l < lib/skin-match-decision-engine.js | tr -d ' ')" = "3100"

      - name: Apply exactly two bounded explanation corrections
        run: |
          set -euo pipefail
          cp lib/skin-match-decision-engine.js /tmp/skin-match-decision-engine.before.js
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/skin-match-decision-engine.js")
          text = path.read_text()

          old_serum = '        ? "예민함과 붉은기가 같이 잡힌 피부라면, 세럼 단계에서 진정과 컨디션 회복을 먼저 챙기는 편이 맞습니다."'
          new_serum = '        ? "예민함이나 붉은기가 같이 잡힌 피부라면, 세럼 단계에서 진정과 컨디션 회복을 먼저 챙기는 편이 맞습니다."'

          old_moisturizer = '''    const leadSentence = sensitiveState || priorityAxis === "barrier"
      ? explicitHighSensitivity
        ? "장벽 부담과 높은 민감도가 함께 잡힌 피부라면, 보습 단계에서는 기능을 더 얹기보다 편안함이 오래 남는 쪽을 먼저 보는 편이 맞습니다."
        : groundedSensitivity
          ? "장벽 부담과 예민함이 함께 잡힌 피부라면, 보습 단계에서는 기능을 더 얹기보다 편안함이 오래 남는 쪽을 먼저 보는 편이 맞습니다."
          : "장벽 부담 신호가 큰 피부라면, 보습 단계에서는 기능을 더 얹기보다 편안함이 오래 남는 쪽을 먼저 보는 편이 맞습니다."'''
          new_moisturizer = '''    const leadSentence = sensitiveState || priorityAxis === "barrier"
      ? "장벽과 예민함이 함께 잡힌 피부라면, 보습 단계에서는 기능을 더 얹기보다 편안함이 오래 남는 쪽을 먼저 보는 편이 맞습니다."'''

          replacements = [
              (old_serum, new_serum, "A06 serum collateral wording"),
              (old_moisturizer, new_moisturizer, "C01/A01/A08 moisturizer collateral wording"),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one source match, got {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          node --check lib/skin-match-decision-engine.js
          git diff --check -- lib/skin-match-decision-engine.js

      - name: Fail closed on any unrelated hunk
        run: |
          set -euo pipefail
          git diff --unified=0 -- lib/skin-match-decision-engine.js | tee /tmp/engine.patch
          test "$(grep -c '^@@' /tmp/engine.patch)" = "2"
          test "$(grep -c '^+.*예민함이나 붉은기가 같이 잡힌 피부라면' /tmp/engine.patch)" = "1"
          test "$(grep -c '^+.*장벽과 예민함이 함께 잡힌 피부라면' /tmp/engine.patch)" = "1"
          test "$(grep -c '^-.*예민함과 붉은기가 같이 잡힌 피부라면' /tmp/engine.patch)" = "1"
          test "$(grep -c '^-.*장벽 부담과 높은 민감도가 함께 잡힌 피부라면' /tmp/engine.patch)" = "1"
          test "$(grep -c '^-.*장벽 부담과 예민함이 함께 잡힌 피부라면' /tmp/engine.patch)" = "1"
          test "$(grep -c '^-.*장벽 부담 신호가 큰 피부라면' /tmp/engine.patch)" = "1"
          test "$(git diff --name-only)" = "lib/skin-match-decision-engine.js"

      - name: Commit narrow Production correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/skin-match-decision-engine.js
          git diff --cached --check
          git commit -m "fix(eval-r1): remove explanation over-remediation"
          git push origin HEAD:eval/r1-persona-explanation-grounding-remediation
