name: DATA-OFFER17 Controlled Offer RPC Diagnostic

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/data-offer17-controlled-offer-rpc-diagnostic.yml"
      - "lib/product-offer-controlled-probe-oidc.js"
      - "lib/server/product-offer-read-service.js"
      - "app/api/internal/product-offer-presentation-authority-controlled-probe/route.js"
      - "scripts/verify-data-offer17-controlled-offer-rpc-diagnostic-v1.mjs"
      - "scripts/verify-current-main-health.mjs"

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: data-offer17-controlled-offer-rpc-${{ github.ref }}
  cancel-in-progress: false

env:
  DATA_OFFER17_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  DATA_OFFER17_OIDC_AUDIENCE: urn:bejewely:data-offer17:offer-runtime-probe

jobs:
  verify-contract:
    name: DATA-OFFER17 controlled Offer probe contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DATA_OFFER17_EXACT_HEAD }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install verifier dependencies
        run: npm ci --ignore-scripts

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DATA_OFFER17_EXACT_HEAD"

      - name: Verify controlled Offer diagnostic contract
        run: node scripts/verify-data-offer17-controlled-offer-rpc-diagnostic-v1.mjs

      - name: Verify DATA-OFFER16 authority regression
        run: node scripts/verify-data-offer16-offer-presentation-authority-v1.mjs

  runtime-probe:
    name: DATA-OFFER17 deployed controlled Offer RPC diagnostic
    if: github.event_name == 'push'
    needs: verify-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve exact Vercel deployment URL
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url=""
          for attempt in $(seq 1 72); do
            ids="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments?per_page=100" --jq ".[] | select(.sha == \"$GITHUB_SHA\") | .id" || true)"
            for id in $ids; do
              candidate="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success" and .environment_url != null)][0].environment_url // empty' || true)"
              if [ -n "$candidate" ]; then
                url="$candidate"
                break
              fi
            done
            if [ -n "$url" ]; then
              break
            fi
            sleep 5
          done
          test -n "$url"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Obtain short-lived GitHub OIDC tokens
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          custom_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${DATA_OFFER17_OIDC_AUDIENCE}")"
          custom="$(printf '%s' "$custom_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          trusted_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          trusted="$(printf '%s' "$trusted_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          echo "::add-mask::$custom"
          echo "::add-mask::$trusted"
          printf 'custom=%s\ntrusted=%s\n' "$custom" "$trusted" >> "$GITHUB_OUTPUT"

      - name: Probe deployed Offer presentation runtime
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.custom }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.trusted }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors \
            -o "$response_file" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$DEPLOYMENT_URL/api/internal/product-offer-presentation-authority-controlled-probe")"
          cat "$response_file"
          echo
          echo "DATA_OFFER17_RUNTIME_PROBE_HTTP_STATUS=$status"
          node - "$response_file" "$GITHUB_SHA" <<'NODE'
          const fs = require('fs');
          const [file, expectedSha] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          const safe = {
            result: payload.result || null,
            deploymentSha: payload.deploymentSha || null,
            deploymentRef: payload.deploymentRef || null,
            credentialAvailable: payload.credentialAvailable ?? null,
            runtimeRoleMatch: payload.runtimeRoleMatch ?? null,
            rawOfferSelectDenied: payload.rawOfferSelectDenied ?? null,
            requestedProductCount: payload.requestedProductCount ?? null,
            rpcStatus: payload.rpcStatus || null,
            rpcResultClass: payload.rpcResultClass || null,
            rowCardinality: payload.rowCardinality ?? null,
            offerCount: payload.offerCount ?? null,
            readContractVersion: payload.readContractVersion || null,
            controlRpcResultClass: payload.controlRpcResultClass || null,
            controlRowCardinality: payload.controlRowCardinality ?? null,
            controlOfferCount: payload.controlOfferCount ?? null,
            controlReadContractVersion: payload.controlReadContractVersion || null,
            transportDifferential: payload.transportDifferential || null,
            secretValueExposed: payload.secretValueExposed ?? null,
          };
          console.log(JSON.stringify(safe));
          const allowedResults = new Set(['PASS', 'DIAGNOSTIC_COMPLETE']);
          const allowedRpcClasses = new Set([
            'SUCCESS',
            'QUERY_FAILED',
            'TIMEOUT',
            'CARDINALITY_INVALID',
            'PAYLOAD_INVALID',
            'CONTRACT_MISMATCH',
          ]);
          if (payload.deploymentSha !== expectedSha) process.exit(1);
          if (payload.secretValueExposed !== false) process.exit(2);
          if (!allowedResults.has(payload.result)) process.exit(3);
          if (payload.credentialAvailable !== true) process.exit(4);
          if (payload.runtimeRoleMatch !== true) process.exit(5);
          if (payload.rawOfferSelectDenied !== true) process.exit(6);
          if (payload.requestedProductCount !== 8) process.exit(7);
          if (!allowedRpcClasses.has(payload.rpcResultClass)) process.exit(8);
          if (payload.result === 'PASS' && payload.rpcResultClass !== 'SUCCESS') process.exit(9);
          NODE
          rm -f "$response_file"

      - name: Run controlled Production analyze request
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.trusted }}
        shell: bash
        run: |
          set -euo pipefail
          image_file="$(mktemp --suffix=.png)"
          response_file="$(mktemp)"
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z0T8AAAAASUVORK5CYII=' | base64 --decode > "$image_file"
          status="$(curl --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors \
            -o "$response_file" \
            -w '%{http_code}' \
            -X POST \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            -F "image=@${image_file};type=image/png" \
            -F 'skinType=combination' \
            -F 'sensitivity=medium' \
            -F 'mainConcern=dehydration' \
            -F 'cleansingFrequency=twice' \
            -F 'preferredTexture=lotion' \
            -F 'postWashFeeling=comfortable' \
            -F 'afternoonSkinChange=mostly_same' \
            -F 'mostDislikedFeel=sticky' \
            -F 'whiteCastHate=false' \
            -F 'toneUpWanted=false' \
            -F 'makeupUse=false' \
            -F 'eyeSensitive=false' \
            -F 'locale=ko' \
            "$DEPLOYMENT_URL/api/analyze")"
          node - "$response_file" "$status" <<'NODE'
          const fs = require('fs');
          const [file, status] = process.argv.slice(2);
          let payload = null;
          try {
            payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          } catch {}
          const evidence = {
            httpStatus: Number(status),
            responseJson: Boolean(payload && typeof payload === 'object'),
            summaryPresent: typeof payload?.summary === 'string',
            topPickFieldPresent: Boolean(payload && Object.prototype.hasOwnProperty.call(payload, 'topPick')),
            morningArray: Array.isArray(payload?.morning),
            nightArray: Array.isArray(payload?.night),
            schemaVersion: payload?.meta?.schemaVersion ?? null,
          };
          console.log(`DATA_OFFER17_ANALYZE_EVIDENCE=${JSON.stringify(evidence)}`);
          if (status !== '200') process.exit(1);
          if (!evidence.responseJson || !evidence.summaryPresent || !evidence.topPickFieldPresent) process.exit(2);
          if (!evidence.morningArray || !evidence.nightArray) process.exit(3);
          NODE
          rm -f "$image_file" "$response_file"
