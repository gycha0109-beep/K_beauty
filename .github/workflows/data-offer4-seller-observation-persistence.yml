name: DATA-OFFER4 Seller Observation Persistence

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/seller-listing-observation-v1.js"
      - "lib/server/seller-listing-observation-persistence-v1.js"
      - "scripts/verify-seller-listing-observation-persistence-v1.mjs"
      - "scripts/verify-current-main-health.mjs"
      - "supabase/migrations/*_seller_listing_observations_*.sql"
      - "crawler/tests/verify-seller-listing-observation-persistence-local-runtime.ts"
      - "crawler/package.json"
      - ".github/workflows/data-offer4-seller-observation-persistence.yml"
  push:
    branches: [main]
    paths:
      - "lib/seller-listing-observation-v1.js"
      - "lib/server/seller-listing-observation-persistence-v1.js"
      - "scripts/verify-seller-listing-observation-persistence-v1.mjs"
      - "scripts/verify-current-main-health.mjs"
      - "supabase/migrations/*_seller_listing_observations_*.sql"
      - "crawler/tests/verify-seller-listing-observation-persistence-local-runtime.ts"
      - "crawler/package.json"
      - ".github/workflows/data-offer4-seller-observation-persistence.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  verify-data-offer4-seller-observation-persistence:
    name: DATA-OFFER4 Seller Observation Persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Attest exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          printf 'DATA_OFFER4_EXACT_HEAD=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crawler/package-lock.json

      - name: Verify deterministic persistence mapper
        run: |
          node scripts/verify-seller-listing-observation-persistence-v1.mjs
          node --check lib/server/seller-listing-observation-persistence-v1.js
          node --check scripts/verify-seller-listing-observation-persistence-v1.mjs

      - name: Install crawler dependencies
        working-directory: crawler
        run: npm ci --no-audit --no-fund

      - name: Typecheck crawler
        working-directory: crawler
        run: npm run typecheck

      - name: Prepare isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="${RUNNER_TEMP}/seller-observation-runtime"
          echo "SELLER_OBSERVATION_RUNTIME_DIR=${runtime_dir}" >>"${GITHUB_ENV}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" init --workdir "${runtime_dir}" --force
          migration_dir="${runtime_dir}/supabase/migrations"
          mkdir -p "${migration_dir}"
          cp supabase/migrations/20260913035725_seller_listing_observations_append_only_v1.sql "${migration_dir}/"

      - name: Start and reset isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          start_log="${RUNNER_TEMP}/seller-observation-start.log"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" start \
            --workdir "${SELLER_OBSERVATION_RUNTIME_DIR}" \
            --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            >"${start_log}" 2>&1; then
            sed -E 's#(sb_(publishable|secret)_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+|postgresql://[^[:space:]]+)#[REDACTED]#g' "${start_log}" >&2
            exit 1
          fi
          rm -f "${start_log}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --workdir "${SELLER_OBSERVATION_RUNTIME_DIR}"

      - name: Verify isolated append-only runtime
        shell: bash
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/seller-observation.env"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" status --workdir "${SELLER_OBSERVATION_RUNTIME_DIR}" -o env >"${env_file}"
          anon_key="$(grep '^ANON_KEY=' "${env_file}" | cut -d= -f2- | tr -d '\"')"
          service_key="$(grep '^SERVICE_ROLE_KEY=' "${env_file}" | cut -d= -f2- | tr -d '\"')"
          echo "::add-mask::${anon_key}"
          echo "::add-mask::${service_key}"
          set -a
          source "${env_file}"
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="${API_URL}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}"
          rm -f "${env_file}"
          cd crawler
          npm run verify:seller-listing-observation-persistence:local-runtime

      - name: Stop isolated Supabase
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [[ -d "${SELLER_OBSERVATION_RUNTIME_DIR}/supabase" ]]; then
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --workdir "${SELLER_OBSERVATION_RUNTIME_DIR}" --no-backup
          fi
          rm -rf -- "${SELLER_OBSERVATION_RUNTIME_DIR}"

      - name: Check exact-head and diff hygiene
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse "${HEAD_SHA}^")"
          fi
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --check "${base}...${HEAD_SHA}"
