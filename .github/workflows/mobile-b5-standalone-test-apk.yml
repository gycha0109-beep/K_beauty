name: BEJEWELY B5 Standalone Device Test APK
run-name: "[WT:mobile] B5 standalone device test APK (not a release)"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mobile-b5-standalone-test-apk.yml"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-b5-standalone-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standalone-device-test:
    name: Build standalone offline-start APK (test signing, remediation HOLD)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert test-only environment and exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "${EXPO_PUBLIC_API_BASE_URL:-}"
          test -z "${EXPO_PUBLIC_SUPABASE_URL:-}"
          test -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}"
          echo "B5_TEST_APK_BUILD=ORIGINAL_APP_UNPATCHED_SECURITY_GRAPH"
          echo "B5_ANALYSIS_BACKEND=NOT_CONFIGURED"
          echo "B5_PATCH_DISTRIBUTION=NOT_AUTHORIZED"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Setup verified Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          verify-signature: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 36 and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install original app lock graph without changing security policy
        run: npm ci --no-audit --no-fund

      - name: Validate mobile configuration and generate Android project
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:mobile-foundation
          npm run mobile:typecheck
          npm run mobile:config
          npm run mobile:prebuild:android
          npm run verify:mobile-native

      - name: Build release-variant standalone APK (test key only)
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile/android
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify APK embeds JS and uses only Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          test -s apps/mobile/android/app/debug.keystore
          signing_tool="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$signing_tool"
          "$signing_tool" verify --print-certs "$apk"
          actual="$("$signing_tool" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          expected="$(keytool -J-Duser.language=en -list -v -keystore apps/mobile/android/app/debug.keystore -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          normalize() { tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]'; }
          test -n "$actual" && test -n "$expected"
          test "$(printf '%s' "$actual" | normalize)" = "$(printf '%s' "$expected" | normalize)"
          unzip -Z -1 "$apk" > "$RUNNER_TEMP/b5-apk-entries.txt"
          grep -Eq '(^|/)index\.android\.bundle$|(^|/)index\.android\.bundle\.hbc$' "$RUNNER_TEMP/b5-apk-entries.txt"
          sha256sum "$apk" | tee "$RUNNER_TEMP/b5-standalone-apk.sha256"
          printf 'B5_STANDALONE_JS_BUNDLE=PASS\nB5_SIGNING=TEST_DEBUG_KEY_ONLY\nB5_ISOLATED_SERVER=NOT_CONFIGURED\nB5_DEVICE_SMOKE=NOT_RUN\n'

      - name: Upload private install-only APK (no release or upstream patch archive)
        uses: actions/upload-artifact@v6
        with:
          name: bejewely-b5-standalone-test-apk-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/b5-standalone-apk.sha256
