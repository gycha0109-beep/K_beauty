name: PF5B1H2 Hosted Post-Apply Closeout

on:
  push:
    branches:
      - verify/pf5b1h2-hosted-closeout

permissions:
  contents: read

concurrency:
  group: pf5b1h2-hosted-post-apply-closeout
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.109.1
  TARGET_PROJECT_REF: bygrczggxfuisupcevaz
  TARGET_MAIN_SHA: 92432c9c111fa2cbbab9d0a62e27ace2d1f28add
  PF5B1_MERGE_SHA: ab3da7b1cd3fb1bbaeec5f38f16b1518b45cd73b
  PF2_PATH: supabase/migrations/20260809115932_product_fact_storage_v1.sql
  CONTROLLED_PATH: supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql
  SUBJECT_PATH: supabase/migrations/20260810174410_product_fact_subject_registration_v1.sql
  PF2_BLOB: 676afbc56bf90443a1198f93427382f067d19407
  CONTROLLED_BLOB: 03523a01322170e6b0fca2ff4cc77b8be581f19e
  SUBJECT_BLOB: a08651d4ea5825e33f2dc94fe98c5b7643d32532
  GENERATED_VERSION: '20260812090959'

jobs:
  post-apply-closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_DB_PASSWORD}"

      - name: Checkout frozen authoritative main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_MAIN_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify final authority and Product Fact blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TARGET_MAIN_SHA}"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/pf5b1h2-post-main
          current_main="$(git rev-parse refs/remotes/origin/pf5b1h2-post-main)"
          test "${current_main}" = "${TARGET_MAIN_SHA}"
          git merge-base --is-ancestor "${PF5B1_MERGE_SHA}" "${TARGET_MAIN_SHA}"
          test -z "$(git diff --name-only "${PF5B1_MERGE_SHA}" "${TARGET_MAIN_SHA}" -- supabase/migrations)"
          test "$(git rev-parse "HEAD:${PF2_PATH}")" = "${PF2_BLOB}"
          test "$(git rev-parse "HEAD:${CONTROLLED_PATH}")" = "${CONTROLLED_BLOB}"
          test "$(git rev-parse "HEAD:${SUBJECT_PATH}")" = "${SUBJECT_BLOB}"
          {
            echo "target_main=${TARGET_MAIN_SHA}"
            echo "current_main=${current_main}"
            echo "pf2_blob=$(git rev-parse "HEAD:${PF2_PATH}")"
            echo "controlled_blob=$(git rev-parse "HEAD:${CONTROLLED_PATH}")"
            echo "subject_blob=$(git rev-parse "HEAD:${SUBJECT_PATH}")"
          } > /tmp/pf5b1h2-post-authority.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          actual="$(npx --yes "supabase@${SUPABASE_CLI_VERSION}" --version)"
          echo "${actual}" | tee /tmp/pf5b1h2-post-cli-version.txt

      - name: Link exact Hosted project
        shell: bash
        run: |
          set -euo pipefail
          raw="$(mktemp)"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" link --project-ref "${TARGET_PROJECT_REF}" --password "${SUPABASE_DB_PASSWORD}" >"${raw}" 2>&1; then
            sed -E -e 's#(postgres(ql)?://[^:/[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' -e 's#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' "${raw}" >&2
            rm -f "${raw}"
            exit 1
          fi
          sed -E -e 's#(postgres(ql)?://[^:/[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' -e 's#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' "${raw}" > /tmp/pf5b1h2-post-link.txt
          rm -f "${raw}"

      - name: Verify canonical migration history aligned
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" migration list --linked --password "${SUPABASE_DB_PASSWORD}" | tee /tmp/pf5b1h2-post-migration-list.txt
          tr -d '`' < /tmp/pf5b1h2-post-migration-list.txt > /tmp/pf5b1h2-post-migration-list-normalized.txt
          grep -Eq '20260809115932[[:space:]]*\|[[:space:]]*20260809115932' /tmp/pf5b1h2-post-migration-list-normalized.txt
          grep -Eq '20260810174400[[:space:]]*\|[[:space:]]*20260810174400' /tmp/pf5b1h2-post-migration-list-normalized.txt
          grep -Eq '20260810174410[[:space:]]*\|[[:space:]]*20260810174410' /tmp/pf5b1h2-post-migration-list-normalized.txt
          ! grep -q "${GENERATED_VERSION}" /tmp/pf5b1h2-post-migration-list-normalized.txt

      - name: Post-apply dry-run requires zero pending
        shell: bash
        run: |
          set -euo pipefail
          raw="$(mktemp)"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" db push --linked --dry-run --password "${SUPABASE_DB_PASSWORD}" >"${raw}" 2>&1; then
            sed -E -e 's#(postgres(ql)?://[^:/[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' -e 's#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' "${raw}" >&2
            rm -f "${raw}"
            exit 1
          fi
          sed -E -e 's#(postgres(ql)?://[^:/[:space:]]+:)[^@[:space:]]+@#\1[REDACTED]@#g' -e 's#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' "${raw}" | tee /tmp/pf5b1h2-post-dry-run.txt
          grep -q 'Remote database is up to date' /tmp/pf5b1h2-post-dry-run.txt
          rm -f "${raw}"

      - name: Final remote main recheck
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/pf5b1h2-post-main-final
          final_main="$(git rev-parse refs/remotes/origin/pf5b1h2-post-main-final)"
          test "${final_main}" = "${TARGET_MAIN_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_MAIN_SHA}"
          test -z "$(git status --porcelain)"
          echo "${final_main}" > /tmp/pf5b1h2-post-final-main.txt

      - name: Upload PF5B1H2 post-apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf5b1h2-hosted-post-apply-cli-evidence
          path: |
            /tmp/pf5b1h2-post-authority.txt
            /tmp/pf5b1h2-post-cli-version.txt
            /tmp/pf5b1h2-post-link.txt
            /tmp/pf5b1h2-post-migration-list.txt
            /tmp/pf5b1h2-post-migration-list-normalized.txt
            /tmp/pf5b1h2-post-dry-run.txt
            /tmp/pf5b1h2-post-final-main.txt
          if-no-files-found: warn
          retention-days: 90
