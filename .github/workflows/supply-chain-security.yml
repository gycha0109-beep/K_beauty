name: BEJEWELY Supply Chain Security
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.watchtower_track != '' && format('[WT:{0}] {1}', inputs.watchtower_track, github.workflow) || github.workflow }}

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "apps/**"
      - "packages/**"
      - "tools/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"
      - ".github/workflows/supply-chain-security.yml"
      - "docs/ci/workflow-responsibility-map.json"
      - "docs/ci/workflow-responsibility-map.md"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "apps/**"
      - "packages/**"
      - "tools/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"
      - ".github/workflows/supply-chain-security.yml"
      - "docs/ci/workflow-responsibility-map.json"
      - "docs/ci/workflow-responsibility-map.md"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  package-integrity:
    name: Package integrity and vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify lockfile install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit dependency vulnerabilities
        run: node scripts/verify-supply-chain-audit.mjs

      - name: Check exact-head diff hygiene
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ && ! "${BASE_SHA}" =~ ^0+$ ]]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          else
            git diff --check HEAD^
          fi

  dependency-review:
    name: PR dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Block newly introduced critical dependency vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          license-check: false

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
