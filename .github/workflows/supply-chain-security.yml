name: BEJEWELY Supply Chain Security
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.watchtower_track != '' && format('[WT:{0}] {1}', inputs.watchtower_track, github.workflow) || github.workflow }}

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "apps/**"
      - "packages/**"
      - "tools/**"
      - "crawler/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"
      - ".github/workflows/supply-chain-security.yml"
      - "docs/ci/workflow-responsibility-map.json"
      - "docs/ci/workflow-responsibility-map.md"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "apps/**"
      - "packages/**"
      - "tools/**"
      - "crawler/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/dependabot.yml"
      - ".github/workflows/supply-chain-security.yml"
      - "docs/ci/workflow-responsibility-map.json"
      - "docs/ci/workflow-responsibility-map.md"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  package-integrity:
    name: Package integrity and vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify lockfile install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Trace vulnerable dependency paths without changing audit policy
        run: |
          node scripts/security/verify-supply-chain-lock-path-tracer.mjs
          node scripts/security/report-supply-chain-lock-paths.mjs

      - name: Audit dependency vulnerabilities
        run: node scripts/verify-supply-chain-audit.mjs

      - name: Check exact-head diff hygiene
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ && ! "${BASE_SHA}" =~ ^0+$ ]]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          else
            git diff --check HEAD^
          fi

  crawler-official-audit:
    name: Separate crawler official dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Attest exact crawler candidate HEAD
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Clean crawler installation from committed lock
        run: npm --prefix crawler ci --ignore-scripts --no-audit --no-fund
      - name: Trace actual fixed runtime and compiler paths
        run: npm --prefix crawler ls ws tsx esbuild --all
      - name: Real localhost WebSocket consumer behavior
        run: node crawler/test-supply-chain-websocket.mjs
      - name: Official full and production raw crawler audits
        run: |
          npm --prefix crawler audit --json --registry=https://registry.npmjs.org
          npm --prefix crawler audit --omit=dev --json --registry=https://registry.npmjs.org
      - run: git diff --exit-code -- crawler/package.json crawler/package-lock.json package.json package-lock.json

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
