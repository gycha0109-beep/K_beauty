name: BEJEWELY Mobile 16A Privacy and Account Deletion

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "!apps/mobile/store-readiness.json"
      - "!apps/mobile/google-play-data-safety.json"
      - "!apps/mobile/google-play-health-apps-declaration.json"
      - "app/privacy/**"
      - "app/en/privacy/**"
      - "app/account-deletion/**"
      - "app/en/account-deletion/**"
      - "app/api/my/account/**"
      - "components/account/**"
      - "components/legal/**"
      - "lib/auth/account-deletion.js"
      - "scripts/verify-mobile-16a-privacy-account-deletion.mjs"
      - ".github/workflows/mobile-16a-privacy-account-deletion.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "!apps/mobile/store-readiness.json"
      - "!apps/mobile/google-play-data-safety.json"
      - "!apps/mobile/google-play-health-apps-declaration.json"
      - "app/privacy/**"
      - "app/en/privacy/**"
      - "app/account-deletion/**"
      - "app/en/account-deletion/**"
      - "app/api/my/account/**"
      - "components/account/**"
      - "components/legal/**"
      - "lib/auth/account-deletion.js"
      - "scripts/verify-mobile-16a-privacy-account-deletion.mjs"
      - ".github/workflows/mobile-16a-privacy-account-deletion.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-16a-privacy-account-deletion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-and-build:
    name: Privacy and Account Deletion Source Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_16A_SOURCE_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify MOBILE-13/14/16A source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-mobile-16a-privacy-account-deletion.mjs
          npm run verify:mobile-foundation
          npm run mobile:typecheck
          npm run mobile:config
          node scripts/verify-mobile-14-auth-app-links.mjs
          node scripts/verify-mobile-16a-privacy-account-deletion.mjs

      - name: Verify Next production build with public privacy routes
        env:
          NEXT_PUBLIC_PRIVACY_CONTACT_EMAIL: privacy-ci@example.invalid
        run: npm run build
