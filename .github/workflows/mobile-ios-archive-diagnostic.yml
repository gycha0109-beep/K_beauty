name: BEJEWELY Expo SDK Dependency Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mobile-ios-archive-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-expo-dependency-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  expo-dependency-diagnostic:
    name: Expo SDK Dependency Diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_EXPO_DEPENDENCY_DIAGNOSTIC_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Capture resolved Expo dependency graph
        shell: bash
        run: |
          set +e
          npm ls expo expo-router @expo/ui expo-modules-core react-native react-native-reanimated --all > "$RUNNER_TEMP/expo-dependency-tree.log" 2>&1
          exit 0

      - name: Ask Expo CLI for SDK alignment
        shell: bash
        run: |
          set +e
          cd apps/mobile
          npx expo install --check > "$RUNNER_TEMP/expo-install-check.log" 2>&1
          status=$?
          printf '\nEXPO_INSTALL_CHECK_EXIT=%s\n' "$status" >> "$RUNNER_TEMP/expo-install-check.log"
          cat "$RUNNER_TEMP/expo-install-check.log"
          exit 0

      - name: Upload Expo dependency diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: expo-dependency-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            ${{ runner.temp }}/expo-dependency-tree.log
            ${{ runner.temp }}/expo-install-check.log
