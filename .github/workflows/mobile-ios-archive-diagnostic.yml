name: BEJEWELY iOS Archive Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mobile-ios-archive-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ios-archive-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-archive-diagnostic:
    name: iOS Archive Compiler Diagnostic
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_IOS_ARCHIVE_DIAGNOSTIC_SHA=%s\n' "$actual"

      - name: Verify Xcode 26.6 distribution toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          case "$sdk" in
            26.*) ;;
            *) printf 'Unexpected iPhoneOS SDK: %s\n' "$sdk" >&2; exit 1 ;;
          esac
          xcodebuild -version
          printf 'MOBILE_IOS_ARCHIVE_DIAGNOSTIC_SDK=%s\n' "$sdk"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Apply bounded Expo Modules JSI compatibility shim
        run: node scripts/apply-expo-modules-jsi-xcode26-compat.mjs

      - name: Generate iOS native project
        run: npm run prebuild:ios --workspace @bejewely/mobile

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile/ios
          pod install

      - name: Build unsigned Release archive and capture compiler log
        shell: bash
        run: |
          set -o pipefail
          mkdir -p apps/mobile/.mobile-store-preflight
          xcodebuild \
            -workspace apps/mobile/ios/BEJEWELY.xcworkspace \
            -scheme BEJEWELY \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$GITHUB_WORKSPACE/apps/mobile/.mobile-store-preflight/BEJEWELY.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive 2>&1 | tee "$RUNNER_TEMP/ios-unsigned-archive-xcodebuild.log"

      - name: Upload archive compiler diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-compiler-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/ios-unsigned-archive-xcodebuild.log
