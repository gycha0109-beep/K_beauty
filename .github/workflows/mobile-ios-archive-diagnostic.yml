name: BEJEWELY Expo SDK Dependency Remediation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mobile-ios-archive-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-expo-dependency-remediation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  expo-dependency-remediation:
    name: Expo SDK Dependency Remediation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_EXPO_REMEDIATION_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install official Expo SDK 57 aligned versions
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --workspace @bejewely/mobile \
            'expo@~57.0.20' \
            'expo-secure-store@~57.0.3' \
            'expo-system-ui@~57.0.3' \
            'react-native@0.86.3'

      - name: Verify Expo dependency alignment
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile
          npx expo install --check

      - name: Verify bounded dependency diff
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(apps/mobile/package\.json|package-lock\.json)$' || true)"
          test -z "$unexpected"

      - name: Commit aligned dependency lock
        shell: bash
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test -n "$PR_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json package-lock.json
          git commit -m "fix(mobile): align Expo SDK 57 dependencies"
          git push origin "HEAD:${PR_BRANCH}"
