name: BEJEWELY Mobile API Integration
run-name: "[WT:mobile] BEJEWELY Mobile API Integration"

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "app/api/analyze/route.js"
      - "app/api/current-products/products/route.js"
      - "app/api/full-report/route.js"
      - "app/api/my/check-in/route.js"
      - "app/api/my/dashboard/route.js"
      - "app/api/my/diary-day/route.js"
      - "app/api/premium/access/route.js"
      - "app/api/results/[shareId]/route.js"
      - "app/api/results/route.js"
      - "lib/analysis-result-access.js"
      - "lib/analysis-results.js"
      - "lib/current-products.js"
      - "lib/my/dashboard.js"
      - "lib/my/diary-day.js"
      - "lib/my/routine-generator.js"
      - "lib/premium-access.js"
      - "lib/premium-current-products.js"
      - "lib/premium-report-session.js"
      - "lib/premium-route-context.js"
      - "lib/security/analysis-request-guard*.js"
      - "lib/security/public-result-read-guard*.js"
      - "lib/supabase/server-client.js"
      - "lib/supabase/server.js"
      - "scripts/verify-mobile-analyze-integration.mjs"
      - "scripts/verify-mobile-saved-report-reentry.mjs"
      - "scripts/verify-mobile-public-share.mjs"
      - "scripts/verify-mobile-public-result-deep-link.mjs"
      - "scripts/verify-mobile-premium-entry.mjs"
      - "scripts/verify-mobile-my-skin-diary.mjs"
      - ".github/workflows/mobile-api-integration.yml"
      - ".github/workflows/mobile-ci.yml"
      - "docs/ci/workflow-responsibility-map.json"
      - "docs/ci/workflow-responsibility-map.md"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "app/api/analyze/route.js"
      - "app/api/current-products/products/route.js"
      - "app/api/full-report/route.js"
      - "app/api/my/check-in/route.js"
      - "app/api/my/dashboard/route.js"
      - "app/api/my/diary-day/route.js"
      - "app/api/premium/access/route.js"
      - "app/api/results/[shareId]/route.js"
      - "app/api/results/route.js"
      - "lib/analysis-result-access.js"
      - "lib/analysis-results.js"
      - "lib/current-products.js"
      - "lib/my/dashboard.js"
      - "lib/my/diary-day.js"
      - "lib/my/routine-generator.js"
      - "lib/premium-access.js"
      - "lib/premium-current-products.js"
      - "lib/premium-report-session.js"
      - "lib/premium-route-context.js"
      - "lib/security/analysis-request-guard*.js"
      - "lib/security/public-result-read-guard*.js"
      - "lib/supabase/server-client.js"
      - "lib/supabase/server.js"
      - "scripts/verify-mobile-analyze-integration.mjs"
      - "scripts/verify-mobile-saved-report-reentry.mjs"
      - "scripts/verify-mobile-public-share.mjs"
      - "scripts/verify-mobile-public-result-deep-link.mjs"
      - "scripts/verify-mobile-premium-entry.mjs"
      - "scripts/verify-mobile-my-skin-diary.mjs"
      - ".github/workflows/mobile-api-integration.yml"
      - "docs/ci/workflow-responsibility-map.json"
      - "docs/ci/workflow-responsibility-map.md"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string

concurrency:
  group: mobile-api-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-integration-contracts:
    name: Mobile API integration contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify mobile API integration boundary
        run: |
          npm run mobile:typecheck
          node scripts/verify-mobile-analyze-integration.mjs
          node scripts/verify-mobile-saved-report-reentry.mjs
          node scripts/verify-mobile-public-share.mjs
          node scripts/verify-mobile-public-result-deep-link.mjs
          node scripts/verify-mobile-premium-entry.mjs
          node scripts/verify-mobile-my-skin-diary.mjs

      - name: Check exact-head diff hygiene
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git diff --check HEAD^
          fi
