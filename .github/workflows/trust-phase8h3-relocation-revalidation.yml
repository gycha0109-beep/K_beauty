          echo "### Phase 8I-4G activation signal" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat "${activation}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scheduled drift evaluation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trust-phase8i3e-scheduled-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trust-phase8i3e/
          if-no-files-found: warn
          retention-days: 30
