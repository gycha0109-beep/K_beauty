          node scripts/verify-trust-phase8i4g-canary-snapshot.mjs "--result=${canary}" | tee "${canary_summary}"
          activation="${RUNNER_TEMP}/trust-phase8i3e/phase8i4g-canary-activation.json"
          node scripts/trust-phase8i4g-canary-activation-signal.mjs "--snapshot=${canary}" | tee "${activation}"
