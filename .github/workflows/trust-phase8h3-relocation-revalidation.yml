name: TRUST Data Governance - Phase 8H-3 Relocation Revalidation
run-name: "[WT:trust] TRUST Data Governance - Phase 8H-3 Relocation Revalidation"

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/evidence/trust-phase8h3-*"
      - "docs/evidence/trust-phase8i2-*"
      - "docs/evidence/trust-phase8i3-*"
      - "supabase/migrations/*_trust_phase8i2_*.sql"
      - "supabase/migrations/*_trust_phase8i3_*.sql"
      - "lib/trust/official-source-transport-fetch.mjs"
      - "scripts/trust-official-source-transport-worker.mjs"
      - "scripts/verify-trust-phase8i2-transport-foundation.mjs"
      - "scripts/verify-trust-phase8i2b-rollout-controls.mjs"
      - "scripts/verify-trust-phase8i2b-live-result.mjs"
      - "scripts/verify-trust-phase8i2-production-closure.mjs"
      - "scripts/verify-trust-phase8i3a-drift-case-bridge.mjs"
      - "supabase/migrations/*_trust_phase8h3_*.sql"
      - "scripts/trust-research-worker.mjs"
      - "scripts/trust-source-verification-worker.mjs"
      - "scripts/verify-trust-phase8h3-relocation-aware-verification.mjs"
      - "scripts/verify-trust-phase8h3-relocation-revalidation.mjs"
      - "scripts/verify-trust-phase8h3-production-closure.mjs"
      - ".github/workflows/trust-phase8h3-relocation-revalidation.yml"
      - "docs/ci/workflow-responsibilities/trust-phase8h3-relocation-revalidation.yml.json"
      - "docs/ci/consolidation-audits/phase-b-policy.json"
      - "scripts/audit-ci-workflow-overlap.mjs"
      - "scripts/verify-ci-workflow-responsibility-map.mjs"
  push:
    branches: [main, "pipeline-reliability/trust-phase8h3-relocation-revalidation"]
    paths:
      - "docs/evidence/trust-phase8h3-*"
      - "docs/evidence/trust-phase8i2-*"
      - "docs/evidence/trust-phase8i3-*"
      - "supabase/migrations/*_trust_phase8i2_*.sql"
      - "supabase/migrations/*_trust_phase8i3_*.sql"
      - "lib/trust/official-source-transport-fetch.mjs"
      - "scripts/trust-official-source-transport-worker.mjs"
      - "scripts/verify-trust-phase8i2-transport-foundation.mjs"
      - "scripts/verify-trust-phase8i2b-rollout-controls.mjs"
      - "scripts/verify-trust-phase8i2b-live-result.mjs"
      - "scripts/verify-trust-phase8i2-production-closure.mjs"
      - "scripts/verify-trust-phase8i3a-drift-case-bridge.mjs"
      - "supabase/migrations/*_trust_phase8h3_*.sql"
      - "scripts/trust-research-worker.mjs"
      - "scripts/trust-source-verification-worker.mjs"
      - "scripts/verify-trust-phase8h3-relocation-aware-verification.mjs"
      - "scripts/verify-trust-phase8h3-relocation-revalidation.mjs"
      - "scripts/verify-trust-phase8h3-production-closure.mjs"
      - ".github/workflows/trust-phase8h3-relocation-revalidation.yml"
      - "docs/ci/workflow-responsibilities/trust-phase8h3-relocation-revalidation.yml.json"
      - "docs/ci/consolidation-audits/phase-b-policy.json"
      - "scripts/audit-ci-workflow-overlap.mjs"
      - "scripts/verify-ci-workflow-responsibility-map.mjs"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string
      transport_mode:
        description: Phase 8I-2B live transport rollout mode
        required: false
        default: none
        type: choice
        options:
          - none
          - canary
          - full
      transport_expected_fleet_digest:
        description: Optional full-pass fleet SHA-256 from the prior independent observation
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify research worker syntax and regression contract
        run: |
          node --check scripts/trust-research-worker.mjs
          node scripts/verify-trust-research-worker.mjs

      - name: Verify Phase 8I-2 transport foundation and rollout controls
        run: |
          node --check lib/trust/official-source-transport-fetch.mjs
          node --check scripts/trust-official-source-transport-worker.mjs
          node --check scripts/verify-trust-phase8i2b-live-result.mjs
          node scripts/verify-trust-phase8i2-transport-foundation.mjs
          node scripts/verify-trust-phase8i2b-rollout-controls.mjs
          node scripts/verify-trust-phase8i2-production-closure.mjs

      - name: Verify Phase 8I-3A transport drift case bridge
        run: node scripts/verify-trust-phase8i3a-drift-case-bridge.mjs

      - name: Verify Phase 8E and 8F unchanged contracts
        run: |
          node scripts/verify-trust-phase8e-revalidation-adjudication.mjs
          node scripts/verify-trust-phase8f-changed-semantic-replacement.mjs

      - name: Verify Phase 8H-3 contract and rollback evidence
        run: |
          node scripts/verify-trust-phase8h3-relocation-revalidation.mjs
          node scripts/verify-trust-phase8h3-relocation-aware-verification.mjs
          node scripts/verify-trust-phase8h3-production-closure.mjs

      - name: Manual Phase 8H-3 Derma relocation observation triplet
        if: github.event_name == 'workflow_dispatch' && inputs.transport_mode == 'none'
        run: node scripts/trust-source-verification-canary-capture.mjs --target=docs/evidence/trust-phase8h3-relocation-canary-target-v1.json

      - name: Manual Phase 8H-3 research live candidate payload
        if: github.event_name == 'workflow_dispatch' && inputs.transport_mode == 'none'
        run: node scripts/trust-phase8h3-research-live-canary-capture.mjs --target=docs/evidence/trust-phase8h3-research-live-canary-target-v1.json

      - name: Verify CI workflow governance
        run: |
          node scripts/verify-ci-workflow-responsibility-map.mjs
          node scripts/audit-ci-workflow-overlap.mjs --check

      - name: Check exact-head diff hygiene
        if: github.event_name != 'schedule'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...$HEAD_SHA"

  transport_live:
    name: Phase 8I-2B live transport rollout
    if: github.event_name == 'schedule' || inputs.transport_mode == 'canary' || inputs.transport_mode == 'full'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://bygrczggxfuisupcevaz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify live rollout authority
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$SUPABASE_URL" = "https://bygrczggxfuisupcevaz.supabase.co"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Execute governed live transport pass
        env:
          TRANSPORT_MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.transport_mode }}
          EXPECTED_FLEET_DIGEST: ${{ github.event_name == 'schedule' && '' || inputs.transport_expected_fleet_digest }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trust-phase8i2b"
          result="${RUNNER_TEMP}/trust-phase8i2b/result.json"
          run_id="phase8i2b-${TRANSPORT_MODE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          args=(
            "--scope=${TRANSPORT_MODE}"
            "--record=true"
            "--concurrency=3"
            "--per-host-delay-ms=1000"
            "--run-id=${run_id}"
          )

          if [ "${TRANSPORT_MODE}" = "canary" ]; then
            test -z "${EXPECTED_FLEET_DIGEST}"
            args+=(
              "--manifest=docs/evidence/trust-phase8i2-live-canary-targets-v1.json"
              "--expected-source-count=10"
              "--expected-target-count=5"
            )
          elif [ "${TRANSPORT_MODE}" = "full" ]; then
            if [ "${SCHEDULED_RUN}" = "true" ]; then
              args+=("--dynamic-fleet=true")
            else
              args+=(
                "--expected-source-count=35"
                "--expected-target-count=25"
              )
              if [ -n "${EXPECTED_FLEET_DIGEST}" ]; then
                args+=("--expected-fleet-digest=${EXPECTED_FLEET_DIGEST}")
              fi
            fi
          else
            echo "unsupported transport mode: ${TRANSPORT_MODE}" >&2
            exit 2
          fi

          node scripts/trust-official-source-transport-worker.mjs "${args[@]}" >"${result}"
          cat "${result}"

      - name: Verify governed live transport result
        env:
          TRANSPORT_MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.transport_mode }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/trust-phase8i2b/result.json"
          summary="${RUNNER_TEMP}/trust-phase8i2b/verification.json"
          node scripts/verify-trust-phase8i2b-live-result.mjs \
            "--result=${result}" \
            "--mode=${TRANSPORT_MODE}" \
            "--dynamic-full=${SCHEDULED_RUN}" | tee "${summary}"
          echo "### Phase 8I-2B live transport" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat "${summary}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live rollout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trust-phase8i2b-${{ github.event_name == 'schedule' && 'full' || inputs.transport_mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trust-phase8i2b/
          if-no-files-found: warn
          retention-days: 30
