          echo >> "$GITHUB_STEP_SUMMARY"
          cat "${enqueue_summary}" >> "$GITHUB_STEP_SUMMARY"

      - name: Execute governed scheduled drift evaluation
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/trust-phase8i3e/result.json"
          run_id="phase8i3e-scheduled-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/trust-transport-drift-handoff-worker.mjs             --registry=docs/evidence/trust-phase8i3-transport-drift-evaluation-policy-registry-v1.json             --run-id="${run_id}"             --record=true             --limit=100 >"${result}"
          cat "${result}"

      - name: Verify governed scheduled drift result
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/trust-phase8i3e/result.json"
