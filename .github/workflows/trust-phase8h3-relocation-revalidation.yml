    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string
      transport_mode:
        description: Phase 8I-2B live transport rollout mode
        required: false
        default: none
        type: choice
        options:
          - none
          - canary
          - full
      transport_expected_fleet_digest:
        description: Optional full-pass fleet SHA-256 from the prior independent observation
        required: false
        default: ""
        type: string
      transport_drift_mode:
        description: Phase 8I-3D manual live transport-drift evaluation mode
        required: false
        default: none
        type: choice
        options:
          - none
          - shadow
          - record

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify research worker syntax and regression contract
        run: |
          node --check scripts/trust-research-worker.mjs
          node scripts/verify-trust-research-worker.mjs

      - name: Verify Phase 8I-2 transport foundation and rollout controls
        run: |
          node --check lib/trust/official-source-transport-fetch.mjs
          node --check scripts/trust-official-source-transport-worker.mjs
          node --check scripts/verify-trust-phase8i2b-live-result.mjs
          node scripts/verify-trust-phase8i2-transport-foundation.mjs
          node scripts/verify-trust-phase8i2b-rollout-controls.mjs
          node scripts/verify-trust-phase8i2-production-closure.mjs

      - name: Verify Phase 8I-3A transport drift case bridge
        run: node scripts/verify-trust-phase8i3a-drift-case-bridge.mjs

      - name: Verify Phase 8I-3B drift evaluation worker
        run: |
          node --check scripts/trust-transport-drift-handoff-worker.mjs
          node scripts/verify-trust-phase8i3b-evaluation-worker.mjs

      - name: Verify Phase 8I-3C/D backfill and manual live workflow
        run: |
          node scripts/verify-trust-phase8i3d-manual-workflow.mjs
          node --check scripts/verify-trust-phase8i3d-live-result.mjs

      - name: Verify Phase 8I-3D closeout and 8I-3E scheduler integration
        run: |
          node --check scripts/trust-transport-drift-case-enqueue.mjs
          node --check scripts/verify-trust-phase8i3e-enqueue-result.mjs
          node scripts/verify-trust-phase8i3e-scheduler-integration.mjs

      - name: Verify Phase 8I-4A/B grouped relocation preflight
        run: |
          node --check lib/trust/official-source-grouped-relocation-preflight.mjs
          node --check scripts/verify-trust-phase8i4-grouped-relocation-preflight.mjs
          node scripts/verify-trust-phase8i4-grouped-relocation-preflight.mjs

      - name: Verify Phase 8I-4C grouped confirmation request
        run: |
          node --check lib/trust/official-source-grouped-relocation-confirmation-request.mjs
          node --check scripts/verify-trust-phase8i4-grouped-relocation-confirmation-request.mjs
          node scripts/verify-trust-phase8i4-grouped-relocation-confirmation-request.mjs

      - name: Verify Phase 8I-4D Phase 8H anchor bridge
        run: |
          node --check lib/trust/official-source-grouped-relocation-phase8h-anchor-bridge.mjs
          node --check scripts/verify-trust-phase8i4-phase8h-anchor-bridge.mjs
          node scripts/verify-trust-phase8i4-phase8h-anchor-bridge.mjs

      - name: Verify Phase 8I-4E grouped relocation DB foundation
        run: |
          node --check scripts/verify-trust-phase8i4e-grouped-relocation-db-foundation.mjs
          node scripts/verify-trust-phase8i4e-grouped-relocation-db-foundation.mjs

      - name: Verify Phase 8I-4F Admin operator handoff
        run: |
          node --check lib/trust/official-source-grouped-relocation-operator-contract.mjs
          node --check scripts/verify-trust-phase8i4f-admin-operator-handoff.mjs
          node scripts/verify-trust-phase8i4f-admin-operator-handoff.mjs

      - name: Verify Phase 8I-4G first real canary framework
        run: |
          node --check lib/trust/official-source-grouped-relocation-canary.mjs
          node --check scripts/trust-phase8i4g-canary-snapshot.mjs
          node --check scripts/trust-phase8i4g-canary-activation-signal.mjs
          node --check scripts/verify-trust-phase8i4g-canary-activation.mjs
          node --check scripts/verify-trust-phase8i4g-canary-snapshot.mjs
          node --check scripts/verify-trust-phase8i4g-authority-invariants.mjs
          node --check scripts/verify-trust-phase8i4g-lineage.mjs
          node --check scripts/verify-trust-phase8i4g-idempotent-replay.mjs
          node --check scripts/verify-trust-phase8i4g-phase8h3-handoff.mjs
          node --check scripts/verify-trust-phase8i4g-static-contract.mjs
          node --check scripts/verify-trust-phase8i4g-canary-closure.mjs
          node --check scripts/materialize-trust-phase8i4g-isolated-e2e.mjs
          node --check scripts/run-trust-phase8i4g-isolated-e2e.mjs
          node --check scripts/verify-trust-phase8i4g-isolated-e2e.mjs
          node scripts/verify-trust-phase8i4g-static-contract.mjs
          node scripts/verify-trust-phase8i4g-canary-activation.mjs
          node scripts/verify-trust-phase8i4g-canary-closure.mjs
          node scripts/verify-trust-phase8i4g-isolated-e2e.mjs

      - name: Verify Phase 8E and 8F unchanged contracts
        run: |
          node scripts/verify-trust-phase8e-revalidation-adjudication.mjs
          node scripts/verify-trust-phase8f-changed-semantic-replacement.mjs

      - name: Verify Phase 8H-3 contract and rollback evidence
        run: |
          node scripts/verify-trust-phase8h3-relocation-revalidation.mjs
          node scripts/verify-trust-phase8h3-relocation-aware-verification.mjs
          node scripts/verify-trust-phase8h3-production-closure.mjs

      - name: Manual Phase 8H-3 Derma relocation observation triplet
        if: github.event_name == 'workflow_dispatch' && inputs.transport_mode == 'none'
        run: node scripts/trust-source-verification-canary-capture.mjs --target=docs/evidence/trust-phase8h3-relocation-canary-target-v1.json

      - name: Manual Phase 8H-3 research live candidate payload
        if: github.event_name == 'workflow_dispatch' && inputs.transport_mode == 'none'
        run: node scripts/trust-phase8h3-research-live-canary-capture.mjs --target=docs/evidence/trust-phase8h3-research-live-canary-target-v1.json

      - name: Verify CI workflow governance
        run: |
          node scripts/verify-ci-workflow-responsibility-map.mjs
          node scripts/audit-ci-workflow-overlap.mjs --check

      - name: Check exact-head diff hygiene
        if: github.event_name != 'schedule'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...$HEAD_SHA"


  isolated_first_real_canary_e2e:
    name: Phase 8I-4G isolated first-real canary e2e
    if: github.event_name != 'schedule' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_CLI_VERSION: 2.117.0
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Materialize isolated first-real canary runtime
        run: node scripts/materialize-trust-phase8i4g-isolated-e2e.mjs

      - name: Start isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$GITHUB_WORKSPACE/tmp/trust-phase8i4g-isolated-e2e"
          echo "TRUST_PHASE8I4G_E2E_RUNTIME_DIR=$runtime_dir" >>"$GITHUB_ENV"
          start_log="$RUNNER_TEMP/trust-phase8i4g-e2e-start.log"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" start \
            --workdir "$runtime_dir" \
            --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            >"$start_log" 2>&1; then
            sed -E 's#(sb_(publishable|secret)_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+|postgresql://[^[:space:]]+)#[REDACTED]#g' "$start_log" >&2
            exit 1
          fi
          rm -f "$start_log"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --workdir "$runtime_dir"

      - name: Bind isolated Supabase environment
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/trust-phase8i4g-e2e.env"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" status \
            --workdir "$TRUST_PHASE8I4G_E2E_RUNTIME_DIR" -o env >"$env_file"
          api_url="$(grep '^API_URL=' "$env_file" | cut -d= -f2- | tr -d '"')"
          anon_key="$(grep '^ANON_KEY=' "$env_file" | cut -d= -f2- | tr -d '"')"
          service_key="$(grep '^SERVICE_ROLE_KEY=' "$env_file" | cut -d= -f2- | tr -d '"')"
          test -n "$api_url"
          test -n "$anon_key"
          test -n "$service_key"
          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_key"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon_key"
            echo "SUPABASE_URL=$api_url"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_key"
          } >>"$GITHUB_ENV"
          rm -f "$env_file"

      - name: Execute isolated first-real canary e2e
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/trust-phase8i4g-isolated-e2e"
          mkdir -p "$artifact_dir"
          result="$artifact_dir/result.json"
          NODE_OPTIONS="--conditions=react-server" \
            npx --yes "tsx@4.23.15" --tsconfig jsconfig.json scripts/run-trust-phase8i4g-isolated-e2e.mjs \
            | tee "$result"
          node -e '
            const fs=require("node:fs");
            const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(x.contract!=="trust-phase8i4g-isolated-e2e-v1" || x.result!=="PASS") process.exit(1);
          ' "$result"
          echo "### Phase 8I-4G isolated first-real canary e2e" >>"$GITHUB_STEP_SUMMARY"
          echo >>"$GITHUB_STEP_SUMMARY"
          cat "$result" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload isolated e2e result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trust-phase8i4g-isolated-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trust-phase8i4g-isolated-e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop isolated Supabase
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          runtime_dir="${TRUST_PHASE8I4G_E2E_RUNTIME_DIR:-$GITHUB_WORKSPACE/tmp/trust-phase8i4g-isolated-e2e}"
          if [[ -d "$runtime_dir/supabase" ]]; then
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop \
              --workdir "$runtime_dir" --no-backup
          fi
          rm -rf -- "$runtime_dir"

  transport_live:
    name: Phase 8I-2B live transport rollout
    if: github.event_name == 'schedule' || inputs.transport_mode == 'canary' || inputs.transport_mode == 'full'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://bygrczggxfuisupcevaz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify live rollout authority
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$SUPABASE_URL" = "https://bygrczggxfuisupcevaz.supabase.co"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Execute governed live transport pass
        env:
          TRANSPORT_MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.transport_mode }}
          EXPECTED_FLEET_DIGEST: ${{ github.event_name == 'schedule' && '' || inputs.transport_expected_fleet_digest }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trust-phase8i2b"
          result="${RUNNER_TEMP}/trust-phase8i2b/result.json"
          run_id="phase8i2b-${TRANSPORT_MODE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          args=(
            "--scope=${TRANSPORT_MODE}"
            "--record=true"
            "--concurrency=3"
            "--per-host-delay-ms=1000"
            "--run-id=${run_id}"
          )

          if [ "${TRANSPORT_MODE}" = "canary" ]; then
            test -z "${EXPECTED_FLEET_DIGEST}"
            args+=(
              "--manifest=docs/evidence/trust-phase8i2-live-canary-targets-v1.json"
              "--expected-source-count=10"
              "--expected-target-count=5"
            )
          elif [ "${TRANSPORT_MODE}" = "full" ]; then
            if [ "${SCHEDULED_RUN}" = "true" ]; then
              args+=("--dynamic-fleet=true")
            else
              args+=(
                "--expected-source-count=35"
                "--expected-target-count=25"
              )
              if [ -n "${EXPECTED_FLEET_DIGEST}" ]; then
                args+=("--expected-fleet-digest=${EXPECTED_FLEET_DIGEST}")
              fi
            fi
          else
            echo "unsupported transport mode: ${TRANSPORT_MODE}" >&2
            exit 2
          fi

          node scripts/trust-official-source-transport-worker.mjs "${args[@]}" >"${result}"
          cat "${result}"

      - name: Verify governed live transport result
        env:
          TRANSPORT_MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.transport_mode }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/trust-phase8i2b/result.json"
          summary="${RUNNER_TEMP}/trust-phase8i2b/verification.json"
          node scripts/verify-trust-phase8i2b-live-result.mjs \
            "--result=${result}" \
            "--mode=${TRANSPORT_MODE}" \
            "--dynamic-full=${SCHEDULED_RUN}" | tee "${summary}"
          echo "### Phase 8I-2B live transport" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat "${summary}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live rollout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trust-phase8i2b-${{ github.event_name == 'schedule' && 'full' || inputs.transport_mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trust-phase8i2b/
          if-no-files-found: warn
          retention-days: 30

  transport_drift_live:
    name: Phase 8I-3D manual transport drift evaluation
    if: github.event_name == 'workflow_dispatch' && (inputs.transport_drift_mode == 'shadow' || inputs.transport_drift_mode == 'record')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://bygrczggxfuisupcevaz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify live evaluation authority
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$SUPABASE_URL" = "https://bygrczggxfuisupcevaz.supabase.co"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Execute governed manual drift evaluation
        env:
          TRANSPORT_DRIFT_MODE: ${{ inputs.transport_drift_mode }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trust-phase8i3d"
          result="${RUNNER_TEMP}/trust-phase8i3d/result.json"
          run_id="phase8i3d-${TRANSPORT_DRIFT_MODE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          case "${TRANSPORT_DRIFT_MODE}" in
            shadow) record=false ;;
            record) record=true ;;
            *)
              echo "unsupported transport drift mode: ${TRANSPORT_DRIFT_MODE}" >&2
              exit 2
              ;;
          esac

          node scripts/trust-transport-drift-handoff-worker.mjs \
            --registry=docs/evidence/trust-phase8i3-transport-drift-evaluation-policy-registry-v1.json \
            --run-id="${run_id}" \
            --record="${record}" \
            --limit=100 >"${result}"
          cat "${result}"

      - name: Verify governed manual drift result
        env:
          TRANSPORT_DRIFT_MODE: ${{ inputs.transport_drift_mode }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/trust-phase8i3d/result.json"
          summary="${RUNNER_TEMP}/trust-phase8i3d/verification.json"
          node scripts/verify-trust-phase8i3d-live-result.mjs \
            --result="${result}" \
            --mode="${TRANSPORT_DRIFT_MODE}" \
            --expected-case-count=2 | tee "${summary}"
          echo "### Phase 8I-3D manual transport drift evaluation" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat "${summary}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manual drift evaluation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trust-phase8i3d-${{ inputs.transport_drift_mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trust-phase8i3d/
          if-no-files-found: warn
          retention-days: 30

  transport_drift_scheduled:
    name: Phase 8I-3E scheduled transport drift evaluation
    if: github.event_name == 'schedule'
    needs: [verify, transport_live]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://bygrczggxfuisupcevaz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify scheduled evaluation authority
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$SUPABASE_URL" = "https://bygrczggxfuisupcevaz.supabase.co"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Enqueue governed transport drift cases
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trust-phase8i3e"
          enqueue_result="${RUNNER_TEMP}/trust-phase8i3e/enqueue-result.json"
          node scripts/trust-transport-drift-case-enqueue.mjs             --limit=100 >"${enqueue_result}"
          cat "${enqueue_result}"

      - name: Verify governed transport drift enqueue
        run: |
          set -euo pipefail
          enqueue_result="${RUNNER_TEMP}/trust-phase8i3e/enqueue-result.json"
          enqueue_summary="${RUNNER_TEMP}/trust-phase8i3e/enqueue-verification.json"
          node scripts/verify-trust-phase8i3e-enqueue-result.mjs             "--result=${enqueue_result}" | tee "${enqueue_summary}"
