      - "evidence/recommendation-governance/v21-admission-g4-f1-d1-production-migration-preflight-v1.json"
      - "scripts/verify-v21-admission-g4-f1-d1-production-migration-preflight-v1.mjs"
      - "evidence/recommendation-governance/v21-admission-g4-f1-d2-production-migration-apply-v1.json"
      - "scripts/verify-v21-admission-g4-f1-d2-production-migration-apply-v1.mjs"
      - "evidence/recommendation-governance/v21-admission-g4-f1-d3-fation-category-authority-review-preflight-v1.json"
      - "scripts/verify-v21-admission-g4-f1-d3-fation-category-authority-review-preflight-v1.mjs"
      - "evidence/recommendation-governance/v21-admission-g4-f1-d4-fation-category-authority-review-execution-v1.json"
      - "scripts/verify-v21-admission-g4-f1-d4-fation-category-authority-review-execution-v1.mjs"
      - "lib/recommendation-category-authority-reader.js"
      - "app/api/internal/recommendation-category-authority-shadow-dual-read/route.js"
      - "evidence/recommendation-governance/v21-admission-g4-f2-category-authority-shadow-dual-read-v1.json"
      - "scripts/verify-v21-admission-g4-f2-category-authority-shadow-dual-read-v1.mjs"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/v21-admission-g3a-pf-authority-read.yml"
      - "lib/recommendation-admission-authority-controlled-probe-oidc.js"
      - "lib/recommendation-admission-authority-reader.js"
      - "app/api/internal/recommendation-admission-authority-controlled-probe/route.js"
      - "lib/catalog-taxonomy-recommendation-shadow-reader.js"
      - "lib/catalog-taxonomy-recommendation-shadow-replay.js"
      - "lib/catalog-taxonomy-recommendation-shadow-cardinality-v2.mjs"
      - "app/api/internal/catalog-taxonomy-recommendation-shadow-replay/route.js"
      - "scripts/product-evidence/verify-data-taxonomy5-production-recommendation-parity-runtime-v1.mjs"
      - "scripts/product-evidence/verify-data-taxonomy15-recommendation-parity-catalog-only-v2.mjs"
      - "lib/recommendation-category-authority-shadow-contract.mjs"
