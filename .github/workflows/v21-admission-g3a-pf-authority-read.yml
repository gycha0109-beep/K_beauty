      - "evidence/recommendation-governance/v21-admission-g4-f0-category-authority-shadow-contract-v1.json"
      - "scripts/verify-v21-admission-g4-f0-category-authority-shadow-contract-v1.mjs"
      - "fixtures/recommendation-governance/g4f1-p0-ledger-reader-scenarios-v1.json"
      - "evidence/recommendation-governance/v21-admission-g4-f1-p0-ledger-reader-preflight-v1.json"
      - "scripts/verify-v21-admission-g4-f1-p0-ledger-reader-preflight-v1.mjs"
      - "supabase/migrations/20261003160200_v21_admission_g4_f1_category_authority_v1.sql"
      - "evidence/recommendation-governance/v21-admission-g4-f1-category-authority-infrastructure-v1.json"
      - "scripts/verify-v21-admission-g4-f1-category-authority-infrastructure-v1.mjs"
      - "evidence/recommendation-governance/v21-admission-g4-f1-d1-production-migration-preflight-v1.json"
      - "scripts/verify-v21-admission-g4-f1-d1-production-migration-preflight-v1.mjs"
      - "evidence/recommendation-governance/v21-admission-g4-f1-d2-production-migration-apply-v1.json"
      - "scripts/verify-v21-admission-g4-f1-d2-production-migration-apply-v1.mjs"
      - "evidence/recommendation-governance/v21-admission-g4-f1-d3-fation-category-authority-review-preflight-v1.json"
      - "scripts/verify-v21-admission-g4-f1-d3-fation-category-authority-review-preflight-v1.mjs"
      - "evidence/recommendation-governance/v21-admission-g4-f1-d4-fation-category-authority-review-execution-v1.json"
      - "scripts/verify-v21-admission-g4-f1-d4-fation-category-authority-review-execution-v1.mjs"
      - "lib/recommendation-category-authority-reader.js"
      - "app/api/internal/recommendation-category-authority-shadow-dual-read/route.js"
      - "evidence/recommendation-governance/v21-admission-g4-f2-category-authority-shadow-dual-read-v1.json"
      - "scripts/verify-v21-admission-g4-f2-category-authority-shadow-dual-read-v1.mjs"

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: g3a-runtime-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  G3A_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  G3A_RUNTIME_PROBE_PRODUCT_ID: 0b88019a-9eb2-4be9-842d-f1e60e42cf51
  G3A_OIDC_AUDIENCE: urn:bejewely:v21-admission-g3a:runtime-probe

jobs:
  verify-contract:
    name: G3A controlled probe contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.G3A_CHECKOUT_SHA }}
          fetch-depth: 1

      - name: Verify pinned OIDC contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$G3A_CHECKOUT_SHA"
          grep -F '"urn:bejewely:v21-admission-g3a:runtime-probe"' lib/recommendation-admission-authority-controlled-probe-oidc.js >/dev/null
          grep -F '".github/workflows/v21-admission-g3a-pf-authority-read.yml"' lib/recommendation-admission-authority-controlled-probe-oidc.js >/dev/null
          grep -F 'export async function POST(request)' app/api/internal/recommendation-admission-authority-controlled-probe/route.js >/dev/null
          grep -F 'runRecommendationAdmissionRuntimeSecurityProbe' app/api/internal/recommendation-admission-authority-controlled-probe/route.js >/dev/null
          grep -F 'RECOMMENDATION_ADMISSION_DATABASE_URL' lib/recommendation-admission-authority-reader.js >/dev/null

      - name: Verify DATA-TAXONOMY5 deployed replay wiring
        run: node scripts/product-evidence/verify-data-taxonomy5-production-recommendation-parity-runtime-v1.mjs

      - name: Verify DATA-TAXONOMY15 catalog-only parity extension
        run: node scripts/product-evidence/verify-data-taxonomy15-recommendation-parity-catalog-only-v2.mjs

      - name: Verify G4-F0 category authority shadow contract
        run: node scripts/verify-v21-admission-g4-f0-category-authority-shadow-contract-v1.mjs

      - name: Verify G4-F1-P0 ledger and protected-reader preflight
        run: node scripts/verify-v21-admission-g4-f1-p0-ledger-reader-preflight-v1.mjs

      - name: Verify G4-F1 category authority infrastructure
        run: node scripts/verify-v21-admission-g4-f1-category-authority-infrastructure-v1.mjs

      - name: Verify G4-F1-D1 Production migration preflight
        run: node scripts/verify-v21-admission-g4-f1-d1-production-migration-preflight-v1.mjs

      - name: Verify G4-F1-D2 Production migration apply closeout
        run: node scripts/verify-v21-admission-g4-f1-d2-production-migration-apply-v1.mjs

      - name: Verify G4-F1-D3 FATION category authority review preflight
        run: node scripts/verify-v21-admission-g4-f1-d3-fation-category-authority-review-preflight-v1.mjs

      - name: Verify G4-F1-D4 FATION category authority review execution
        run: node scripts/verify-v21-admission-g4-f1-d4-fation-category-authority-review-execution-v1.mjs

      - name: Verify G4-F2 category authority shadow dual-read
        run: node scripts/verify-v21-admission-g4-f2-category-authority-shadow-dual-read-v1.mjs

  runtime-probe:
    name: G3A deployed runtime authority probe
    if: github.event_name == 'push'
    needs: verify-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve exact Vercel deployment URL
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url=""
          for attempt in $(seq 1 72); do
            ids="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments?per_page=100" --jq ".[] | select(.sha == \"$GITHUB_SHA\") | .id" || true)"
            for id in $ids; do
              candidate="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success" and .environment_url != null)][0].environment_url // empty' || true)"
              if [ -n "$candidate" ]; then
                url="$candidate"
                break
              fi
            done
            if [ -n "$url" ]; then
              break
            fi
            sleep 5
          done
          test -n "$url"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Obtain short-lived GitHub OIDC tokens
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          custom_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${G3A_OIDC_AUDIENCE}")"
          custom="$(printf '%s' "$custom_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          trusted_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          trusted="$(printf '%s' "$trusted_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          echo "::add-mask::$custom"
          echo "::add-mask::$trusted"
          printf 'custom=%s\ntrusted=%s\n' "$custom" "$trusted" >> "$GITHUB_OUTPUT"

      - name: Probe deployed recommendation admission runtime
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.custom }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.trusted }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors \
            -o "$response_file" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"productId\":\"$G3A_RUNTIME_PROBE_PRODUCT_ID\"}" \
            "$DEPLOYMENT_URL/api/internal/recommendation-admission-authority-controlled-probe")"
          cat "$response_file"
          echo
          echo "G3A_RUNTIME_PROBE_HTTP_STATUS=$status"
          node - "$response_file" "$GITHUB_SHA" <<'NODE'
          const fs = require('fs');
          const [file, expectedSha] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          const safe = {
            result: payload.result || null,
            deploymentSha: payload.deploymentSha || null,
            deploymentRef: payload.deploymentRef || null,
            credentialAvailable: payload.credentialAvailable ?? null,
            runtimeRoleMatch: payload.runtimeRoleMatch ?? null,
            rawPfSelectDenied: payload.rawPfSelectDenied ?? null,
            authorityStatus: payload.authorityStatus || null,
            authorityReason: payload.authorityReason || null,
            readContractVersion: payload.readContractVersion || null,
            secretValueExposed: payload.secretValueExposed ?? null,
          };
          console.log(JSON.stringify(safe));
          if (payload.deploymentSha !== expectedSha) process.exit(1);
          if (payload.secretValueExposed !== false) process.exit(1);
          if (payload.result !== 'PASS') process.exit(2);
          if (payload.credentialAvailable !== true) process.exit(3);
          if (payload.runtimeRoleMatch !== true) process.exit(4);
          if (payload.rawPfSelectDenied !== true) process.exit(5);
          if (payload.authorityStatus !== 'AUTHORITY_RESOLVED') process.exit(6);
          NODE
          rm -f "$response_file"

      - name: Probe deployed G4-F2 category authority shadow dual-read
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.custom }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.trusted }}
          G4F2_TARGET_PRODUCT_ID: da5df70c-8cdd-4eb2-93b6-ede46c2f171d
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors \
            -o "$response_file" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"productId\":\"$G4F2_TARGET_PRODUCT_ID\"}" \
            "$DEPLOYMENT_URL/api/internal/recommendation-category-authority-shadow-dual-read")"
          cat "$response_file"
          echo
          echo "G4F2_RUNTIME_PROBE_HTTP_STATUS=$status"
          node - "$response_file" "$GITHUB_SHA" "$status" <<'NODE'
          const fs = require('fs');
          const [file, expectedSha, httpStatus] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          const safe = {
            result: payload.result || null,
            deploymentSha: payload.deploymentSha || null,
            deploymentRef: payload.deploymentRef || null,
            credentialAvailable: payload.credentialAvailable ?? null,
            runtimeRoleMatch: payload.runtimeRoleMatch ?? null,
            rawCategoryReviewSelectDenied: payload.rawCategoryReviewSelectDenied ?? null,
            rawTaxonomySelectDenied: payload.rawTaxonomySelectDenied ?? null,
            rawTaxonomyVersionSelectDenied: payload.rawTaxonomyVersionSelectDenied ?? null,
            pfAuthorityStatus: payload.pfAuthorityStatus || null,
            pfAuthorityReason: payload.pfAuthorityReason || null,
            categoryAuthorityStatus: payload.categoryAuthorityStatus || null,
            categoryAuthorityReason: payload.categoryAuthorityReason || null,
            categoryAuthorityReadContractVersion: payload.categoryAuthorityReadContractVersion || null,
            category: payload.category || null,
            productionDecisionSource: payload.productionDecisionSource || null,
            categoryAuthorityObservationalOnly: payload.categoryAuthorityObservationalOnly ?? null,
            recommendationAdmissionMutated: payload.recommendationAdmissionMutated ?? null,
            productionCutoverAuthorized: payload.productionCutoverAuthorized ?? null,
            secretValueExposed: payload.secretValueExposed ?? null,
          };
          console.log(`G4F2_RUNTIME_EVIDENCE=${JSON.stringify(safe)}`);
          if (httpStatus !== '200') process.exit(1);
          if (payload.deploymentSha !== expectedSha || payload.deploymentRef !== 'main') process.exit(2);
          if (payload.result !== 'PASS') process.exit(3);
          if (payload.credentialAvailable !== true || payload.runtimeRoleMatch !== true) process.exit(4);
          if (payload.rawCategoryReviewSelectDenied !== true) process.exit(5);
          if (payload.rawTaxonomySelectDenied !== true || payload.rawTaxonomyVersionSelectDenied !== true) process.exit(6);
          if (payload.categoryAuthorityStatus !== 'CATEGORY_AUTHORITY_RESOLVED') process.exit(7);
          if (payload.categoryAuthorityReadContractVersion !== 'recommendation-category-authority-read-v1') process.exit(8);
          if (payload.category !== 'treatment') process.exit(9);
          if (payload.productionDecisionSource !== 'G3_PF_AUTHORITY_ONLY') process.exit(10);
          if (payload.categoryAuthorityObservationalOnly !== true) process.exit(11);
          if (payload.recommendationAdmissionMutated !== false || payload.productionCutoverAuthorized !== false) process.exit(12);
          if (payload.secretValueExposed !== false) process.exit(13);
          NODE
          rm -f "$response_file"

      - name: Probe deployed DATA-TAXONOMY5 Recommendation parity
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.custom }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.trusted }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors \
            -o "$response_file" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            "$DEPLOYMENT_URL/api/internal/catalog-taxonomy-recommendation-shadow-replay")"
          cat "$response_file"
          echo
          echo "DATA_TAXONOMY5_RUNTIME_PROBE_HTTP_STATUS=$status"
          node - "$response_file" "$GITHUB_SHA" "$status" <<'NODE'
          const fs = require('fs');
          const [file, expectedSha, httpStatus] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          const safe = {
            result: payload.result || null,
            deploymentSha: payload.deploymentSha || null,
            deploymentRef: payload.deploymentRef || null,
            expectedProductCount: payload.expectedProductCount ?? null,
            expectedLegacyExactOverlayCount: payload.expectedLegacyExactOverlayCount ?? null,
            expectedRecommendationProductCount: payload.expectedRecommendationProductCount ?? null,
            expectedOverlayOnlyCount: payload.expectedOverlayOnlyCount ?? null,
            credentialAvailable: payload.credentialAvailable ?? null,
            runtimeRoleMatch: payload.runtimeRoleMatch ?? null,
            rawProductSelectDenied: payload.rawProductSelectDenied ?? null,
            rawTaxonomySelectDenied: payload.rawTaxonomySelectDenied ?? null,
            overlayCount: payload.overlayCount ?? null,
            recommendationProductCount: payload.recommendationProductCount ?? null,
            exactEquivalentCount: payload.exactEquivalentCount ?? null,
            catalogOnlyShadowCount: payload.catalogOnlyShadowCount ?? null,
            nonExactOverlayCount: payload.nonExactOverlayCount ?? null,
            invalidOverlayCount: payload.invalidOverlayCount ?? null,
            overlayOnlyCount: payload.overlayOnlyCount ?? null,
            overlayOnlyNonLegacyCount: payload.overlayOnlyNonLegacyCount ?? null,
            overlayOnlyCatalogOnlyCount: payload.overlayOnlyCatalogOnlyCount ?? null,
            missingLegacyLiveCount: payload.missingLegacyLiveCount ?? null,
            unexpectedLiveCount: payload.unexpectedLiveCount ?? null,
            catalogOnlyRecommendationLeakCount: payload.catalogOnlyRecommendationLeakCount ?? null,
            duplicateOverlayCount: payload.duplicateOverlayCount ?? null,
            invalidTaxonomyStateCount: payload.invalidTaxonomyStateCount ?? null,
            unmatchedProductCount: payload.unmatchedProductCount ?? null,
            legacyIdentityMismatchCount: payload.legacyIdentityMismatchCount ?? null,
            scenarioCount: payload.scenarioCount ?? null,
            scoreDeltaCount: payload.scoreDeltaCount ?? null,
            slotDeltaCount: payload.slotDeltaCount ?? null,
            fullOrderDeltaCount: payload.fullOrderDeltaCount ?? null,
            top1DeltaCount: payload.top1DeltaCount ?? null,
            top3DeltaCount: payload.top3DeltaCount ?? null,
            recommendationRuntimeCutover: payload.recommendationRuntimeCutover ?? null,
            secretValueExposed: payload.secretValueExposed ?? null,
          };
          console.log(`DATA_TAXONOMY5_RUNTIME_EVIDENCE=${JSON.stringify(safe)}`);
          if (httpStatus !== '200') process.exit(1);
          if (payload.deploymentSha !== expectedSha || payload.deploymentRef !== 'main') process.exit(2);
          if (payload.result !== 'PASS') process.exit(3);
          if (payload.credentialAvailable !== true || payload.runtimeRoleMatch !== true) process.exit(4);
          if (payload.rawProductSelectDenied !== true || payload.rawTaxonomySelectDenied !== true) process.exit(5);
          if (payload.expectedLegacyExactOverlayCount !== 165) process.exit(6);
          if (payload.expectedRecommendationProductCount !== 164) process.exit(7);
          if (!Number.isInteger(payload.catalogOnlyShadowCount) || payload.catalogOnlyShadowCount < 0) process.exit(8);
          if (payload.expectedProductCount !== 165 + payload.catalogOnlyShadowCount) process.exit(9);
          if (payload.expectedOverlayOnlyCount !== 1 + payload.catalogOnlyShadowCount) process.exit(10);
          if (payload.overlayCount !== payload.expectedProductCount) process.exit(11);
          if (payload.recommendationProductCount !== 164) process.exit(12);
          if (payload.exactEquivalentCount !== 165) process.exit(13);
          if (payload.nonExactOverlayCount !== payload.catalogOnlyShadowCount) process.exit(14);
          if (payload.invalidOverlayCount !== 0 || payload.catalogOnlyRecommendationLeakCount !== 0) process.exit(15);
          if (payload.overlayOnlyCount !== payload.expectedOverlayOnlyCount) process.exit(16);
          if (payload.overlayOnlyNonLegacyCount !== payload.expectedOverlayOnlyCount) process.exit(17);
          if (payload.overlayOnlyCatalogOnlyCount !== payload.catalogOnlyShadowCount) process.exit(18);
          if (payload.missingLegacyLiveCount !== 0 || payload.unexpectedLiveCount !== 0) process.exit(19);
          if (payload.duplicateOverlayCount !== 0 || payload.invalidTaxonomyStateCount !== 0) process.exit(20);
          if (payload.unmatchedProductCount !== 0 || payload.legacyIdentityMismatchCount !== 0) process.exit(21);
          if (payload.scenarioCount !== 8) process.exit(22);
          if (payload.scoreDeltaCount !== 0 || payload.slotDeltaCount !== 0) process.exit(23);
          if (payload.fullOrderDeltaCount !== 0 || payload.top1DeltaCount !== 0 || payload.top3DeltaCount !== 0) process.exit(24);
          if (payload.recommendationRuntimeCutover !== false || payload.secretValueExposed !== false) process.exit(25);
          if (!Array.isArray(payload.scenarios) || payload.scenarios.length !== 8) process.exit(26);
          if (payload.scenarios.some((item) => item?.fullOrderEqual !== true || item?.top1Equal !== true || item?.top3Equal !== true)) process.exit(27);
          NODE
          rm -f "$response_file"
