name: V2.1 ADMISSION G3A PF Authority Read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/v21-admission-g3a-pf-authority-read.yml"
      - "lib/recommendation-admission-authority-controlled-probe-oidc.js"
      - "lib/recommendation-admission-authority-reader.js"
      - "app/api/internal/recommendation-admission-authority-controlled-probe/route.js"

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: data-offer17-g3a-runtime-probe-${{ github.ref }}
  cancel-in-progress: false

env:
  G3A_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  G3A_RUNTIME_PROBE_PRODUCT_ID: 0b88019a-9eb2-4be9-842d-f1e60e42cf51
  G3A_OIDC_AUDIENCE: urn:bejewely:v21-admission-g3a:runtime-probe

jobs:
  verify-contract:
    name: G3A controlled probe contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.G3A_CHECKOUT_SHA }}
          fetch-depth: 1

      - name: Verify pinned OIDC contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$G3A_CHECKOUT_SHA"
          grep -F '"urn:bejewely:v21-admission-g3a:runtime-probe"' lib/recommendation-admission-authority-controlled-probe-oidc.js >/dev/null
          grep -F '".github/workflows/v21-admission-g3a-pf-authority-read.yml"' lib/recommendation-admission-authority-controlled-probe-oidc.js >/dev/null
          grep -F 'export async function POST(request)' app/api/internal/recommendation-admission-authority-controlled-probe/route.js >/dev/null
          grep -F 'runRecommendationAdmissionRuntimeSecurityProbe' app/api/internal/recommendation-admission-authority-controlled-probe/route.js >/dev/null
          grep -F 'RECOMMENDATION_ADMISSION_DATABASE_URL' lib/recommendation-admission-authority-reader.js >/dev/null

  runtime-probe:
    name: G3A deployed runtime authority probe
    if: github.event_name == 'push'
    needs: verify-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve exact Vercel deployment URL
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url=""
          for attempt in $(seq 1 72); do
            ids="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments?per_page=100" --jq ".[] | select(.sha == \"$GITHUB_SHA\") | .id" || true)"
            for id in $ids; do
              candidate="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success" and .environment_url != null)][0].environment_url // empty' || true)"
              if [ -n "$candidate" ]; then
                url="$candidate"
                break
              fi
            done
            if [ -n "$url" ]; then
              break
            fi
            sleep 5
          done
          test -n "$url"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Obtain short-lived GitHub OIDC tokens
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          custom_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${G3A_OIDC_AUDIENCE}")"
          custom="$(printf '%s' "$custom_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          trusted_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          trusted="$(printf '%s' "$trusted_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          echo "::add-mask::$custom"
          echo "::add-mask::$trusted"
          printf 'custom=%s\ntrusted=%s\n' "$custom" "$trusted" >> "$GITHUB_OUTPUT"

      - name: Probe deployed recommendation admission runtime
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.custom }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.trusted }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors \
            -o "$response_file" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"productId\":\"$G3A_RUNTIME_PROBE_PRODUCT_ID\"}" \
            "$DEPLOYMENT_URL/api/internal/recommendation-admission-authority-controlled-probe")"
          cat "$response_file"
          echo
          echo "G3A_RUNTIME_PROBE_HTTP_STATUS=$status"
          node - "$response_file" "$GITHUB_SHA" <<'NODE'
          const fs = require('fs');
          const [file, expectedSha] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          const safe = {
            result: payload.result || null,
            deploymentSha: payload.deploymentSha || null,
            deploymentRef: payload.deploymentRef || null,
            credentialAvailable: payload.credentialAvailable ?? null,
            runtimeRoleMatch: payload.runtimeRoleMatch ?? null,
            rawPfSelectDenied: payload.rawPfSelectDenied ?? null,
            authorityStatus: payload.authorityStatus || null,
            authorityReason: payload.authorityReason || null,
            readContractVersion: payload.readContractVersion || null,
            secretValueExposed: payload.secretValueExposed ?? null,
          };
          console.log(JSON.stringify(safe));
          if (payload.deploymentSha !== expectedSha) process.exit(1);
          if (payload.secretValueExposed !== false) process.exit(1);
          if (payload.result !== 'PASS') process.exit(2);
          if (payload.credentialAvailable !== true) process.exit(3);
          if (payload.runtimeRoleMatch !== true) process.exit(4);
          if (payload.rawPfSelectDenied !== true) process.exit(5);
          if (payload.authorityStatus !== 'AUTHORITY_RESOLVED') process.exit(6);
          NODE
          rm -f "$response_file"
