name: TRUST-P15 DrG Sunscreen Hosted Adoption Plan

on:
  pull_request:
    paths:
      - "evidence/product-fact-adoption-v1/trust-p15-drg-sunscreen-hosted-adoption-plan-v1.json"
      - "docs/evidence/trust-p15-drg-sunscreen-hosted-adoption-plan-v1.md"
      - "scripts/product-evidence/trust-p15-drg-sunscreen-hosted-adoption-plan-v1.mjs"
      - "scripts/product-evidence/verify-trust-p15-drg-sunscreen-hosted-adoption-plan-v1.mjs"
      - ".github/workflows/trust-p15-drg-sunscreen-hosted-adoption-plan.yml"
  push:
    branches:
      - main
    paths:
      - "evidence/product-fact-adoption-v1/trust-p15-drg-sunscreen-hosted-adoption-plan-v1.json"
      - "docs/evidence/trust-p15-drg-sunscreen-hosted-adoption-plan-v1.md"
      - "scripts/product-evidence/trust-p15-drg-sunscreen-hosted-adoption-plan-v1.mjs"
      - "scripts/product-evidence/verify-trust-p15-drg-sunscreen-hosted-adoption-plan-v1.mjs"
      - ".github/workflows/trust-p15-drg-sunscreen-hosted-adoption-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-trust-p15-drg-sunscreen-hosted-adoption-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Attest exact head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify TRUST-P15 deterministic plan
        run: node scripts/product-evidence/verify-trust-p15-drg-sunscreen-hosted-adoption-plan-v1.mjs
