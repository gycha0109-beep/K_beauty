name: Skin Decision Closeout Apply

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/skin-decision-closeout-apply.yml
      - .closeout-payload/**
      - .closeout-payload.b64
      - .closeout-trigger

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Checkout v4 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: 3f697f3e5c2ae607c9d86af3f16bdfe2cdb43037
          path: _source-v4
          persist-credentials: false
      - name: Checkout Unified Vision source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: c88d3c89801d5de73c307a925bf811f21c5198ff
          path: _source-vision
          persist-credentials: false
      - name: Reconstruct curated closeout
        shell: bash
        run: |
          set -euo pipefail
          copy() { mkdir -p "$(dirname "$1")"; cp "$2/$1" "$1"; }

          for path in \
            app/api/face-reading/route.js \
            app/page.js \
            app/result/full-report/page.js \
            app/result/page.js \
            components/onboarding/SurveyFlow.js \
            components/result/free-v2/FreeResultV2DiagnosisStep.jsx \
            docs/domain/facelab/unified-vision-observation-contract-v1.md \
            lib/face-lab-analysis-bundle.js \
            lib/face-lab-observation-contract.js \
            lib/face-lab-observation-projector.js \
            lib/face-lab-result-envelope.js \
            lib/image-analysis-eligibility.js \
            lib/photo-evidence.js \
            lib/premium-face-lab.js \
            lib/provider-runtime-log.js \
            lib/server/vision-observation-service.js \
            lib/skin-observation-projector.js \
            lib/vision-observation-contract.js \
            lib/vision-observation-normalizer.js \
            playwright.mobile-analyze.config.ts \
            scripts/verify-analysis-request-guard.mjs \
            scripts/verify-face-lab-failure-and-legacy-contract.mjs \
            scripts/verify-face-lab-keyword-summary.mjs \
            scripts/verify-face-lab-observation-contract.mjs \
            scripts/verify-image-analysis-eligibility.mjs \
            scripts/verify-provider-runtime-log-sanitization.mjs \
            scripts/verify-sec06-saved-report-boundary.mjs \
            scripts/verify-sec08-image-upload-boundary.mjs \
            scripts/verify-unified-vision-pipeline.mjs \
            tests/e2e/mobile-analyze-browser-flow.spec.ts
          do
            copy "$path" _source-vision
          done

          for path in \
            lib/premium-decision-state.js \
            scripts/verify-condition-policy-single-source.mjs \
            scripts/verify-routine-policy-single-source.mjs
          do
            copy "$path" _source-v4
          done

          printf '%s  %s\n' \
            '7ece80a61e6a5f4979121b9d13b89fcb5218e96aefc3da7bf1e188b363af2114' '.closeout-payload/part-00a' \
            '517a8d360240d81f56de18749c3dfe14b351f07727b2fb622d1df14f3fb847fc' '.closeout-payload/part-00b' \
            'def4f031073252621f51dcff69c288fd053678d6d9d964b8610957164971e513' '.closeout-payload/part-01' \
            'f2caacfe29e8e243dc3db8a405e502bfc2249a28caf05bbfce8041350c7d8b88' '.closeout-payload/part-02' \
            '77b1417ae4776f3ba444388b850f7dabf35845d5126a9b2f9faa6235d95a86ad' '.closeout-payload/part-03' \
            '96ffc097f06fc0dda1d53a2bd33017c490bfc063ff612a765914e7d0c0379ee4' '.closeout-payload/part-04' \
            '64d92fe8677a88adb1fe708b93069bc350f02056aa8fb0b222615ffa7cd70d6b' '.closeout-payload/part-05' \
            | sha256sum --check --strict

          cat .closeout-payload/part-00a \
              .closeout-payload/part-00b \
              .closeout-payload/part-01 \
              .closeout-payload/part-02 \
              .closeout-payload/part-03 \
              .closeout-payload/part-04 \
              .closeout-payload/part-05 \
              > /tmp/custom.patch.gz.b64
          base64 --decode /tmp/custom.patch.gz.b64 > /tmp/custom.patch.gz
          echo '66c69ed675d4c1996b05786ec0eb824b82f34ed792064baa81f093aa66200456  /tmp/custom.patch.gz' | sha256sum --check --strict
          gzip -dc /tmp/custom.patch.gz > /tmp/custom.patch
          patch --batch --forward -p1 < /tmp/custom.patch

          rm -rf _source-v4 _source-vision .closeout-payload
          rm -f .closeout-payload.b64 .closeout-trigger
          rm -f .github/workflows/skin-decision-closeout-apply.yml

          test -f .github/workflows/skin-decision-engine-closeout.yml
          test -f lib/shared-skin-decision-context-v4.js
          test -f scripts/verify-premium-integrated-evaluation-v2.mjs
          test -f scripts/verify-skin-decision-recommendation-invariance.mjs
          test ! -e .closeout-payload.b64
          test ! -e .closeout-trigger
          test ! -e .github/workflows/skin-decision-closeout-apply.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          ! git diff --cached --name-only | grep -E '^(supabase/|app/admin/|app/api/admin/)'
          git commit -m 'feat(skin-decision): curate current-main closeout'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
