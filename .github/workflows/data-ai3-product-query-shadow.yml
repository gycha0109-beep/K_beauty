name: DATA-AI3 Product Query Shadow

on:
  push:
    branches: [main]
    paths:
      - "lib/product-query-intent-contract.mjs"
      - "lib/server/product-query-intent-service.js"
      - "lib/product-query-execution-contract.mjs"
      - "lib/product-query-recommendation.js"
      - "lib/recommendation-scoring.ts"
      - "lib/product-source.js"
      - "lib/recommendation-candidate-admission.js"
      - "lib/recommendation-candidate-admission-core.mjs"
      - "lib/server/recommendation-candidate-admission-runtime.js"
      - "lib/server/product-query-shadow-service.js"
      - "lib/product-query-shadow-probe-oidc.js"
      - "app/api/internal/product-query-shadow/route.js"
      - "scripts/verify-data-ai3-product-query-shadow.mjs"
      - ".github/workflows/data-ai3-product-query-shadow.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/product-query-intent-contract.mjs"
      - "lib/server/product-query-intent-service.js"
      - "lib/product-query-execution-contract.mjs"
      - "lib/product-query-recommendation.js"
      - "lib/recommendation-scoring.ts"
      - "lib/product-source.js"
      - "lib/recommendation-candidate-admission.js"
      - "lib/recommendation-candidate-admission-core.mjs"
      - "lib/server/recommendation-candidate-admission-runtime.js"
      - "lib/server/product-query-shadow-service.js"
      - "lib/product-query-shadow-probe-oidc.js"
      - "app/api/internal/product-query-shadow/route.js"
      - "scripts/verify-data-ai3-product-query-shadow.mjs"
      - ".github/workflows/data-ai3-product-query-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: data-ai3-product-query-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATA_AI3_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  DATA_AI3_OIDC_AUDIENCE: urn:bejewely:data-ai3:product-query-shadow

jobs:
  verify:
    name: DATA-AI3 static shadow contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.DATA_AI3_EXACT_HEAD }}

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DATA_AI3_EXACT_HEAD"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify DATA-AI1 intent boundary
        run: node scripts/verify-data-ai1-product-query-intent.mjs

      - name: Verify DATA-AI2 deterministic execution
        run: node scripts/verify-data-ai2-product-query-execution.mjs

      - name: Verify DATA-AI3 shadow boundary
        run: node scripts/verify-data-ai3-product-query-shadow.mjs

      - name: Verify architecture boundaries
        env:
          ARCHITECTURE_GUARD_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: npm run architecture:guard

      - name: Build production application
        run: npm run build

      - name: Check exact-head and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DATA_AI3_EXACT_HEAD"
          git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}...$DATA_AI3_EXACT_HEAD" || git diff --check HEAD^

  runtime-probe:
    name: DATA-AI3 deployed real-corpus shadow probe
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve exact Vercel deployment URL
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url=""
          for attempt in $(seq 1 72); do
            ids="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments?per_page=100" --jq ".[] | select(.sha == \"$GITHUB_SHA\") | .id" || true)"
            for id in $ids; do
              candidate="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success" and .environment_url != null)][0].environment_url // empty' || true)"
              if [ -n "$candidate" ]; then
                url="$candidate"
                break
              fi
            done
            if [ -n "$url" ]; then
              break
            fi
            sleep 5
          done
          test -n "$url"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Obtain short-lived GitHub OIDC tokens
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          custom_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${DATA_AI3_OIDC_AUDIENCE}")"
          custom="$(printf '%s' "$custom_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          trusted_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          trusted="$(printf '%s' "$trusted_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          echo "::add-mask::$custom"
          echo "::add-mask::$trusted"
          printf 'custom=%s\ntrusted=%s\n' "$custom" "$trusted" >> "$GITHUB_OUTPUT"

      - name: Probe deployed real admitted corpus
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.custom }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.trusted }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors             -o "$response_file"             -w '%{http_code}'             -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN"             "$DEPLOYMENT_URL/api/internal/product-query-shadow")"
          cat "$response_file"
          echo
          echo "DATA_AI3_RUNTIME_PROBE_HTTP_STATUS=$status"
          node - "$response_file" "$GITHUB_SHA" "$status" <<'NODE'
          const fs = require("fs");
          const [file, expectedSha, httpStatus] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const safe = {
            result: payload.result || null,
            deploymentSha: payload.deploymentSha || null,
            deploymentRef: payload.deploymentRef || null,
            contractVersion: payload.contractVersion || null,
            candidateCorpusCount: payload.candidateCorpusCount ?? null,
            scenarioCount: payload.scenarioCount ?? null,
            allParity: payload.allParity ?? null,
            allScenarioChecksPass: payload.allScenarioChecksPass ?? null,
            secretValueExposed: payload.secretValueExposed ?? null,
            queryTextExposed: payload.queryTextExposed ?? null,
            productionWrite: payload.productionWrite ?? null,
            recommendationLogWrite: payload.recommendationLogWrite ?? null,
            publicActivation: payload.publicActivation ?? null,
            scenarios: Array.isArray(payload.scenarios)
              ? payload.scenarios.map((item) => ({
                  id: item.id,
                  status: item.status,
                  effectiveCategory: item.effectiveCategory,
                  candidateCount: item.candidateCount,
                  resultCount: item.resultCount,
                  constraintStatus: item.constraintStatus,
                  parity: item.parity,
                  pass: item.pass,
                  failures: item.failures
                }))
              : null
          };
          console.log(`DATA_AI3_RUNTIME_EVIDENCE=${JSON.stringify(safe)}`);
          if (httpStatus !== "200") process.exit(1);
          if (payload.deploymentSha !== expectedSha || payload.deploymentRef !== "main") process.exit(2);
          if (payload.result !== "PASS") process.exit(3);
          if (payload.contractVersion !== "product-query-shadow-v1") process.exit(4);
          if (!Number.isInteger(payload.candidateCorpusCount) || payload.candidateCorpusCount < 1) process.exit(5);
          if (payload.scenarioCount !== 4) process.exit(6);
          if (payload.allParity !== true || payload.allScenarioChecksPass !== true) process.exit(7);
          if (payload.secretValueExposed !== false || payload.queryTextExposed !== false) process.exit(8);
          if (payload.productionWrite !== false || payload.recommendationLogWrite !== false) process.exit(9);
          if (payload.publicActivation !== false) process.exit(10);
          if (!Array.isArray(payload.scenarios) || payload.scenarios.length !== 4) process.exit(11);
          if (payload.scenarios.some((item) => item?.parity !== true || item?.pass !== true)) process.exit(12);
          const categoryOnly = payload.scenarios.find((item) => item?.id === "category_only_fail_closed");
          if (categoryOnly?.status !== "insufficient_supported_intent" || categoryOnly?.resultCount !== 0) process.exit(13);
          const unresolved = payload.scenarios.find((item) => item?.id === "unresolved_constraint_preserved");
          if (unresolved?.constraintStatus !== "partial" || !unresolved?.unresolvedTerms?.includes("pregnancy-safe")) process.exit(14);
          NODE
          rm -f "$response_file"
