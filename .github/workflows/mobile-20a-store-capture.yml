name: BEJEWELY Mobile 20A Store Capture

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/features/analyze/NativeAnalyzeResult.tsx"
      - "apps/mobile/.gitignore"
      - "docs/store/mobile-store-listing-final.json"
      - "scripts/capture-mobile-store-assets.sh"
      - "scripts/verify-mobile-20a-store-capture.mjs"
      - ".github/workflows/mobile-20a-store-capture.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/features/analyze/NativeAnalyzeResult.tsx"
      - "apps/mobile/.gitignore"
      - "docs/store/mobile-store-listing-final.json"
      - "scripts/capture-mobile-store-assets.sh"
      - "scripts/verify-mobile-20a-store-capture.mjs"
      - ".github/workflows/mobile-20a-store-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-20a-store-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  store-capture:
    name: Android Store Capture
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_20A_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify MOBILE-20A store capture contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/capture-mobile-store-assets.sh
          node scripts/verify-mobile-20a-store-capture.mjs
          node scripts/verify-mobile-18-store-listing.mjs
          node scripts/verify-mobile-analyze-integration.mjs

      - name: Verify mobile types and Expo config
        shell: bash
        run: |
          set -euo pipefail
          npm run mobile:typecheck
          npm run mobile:config

      - name: Generate Android native project
        run: npm run mobile:prebuild:android

      - name: Verify generated Android contract
        run: npm run verify:mobile-native

      - name: Build installable debug APK
        run: npm run mobile:build:android:debug

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture 1080x1920 EN and KO store candidates
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          avd-name: bejewely-mobile-20a-api35
          force-avd-creation: true
          disable-animations: true
          pre-emulator-launch-script: |
            config="$HOME/.android/avd/bejewely-mobile-20a-api35.avd/config.ini"
            test -f "$config"
            for camera in front back; do
              key="hw.camera.$camera"
              if grep -q "^${key}=" "$config"; then
                sed -i "s/^${key}=.*/${key}=emulated/" "$config"
              else
                printf '\n%s=emulated\n' "$key" >> "$config"
              fi
              grep -q "^${key}=emulated$" "$config"
            done
            printf 'MOBILE_20A_DUAL_CAMERA_AVD_CONFIG=PASS\n'
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: bash scripts/capture-mobile-store-assets.sh

      - name: Upload store capture candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bejewely-mobile-20a-store-capture-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            apps/mobile/.mobile-store-artifacts/**
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
