name: CandidatePolicy Main Integration Build

on:
  pull_request:
    branches:
      - codex/candidate-policy-design-audit-validation-base

permissions:
  contents: write

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: 647051f7feff8e23dc7b563cb7b58ffcba7e6eaf
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Run fail-closed integration build
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin codex/candidate-policy-design-audit-validation-base
          git show origin/codex/candidate-policy-design-audit-validation-base:.validation/run-candidate-policy-main-integration-v3.sh > "$RUNNER_TEMP/run-candidate-policy-main-integration-v3.sh"
          bash -n "$RUNNER_TEMP/run-candidate-policy-main-integration-v3.sh"
          chmod +x "$RUNNER_TEMP/run-candidate-policy-main-integration-v3.sh"
          "$RUNNER_TEMP/run-candidate-policy-main-integration-v3.sh"

      - name: Publish validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-policy-main-integration-evidence
          path: ${{ runner.temp }}/candidate-policy-main-integration-evidence/**
          retention-days: 30
