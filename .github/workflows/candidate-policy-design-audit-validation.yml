name: CandidatePolicy Semantic Merge Inspection

on:
  pull_request:
    branches:
      - codex/candidate-policy-design-audit-validation-base

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: 647051f7feff8e23dc7b563cb7b58ffcba7e6eaf
          fetch-depth: 0

      - name: Capture semantic authorities
        shell: bash
        run: |
          set -euo pipefail
          BASE=647051f7feff8e23dc7b563cb7b58ffcba7e6eaf
          SOURCE=ce882aa2057a06d39d86f99a09f4264725b4161b
          DESIGN=797e179077df9065f08a262c92f4940f5a259cbe
          git fetch --no-tags origin codex/dependency-security-triage codex/candidate-policy-main-integration-final-design
          mkdir -p semantic/main semantic/source semantic/diff design
          paths=(
            app/api/analyze/route.js
            lib/evaluator-boundary-policy-shadow.js
            package.json
            package-lock.json
            scripts/run-security-closeout-verifier-suite.mjs
            scripts/verify-evaluator-boundary-readiness-review.mjs
          )
          for path in "${paths[@]}"; do
            mkdir -p "semantic/main/$(dirname "$path")" "semantic/source/$(dirname "$path")" "semantic/diff/$(dirname "$path")"
            git show "$BASE:$path" > "semantic/main/$path"
            git show "$SOURCE:$path" > "semantic/source/$path"
            git diff --no-ext-diff --unified=120 "$BASE" "$SOURCE" -- "$path" > "semantic/diff/$path.diff" || true
          done
          git show "$DESIGN:docs/architecture/candidate-policy-main-integration-path-ledger-v1.json" > design/ledger.json
          git show "$DESIGN:docs/architecture/candidate-policy-main-integration-ledger/include-exact.txt" > design/include-exact.txt
          git show "$DESIGN:docs/architecture/candidate-policy-main-integration-ledger/exclude-source-only.txt" > design/exclude-source-only.txt
          printf '%s\n' "$BASE" > design/main-sha.txt
          printf '%s\n' "$SOURCE" > design/source-sha.txt

      - name: Publish inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-policy-semantic-authorities
          path: |
            semantic/**
            design/**
          retention-days: 7
