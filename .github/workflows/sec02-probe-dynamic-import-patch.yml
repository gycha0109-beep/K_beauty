name: SEC-02 live mutation execution

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  execute:
    if: github.head_ref == 'feature/premium-beta-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Execute exact Preview probe
        id: probe
        shell: bash
        env:
          PROBE_URL: https://k-beauty-4l31m8jpv-johnny-self.vercel.app/?_vercel_share=69wgsknGWhnGd10lpHGAdZ8CBXpr9HPN
        run: |
          set -euo pipefail
          mkdir -p sec02-evidence
          status=$(curl \
            --silent \
            --show-error \
            --location \
            --max-redirs 12 \
            --max-time 330 \
            --cookie sec02-evidence/cookies.txt \
            --cookie-jar sec02-evidence/cookies.txt \
            --dump-header sec02-evidence/headers.txt \
            --output sec02-evidence/body.json \
            --write-out '%{http_code}' \
            "$PROBE_URL")
          printf '%s\n' "$status" > sec02-evidence/status.txt
          cat sec02-evidence/body.json
          python - <<'PY'
          import json
          from pathlib import Path

          status = Path('sec02-evidence/status.txt').read_text().strip()
          body_path = Path('sec02-evidence/body.json')
          try:
              body = json.loads(body_path.read_text())
          except Exception as exc:
              raise SystemExit(f'probe response was not JSON: HTTP {status}: {exc}')
          if status != '200' or body.get('passed') is not True:
              raise SystemExit(f'probe failed: HTTP {status}: {json.dumps(body, ensure_ascii=False)}')
          PY
      - name: Remove cookies from evidence
        if: always()
        shell: bash
        run: rm -f sec02-evidence/cookies.txt
      - name: Upload SEC-02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec02-live-mutation-evidence
          path: sec02-evidence/
          if-no-files-found: error
          retention-days: 1
