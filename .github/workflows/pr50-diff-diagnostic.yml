name: PR50 Diff Diagnostic

on:
  push:
    branches:
      - design/unified-vision-observation-pipeline

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Vision branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: design/unified-vision-observation-pipeline

      - name: Persist diff-check diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/survey-input-contract-refactor
          diagnostic=".codex/pr50-diff-check-diagnostic.txt"
          mkdir -p .codex
          set +e
          git diff --check origin/codex/survey-input-contract-refactor HEAD >"${diagnostic}" 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "${status}" >>"${diagnostic}"
          git add "${diagnostic}"
          git commit -m "chore(vision): capture diff-check diagnostic"
          git push origin HEAD:design/unified-vision-observation-pipeline
