name: G3A Secure Credential Rotation

on:
  push:
    branches:
      - admission/g3a-cont-pf-authority-read
    paths:
      - .github/workflows/g3a-secure-credential-rotation.yml

permissions:
  contents: read
  statuses: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_VHh3BMegmXFGwxgOJLlgFQjksmKA
      VERCEL_TEAM_ID: team_xuYA9OhCWlJETaYFOmeVodgS
      ENV_KEY: RECOMMENDATION_ADMISSION_DATABASE_URL
      EXPECTED_ROLE: recommendation_admission_runtime
      PROJECT_REF: bygrczggxfuisupcevaz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admission/g3a-cont-pf-authority-read
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Securely rotate dedicated runtime credential and Vercel sensitive env
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import postgres from 'postgres';

          const fail = (code) => { process.stdout.write(`${code}\n`); process.exit(1); };
          const token = process.env.VERCEL_TOKEN || '';
          if (!token) fail('VERCEL_TOKEN_UNAVAILABLE');

          const projectId = process.env.VERCEL_PROJECT_ID;
          const teamId = process.env.VERCEL_TEAM_ID;
          const key = process.env.ENV_KEY;
          const expectedRole = process.env.EXPECTED_ROLE;
          const projectRef = process.env.PROJECT_REF;
          const expectedPoolerUser = `${expectedRole}.${projectRef}`;
          const authHeaders = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };

          function parsePossiblyUnescapedPgUrl(raw) {
            if (typeof raw !== 'string' || !raw.startsWith('postgresql://')) throw new Error('INVALID_CONNECTION_FORMAT');
            const body = raw.slice('postgresql://'.length);
            const at = body.lastIndexOf('@');
            if (at <= 0) throw new Error('INVALID_CONNECTION_FORMAT');
            const credentials = body.slice(0, at);
            const colon = credentials.indexOf(':');
            if (colon <= 0) throw new Error('INVALID_CONNECTION_FORMAT');
            const password = credentials.slice(colon + 1);
            const location = body.slice(at + 1);
            const slash = location.indexOf('/');
            const hostPort = slash >= 0 ? location.slice(0, slash) : location;
            const database = slash >= 0 ? location.slice(slash + 1).split('?')[0] : 'postgres';
            const lastColon = hostPort.lastIndexOf(':');
            const host = lastColon > 0 ? hostPort.slice(0, lastColon) : hostPort;
            const port = lastColon > 0 ? Number(hostPort.slice(lastColon + 1)) : 6543;
            if (!host.endsWith('.pooler.supabase.com') || port !== 6543 || database !== 'postgres' || !password) {
              throw new Error('POOLER_CONFIGURATION_MISMATCH');
            }
            return { host, port, database, password };
          }

          const listUrl = `https://api.vercel.com/v10/projects/${encodeURIComponent(projectId)}/env?decrypt=true&source=vercel-cli:pull&teamId=${encodeURIComponent(teamId)}`;
          const listRes = await fetch(listUrl, { headers: authHeaders });
          if (!listRes.ok) fail(`VERCEL_ENV_READ_FAILED_${listRes.status}`);
          const listJson = await listRes.json();
          const envs = Array.isArray(listJson?.envs) ? listJson.envs : Array.isArray(listJson) ? listJson : [];
          const targets = envs.filter((env) => env?.key === key && typeof env?.value === 'string' && env.value);
          if (!targets.length) fail('VERCEL_ENV_NOT_FOUND_OR_NOT_DECRYPTED');

          const uniqueValues = [...new Set(targets.map((env) => env.value))];
          if (uniqueValues.length !== 1) fail('VERCEL_ENV_MULTIPLE_VALUES_UNSUPPORTED');
          const oldUrl = uniqueValues[0];
          const parsed = parsePossiblyUnescapedPgUrl(oldUrl);

          const oldSql = postgres({
            host: parsed.host,
            port: parsed.port,
            database: parsed.database,
            username: expectedPoolerUser,
            password: parsed.password,
            ssl: 'require',
            prepare: false,
            max: 1,
            connect_timeout: 5,
            idle_timeout: 5,
          });

          try {
            const roleRows = await oldSql`select current_user::text as role`;
            if (roleRows?.[0]?.role !== expectedRole) throw new Error('ROLE_MISMATCH');
          } catch {
            await oldSql.end({ timeout: 1 }).catch(() => {});
            fail('DEDICATED_ROLE_AUTHENTICATION_FAILED');
          }

          const newPassword = crypto.randomBytes(48).toString('base64url');
          const newUrl = `postgresql://${expectedPoolerUser}:${encodeURIComponent(newPassword)}@${parsed.host}:${parsed.port}/${parsed.database}`;
          const updated = [];

          async function patchEnv(env, value) {
            const res = await fetch(`https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}/env/${encodeURIComponent(env.id)}?teamId=${encodeURIComponent(teamId)}`, {
              method: 'PATCH', headers: authHeaders,
              body: JSON.stringify({ value, type: 'sensitive' }),
            });
            return res.ok;
          }

          for (const env of targets) {
            if (!(await patchEnv(env, newUrl))) {
              for (const prior of updated) await patchEnv(prior, oldUrl).catch(() => {});
              await oldSql.end({ timeout: 1 }).catch(() => {});
              fail('VERCEL_ENV_UPDATE_FAILED_ROLLED_BACK');
            }
            updated.push(env);
          }

          try {
            await oldSql.unsafe(`alter role ${expectedRole} password '${newPassword}'`);
          } catch {
            for (const prior of updated) await patchEnv(prior, oldUrl).catch(() => {});
            await oldSql.end({ timeout: 1 }).catch(() => {});
            fail('DATABASE_PASSWORD_ROTATION_FAILED_ENV_ROLLED_BACK');
          }

          const newSql = postgres({
            host: parsed.host,
            port: parsed.port,
            database: parsed.database,
            username: expectedPoolerUser,
            password: newPassword,
            ssl: 'require',
            prepare: false,
            max: 1,
            connect_timeout: 5,
            idle_timeout: 5,
          });

          try {
            const roleRows = await newSql`select current_user::text as role`;
            if (roleRows?.[0]?.role !== expectedRole) throw new Error('ROLE_MISMATCH');
          } catch {
            try { await oldSql.unsafe(`alter role ${expectedRole} password '${parsed.password.replaceAll("'", "''")}'`); } catch {}
            for (const prior of updated) await patchEnv(prior, oldUrl).catch(() => {});
            await newSql.end({ timeout: 1 }).catch(() => {});
            await oldSql.end({ timeout: 1 }).catch(() => {});
            fail('ROTATED_CREDENTIAL_VERIFICATION_FAILED_ROLLED_BACK');
          }

          await newSql.end({ timeout: 1 });
          await oldSql.end({ timeout: 1 });
          process.stdout.write('CREDENTIAL_ROTATION_PASS\n');
          NODE

      - name: Publish rotation attestation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=success
          description="G3A dedicated credential securely rotated"
          if [ "$PRIOR_JOB_STATUS" != success ]; then
            state=failure
            description="G3A dedicated credential rotation failed"
          fi
          gh api --method POST -H "Accept: application/vnd.github+json" "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="V2.1-ADMISSION-G3A credential rotation" -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          test "$state" = success
