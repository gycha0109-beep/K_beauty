name: V21-2 Scope Scanner Fix

on:
  push:
    branches:
      - research/product-fact-cross-category-materialization-dry-run-v1
    paths:
      - .github/workflows/v21-2-scope-scanner-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/product-fact-cross-category-materialization-dry-run-v1
          fetch-depth: 0
      - name: Patch verifier scope sentinel handling only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-product-fact-cross-category-materialization-dry-run-v1.mjs')
          s=p.read_text()
          old='''function walkKeys(v,at="$"){
  if(Array.isArray(v)){v.forEach((x,i)=>walkKeys(x,`${at}[${i}]`));return;}
  if(!v||typeof v!=="object")return;
  for(const [k,x] of Object.entries(v)){
    if(forbiddenKey.test(k)&&![/recommendation_output/i,/recommendation_activated/i].some(r=>r.test(k))) throw new Error(`forbidden scope field ${at}.${k}`);
    walkKeys(x,`${at}.${k}`);
  }
}'''
          new='''function walkKeys(v,at="$"){
  if(Array.isArray(v)){v.forEach((x,i)=>walkKeys(x,`${at}[${i}]`));return;}
  if(!v||typeof v!=="object")return;
  for(const [k,x] of Object.entries(v)){
    if(forbiddenKey.test(k)){
      const invariantSentinel=at==="$.invariants"&&["decision_axis_output","user_concern_output","recommendation_output"].includes(k)&&x===false;
      const lifecycleSentinel=at==="$.invariants.lifecycle"&&["DECISION_AXIS_PRODUCTION_READY","DECISION_AXIS_CONSUMPTION","RECOMMENDATION_ACTIVATED"].includes(k)&&x==="NO";
      if(!invariantSentinel&&!lifecycleSentinel) throw new Error(`forbidden scope field ${at}.${k}`);
    }
    walkKeys(x,`${at}.${k}`);
  }
}'''
          if old not in s: raise SystemExit('expected walkKeys block not found')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- scripts/verify-product-fact-cross-category-materialization-dry-run-v1.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-product-fact-cross-category-materialization-dry-run-v1.mjs
          git commit -m 'test(storage): distinguish scope sentinels from forbidden outputs'
          git push origin HEAD:research/product-fact-cross-category-materialization-dry-run-v1
