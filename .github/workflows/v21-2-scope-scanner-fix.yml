name: V21-2 Scope Scanner Fix

on:
  push:
    branches:
      - research/product-fact-cross-category-materialization-dry-run-v1
    paths:
      - .github/workflows/v21-2-scope-scanner-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/product-fact-cross-category-materialization-dry-run-v1
          fetch-depth: 0
      - name: Patch forbidden-scope sentinel handling
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='scripts/verify-product-fact-cross-category-materialization-dry-run-v1.mjs';
          let s=fs.readFileSync(p,'utf8');
          const old='    if(forbiddenKey.test(k)&&![/recommendation_output/i,/recommendation_activated/i].some(r=>r.test(k))) throw new Error(`forbidden scope field ${at}.${k}`);';
          const replacement='    if(forbiddenKey.test(k)&&!((at==="$.invariants"&&["decision_axis_output","user_concern_output","recommendation_output"].includes(k)&&x===false)||(at==="$.invariants.lifecycle"&&["DECISION_AXIS_PRODUCTION_READY","DECISION_AXIS_CONSUMPTION","RECOMMENDATION_ACTIVATED"].includes(k)&&x==="NO"))) throw new Error(`forbidden scope field ${at}.${k}`);';
          if(!s.includes(old)) throw new Error('expected scanner line not found');
          fs.writeFileSync(p,s.replace(old,replacement));
          NODE
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-product-fact-cross-category-materialization-dry-run-v1.mjs
          git commit -m 'test(storage): distinguish scope sentinels from forbidden outputs'
          git push origin HEAD:research/product-fact-cross-category-materialization-dry-run-v1
