name: DATA-TAXONOMY15 Catalog-only TRUST Intake Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20260915154500_data_taxonomy15_catalog_only_trust_intake_bridge_v1.sql"
      - "tests/fixtures/data-taxonomy15-catalog-only-trust-intake/**"
      - "scripts/product-evidence/verify-data-taxonomy15-catalog-only-trust-intake-v1.mjs"
      - ".github/workflows/data-taxonomy15-catalog-only-trust-intake.yml"
  push:
    branches: [main, "fix/data-taxonomy15-catalog-only-trust-intake"]
    paths:
      - "supabase/migrations/20260915154500_data_taxonomy15_catalog_only_trust_intake_bridge_v1.sql"
      - "tests/fixtures/data-taxonomy15-catalog-only-trust-intake/**"
      - "scripts/product-evidence/verify-data-taxonomy15-catalog-only-trust-intake-v1.mjs"
      - ".github/workflows/data-taxonomy15-catalog-only-trust-intake.yml"

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  verify:
    name: Catalog-only TRUST intake compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"

      - name: Verify static authority boundary
        run: node scripts/product-evidence/verify-data-taxonomy15-catalog-only-trust-intake-v1.mjs

      - name: Prepare isolated Supabase runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="${RUNNER_TEMP}/data-taxonomy15-runtime"
          echo "DATA_TAXONOMY15_RUNTIME_DIR=${runtime_dir}" >>"${GITHUB_ENV}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" init --workdir "${runtime_dir}" --force
          migration_dir="${runtime_dir}/supabase/migrations"
          mkdir -p "${migration_dir}"
          cp tests/fixtures/data-taxonomy15-catalog-only-trust-intake/20260915154000_data_taxonomy15_catalog_only_trust_intake_fixture.sql \
            "${migration_dir}/20260915154000_data_taxonomy15_catalog_only_trust_intake_fixture.sql"
          cp supabase/migrations/20260915154500_data_taxonomy15_catalog_only_trust_intake_bridge_v1.sql \
            "${migration_dir}/20260915154500_data_taxonomy15_catalog_only_trust_intake_bridge_v1.sql"
          cp tests/fixtures/data-taxonomy15-catalog-only-trust-intake/verify_data_taxonomy15_catalog_only_trust_intake_runtime.sql \
            "${migration_dir}/20260915154600_verify_data_taxonomy15_catalog_only_trust_intake_runtime.sql"

      - name: Start and verify isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          start_log="${RUNNER_TEMP}/data-taxonomy15-start.log"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" start \
            --workdir "${DATA_TAXONOMY15_RUNTIME_DIR}" \
            --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            >"${start_log}" 2>&1; then
            sed -E 's#(sb_(publishable|secret)_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+|postgresql://[^[:space:]]+)#[REDACTED]#g' "${start_log}" >&2
            exit 1
          fi
          rm -f "${start_log}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --workdir "${DATA_TAXONOMY15_RUNTIME_DIR}"

      - name: Check exact-head diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          git diff --check HEAD^

      - name: Stop isolated Supabase
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [[ -n "${DATA_TAXONOMY15_RUNTIME_DIR:-}" ]]; then
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --workdir "${DATA_TAXONOMY15_RUNTIME_DIR}" --no-backup || true
          fi
