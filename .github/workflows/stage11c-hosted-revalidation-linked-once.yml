name: Stage 11C Hosted Existing-Deployment Probe Once

on:
  pull_request:
    types: [edited]
    branches:
      - codex/candidate-exposure-policy-shadow-runtime

permissions:
  contents: read

jobs:
  hosted-probe:
    if: github.event.pull_request.head.ref == 'codex/candidate-exposure-policy-shadow-evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_xuYA9OhCWlJETaYFOmeVodgS
      VERCEL_PROJECT_ID: prj_VHh3BMegmXFGwxgOJLlgFQjksmKA
      HEAD_SHA: 3d697efd3b7b90137c68e988d42487c7a58a92a2
      DEFAULT_DEPLOYMENT_ID: dpl_FBndGs9izVGgC32FUoRLJngcm5Dh
      DEFAULT_DEPLOYMENT_URL: https://k-beauty-36a69u14b-johnny-self.vercel.app
      SHADOW_DEPLOYMENT_ID: dpl_GGCBUfuwjAD52oF6pJiaSNhwApHy
      SHADOW_DEPLOYMENT_URL: https://k-beauty-euj8399kp-johnny-self.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d697efd3b7b90137c68e988d42487c7a58a92a2
          fetch-depth: 1

      - name: Require Vercel authority and verify exact deployments
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          token = os.environ['VERCEL_TOKEN']
          team = os.environ['VERCEL_ORG_ID']
          expected_sha = os.environ['HEAD_SHA']
          headers = {'Authorization': f'Bearer {token}'}
          deployments = {
              'off': (os.environ['DEFAULT_DEPLOYMENT_ID'], os.environ['DEFAULT_DEPLOYMENT_URL']),
              'on': (os.environ['SHADOW_DEPLOYMENT_ID'], os.environ['SHADOW_DEPLOYMENT_URL']),
          }
          for mode, (deployment_id, deployment_url) in deployments.items():
              endpoint = 'https://api.vercel.com/v13/deployments/' + urllib.parse.quote(
                  deployment_id, safe=''
              ) + '?' + urllib.parse.urlencode({'teamId': team})
              request = urllib.request.Request(endpoint, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  deployment = json.load(response)
              state = deployment.get('readyState') or deployment.get('state')
              target = deployment.get('target')
              actual_sha = deployment.get('meta', {}).get('githubCommitSha')
              if state != 'READY':
                  raise SystemExit(f'{mode}_deployment_not_ready')
              if target is not None:
                  raise SystemExit(f'{mode}_deployment_not_preview')
              if actual_sha != expected_sha:
                  raise SystemExit(f'{mode}_deployment_sha_mismatch')
              if mode == 'on' and deployment.get('meta', {}).get('actor') != 'codex-stage11c-linked':
                  raise SystemExit('shadow_deployment_actor_mismatch')
              with open(f'{"default" if mode == "off" else "shadow"}-deployment.json', 'w') as handle:
                  json.dump({'id': deployment_id, 'url': deployment_url, 'sha': actual_sha}, handle)
          print(json.dumps({
              'implementationSha': expected_sha,
              'defaultDeploymentId': deployments['off'][0],
              'shadowDeploymentId': deployments['on'][0],
              'readyPreviewCount': 2,
          }, indent=2))
          PY

      - name: Extract canonical four-call probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/stage11c-hosted-revalidation-once.yml').read_text().splitlines()
          step_name = 'Run four exact-SHA Hosted probes and build aggregate evidence'
          start = next(i for i, line in enumerate(source) if line.strip() == f'- name: {step_name}')
          run_line = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'run: |')
          body = []
          for line in source[run_line + 1:]:
              if line.startswith('      - name:'):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/stage11c-probe.sh').write_text('\n'.join(body).rstrip() + '\n')
          PY
          bash -n /tmp/stage11c-probe.sh

      - name: Run exactly four KO/EN off/on probes
        shell: bash
        run: bash /tmp/stage11c-probe.sh

      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage11c-hosted-existing-deployment-probe
          path: stage11c-hosted-revalidation-aggregate.json
          if-no-files-found: warn
          retention-days: 1
