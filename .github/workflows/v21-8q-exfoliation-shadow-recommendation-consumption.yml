name: V2.1-8Q Exfoliation Shadow Recommendation Consumption

on:
  pull_request:
    paths:
      - ".github/workflows/v21-8q-exfoliation-shadow-recommendation-consumption.yml"
      - "docs/evidence/exfoliation-non-numeric-pda-shadow-recommendation-consumption-audit-v1.md"
      - "evidence/product-decision-axis-non-numeric-shadow-v1/**"
      - "scripts/product-evidence/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/v21-8q-exfoliation-shadow-recommendation-consumption.yml"
      - "docs/evidence/exfoliation-non-numeric-pda-shadow-recommendation-consumption-audit-v1.md"
      - "evidence/product-decision-axis-non-numeric-shadow-v1/**"
      - "scripts/product-evidence/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v21-8q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replay V2.1-8J
        run: node scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs
      - name: Replay V2.1-8K
        run: node scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs
      - name: Replay V2.1-8L
        run: node scripts/product-evidence/verify-exfoliation-load-anchor-contract-v1.mjs
      - name: Replay V2.1-8M
        run: node scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs
      - name: Replay V2.1-8N
        run: node scripts/product-evidence/verify-exfoliation-load-calibration-feasibility-reassessment-v1.mjs
      - name: Replay V2.1-8O
        run: node scripts/product-evidence/verify-exfoliation-non-numeric-pda-contract-v1.mjs
      - name: Replay V2.1-8P
        run: node scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs
      - name: Verify V2.1-8Q
        run: node scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumption-v1.mjs
