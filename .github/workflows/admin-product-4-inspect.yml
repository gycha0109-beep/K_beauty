name: ADMIN PRODUCT 4 Exact Head Validation

on:
  push:
    branches:
      - automation/admin-product-4-inspect

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: admin-product-4-precommit-validation
  cancel-in-progress: true

jobs:
  validate-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      BASE_SHA: e174f80f79fa9ce5d62c742f440c9e18e602929a
      TARGET_BRANCH: feature/admin-product-review-import-ui
      SUPABASE_CLI_VERSION: 2.109.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout registered helper runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate exact feature SHA and clean helpers
        run: bash .github/scripts/admin-product-4-run-validation.sh
