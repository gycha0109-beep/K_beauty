name: ADMIN PRODUCT 4 Inspect

on:
  push:
    branches:
      - automation/admin-product-4-inspect

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: admin-product-4-precommit-validation
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BASE_SHA: e174f80f79fa9ce5d62c742f440c9e18e602929a
      BASE_BRANCH: feature/admin-product-review-import-confirm
      TARGET_BRANCH: feature/admin-product-review-import-ui
      SUPABASE_CLI_VERSION: 2.109.1
      ADMIN_PRODUCT_REVIEW_IMPORT_RUNTIME_DIR: ${{ runner.temp }}/admin-product-review-import-ui-precommit
      REVIEW_IMPORT_PACKAGE_DIR: data/review-batches/admin-product-review-import-ui-precommit
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: automation/admin-product-4-inspect
          fetch-depth: 20
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate implementation and create local commit
        run: bash .github/scripts/admin-product-4-run-validation.sh
