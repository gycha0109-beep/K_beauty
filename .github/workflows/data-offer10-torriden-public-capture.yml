name: DATA-OFFER10 Torriden Public Capture

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/server/torriden-public-listing-capture-v1.js"
      - "scripts/capture-torriden-public-listing-v1.mjs"
      - "scripts/verify-torriden-public-listing-capture-v1.mjs"
      - "scripts/verify-torriden-public-capture-attempt-artifact-v1.mjs"
      - "scripts/verify-current-main-health.mjs"
      - ".github/workflows/data-offer10-torriden-public-capture.yml"
  push:
    branches: [main]
    paths:
      - "lib/server/torriden-public-listing-capture-v1.js"
      - "scripts/capture-torriden-public-listing-v1.mjs"
      - "scripts/verify-torriden-public-listing-capture-v1.mjs"
      - "scripts/verify-torriden-public-capture-attempt-artifact-v1.mjs"
      - "scripts/verify-current-main-health.mjs"
      - ".github/workflows/data-offer10-torriden-public-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-capture:
    name: DATA-OFFER10 Torriden Public Capture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Attest exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          printf 'DATA_OFFER10_EXACT_HEAD=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify bounded capture policy
        run: |
          node scripts/verify-torriden-public-listing-capture-v1.mjs
          node --check lib/server/torriden-public-listing-capture-v1.js
          node --check scripts/capture-torriden-public-listing-v1.mjs
          node --check scripts/verify-torriden-public-listing-capture-v1.mjs
          node --check scripts/verify-torriden-public-capture-attempt-artifact-v1.mjs

      - name: Attempt one public Torriden listing
        run: node scripts/capture-torriden-public-listing-v1.mjs --output-dir="${RUNNER_TEMP}/torriden-public-capture"

      - name: Verify live attempt artifact
        run: node scripts/verify-torriden-public-capture-attempt-artifact-v1.mjs --input-dir="${RUNNER_TEMP}/torriden-public-capture"

      - name: Upload immutable capture evidence
        uses: actions/upload-artifact@v4
        with:
          name: data-offer10-torriden-public-capture-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/torriden-public-capture
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Check exact-head and diff hygiene
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse "${HEAD_SHA}^")"
          fi
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --check "${base}...${HEAD_SHA}"
