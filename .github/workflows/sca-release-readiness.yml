name: BEJEWELY SCA Release Readiness (no upload)
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.watchtower_track != '' && format('[WT:{0}] {1}', inputs.watchtower_track, github.workflow) || github.workflow }}
on:
  pull_request:
    branches: [main, fix/security/sca-b3-private-pack-validation-20261014, fix/security/sca-b6-release-readiness-20261014]
    paths:
      - scripts/security/*sca-release*
      - scripts/security/sca-release-*
      - scripts/security/run-sca-b6-*
      - scripts/security/sca-readiness-*.mjs
      - scripts/security/sca-audit-root-causes*.mjs
      - scripts/security/run-sca-readiness-evidence.mjs
      - docs/security/sec-sca-20261013-private-patch-distribution-roadmap.md
      - scripts/security/run-sca-b3-forge-browser-dist-rebuild-probe.mjs
      - security/release/**
      - .github/workflows/sca-release-readiness.yml
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string
permissions:
  contents: read
  security-events: write
concurrency:
  group: sca-release-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  admission-tests:
    name: Offline release admission and negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: node --test scripts/security/sca-release-bundle.test.mjs scripts/security/sca-readiness-evidence.test.mjs scripts/security/sca-audit-root-causes.test.mjs
  candidate:
    name: Clean release candidate structure (not approval)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.candidate.outputs.b6_candidate_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Attest exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install canonical Main Health crawler toolchain
        run: npm --prefix crawler ci --ignore-scripts --no-audit --no-fund
      - name: Main Health on exact release preparation HEAD
        run: node scripts/verify-current-main-health.mjs
      - id: candidate
        env:
          SCA_B6_VERIFY_CANDIDATE: '1'
        run: node scripts/security/run-sca-b3-forge-browser-dist-rebuild-probe.mjs
      - run: git diff --exit-code -- package.json package-lock.json apps/mobile/package.json
  independent-candidate:
    name: Independent clean release candidate digest replay
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - env:
          SCA_B6_VERIFY_CANDIDATE: '1'
          SCA_B6_EXPECTED_CANDIDATE_SHA256: ${{ needs.candidate.outputs.digest }}
        run: |
          test -n "$SCA_B6_EXPECTED_CANDIDATE_SHA256"
          node scripts/security/run-sca-b3-forge-browser-dist-rebuild-probe.mjs
      - run: git diff --exit-code -- package.json package-lock.json apps/mobile/package.json
  original-security-gate:
    name: Original security gate (unresolved advisories remain FAIL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-supply-chain-audit.mjs
      - name: Capture exact HEAD raw full and production audit evidence (not a waiver)
        if: ${{ always() }}
        env:
          SCA_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/security/run-sca-readiness-evidence.mjs
      - name: Upload separate diagnostic evidence even when mandatory audit fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: bejewely-sca-readiness-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: .sca-readiness-evidence/*.json

  codeql:
    name: CodeQL release preparation code
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
