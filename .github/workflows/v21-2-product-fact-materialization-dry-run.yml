name: V21-2 Product Fact Materialization Dry-run

on:
  workflow_dispatch:
  push:
    branches:
      - research/product-fact-cross-category-materialization-dry-run-v1
    paths:
      - .github/workflows/v21-2-product-fact-materialization-dry-run.yml
      - scripts/build-product-fact-cross-category-materialization-dry-run-v1.mjs
      - scripts/verify-product-fact-cross-category-materialization-dry-run-v1.mjs

permissions:
  contents: write

concurrency:
  group: v21-2-product-fact-materialization-dry-run
  cancel-in-progress: false

env:
  BASE_MAIN_SHA: e75ae83f3cc8b682fa7cc7dfb38edf983d2aa68f
  OLD_MAIN_SHA: 22c20146192e9075c9d9cb36be7e5f49f83d3119
  OLD_V21_2_HEAD: 62b5494d037a67d350ad44531a98e3a27a3ca768
  PILOT_HEAD: 596493154b74548187ed71f8d522bb41c7ad1900
  BRANCH_NAME: research/product-fact-cross-category-materialization-dry-run-v1
  OUT_JSON: evidence/product-fact-materialization-v1/cross-category-pilot-materialization-dry-run-v1.json
  OUT_MD: docs/evidence/cross-category-pilot-materialization-dry-run-v1.md

jobs:
  verify-and-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH_NAME }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reconcile V2.1-2 builder authority in runner checkout
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const p="scripts/build-product-fact-cross-category-materialization-dry-run-v1.mjs";
          const oldSha=process.env.OLD_MAIN_SHA;
          const newSha=process.env.BASE_MAIN_SHA;
          let s=fs.readFileSync(p,"utf8");
          const oldCount=s.split(oldSha).length-1;
          const newCount=s.split(newSha).length-1;
          if(oldCount===1){
            s=s.replace(oldSha,newSha);
            fs.writeFileSync(p,s);
            console.log("builder_authority_reconciled=YES");
          }else if(oldCount===0 && newCount===1){
            console.log("builder_authority_already_reconciled=YES");
          }else{
            throw new Error(`unexpected builder authority refs old=${oldCount} new=${newCount}`);
          }
          NODE

      - name: Freeze current-main authority and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/v21-2-main
          current_main="$(git rev-parse refs/remotes/origin/v21-2-main)"
          test "${current_main}" = "${BASE_MAIN_SHA}"
          git merge-base --is-ancestor "${BASE_MAIN_SHA}" HEAD
          test "$(git rev-parse "${BASE_MAIN_SHA}:evidence/product-evidence-decision-axis-v1/cross-category-registry-v1.json")" = 32fdaa2d3a181c9d18888fc48c1343e083ad20f7
          test "$(git rev-parse "${BASE_MAIN_SHA}:evidence/product-evidence-decision-axis-v1/cross-category-real-evidence-pilot-v1.json")" = c68e26daf3d3295c9f669362851383dd9997c21c
          test "$(git rev-parse "${BASE_MAIN_SHA}:evidence/product-evidence-decision-axis-v1/cross-category-real-fact-mapping-pilot-v1.json")" = 20d211c70f6ba44ca4f9205942cb5e0387d74b7e
          test "$(git rev-parse "${BASE_MAIN_SHA}:evidence/product-evidence-decision-axis-v1/cross-category-real-pilot-gap-report-v1.json")" = 60b53f49cbac2021a47e50f4e1a0a79760ab7874
          test "$(git rev-parse "${BASE_MAIN_SHA}:scripts/verify-cross-category-real-evidence-pilot-v1.mjs")" = 9056eb4b95e46e6afc58158da50d5c6c27e579a9
          test "$(git rev-parse "${BASE_MAIN_SHA}:supabase/migrations/20260809115932_product_fact_storage_v1.sql")" = 676afbc56bf90443a1198f93427382f067d19407
          test "$(git rev-parse "${BASE_MAIN_SHA}:supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql")" = 03523a01322170e6b0fca2ff4cc77b8be581f19e
          test "$(git rev-parse "${BASE_MAIN_SHA}:supabase/migrations/20260810174410_product_fact_subject_registration_v1.sql")" = a08651d4ea5825e33f2dc94fe98c5b7643d32532
          test "$(git rev-parse "${BASE_MAIN_SHA}:docs/architecture/candidate-policy-main-integration-blob-manifest-v1.json")" = 37d60570f5a79cbc0baad114cfc1f7b4ca9e7440
          test -z "$(git diff --name-only "${BASE_MAIN_SHA}" HEAD -- \
            evidence/product-evidence-decision-axis-v1 \
            supabase/migrations \
            scripts/product-evidence \
            scripts/verify-cross-category-real-evidence-pilot-v1.mjs \
            app components)"
          printf 'current_main=%s\nbranch_head=%s\n' "${current_main}" "$(git rev-parse HEAD)" | tee /tmp/v21-2-authority.txt

      - name: Verify frozen file SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum evidence/product-evidence-decision-axis-v1/cross-category-real-evidence-pilot-v1.json | awk '{print $1}')" = 47457c0242451a35305fd8eceba0ebb7e210eb9ee2e73134ccf41696d18e517d
          test "$(sha256sum evidence/product-evidence-decision-axis-v1/cross-category-real-fact-mapping-pilot-v1.json | awk '{print $1}')" = c746c5d02f654ed7f0a8e8385611ac65ca30b9c4648fa4c6454ac863e7c9314f
          test "$(sha256sum evidence/product-evidence-decision-axis-v1/cross-category-real-pilot-gap-report-v1.json | awk '{print $1}')" = 5a4580d76cca62d90a3ac306744054c507a6d5e45b0b91a41dffb3b754980215

      - name: Replay historical frozen pilot verifier in detached worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v21-2-pilot
          git worktree add --detach /tmp/v21-2-pilot "${PILOT_HEAD}"
          (
            cd /tmp/v21-2-pilot
            node scripts/verify-cross-category-real-evidence-pilot-v1.mjs
          ) | tee /tmp/v21-2-historical-verifier.txt
          grep -q 'PASS verify-cross-category-real-evidence-pilot-v1' /tmp/v21-2-historical-verifier.txt
          grep -q 'assertions=547' /tmp/v21-2-historical-verifier.txt
          grep -q 'measurement_evidence_count=0' /tmp/v21-2-historical-verifier.txt
          grep -q 'forced_mapping_count=0' /tmp/v21-2-historical-verifier.txt
          git worktree remove --force /tmp/v21-2-pilot

      - name: Syntax check tooling
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/build-product-fact-cross-category-materialization-dry-run-v1.mjs
          node --check scripts/verify-product-fact-cross-category-materialization-dry-run-v1.mjs

      - name: Build A
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-product-fact-cross-category-materialization-dry-run-v1.mjs | tee /tmp/v21-2-build-a.txt
          sha256sum "${OUT_JSON}" | tee /tmp/v21-2-hash-a.txt
          sha256sum "${OUT_MD}" | tee /tmp/v21-2-doc-hash-a.txt
          cp "${OUT_JSON}" /tmp/v21-2-output-a.json
          cp "${OUT_MD}" /tmp/v21-2-output-a.md

      - name: Build B and require byte-identical outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${OUT_JSON}" "${OUT_MD}"
          node scripts/build-product-fact-cross-category-materialization-dry-run-v1.mjs | tee /tmp/v21-2-build-b.txt
          sha256sum "${OUT_JSON}" | tee /tmp/v21-2-hash-b.txt
          sha256sum "${OUT_MD}" | tee /tmp/v21-2-doc-hash-b.txt
          cmp -s /tmp/v21-2-output-a.json "${OUT_JSON}"
          cmp -s /tmp/v21-2-output-a.md "${OUT_MD}"
          test "$(awk '{print $1}' /tmp/v21-2-hash-a.txt)" = "$(awk '{print $1}' /tmp/v21-2-hash-b.txt)"
          test "$(awk '{print $1}' /tmp/v21-2-doc-hash-a.txt)" = "$(awk '{print $1}' /tmp/v21-2-doc-hash-b.txt)"

      - name: Verify current-main semantic carry-forward
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${OLD_V21_2_HEAD}:${OUT_JSON}")" = 5325824c378ce6262de34a686500912646ad927e
          test "$(git rev-parse "${OLD_V21_2_HEAD}:${OUT_MD}")" = e347720661ace2ce427a7260090f89b5ef60667f
          git show "${OLD_V21_2_HEAD}:${OUT_JSON}" > /tmp/v21-2-old.json
          git show "${OLD_V21_2_HEAD}:${OUT_MD}" > /tmp/v21-2-old.md
          git grep -n "${OLD_MAIN_SHA}" "${OLD_V21_2_HEAD}" -- \
            '.github/workflows/v21-2-product-fact-materialization-dry-run.yml' \
            'docs/evidence/cross-category-pilot-materialization-dry-run-v1.md' \
            'evidence/product-fact-materialization-v1/cross-category-pilot-materialization-dry-run-v1.json' \
            'scripts/build-product-fact-cross-category-materialization-dry-run-v1.mjs' \
            'scripts/verify-product-fact-cross-category-materialization-dry-run-v1.mjs' \
            | tee /tmp/v21-2r3-old-authority-refs.txt
          test "$(wc -l < /tmp/v21-2r3-old-authority-refs.txt | tr -d ' ')" = 4
          node --input-type=module <<'NODE' | tee /tmp/v21-2r3-semantic-carry-forward.txt
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const oldJson=JSON.parse(fs.readFileSync('/tmp/v21-2-old.json','utf8'));
          const newJson=JSON.parse(fs.readFileSync(process.env.OUT_JSON,'utf8'));
          assert.equal(oldJson.authority.current_main_sha,process.env.OLD_MAIN_SHA);
          assert.equal(newJson.authority.current_main_sha,process.env.BASE_MAIN_SHA);
          oldJson.authority.current_main_sha='<MAIN>';
          newJson.authority.current_main_sha='<MAIN>';
          assert.deepStrictEqual(newJson,oldJson);
          const normalizeMd=(s)=>{
            let hits=0;
            const lines=s.split('\n').map(line=>{
              if(line.startsWith('- execution authority main: `')){
                hits++;
                return '- execution authority main: `<MAIN>`';
              }
              return line;
            });
            assert.equal(hits,1);
            return lines.join('\n');
          };
          const oldMd=normalizeMd(fs.readFileSync('/tmp/v21-2-old.md','utf8'));
          const newMd=normalizeMd(fs.readFileSync(process.env.OUT_MD,'utf8'));
          assert.equal(newMd,oldMd);
          console.log('json_semantic_normalized_equality=PASS');
          console.log('md_authority_line_normalized_equality=PASS');
          NODE
          printf 'old_json_sha256=%s\nnew_json_a_sha256=%s\nnew_json_b_sha256=%s\nold_md_sha256=%s\nnew_md_a_sha256=%s\nnew_md_b_sha256=%s\n' \
            "$(sha256sum /tmp/v21-2-old.json | awk '{print $1}')" \
            "$(awk '{print $1}' /tmp/v21-2-hash-a.txt)" \
            "$(awk '{print $1}' /tmp/v21-2-hash-b.txt)" \
            "$(sha256sum /tmp/v21-2-old.md | awk '{print $1}')" \
            "$(awk '{print $1}' /tmp/v21-2-doc-hash-a.txt)" \
            "$(awk '{print $1}' /tmp/v21-2-doc-hash-b.txt)" \
            | tee -a /tmp/v21-2r3-semantic-carry-forward.txt

      - name: Verify materialization contract and negative mutations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-product-fact-cross-category-materialization-dry-run-v1.mjs | tee /tmp/v21-2-verifier.txt
          grep -q 'assertions=5813' /tmp/v21-2-verifier.txt
          grep -q 'negative_mutations=12' /tmp/v21-2-verifier.txt
          grep -q 'forced_mapping=0' /tmp/v21-2-verifier.txt
          grep -q 'hosted_writes=0' /tmp/v21-2-verifier.txt

      - name: Freeze generated outputs on research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            'scripts/build-product-fact-cross-category-materialization-dry-run-v1.mjs' \
            "${OUT_JSON}" \
            "${OUT_MD}"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Generated outputs already frozen.'
          else
            git commit -m 'research(storage): freeze V2.1-2 current-main authority carry-forward'
            git push origin "HEAD:${BRANCH_NAME}"
          fi
          git diff --check "${BASE_MAIN_SHA}" HEAD
          changed="$(git diff --name-only "${BASE_MAIN_SHA}" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v21-2-product-fact-materialization-dry-run.yml' \
            'docs/evidence/cross-category-pilot-materialization-dry-run-v1.md' \
            'evidence/product-fact-materialization-v1/cross-category-pilot-materialization-dry-run-v1.json' \
            'scripts/build-product-fact-cross-category-materialization-dry-run-v1.mjs' \
            'scripts/verify-product-fact-cross-category-materialization-dry-run-v1.mjs' | LC_ALL=C sort)"
          test "${changed}" = "${expected}"
          printf '%s\n' "${changed}" | tee /tmp/v21-2-final-diff.txt
          printf 'final_branch_head=%s\n' "$(git rev-parse HEAD)" | tee /tmp/v21-2-final-head.txt

      - name: Upload deterministic evidence
        uses: actions/upload-artifact@v4
        with:
          name: v21-2-materialization-dry-run-evidence
          retention-days: 90
          path: |
            /tmp/v21-2-authority.txt
            /tmp/v21-2-historical-verifier.txt
            /tmp/v21-2-build-a.txt
            /tmp/v21-2-build-b.txt
            /tmp/v21-2-hash-a.txt
            /tmp/v21-2-hash-b.txt
            /tmp/v21-2-doc-hash-a.txt
            /tmp/v21-2-doc-hash-b.txt
            /tmp/v21-2-verifier.txt
            /tmp/v21-2-final-diff.txt
            /tmp/v21-2-final-head.txt
            /tmp/v21-2r3-old-authority-refs.txt
            /tmp/v21-2r3-semantic-carry-forward.txt
            evidence/product-fact-materialization-v1/cross-category-pilot-materialization-dry-run-v1.json
            docs/evidence/cross-category-pilot-materialization-dry-run-v1.md

# V2.1-2R3 exact-head replay marker