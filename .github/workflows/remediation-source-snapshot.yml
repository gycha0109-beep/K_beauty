name: Remediation source snapshot

on:
  pull_request:
    branches:
      - feature/premium-beta-flow
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=remediation-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: remediation-source
          path: remediation-source.zip
          retention-days: 1
