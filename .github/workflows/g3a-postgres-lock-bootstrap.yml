name: G3A Postgres Lock Bootstrap

on:
  push:
    branches:
      - admission/g3a-cont-pf-authority-read
    paths:
      - .github/workflows/g3a-postgres-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admission/g3a-cont-pf-authority-read
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate exact dependency lock
        run: npm install postgres@3.4.9 --save-exact --package-lock-only --ignore-scripts
      - name: Commit lock only if changed
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "chore(g3a): add postgres runtime dependency"
          git push origin HEAD:admission/g3a-cont-pf-authority-read
