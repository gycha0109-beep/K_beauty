name: Admin Product Current Main Integration

on:
  pull_request:
    branches:
      - main
      - integration/admin-product-current-main
    paths:
      - "app/admin/**"
      - "app/api/admin/product-reviews/**"
      - "crawler/**"
      - "lib/admin/**"
      - "supabase/migrations/*_admin_product_*.sql"
      - "tests/fixtures/admin-product-review*/**"
      - "tests/fixtures/product-review-export-intake/**"
      - "scripts/verify-admin-product-*.mjs"
      - "scripts/run-security-closeout-verifier-suite.mjs"
      - "docs/architecture/*product-review*.md"
      - "docs/reports/admin-product-current-main-integration.md"
      - "next.config.js"
      - "package.json"
      - "crawler/package.json"
      - ".github/workflows/admin-product-current-main-integration.yml"
  push:
    branches:
      - integration/admin-product-current-main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  contracts-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "checkout_sha=${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_HEAD_SHA}"

      - name: Fetch durable Admin base
        run: git fetch origin integration/admin-product-current-main:refs/remotes/origin/integration/admin-product-current-main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install crawler dependencies
        working-directory: crawler
        run: npm ci --no-audit --no-fund

      - name: Verify current-main integration contract
        run: npm run verify:admin-product-current-main-integration

      - name: Verify admin product contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:admin-access-foundation
          npm run verify:admin-product-candidate-reviews
          npm run verify:admin-product-review-import-confirm
          npm run verify:admin-product-review-import-ui
          npm run verify:admin-product-review-import-routes
          if [[ -f scripts/verify-admin-product-review-cleanser-metadata-v2.mjs ]]; then
            node scripts/verify-admin-product-review-cleanser-metadata-v2.mjs
          fi

      - name: Verify crawler contracts
        working-directory: crawler
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run verify:product-review-export
          npm run verify:product-review-intake-dry-run
          npm run verify:product-review-intake-bytes
          npm run verify:product-review-intake-confirm
          if [[ -f tests/verify-cleanser-metadata-v2-contract.ts ]]; then
            npm run verify:product-review-cleanser-metadata-v2
          fi

      - name: Verify security closeout
        run: node scripts/run-security-closeout-verifier-suite.mjs

      - name: Verify architecture boundaries
        run: npm run architecture:guard

      - name: Build production application
        run: npm run build

      - name: Check exact-head and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
            git diff --check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
            git diff --check origin/integration/admin-product-current-main..HEAD
          fi

  isolated-confirm-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REVIEW_IMPORT_BATCH_DIR: tmp/admin-product-current-main-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "checkout_sha=${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_HEAD_SHA}"

      - name: Initialize isolated runtime path
        shell: bash
        env:
          REVIEW_IMPORT_RUNTIME_DIR: ${{ runner.temp }}/admin-product-current-main-runtime
        run: echo "REVIEW_IMPORT_RUNTIME_DIR=${REVIEW_IMPORT_RUNTIME_DIR}" >>"${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install crawler dependencies
        working-directory: crawler
        run: npm ci --no-audit --no-fund

      - name: Prepare isolated Supabase project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" init --workdir "${REVIEW_IMPORT_RUNTIME_DIR}" --force
          mkdir -p "${REVIEW_IMPORT_RUNTIME_DIR}/supabase/migrations"
          cp tests/fixtures/admin-product-reviews/20260730140000_product_review_foundation.sql "${REVIEW_IMPORT_RUNTIME_DIR}/supabase/migrations/"
          cp supabase/migrations/*_admin_access_foundation.sql "${REVIEW_IMPORT_RUNTIME_DIR}/supabase/migrations/"
          cp supabase/migrations/20260804233000_admin_product_candidate_reviews.sql "${REVIEW_IMPORT_RUNTIME_DIR}/supabase/migrations/"
          cp supabase/migrations/20260804233100_admin_product_candidate_reviews_hardening.sql "${REVIEW_IMPORT_RUNTIME_DIR}/supabase/migrations/"
          cp supabase/migrations/20260804233200_admin_product_candidate_reviews_security_hardening.sql "${REVIEW_IMPORT_RUNTIME_DIR}/supabase/migrations/"
          cp tests/fixtures/product-review-export-intake/20260731170000_product_review_export_intake_fixture.sql "${REVIEW_IMPORT_RUNTIME_DIR}/supabase/migrations/"
          cp supabase/migrations/20260804233300_admin_product_review_import_confirm.sql "${REVIEW_IMPORT_RUNTIME_DIR}/supabase/migrations/"
          cp tests/fixtures/admin-product-review-import/20260731190000_review_import_runtime_seed.sql "${REVIEW_IMPORT_RUNTIME_DIR}/supabase/migrations/"

      - name: Start and reset isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          start_log="${RUNNER_TEMP}/admin-product-current-main-start.log"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" start \
            --workdir "${REVIEW_IMPORT_RUNTIME_DIR}" \
            --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            >"${start_log}" 2>&1; then
            sed -E 's#(sb_(publishable|secret)_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+|postgresql://[^[:space:]]+)#[REDACTED]#g' "${start_log}" >&2
            exit 1
          fi
          rm -f "${start_log}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --workdir "${REVIEW_IMPORT_RUNTIME_DIR}"

      - name: Export, dry-run, and confirm isolated v1 batch
        shell: bash
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/admin-product-current-main.env"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" status --workdir "${REVIEW_IMPORT_RUNTIME_DIR}" -o env >"${env_file}"
          anon_key="$(grep '^ANON_KEY=' "${env_file}" | cut -d= -f2- | tr -d '\"')"
          service_key="$(grep '^SERVICE_ROLE_KEY=' "${env_file}" | cut -d= -f2- | tr -d '\"')"
          echo "::add-mask::${anon_key}"
          echo "::add-mask::${service_key}"
          set -a
          source "${env_file}"
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="${API_URL}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}"
          rm -f "${env_file}"
          (
            cd crawler
            npm run reviews:export -- --status queued --out-dir "${REVIEW_IMPORT_BATCH_DIR}" --limit 5
            npx tsx tests/prepare-reviewed-intake-local-fixture.ts "${REVIEW_IMPORT_BATCH_DIR}"
            npm run reviews:import-reviewed -- --file "${REVIEW_IMPORT_BATCH_DIR}/reviewed.csv" --dry-run
            npm run verify:product-review-intake-confirm:local-runtime -- \
              "${REVIEW_IMPORT_BATCH_DIR}/reviewed.csv" \
              "30000000-0000-4000-8000-000000000001" \
              "30000000-0000-4000-8000-000000000003" \
              "integration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          )

      - name: Stop isolated Supabase and clean v1 fixtures
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [[ -d "${REVIEW_IMPORT_RUNTIME_DIR}/supabase" ]]; then
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --workdir "${REVIEW_IMPORT_RUNTIME_DIR}" --no-backup
          fi
          rm -rf -- "${REVIEW_IMPORT_RUNTIME_DIR}" "${REVIEW_IMPORT_BATCH_DIR}"

  isolated-v2-runtime:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      REVIEW_V2_BATCH_ROOT: tmp/admin-product-v2-${{ github.run_id }}-${{ github.run_attempt }}
      REVIEW_V2_EXPORT_BATCH_ID: 70000000-0000-4000-8000-000000000001
      REVIEW_V2_EXPORTED_AT: 2026-08-05T12:00:00.000Z
      REVIEW_V2_REVIEWED_AT: 2026-08-05T12:05:00.000Z
      REVIEW_V2_ACTOR_ID: 30000000-0000-4000-8000-000000000001
      REVIEW_V2_VIEWER_ID: 30000000-0000-4000-8000-000000000003
      REVIEW_V2_REQUEST_ID: 71000000-0000-4000-8000-000000000001
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "checkout_sha=${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_HEAD_SHA}"

      - name: Initialize isolated runtime path
        shell: bash
        run: echo "REVIEW_V2_RUNTIME_DIR=${RUNNER_TEMP}/admin-product-v2-runtime" >>"${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install crawler dependencies
        working-directory: crawler
        run: npm ci --no-audit --no-fund

      - name: Prepare isolated v2 migration chain
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" init --workdir "${REVIEW_V2_RUNTIME_DIR}" --force
          migration_dir="${REVIEW_V2_RUNTIME_DIR}/supabase/migrations"
          mkdir -p "${migration_dir}"
          cp tests/fixtures/admin-product-reviews/20260730140000_product_review_foundation.sql "${migration_dir}/"
          cp supabase/migrations/*_admin_access_foundation.sql "${migration_dir}/"
          cp supabase/migrations/20260804233000_admin_product_candidate_reviews.sql "${migration_dir}/"
          cp supabase/migrations/20260804233100_admin_product_candidate_reviews_hardening.sql "${migration_dir}/"
          cp supabase/migrations/20260804233200_admin_product_candidate_reviews_security_hardening.sql "${migration_dir}/"
          cp supabase/migrations/20260804233300_admin_product_review_import_confirm.sql "${migration_dir}/"
          cp tests/fixtures/admin-product-review-v2/20260805215900_product_review_v2_column_adapter.sql "${migration_dir}/"
          cp supabase/migrations/20260805220000_admin_product_review_cleanser_metadata_v2.sql "${migration_dir}/"
          cp supabase/migrations/20260805220005_admin_product_review_cleanser_metadata_v2_validate.sql "${migration_dir}/"
          cp supabase/migrations/20260805220010_admin_product_review_cleanser_metadata_v2_confirm.sql "${migration_dir}/"
          cp tests/fixtures/admin-product-review-import/20260731190000_review_import_runtime_seed.sql "${migration_dir}/"
          cp tests/fixtures/admin-product-review-v2/20260805220100_product_review_v2_runtime_seed.sql "${migration_dir}/"
          cp tests/fixtures/admin-product-review-v2/20260805220200_product_review_v2_rollback_probe.sql "${migration_dir}/"

      - name: Start isolated v2 Supabase
        shell: bash
        run: |
          set -euo pipefail
          start_log="${RUNNER_TEMP}/admin-product-v2-start.log"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" start \
            --workdir "${REVIEW_V2_RUNTIME_DIR}" \
            --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            >"${start_log}" 2>&1; then
            sed -E 's#(sb_(publishable|secret)_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+|postgresql://[^[:space:]]+)#[REDACTED]#g' "${start_log}" >&2
            exit 1
          fi
          rm -f "${start_log}"
          env_file="${RUNNER_TEMP}/admin-product-v2.env"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" status --workdir "${REVIEW_V2_RUNTIME_DIR}" -o env >"${env_file}"
          api_url="$(grep '^API_URL=' "${env_file}" | cut -d= -f2- | tr -d '\"')"
          anon_key="$(grep '^ANON_KEY=' "${env_file}" | cut -d= -f2- | tr -d '\"')"
          service_key="$(grep '^SERVICE_ROLE_KEY=' "${env_file}" | cut -d= -f2- | tr -d '\"')"
          echo "::add-mask::${anon_key}"
          echo "::add-mask::${service_key}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${api_url}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${anon_key}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${service_key}"
          } >>"${GITHUB_ENV}"
          rm -f "${env_file}"

      - name: Local Supabase v2 reset and runtime cycle 1
        shell: bash
        run: |
          set -euo pipefail
          cycle_dir="${REVIEW_V2_BATCH_ROOT}/cycle-1"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --workdir "${REVIEW_V2_RUNTIME_DIR}"
          (
            cd crawler
            npm run reviews:export-v2 -- --status queued --out-dir "${cycle_dir}" --limit 5
            npx tsx tests/prepare-cleanser-metadata-v2-local-fixture.ts "${cycle_dir}"
            npm run verify:product-review-cleanser-metadata-v2:local-runtime -- \
              "${cycle_dir}" "${REVIEW_V2_ACTOR_ID}" "${REVIEW_V2_VIEWER_ID}" "${REVIEW_V2_REQUEST_ID}"
          )
          sha256sum "${cycle_dir}/batch.json" "${cycle_dir}/manifest.csv" \
            "${cycle_dir}/evidence.jsonl" "${cycle_dir}/reviewed.csv" \
            | awk '{print $1}' >"${RUNNER_TEMP}/admin-product-v2-cycle-1.sha256"

      - name: Local Supabase v2 reset and runtime cycle 2
        shell: bash
        run: |
          set -euo pipefail
          cycle_dir="${REVIEW_V2_BATCH_ROOT}/cycle-2"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --workdir "${REVIEW_V2_RUNTIME_DIR}"
          (
            cd crawler
            npm run reviews:export-v2 -- --status queued --out-dir "${cycle_dir}" --limit 5
            npx tsx tests/prepare-cleanser-metadata-v2-local-fixture.ts "${cycle_dir}"
            npm run verify:product-review-cleanser-metadata-v2:local-runtime -- \
              "${cycle_dir}" "${REVIEW_V2_ACTOR_ID}" "${REVIEW_V2_VIEWER_ID}" "${REVIEW_V2_REQUEST_ID}"
          )
          sha256sum "${cycle_dir}/batch.json" "${cycle_dir}/manifest.csv" \
            "${cycle_dir}/evidence.jsonl" "${cycle_dir}/reviewed.csv" \
            | awk '{print $1}' >"${RUNNER_TEMP}/admin-product-v2-cycle-2.sha256"
          diff -u "${RUNNER_TEMP}/admin-product-v2-cycle-1.sha256" \
            "${RUNNER_TEMP}/admin-product-v2-cycle-2.sha256"

      - name: Stop isolated Supabase and clean v2 fixtures
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [[ -d "${REVIEW_V2_RUNTIME_DIR}/supabase" ]]; then
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --workdir "${REVIEW_V2_RUNTIME_DIR}" --no-backup
          fi
          rm -rf -- "${REVIEW_V2_RUNTIME_DIR}" "${REVIEW_V2_BATCH_ROOT}"
