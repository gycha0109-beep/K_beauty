name: V2.1-8U Exfoliation Production Consumption Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-8u-exfoliation-production-consumption-contract.yml'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-production-consumption-contract-v1.json'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-authority-precedence-matrix-v1.json'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-legacy-migration-compatibility-matrix-v1.json'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-production-consumption-canonical-examples-v1.json'
      - 'scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-consumption-contract-v1.mjs'
      - 'docs/evidence/exfoliation-non-numeric-pda-production-consumption-contract-v1.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-8u-exfoliation-production-consumption-contract.yml'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-production-consumption-contract-v1.json'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-authority-precedence-matrix-v1.json'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-legacy-migration-compatibility-matrix-v1.json'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-production-consumption-canonical-examples-v1.json'
      - 'scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-consumption-contract-v1.mjs'
      - 'docs/evidence/exfoliation-non-numeric-pda-production-consumption-contract-v1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v21-8u:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      V21_8U_BASE_MAIN_SHA: d988f33664e3086250e2595b55319aa18e127608
      FROZEN_8T_MAIN_SHA: d988f33664e3086250e2595b55319aa18e127608
      FROZEN_8S_MAIN_SHA: c3a844ff3aec6a89456aeba9e86a3479239f2974
      FROZEN_8R_MAIN_SHA: 053a963a14bf00d7deb731a2c5427a97f3172b9f
      FROZEN_8Q_MAIN_SHA: e812ee6a7eae6b98940adfe7b10471687e5cad1a
      FROZEN_8S_CONSUMER_BLOB_SHA: b2d84e79a658619371735d1086d0234b24fe58a6
      FROZEN_8T_TAXONOMY_BLOB_SHA: 1ec0699f966cbb4c0fd9c6cb8e23d29a5ff9d877
      FROZEN_8T_READINESS_BLOB_SHA: 13e7ec89d8aed4d549e816ffd3d6ce5c74391a99
      FROZEN_8P_OUTPUT_SHA256: 03d4446fd7ea1ce8dd23c44bb6c641804bd3394b4aab39db9ee0d7e021029624

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Exact authority and frozen upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$V21_8U_BASE_MAIN_SHA" HEAD
          test "$(git hash-object lib/exfoliation-non-numeric-pda-shadow-consumer.js)" = "$FROZEN_8S_CONSUMER_BLOB_SHA"
          test "$(git hash-object evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-shadow-divergence-taxonomy-v1.json)" = "$FROZEN_8T_TAXONOMY_BLOB_SHA"
          test "$(git hash-object evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-production-consumption-readiness-summary-v1.json)" = "$FROZEN_8T_READINESS_BLOB_SHA"
          test "$(sha256sum evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-offline-shadow-output-v1.json | awk '{print $1}')" = "$FROZEN_8P_OUTPUT_SHA256"

      - name: Deterministic Build A B and focused contract verifier
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-consumption-contract-v1.mjs
          node - <<'NODE'
          const fs = require('fs');
          const stable = (v) => Array.isArray(v) ? v.map(stable) : v && typeof v === 'object'
            ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, stable(v[k])])) : v;
          for (const f of [
            'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-production-consumption-contract-v1.json',
            'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-authority-precedence-matrix-v1.json',
            'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-legacy-migration-compatibility-matrix-v1.json',
            'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-production-consumption-canonical-examples-v1.json'
          ]) {
            const parsed = JSON.parse(fs.readFileSync(f, 'utf8'));
            const buildA = JSON.stringify(stable(parsed)) + '\n';
            const buildB = JSON.stringify(stable(parsed)) + '\n';
            if (buildA !== buildB || fs.readFileSync(f, 'utf8') !== buildA) process.exit(1);
          }
          NODE
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-consumption-contract-v1.mjs
          sha256sum \
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-production-consumption-contract-v1.json \
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-authority-precedence-matrix-v1.json \
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-legacy-migration-compatibility-matrix-v1.json \
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-production-consumption-canonical-examples-v1.json \
            docs/evidence/exfoliation-non-numeric-pda-production-consumption-contract-v1.md

      - name: Historical V2.1-8J through V2.1-8P replay
        shell: bash
        run: |
          set -euo pipefail
          node scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-anchor-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs
          node scripts/product-evidence/verify-exfoliation-load-calibration-feasibility-reassessment-v1.mjs
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs

      - name: Historical V2.1-8Q through V2.1-8S replay at frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/v21-8q _reference/v21-8r _reference/v21-8s
          git clone -q --no-hardlinks . _reference/v21-8q
          git -C _reference/v21-8q checkout -q "$FROZEN_8Q_MAIN_SHA"
          (cd _reference/v21-8q && node scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumption-v1.mjs)

          git clone -q --no-hardlinks . _reference/v21-8r
          git -C _reference/v21-8r checkout -q "$FROZEN_8R_MAIN_SHA"
          (cd _reference/v21-8r && node scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-adapter-implementation-v1.mjs)

          git clone -q --no-hardlinks . _reference/v21-8s
          git -C _reference/v21-8s checkout -q "$FROZEN_8S_MAIN_SHA"
          (cd _reference/v21-8s && node scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumer-v1.mjs)

          rm -rf _reference/v21-8q _reference/v21-8r _reference/v21-8s

      - name: Historical V2.1-8T replay at frozen authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/v21-8t
          git clone -q --no-hardlinks . _reference/v21-8t
          git -C _reference/v21-8t checkout -q "$FROZEN_8T_MAIN_SHA"
          (cd _reference/v21-8t && node scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-divergence-readiness-v1.mjs)
          rm -rf _reference/v21-8t

      - name: 164 x 12 production invariance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q 783afb91a964f5d762f46846f9ef854902b48e95
          V21_7_BASE_MAIN_SHA=e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87 RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-product-decision-axis-comparator-v1.mjs
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-skin-decision-recommendation-invariance.mjs
          rm -rf _reference/recommendation

      - name: Exact V2.1-8U additive scope and frozen non-mutation
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            .github/workflows/v21-8u-exfoliation-production-consumption-contract.yml
            docs/evidence/exfoliation-non-numeric-pda-production-consumption-contract-v1.md
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-authority-precedence-matrix-v1.json
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-legacy-migration-compatibility-matrix-v1.json
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-production-consumption-canonical-examples-v1.json
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-production-consumption-contract-v1.json
            scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-consumption-contract-v1.mjs
          )
          mapfile -t actual < <(git diff --name-only "$V21_8U_BASE_MAIN_SHA..HEAD" | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

          test -z "$(git diff --name-only "$V21_8U_BASE_MAIN_SHA..HEAD" -- \
            app \
            lib \
            package.json package-lock.json \
            supabase/migrations \
            evidence/product-decision-axis-non-numeric-contract-v1)"
          git diff --check "$V21_8U_BASE_MAIN_SHA..HEAD"
