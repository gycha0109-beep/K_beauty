name: V2.1-9B Existing Eligibility Candidate Availability Shadow

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-9b-existing-eligibility-candidate-availability-shadow.yml'
      - 'docs/evidence/exfoliation-existing-eligibility-candidate-availability-shadow-v1.md'
      - 'scripts/product-evidence/build-exfoliation-existing-eligibility-candidate-availability-shadow-v1.mjs'
      - 'scripts/product-evidence/verify-exfoliation-existing-eligibility-candidate-availability-shadow-v1.mjs'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-existing-eligibility-candidate-availability-*.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-9b-existing-eligibility-candidate-availability-shadow.yml'
      - 'docs/evidence/exfoliation-existing-eligibility-candidate-availability-shadow-v1.md'
      - 'scripts/product-evidence/build-exfoliation-existing-eligibility-candidate-availability-shadow-v1.mjs'
      - 'scripts/product-evidence/verify-exfoliation-existing-eligibility-candidate-availability-shadow-v1.mjs'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-existing-eligibility-candidate-availability-*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v21-9b:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      V21_9B_BASE_MAIN_SHA: 1c65eced12e05ca4a81d74bbef167f367e170582
      FROZEN_9A_MAIN_SHA: 1c65eced12e05ca4a81d74bbef167f367e170582
      FROZEN_8Z_MAIN_SHA: 57211ec9c2c99ea02da74c4f8d2c707ca89aa597
      FROZEN_8Y_MAIN_SHA: 5ce7195670eab6f2e9a2aff7810d4f48c9b6f688
      FROZEN_8X_MAIN_SHA: 7dd6f3566ca3a680627eb64430ca8d34178b53bd
      FROZEN_8W_MAIN_SHA: fc5da448cc97572547e14c4a796b57773aa0b8d0
      FROZEN_8V_MAIN_SHA: d85ed057cb01923d3f3beef18b08e820fb7d7e22
      FROZEN_8U_MAIN_SHA: a34b5d67dd233629c01568114fea6ebb312fd130
      FROZEN_8T_MAIN_SHA: d988f33664e3086250e2595b55319aa18e127608
      FROZEN_8S_MAIN_SHA: c3a844ff3aec6a89456aeba9e86a3479239f2974
      FROZEN_8R_MAIN_SHA: 053a963a14bf00d7deb731a2c5427a97f3172b9f
      FROZEN_8Q_MAIN_SHA: e812ee6a7eae6b98940adfe7b10471687e5cad1a
      FROZEN_8X_CONTRACT_BLOB_SHA: 5eed23e9b85e4997087663d792a82ecca34d8ad0
      FROZEN_8Y_RUNTIME_BLOB_SHA: 827f3b69f4ad288ea1f791893d8c9fb921fa0226
      FROZEN_8Z_READINESS_BLOB_SHA: 1f67f548fd0f4781296390ab0ee34e890f069efb
      FROZEN_9A_BUILDER_BLOB_SHA: 98ca3976122eda017be6f9c91fb17f0e60dabc50
      FROZEN_9A_SUMMARY_BLOB_SHA: 51ec9f5a73b49e4256187780de6a2f8083e19c32
      FROZEN_9A_IMPACT_BLOB_SHA: 90ce346147796c22d8025a6d80ca087cbb1b8fa8
      FROZEN_SKIN_ENGINE_BLOB_SHA: 96ea483e1099fd4603e3f120b116901ec451541a
      FROZEN_CANDIDATE_SOURCE_BLOB_SHA: af66b2c2038b62ce1aa0013a56b73085e0409041
      FROZEN_EVALUATOR_BOUNDARY_RUNTIME_BLOB_SHA: c436d56e721f8e65946ae2993c0886099677c56a
      V21_9B_REQUIRE_CHECKED_IN: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Exact authority and frozen 8X 8Y 8Z 9A runtime bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$V21_9B_BASE_MAIN_SHA" HEAD
          test "$(git hash-object evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1.json)" = "$FROZEN_8X_CONTRACT_BLOB_SHA"
          test "$(git hash-object lib/exfoliation-non-numeric-pda-normative-production-policy-shadow.js)" = "$FROZEN_8Y_RUNTIME_BLOB_SHA"
          test "$(git hash-object evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-activation-readiness-contract-v1.json)" = "$FROZEN_8Z_READINESS_BLOB_SHA"
          test "$(git hash-object scripts/product-evidence/build-exfoliation-non-numeric-pda-additional-shadow-evidence-v1.mjs)" = "$FROZEN_9A_BUILDER_BLOB_SHA"
          test "$(git hash-object evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-additional-shadow-evidence-summary-v1.json)" = "$FROZEN_9A_SUMMARY_BLOB_SHA"
          test "$(git hash-object evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-additional-shadow-hypothetical-restrict-impact-v1.json)" = "$FROZEN_9A_IMPACT_BLOB_SHA"
          test "$(git hash-object lib/skin-match-decision-engine.js)" = "$FROZEN_SKIN_ENGINE_BLOB_SHA"
          test "$(git hash-object lib/existing-recommendation-candidate-source.js)" = "$FROZEN_CANDIDATE_SOURCE_BLOB_SHA"
          test "$(git hash-object lib/evaluator-boundary-policy-runtime.js)" = "$FROZEN_EVALUATOR_BOUNDARY_RUNTIME_BLOB_SHA"
          test "${ENABLE_EVALUATOR_BOUNDARY_CANDIDATE_POLICY_RUNTIME:-}" != "1"
          test "${DISABLE_EVALUATOR_BOUNDARY_CANDIDATE_POLICY_RUNTIME:-}" != "1"

      - name: Prepare frozen 164 x 12 recommendation reference
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q 783afb91a964f5d762f46846f9ef854902b48e95

      - name: Generate deterministic Build A B
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/product-evidence/build-exfoliation-existing-eligibility-candidate-availability-shadow-v1.mjs
          node --check scripts/product-evidence/verify-exfoliation-existing-eligibility-candidate-availability-shadow-v1.mjs
          rm -rf /tmp/v21-9b-a /tmp/v21-9b-b
          mkdir -p /tmp/v21-9b-a /tmp/v21-9b-b
          for mode in summary audit distribution joined restrict impact boundary gaps rows; do
            RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/product-evidence/build-exfoliation-existing-eligibility-candidate-availability-shadow-v1.mjs "$mode" > "/tmp/v21-9b-a/$mode.json"
            RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/product-evidence/build-exfoliation-existing-eligibility-candidate-availability-shadow-v1.mjs "$mode" > "/tmp/v21-9b-b/$mode.json"
            cmp "/tmp/v21-9b-a/$mode.json" "/tmp/v21-9b-b/$mode.json"
          done
          sha256sum /tmp/v21-9b-a/*.json

      - name: Upload generated 9B evidence
        uses: actions/upload-artifact@v4
        with:
          name: v21-9b-generated-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/v21-9b-a/*.json
          retention-days: 3

      - name: Focused V2.1-9B verifier
        shell: bash
        run: |
          set -euo pipefail
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/product-evidence/verify-exfoliation-existing-eligibility-candidate-availability-shadow-v1.mjs | tee /tmp/v21-9b-verifier.json

      - name: Historical V2.1-8J through V2.1-8P replay
        shell: bash
        run: |
          set -euo pipefail
          node scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-anchor-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs
          node scripts/product-evidence/verify-exfoliation-load-calibration-feasibility-reassessment-v1.mjs
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs

      - name: Historical V2.1-8Q through V2.1-9A replay at exact frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            "v21-8q:$FROZEN_8Q_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumption-v1.mjs" \
            "v21-8r:$FROZEN_8R_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-adapter-implementation-v1.mjs" \
            "v21-8s:$FROZEN_8S_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumer-v1.mjs" \
            "v21-8t:$FROZEN_8T_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-divergence-readiness-v1.mjs" \
            "v21-8u:$FROZEN_8U_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-consumption-contract-v1.mjs" \
            "v21-8v:$FROZEN_8V_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-consumption-shadow-v1.mjs" \
            "v21-8w:$FROZEN_8W_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-policy-mapping-v1.mjs" \
            "v21-8x:$FROZEN_8X_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs" \
            "v21-8y:$FROZEN_8Y_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-normative-production-policy-shadow-v1.mjs" \
            "v21-8z:$FROZEN_8Z_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-normative-production-policy-activation-readiness-v1.mjs" \
            "v21-9a:$FROZEN_9A_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-additional-shadow-evidence-v1.mjs"; do
            IFS=: read -r name sha verifier <<< "$pair"
            rm -rf "_reference/$name"
            git clone -q --no-hardlinks . "_reference/$name"
            git -C "_reference/$name" checkout -q "$sha"
            if [ "$name" = "v21-9a" ]; then
              (cd "_reference/$name" && V21_9A_REQUIRE_CHECKED_IN=1 RECOMMENDATION_REFERENCE_ROOT="$GITHUB_WORKSPACE/_reference/recommendation" node "$verifier")
            else
              (cd "_reference/$name" && node "$verifier")
            fi
            rm -rf "_reference/$name"
          done

      - name: Canonical 164 x 12 production invariance
        shell: bash
        run: |
          set -euo pipefail
          V21_7_BASE_MAIN_SHA=e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87 RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-product-decision-axis-comparator-v1.mjs
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-skin-decision-recommendation-invariance.mjs

      - name: Bootstrap additive scope and frozen non-mutation
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            .github/workflows/v21-9b-existing-eligibility-candidate-availability-shadow.yml
            docs/evidence/exfoliation-existing-eligibility-candidate-availability-shadow-v1.md
            scripts/product-evidence/build-exfoliation-existing-eligibility-candidate-availability-shadow-v1.mjs
            scripts/product-evidence/verify-exfoliation-existing-eligibility-candidate-availability-shadow-v1.mjs
          )
          mapfile -t actual < <(git diff --name-only "$V21_9B_BASE_MAIN_SHA..HEAD" | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${wanted[@]}")"
          test -z "$(git diff --name-only "$V21_9B_BASE_MAIN_SHA..HEAD" -- app package.json package-lock.json supabase/migrations lib/skin-match-decision-engine.js lib/recommendation-scoring.ts lib/candidate-exposure-policy.js lib/candidate-exposure-policy-contract.js lib/evaluator-boundary-policy-runtime.js lib/existing-recommendation-candidate-source.js lib/routine-policy.js lib/recent-instability-guard-policy.js lib/functional-ranking-contract.js lib/product-functional-profile.js lib/exfoliation-non-numeric-pda-normative-production-policy-shadow.js evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1.json evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-activation-readiness-contract-v1.json evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-additional-shadow-evidence-summary-v1.json)"
          git diff --check "$V21_9B_BASE_MAIN_SHA..HEAD"
          rm -rf _reference/recommendation
