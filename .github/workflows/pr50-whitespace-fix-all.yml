name: PR50 Whitespace Fix All

on:
  push:
    branches:
      - design/unified-vision-observation-pipeline

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Vision branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: design/unified-vision-observation-pipeline

      - name: Normalize changed text files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/survey-input-contract-refactor

          while IFS= read -r file; do
            [ -f "${file}" ] || continue
            case "${file}" in
              *.js|*.mjs|*.json|*.md|*.yml|*.yaml|*.sql|*.toml|*.txt)
                perl -pi -e 's/[ \t]+$//' "${file}"
                ;;
            esac
          done < <(git diff --name-only origin/codex/survey-input-contract-refactor...HEAD)

          git diff --check origin/codex/survey-input-contract-refactor
          if git diff --quiet; then
            echo "no_whitespace_changes"
            exit 0
          fi
          git add -u
          git commit -m "style(vision): normalize changed-file whitespace"
          git push origin HEAD:design/unified-vision-observation-pipeline
