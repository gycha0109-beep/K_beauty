name: DATA-AI21 Limited Beta Evidence Capture

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/product-query-authenticated-beta-evidence-capture.mjs"
      - "app/api/my/product-query-beta/evidence-receipt/route.js"
      - "scripts/verify-data-ai21-limited-beta-evidence.mjs"
      - ".github/workflows/data-ai21-limited-beta-evidence.yml"
      - "scripts/verify-current-main-health.mjs"
  push:
    branches: [main]
    paths:
      - "lib/product-query-authenticated-beta-evidence-capture.mjs"
      - "app/api/my/product-query-beta/evidence-receipt/route.js"
      - "scripts/verify-data-ai21-limited-beta-evidence.mjs"
      - ".github/workflows/data-ai21-limited-beta-evidence.yml"
      - "scripts/verify-current-main-health.mjs"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  id-token: write

concurrency:
  group: data-ai21-limited-beta-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: DATA-AI21 evidence capture contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify DATA-AI21 evidence capture
        run: node scripts/verify-data-ai21-limited-beta-evidence.mjs

  production-preflight:
    name: DATA-AI21 exact-deployment Production preflight
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact activation SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Resolve exact successful Production deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url=""
          for attempt in $(seq 1 48); do
            ids="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&per_page=100" --jq '.[] | .id' || true)"
            for id in $ids; do
              deployment="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments/$id")"
              production="$(printf '%s' "$deployment" | jq -r '.production_environment // false')"
              environment="$(printf '%s' "$deployment" | jq -r '.environment // ""' | tr '[:upper:]' '[:lower:]')"
              if [ "$production" != "true" ] && [ "$environment" != "production" ]; then
                continue
              fi
              candidate="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success" and .environment_url != null)][0].environment_url // empty' || true)"
              if [ -n "$candidate" ]; then
                url="${candidate%/}"
                break
              fi
            done
            if [ -n "$url" ]; then break; fi
            sleep 5
          done
          test -n "$url"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"

      - name: Obtain Vercel trusted OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          trusted_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          trusted="$(printf '%s' "$trusted_json" | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const j=JSON.parse(x);if(!j.value)process.exit(1);process.stdout.write(j.value)})')"
          echo "::add-mask::$trusted"
          printf 'trusted=%s\n' "$trusted" >> "$GITHUB_OUTPUT"

      - name: Assert anonymous evidence capture remains closed
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.trusted }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          status="$(curl --silent --show-error -o "$output" -w '%{http_code}' \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            "$DEPLOYMENT_URL/api/my/product-query-beta/evidence-receipt")"
          test "$status" = "401"
          grep -Fq '"unauthorized"' "$output"
          echo "DATA_AI21_PRODUCTION_PREFLIGHT=PASS"
