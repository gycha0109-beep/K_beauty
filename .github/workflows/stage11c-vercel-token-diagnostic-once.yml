name: Stage 11C Vercel Token Diagnostic Once

on:
  pull_request:
    types: [synchronize]
    branches:
      - codex/candidate-exposure-policy-shadow-runtime

permissions:
  contents: read

jobs:
  token-diagnostic:
    if: github.event.pull_request.head.ref == 'codex/candidate-exposure-policy-shadow-evaluation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_xuYA9OhCWlJETaYFOmeVodgS
      VERCEL_PROJECT_ID: prj_VHh3BMegmXFGwxgOJLlgFQjksmKA
    steps:
      - name: Verify read-only project authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          echo "::add-mask::$VERCEL_TOKEN"
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          token = os.environ['VERCEL_TOKEN']
          team = os.environ['VERCEL_ORG_ID']
          project = os.environ['VERCEL_PROJECT_ID']
          headers = {'Authorization': f'Bearer {token}'}
          checks = {
              'project': f'https://api.vercel.com/v9/projects/{project}?' + urllib.parse.urlencode({'teamId': team}),
              'env': f'https://api.vercel.com/v10/projects/{project}/env?' + urllib.parse.urlencode({'teamId': team}),
              'deployments': 'https://api.vercel.com/v6/deployments?' + urllib.parse.urlencode({'projectId': project, 'teamId': team, 'limit': 1}),
          }
          result = {}
          for name, url in checks.items():
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
                      result[name] = {
                          'status': response.status,
                          'projectIdMatch': payload.get('id') == project if isinstance(payload, dict) else None,
                          'envCount': len(payload.get('envs', [])) if name == 'env' and isinstance(payload, dict) else None,
                          'deploymentCount': len(payload.get('deployments', [])) if name == 'deployments' and isinstance(payload, dict) else None,
                      }
              except urllib.error.HTTPError as error:
                  result[name] = {'status': error.code}
          print(json.dumps(result, indent=2))
          if any(value['status'] != 200 for value in result.values()):
              raise SystemExit('VERCEL_TOKEN_PROJECT_AUTHORITY_INCOMPLETE')
          PY
