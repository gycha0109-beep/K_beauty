name: DATA-TAXONOMY2 Candidate Manual Taxonomy Classification

on:
  pull_request:
    paths:
      - "supabase/migrations/20260913202500_data_taxonomy2_candidate_manual_classification_v1.sql"
      - "supabase/migrations/20260913210000_data_taxonomy2_production_adoption_reconcile_v1.sql"
      - "docs/evidence/data-taxonomy2-candidate-manual-classification-v1.md"
      - "scripts/verify-data-taxonomy2-candidate-manual-classification-v1.mjs"
      - ".github/workflows/data-taxonomy2-candidate-manual-classification-v1.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/20260913202500_data_taxonomy2_candidate_manual_classification_v1.sql"
      - "supabase/migrations/20260913210000_data_taxonomy2_production_adoption_reconcile_v1.sql"
      - "docs/evidence/data-taxonomy2-candidate-manual-classification-v1.md"
      - "scripts/verify-data-taxonomy2-candidate-manual-classification-v1.mjs"
      - ".github/workflows/data-taxonomy2-candidate-manual-classification-v1.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify exact DATA-TAXONOMY2 change scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          while IFS= read -r path; do
            case "$path" in
              supabase/migrations/20260913202500_data_taxonomy2_candidate_manual_classification_v1.sql|\
              supabase/migrations/20260913210000_data_taxonomy2_production_adoption_reconcile_v1.sql|\
              docs/evidence/data-taxonomy2-candidate-manual-classification-v1.md|\
              scripts/verify-data-taxonomy2-candidate-manual-classification-v1.mjs|\
              .github/workflows/data-taxonomy2-candidate-manual-classification-v1.yml)
                ;;
              *)
                echo "Unexpected DATA-TAXONOMY2 path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

      - name: Verify candidate/manual shadow taxonomy contract
        run: node scripts/verify-data-taxonomy2-candidate-manual-classification-v1.mjs
