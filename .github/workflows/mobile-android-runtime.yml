name: BEJEWELY Mobile Android Runtime
run-name: "[WT:mobile] BEJEWELY Mobile Android Runtime"

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/modules/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "apps/mobile/app/_layout.tsx"
      - "apps/mobile/app/store-capture.tsx"
      - "apps/mobile/app/my.tsx"
      - "apps/mobile/features/analyze/NativeAnalyzeResult.tsx"
      - "apps/mobile/features/my/NativeMyDiaryView.tsx"
      - "apps/mobile/features/store-capture/**"
      - "apps/mobile/lib/mobile-shell.tsx"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/.gitignore"
      - "docs/store/mobile-store-listing-final.json"
      - "scripts/verify-mobile-native-shell.mjs"
      - "scripts/verify-mobile-android-smoke.sh"
      - "scripts/capture-mobile-store-assets.sh"
      - "scripts/capture-mobile-store-scenarios.sh"
      - "scripts/capture-mobile-20b-store-assets.sh"
      - "scripts/verify-mobile-20a-store-capture.mjs"
      - "scripts/verify-mobile-20b-store-scenarios.mjs"
      - "scripts/verify-mobile-20b-store-capture.mjs"
      - "scripts/verify-mobile-18-store-listing.mjs"
      - "scripts/verify-mobile-analyze-integration.mjs"
      - ".github/workflows/mobile-android-runtime.yml"
      - ".github/workflows/mobile-native-shell.yml"
      - ".github/workflows/mobile-20a-store-capture.yml"
      - ".github/workflows/mobile-20b-store-capture.yml"
      - "docs/ci/workflow-responsibility-map.json"
      - "docs/ci/workflow-responsibility-map.md"
  push:
    branches: [main]
    paths:
      - "apps/mobile/modules/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "apps/mobile/app/_layout.tsx"
      - "apps/mobile/app/store-capture.tsx"
      - "apps/mobile/app/my.tsx"
      - "apps/mobile/features/analyze/NativeAnalyzeResult.tsx"
      - "apps/mobile/features/my/NativeMyDiaryView.tsx"
      - "apps/mobile/features/store-capture/**"
      - "apps/mobile/lib/mobile-shell.tsx"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/.gitignore"
      - "docs/store/mobile-store-listing-final.json"
      - "scripts/verify-mobile-native-shell.mjs"
      - "scripts/verify-mobile-android-smoke.sh"
      - "scripts/capture-mobile-store-assets.sh"
      - "scripts/capture-mobile-store-scenarios.sh"
      - "scripts/capture-mobile-20b-store-assets.sh"
      - "scripts/verify-mobile-20a-store-capture.mjs"
      - "scripts/verify-mobile-20b-store-scenarios.mjs"
      - "scripts/verify-mobile-20b-store-capture.mjs"
      - "scripts/verify-mobile-18-store-listing.mjs"
      - "scripts/verify-mobile-analyze-integration.mjs"
      - ".github/workflows/mobile-android-runtime.yml"
      - ".github/workflows/mobile-native-shell.yml"
      - ".github/workflows/mobile-20a-store-capture.yml"
      - ".github/workflows/mobile-20b-store-capture.yml"
      - "docs/ci/workflow-responsibility-map.json"
      - "docs/ci/workflow-responsibility-map.md"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-android-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Android Debug APK Build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify shared Android build contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:mobile-foundation
          npm run mobile:typecheck
          npm run mobile:config

      - name: Generate Android native project
        run: npm run mobile:prebuild:android

      - name: Verify generated Android contract
        run: npm run verify:mobile-native

      - name: Build installable debug APK once
        run: npm run mobile:build:android:debug

      - name: Upload canonical debug APK
        uses: actions/upload-artifact@v6
        with:
          name: bejewely-mobile-android-debug-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  native-shell-smoke:
    name: Android Native Shell Smoke
    needs: android-debug-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install monorepo dependencies
        run: npm ci

      - name: Restore canonical debug APK
        uses: actions/download-artifact@v7
        with:
          name: bejewely-mobile-android-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install APK, and verify rendered shell
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          avd-name: bejewely-mobile-api35
          force-avd-creation: true
          disable-animations: true
          pre-emulator-launch-script: |
            config="$HOME/.android/avd/bejewely-mobile-api35.avd/config.ini"; test -f "$config"; if grep -q '^hw\.camera\.front' "$config"; then sed -i 's/^hw\.camera\.front.*/hw.camera.front=emulated/' "$config"; else printf '\nhw.camera.front=emulated\n' >> "$config"; fi; grep -q '^hw\.camera\.front=emulated$' "$config"; printf 'MOBILE_ANDROID_FRONT_CAMERA_AVD_CONFIG=PASS\n'
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated -camera-back none
          script: bash scripts/verify-mobile-android-smoke.sh

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bejewely-mobile-native-shell-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/.mobile-native-artifacts/**

  store-capture-20a:
    name: Android Store Capture 20A
    needs: android-debug-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify MOBILE-20A store capture contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/capture-mobile-store-assets.sh
          bash -n scripts/capture-mobile-store-scenarios.sh
          node scripts/verify-mobile-20a-store-capture.mjs
          node scripts/verify-mobile-20b-store-scenarios.mjs
          node scripts/verify-mobile-18-store-listing.mjs
          node scripts/verify-mobile-analyze-integration.mjs
          npm run mobile:typecheck
          npm run mobile:config

      - name: Restore canonical debug APK
        uses: actions/download-artifact@v7
        with:
          name: bejewely-mobile-android-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture 1080x1920 EN and KO store candidates
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          avd-name: bejewely-mobile-20a-api35
          force-avd-creation: true
          disable-animations: true
          pre-emulator-launch-script: >-
            config="$HOME/.android/avd/bejewely-mobile-20a-api35.avd/config.ini"; test -f "$config"; for camera in front back; do key="hw.camera.$camera"; if grep -q "^${key}=" "$config"; then sed -i "s/^${key}=.*/${key}=emulated/" "$config"; else printf '\n%s=emulated\n' "$key" >> "$config"; fi; grep -q "^${key}=emulated$" "$config"; done; printf 'MOBILE_20A_DUAL_CAMERA_AVD_CONFIG=PASS\n'
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated -camera-back emulated
          script: bash scripts/capture-mobile-store-assets.sh && bash scripts/capture-mobile-store-scenarios.sh

      - name: Upload store capture candidates
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bejewely-mobile-20a-store-capture-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            apps/mobile/.mobile-store-artifacts/**
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  store-capture-20b:
    name: Android Store Capture 20B
    needs: android-debug-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify MOBILE-20B source contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/capture-mobile-20b-store-assets.sh
          node scripts/verify-mobile-20b-store-capture.mjs source
          node scripts/verify-mobile-18-store-listing.mjs
          node scripts/verify-mobile-analyze-integration.mjs
          npm run mobile:typecheck
          npm run mobile:config

      - name: Restore canonical debug APK
        uses: actions/download-artifact@v7
        with:
          name: bejewely-mobile-android-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug

      - name: Preinstall Android 35 emulator image with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          package='system-images;android-35;default;x86_64'
          for attempt in 1 2 3; do
            if sdkmanager --install "$package" --channel=0; then
              test -f "$sdk_root/system-images/android-35/default/x86_64/package.xml"
              printf 'MOBILE_ANDROID_SYSTEM_IMAGE_READY=PASS attempt=%s\n' "$attempt"
              exit 0
            fi
            printf 'MOBILE_ANDROID_SYSTEM_IMAGE_RETRY=attempt=%s\n' "$attempt" >&2
            rm -rf "$sdk_root/system-images/android-35/default/x86_64"
            sleep $((attempt * 5))
          done
          printf 'MOBILE_ANDROID_SYSTEM_IMAGE_READY=FAIL attempts=3\n' >&2
          exit 1

      - name: Enable KVM permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Results and Diary EN/KO candidates
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          avd-name: bejewely-mobile-20b-api35
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/capture-mobile-20b-store-assets.sh

      - name: Upload store capture candidates
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bejewely-mobile-20b-store-capture-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            apps/mobile/.mobile-20b-store-artifacts/**
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
