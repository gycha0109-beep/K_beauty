name: BEJEWELY Mobile iOS JSI 57.1 Repair

on:
  push:
    branches: [mobile-20c-google-play-feature-graphic]
    paths:
      - ".github/workflows/mobile-ios-jsi-57-1-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-ios-jsi-57-1-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Rebind bounded Expo Modules JSI compatibility shim
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: mobile-20c-google-play-feature-graphic
          fetch-depth: 0

      - name: Rebind current Expo Modules JSI target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          shim_path = Path('scripts/apply-expo-modules-jsi-xcode26-compat.mjs')
          shim = shim_path.read_text()
          shim = shim.replace('expectedVersion: "57.0.5",', 'expectedVersion: "57.1.0",', 1)
          mobile_target = '''  {
            label: "mobile-resolved",
            packageRoot: join(repoRoot, "apps", "mobile", "node_modules", "expo-modules-jsi"),
            expectedVersion: "57.0.8",
          },
          '''
          if mobile_target not in shim:
              raise SystemExit('expected legacy mobile-resolved target block missing')
          shim = shim.replace(mobile_target, '', 1)
          if 'expectedVersion: "57.0.5"' in shim or 'mobile-resolved' in shim:
              raise SystemExit('legacy Expo Modules JSI target remained in shim')
          if 'expectedVersion: "57.1.0"' not in shim:
              raise SystemExit('current Expo Modules JSI target missing in shim')
          shim_path.write_text(shim)

          verifier_path = Path('scripts/verify-mobile-ios-shell.mjs')
          verifier = verifier_path.read_text()
          old_root = '''assert.match(
            compatScript,
            /label: "root-peer"[\\s\\S]*?expectedVersion: "57\\.0\\.5"/,
            "MOBILE-12 compatibility shim must preserve the bounded root-peer expo-modules-jsi@57.0.5 target"
          );
          '''
          new_root = '''assert.match(
            compatScript,
            /label: "root-peer"[\\s\\S]*?expectedVersion: "57\\.1\\.0"/,
            "MOBILE-12 compatibility shim must preserve the bounded root-peer expo-modules-jsi@57.1.0 target"
          );
          '''
          old_mobile = '''assert.match(
            compatScript,
            /label: "mobile-resolved"[\\s\\S]*?expectedVersion: "57\\.0\\.8"/,
            "MOBILE-12 compatibility shim must preserve the bounded mobile-resolved expo-modules-jsi@57.0.8 target"
          );
          '''
          if old_root not in verifier or old_mobile not in verifier:
              raise SystemExit('legacy verifier target blocks missing')
          verifier = verifier.replace(old_root, new_root, 1).replace(old_mobile, '', 1)
          verifier = verifier.replace(
              '  "57.0.5",\n  "MOBILE-12 compatibility boundary must fail closed when expo-modules-jsi changes version"',
              '  "57.1.0",\n  "MOBILE-12 compatibility boundary must fail closed when expo-modules-jsi changes version"',
              1,
          )
          if '57.0.5' in verifier or 'mobile-resolved' in verifier:
              raise SystemExit('legacy Expo Modules JSI verifier authority remained')
          if '57.1.0' not in verifier:
              raise SystemExit('current Expo Modules JSI verifier authority missing')
          verifier_path.write_text(verifier)
          PY

      - name: Verify bounded source hash remains current
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'expectedSourceSha1 = "708aeaf33190ec55694e2677da0e7c565f61adfe"' scripts/apply-expo-modules-jsi-xcode26-compat.mjs
          grep -F 'expectedPatchedSha1 = "104a90a05f703288e5697c5548bb3af14ef951b1"' scripts/apply-expo-modules-jsi-xcode26-compat.mjs
          grep -F 'expectedVersion: "57.1.0"' scripts/apply-expo-modules-jsi-xcode26-compat.mjs

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/mobile-ios-jsi-57-1-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply-expo-modules-jsi-xcode26-compat.mjs scripts/verify-mobile-ios-shell.mjs .github/workflows/mobile-ios-jsi-57-1-repair.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'repair produced no diff'; exit 1; }
          git commit -m 'fix(mobile): rebind Xcode 26 JSI shim to 57.1.0'
          git push origin HEAD:mobile-20c-google-play-feature-graphic
