name: BEJEWELY Mobile iOS JSI 57.1 Repair

on:
  push:
    branches: [mobile-20c-google-play-feature-graphic]
    paths:
      - ".github/workflows/mobile-ios-jsi-57-1-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-ios-jsi-57-1-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Rebind bounded Expo Modules JSI compatibility shim
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: mobile-20c-google-play-feature-graphic
          fetch-depth: 0

      - name: Rebind current Expo Modules JSI target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          shim_path = Path('scripts/apply-expo-modules-jsi-xcode26-compat.mjs')
          shim = shim_path.read_text()
          if shim.count('expectedVersion: "57.0.5",') != 1:
              raise SystemExit('unexpected root-peer version authority count')
          shim = shim.replace('expectedVersion: "57.0.5",', 'expectedVersion: "57.1.0",', 1)
          shim, removed = re.subn(
              r'\s*\{\s*label: "mobile-resolved",\s*packageRoot: join\(repoRoot, "apps", "mobile", "node_modules", "expo-modules-jsi"\),\s*expectedVersion: "57\.0\.8",\s*\},',
              '',
              shim,
              count=1,
          )
          if removed != 1:
              raise SystemExit(f'expected exactly one legacy mobile-resolved target, removed={removed}')
          if '57.0.5' in shim or '57.0.8' in shim or 'mobile-resolved' in shim:
              raise SystemExit('legacy Expo Modules JSI target remained in shim')
          if shim.count('expectedVersion: "57.1.0",') != 1:
              raise SystemExit('current Expo Modules JSI target authority is not singular')
          shim_path.write_text(shim)

          verifier_path = Path('scripts/verify-mobile-ios-shell.mjs')
          verifier = verifier_path.read_text()
          verifier, removed = re.subn(
              r'assert\.match\(\s*compatScript,\s*/label: "mobile-resolved".*?\);\n',
              '',
              verifier,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit(f'expected exactly one mobile-resolved verifier assertion, removed={removed}')
          verifier = verifier.replace('57\\.0\\.5', '57\\.1\\.0')
          verifier = verifier.replace('57.0.5', '57.1.0')
          if '57.0.5' in verifier or '57.0.8' in verifier or 'mobile-resolved' in verifier:
              raise SystemExit('legacy Expo Modules JSI verifier authority remained')
          if verifier.count('57.1.0') < 2:
              raise SystemExit('current Expo Modules JSI verifier authority was not fully rebound')
          verifier_path.write_text(verifier)
          PY

      - name: Verify bounded source hash remains current
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'expectedSourceSha1 = "708aeaf33190ec55694e2677da0e7c565f61adfe"' scripts/apply-expo-modules-jsi-xcode26-compat.mjs
          grep -F 'expectedPatchedSha1 = "104a90a05f703288e5697c5548bb3af14ef951b1"' scripts/apply-expo-modules-jsi-xcode26-compat.mjs
          test "$(grep -cF 'expectedVersion: "57.1.0"' scripts/apply-expo-modules-jsi-xcode26-compat.mjs)" -eq 1
          ! grep -F 'mobile-resolved' scripts/apply-expo-modules-jsi-xcode26-compat.mjs
          ! grep -F '57.0.5' scripts/verify-mobile-ios-shell.mjs
          ! grep -F '57.0.8' scripts/verify-mobile-ios-shell.mjs

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/mobile-ios-jsi-57-1-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply-expo-modules-jsi-xcode26-compat.mjs scripts/verify-mobile-ios-shell.mjs .github/workflows/mobile-ios-jsi-57-1-repair.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'repair produced no diff'; exit 1; }
          git commit -m 'fix(mobile): rebind Xcode 26 JSI shim to 57.1.0'
          git push origin HEAD:mobile-20c-google-play-feature-graphic
