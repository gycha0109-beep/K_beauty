name: Face Lab Neutral Face Count Shared Stage v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/facelab/review/**'
      - 'app/api/facelab/review/**'
      - 'lib/face-lab-neutral-face-count-*'
      - 'evidence/facelab/face-count-neutral-*'
      - 'public/facelab/neutral-review/v1/assets/**'
      - 'scripts/check-face-lab-neutral-face-count-stage-v1.mjs'
      - 'supabase/migrations/20260901012653_face_lab_neutral_face_count_intake_v1.sql'
      - 'docs/domain/facelab/face-count-neutral-shared-stage-v1.md'
      - '.github/workflows/face-lab-neutral-face-count-shared-stage-v1.yml'
  push:
    branches: [main]
    paths:
      - 'app/facelab/review/**'
      - 'app/api/facelab/review/**'
      - 'lib/face-lab-neutral-face-count-*'
      - 'evidence/facelab/face-count-neutral-*'
      - 'public/facelab/neutral-review/v1/assets/**'
      - 'scripts/check-face-lab-neutral-face-count-stage-v1.mjs'
      - 'supabase/migrations/20260901012653_face_lab_neutral_face_count_intake_v1.sql'
      - 'docs/domain/facelab/face-count-neutral-shared-stage-v1.md'
      - '.github/workflows/face-lab-neutral-face-count-shared-stage-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'FACE_COUNT_NEUTRAL_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify neutral authority, exact bytes, intake and receipt gate
        run: node scripts/check-face-lab-neutral-face-count-stage-v1.mjs

      - name: Syntax check touched runtime files
        run: |
          node --check lib/face-lab-neutral-face-count-contract.mjs
          node --check lib/face-lab-neutral-face-count-intake.js
          node --check lib/face-lab-neutral-face-count-review-html.js
          node --check app/api/facelab/review/neutral/submit/route.js
          node --check app/api/facelab/review/submit/route.js
          node --check app/facelab/review/route.js

      - name: Verify existing hosted evaluation authority remains intact
        run: |
          npm run verify:face-lab-independent-human-cue-hosted-set
          npm run verify:face-lab-independent-human-cue-hosted-response
          npm run verify:face-lab-independent-human-cue-hosted-ui
          npm run verify:face-lab-target-axis-definitions
          npm run verify:face-lab-independent-human-cue-protocol
          npm run verify:face-lab-archetype-human-evaluation

      - name: Verify architecture boundary
        run: npm run architecture:guard

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            base="$(git merge-base '${{ github.event.pull_request.base.sha }}' HEAD)"
            git diff --check "$base..HEAD"
          else
            git diff --check 'HEAD^..HEAD'
          fi
