name: V2.1-9I Merged Main Dispatch Helper

on:
  pull_request:
    paths:
      - ".github/workflows/v21-9i-merged-main-dispatch-helper.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      TARGET_MAIN_SHA: 2b7e2667fd809d268ee562f66c67fa1e61cadf55
      TARGET_WORKFLOW: v21-9i-prelaunch-robustness-remediation-resume.yml
    steps:
      - name: Assert current main exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual=$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')
          test "$actual" = "$TARGET_MAIN_SHA"

      - name: Dispatch full V2.1-9I workflow on merged main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" \
            -d '{"ref":"main"}'

      - name: Resolve dispatched exact-SHA run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            payload=$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?event=workflow_dispatch&branch=main&head_sha=$TARGET_MAIN_SHA&per_page=10")
            run_id=$(printf '%s' "$payload" | jq -r '.workflow_runs[0].id // empty')
            if [ -n "$run_id" ]; then
              echo "V21_9I_MERGED_MAIN_RUN_ID=$run_id"
              echo "V21_9I_MERGED_MAIN_SHA=$TARGET_MAIN_SHA"
              exit 0
            fi
            sleep 2
          done
          echo "Unable to resolve dispatched merged-main run" >&2
          exit 1
