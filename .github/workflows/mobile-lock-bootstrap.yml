name: BEJEWELY Mobile Lock Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "scripts/prepare-mobile-workspace-lock.mjs"
      - ".github/workflows/mobile-lock-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile-lock-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare workspace manifest
        run: node scripts/prepare-mobile-workspace-lock.mjs

      - name: Generate canonical npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated manifests to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "workspace manifests already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(mobile): pin workspace manifest and lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
