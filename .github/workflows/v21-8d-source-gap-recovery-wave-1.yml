name: V21-8D Source Gap Recovery Wave 1

on:
  push:
    branches: [research/product-fact-source-gap-recovery-wave-1-v1]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-8d-source-gap-recovery-wave-1.yml'
      - 'scripts/product-evidence/product-fact-source-gap-recovery-wave-1-v1.mjs'
      - 'scripts/build-product-fact-source-gap-recovery-wave-1-v1.mjs'
      - 'scripts/verify-product-fact-source-gap-recovery-wave-1-v1.mjs'
      - 'evidence/product-evidence-expansion-v1/source-gap-recovery-wave-1-v1.json'
      - 'evidence/product-fact-adoption-v1/source-gap-recovery-wave-1-materialization-v1.json'
      - 'docs/evidence/product-fact-source-gap-recovery-wave-1-v1.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BASE_MAIN_SHA: 118152c40d76d2956d85c5bbc56ecdbe725b5ee7
      OUT_EVIDENCE: evidence/product-evidence-expansion-v1/source-gap-recovery-wave-1-v1.json
      OUT_MATERIALIZATION: evidence/product-fact-adoption-v1/source-gap-recovery-wave-1-materialization-v1.json
      OUT_MD: docs/evidence/product-fact-source-gap-recovery-wave-1-v1.md
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Exact authority and frozen hashes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_MAIN_SHA"
          git merge-base --is-ancestor "$BASE_MAIN_SHA" HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(sha256sum evidence/product-fact-materialization-v1/cross-category-pilot-materialization-dry-run-v1.json|awk '{print $1}')" = b2f19878f00f53d9a60dad0b1515fff1f566449e6a531825e712dfa2e3f19bb2
          test "$(sha256sum evidence/product-evidence-decision-axis-v1/cross-category-real-evidence-pilot-v1.json|awk '{print $1}')" = 47457c0242451a35305fd8eceba0ebb7e210eb9ee2e73134ccf41696d18e517d
          test "$(sha256sum evidence/product-evidence-decision-axis-v1/cross-category-real-fact-mapping-pilot-v1.json|awk '{print $1}')" = c746c5d02f654ed7f0a8e8385611ac65ca30b9c4648fa4c6454ac863e7c9314f
          test "$(sha256sum evidence/product-evidence-decision-axis-v1/cross-category-real-pilot-gap-report-v1.json|awk '{print $1}')" = 5a4580d76cca62d90a3ac306744054c507a6d5e45b0b91a41dffb3b754980215
          printf 'base=%s\nhead=%s\n' "$BASE_MAIN_SHA" "$(git rev-parse HEAD)" | tee /tmp/v21-8d-authority.txt

      - name: Controlled-write contracts and syntax
        run: |
          node scripts/verify-product-fact-controlled-write-v1.mjs > /tmp/v21-8d-pf-write.json
          node scripts/verify-product-fact-subject-registration-v1.mjs > /tmp/v21-8d-pf-subject.json
          node -e 'for(const f of process.argv.slice(1)){if(require(f).status!=="PASS")process.exit(1)}' /tmp/v21-8d-pf-write.json /tmp/v21-8d-pf-subject.json
          node --check scripts/product-evidence/product-fact-source-gap-recovery-wave-1-v1.mjs
          node --check scripts/build-product-fact-source-gap-recovery-wave-1-v1.mjs
          node --check scripts/verify-product-fact-source-gap-recovery-wave-1-v1.mjs

      - name: Canonical build and Build A/B determinism
        shell: bash
        run: |
          set -euo pipefail
          V21_8D_BASE_MAIN_SHA="$BASE_MAIN_SHA" node scripts/build-product-fact-source-gap-recovery-wave-1-v1.mjs | tee /tmp/v21-8d-canonical-build.txt
          for r in a b; do
            root="/tmp/v21-8d-$r"; rm -rf "$root"
            V21_8D_BASE_MAIN_SHA="$BASE_MAIN_SHA" V21_8D_OUTPUT_ROOT="$root" node scripts/build-product-fact-source-gap-recovery-wave-1-v1.mjs > "/tmp/v21-8d-build-$r.txt"
          done
          for p in "$OUT_EVIDENCE" "$OUT_MATERIALIZATION" "$OUT_MD"; do cmp -s "/tmp/v21-8d-a/$p" "/tmp/v21-8d-b/$p"; cmp -s "$p" "/tmp/v21-8d-a/$p"; done
          sha256sum /tmp/v21-8d-a/$OUT_EVIDENCE /tmp/v21-8d-a/$OUT_MATERIALIZATION /tmp/v21-8d-a/$OUT_MD | tee /tmp/v21-8d-hash-a.txt
          sha256sum /tmp/v21-8d-b/$OUT_EVIDENCE /tmp/v21-8d-b/$OUT_MATERIALIZATION /tmp/v21-8d-b/$OUT_MD | tee /tmp/v21-8d-hash-b.txt
          node scripts/verify-product-fact-source-gap-recovery-wave-1-v1.mjs | tee /tmp/v21-8d-verifier.txt

      - name: V2.1-8A / 8B / 8C replays
        run: |
          V21_8A_BASE_MAIN_SHA=5bcebba6b945f08b0fc5b1ae9f31fb0f9067397e node scripts/verify-product-fact-adoption-batch-1-v1.mjs | tee /tmp/v21-8d-v21-8a.txt
          V21_8B_BASE_MAIN_SHA=a303e216f3953567a175c4d01978efc06b20bbc6 node scripts/verify-product-fact-adoption-batch-2-v1.mjs | tee /tmp/v21-8d-v21-8b.txt
          V21_8C_BASE_MAIN_SHA=a13e27e9e3dae0b5a38bab3324c587b99e8495d5 node scripts/verify-product-fact-adoption-batch-3-v1.mjs | tee /tmp/v21-8d-v21-8c.txt

      - name: Historical V2.1-2 / 4 / 5 / 6 replays
        shell: bash
        run: |
          set -euo pipefail
          run_hist(){ d="$1"; commit="$2"; main="$3"; script="$4"; rm -rf "/tmp/$d"; git clone -q --no-hardlinks . "/tmp/$d"; git -C "/tmp/$d" checkout -q "$commit"; git -C "/tmp/$d" update-ref refs/remotes/origin/main "$main"; (cd "/tmp/$d" && node "$script"); }
          run_hist v21-2 6e79aa6a4ac08c98790787e371d59698588f349e e75ae83f3cc8b682fa7cc7dfb38edf983d2aa68f scripts/verify-product-fact-cross-category-materialization-dry-run-v1.mjs
          run_hist v21-4 c471f5ae82acc36a7c29b9ec8158b4ca2d595ec9 a38df682ebc686cb076dfc40b432ae714fdfd6da scripts/verify-product-fact-evidence-fusion-review-uncertainty-v1.mjs
          run_hist v21-5 4cb69354c3919f40c2b00acc070bcd0fb142f042 4dce99057ca44adb14dac549e8df6d468cf7f5e2 scripts/verify-product-decision-axis-cleanser-v1.mjs
          run_hist v21-6 bd04f0924a74c8d36a935da8a4137dd3cf497117 45628d2c859ab0ba875b66f30b4c47c150ef3162 scripts/verify-product-decision-axis-cross-category-v1.mjs

      - name: V2.1-7 and 164 x 12 production invariance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q 783afb91a964f5d762f46846f9ef854902b48e95
          V21_7_BASE_MAIN_SHA=e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87 RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-product-decision-axis-comparator-v1.mjs | tee /tmp/v21-8d-v21-7.txt
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-skin-decision-recommendation-invariance.mjs | tee /tmp/v21-8d-production.txt
          rm -rf _reference

      - name: Exact 7-file scope, runtime isolation, diff and secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_MAIN_SHA..HEAD" | sort)
          allowed='^(\.github/workflows/v21-8d-source-gap-recovery-wave-1\.yml|docs/evidence/product-fact-source-gap-recovery-wave-1-v1\.md|evidence/product-evidence-expansion-v1/source-gap-recovery-wave-1-v1\.json|evidence/product-fact-adoption-v1/source-gap-recovery-wave-1-materialization-v1\.json|scripts/build-product-fact-source-gap-recovery-wave-1-v1\.mjs|scripts/product-evidence/product-fact-source-gap-recovery-wave-1-v1\.mjs|scripts/verify-product-fact-source-gap-recovery-wave-1-v1\.mjs)$'
          for f in "${changed[@]}"; do [[ "$f" =~ $allowed ]] || { echo "unexpected path: $f"; exit 1; }; done
          test "${#changed[@]}" -eq 7
          test -z "$(git diff --name-only "$BASE_MAIN_SHA..HEAD" -- app components lib supabase/migrations package.json package-lock.json)"
          test ! -e tmp/v21-8d-canonical/source-gap-recovery-wave-1-materialization-v1.json
          ! grep -R -n --include='*.js' --include='*.mjs' 'source-gap-recovery-wave-1-v1\|source-gap-recovery-wave-1-materialization-v1' app lib components 2>/dev/null
          git diff --check "$BASE_MAIN_SHA..HEAD"
          if git diff -U0 "$BASE_MAIN_SHA..HEAD" | grep '^+' | grep -Ev '^\+\+\+' | grep -E 'sk-(proj-)?[A-Za-z0-9_-]{24,}|eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'; then exit 1; fi
          printf '%s\n' "${changed[@]}" | tee /tmp/v21-8d-changed.txt

      - name: Freeze corrected canonical outputs
        if: github.event_name == 'push' && github.ref_name == 'research/product-fact-source-gap-recovery-wave-1-v1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT_EVIDENCE" "$OUT_MATERIALIZATION" "$OUT_MD"
          if ! git diff --cached --quiet; then git commit -m 'research(evidence): freeze corrected V2.1-8D authority'; git push origin HEAD:research/product-fact-source-gap-recovery-wave-1-v1; fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-8d-source-gap-recovery-wave-1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/v21-8d-*.txt
            /tmp/v21-8d-*.json
            evidence/product-evidence-expansion-v1/source-gap-recovery-wave-1-v1.json
            evidence/product-fact-adoption-v1/source-gap-recovery-wave-1-materialization-v1.json
            docs/evidence/product-fact-source-gap-recovery-wave-1-v1.md
          if-no-files-found: warn
          retention-days: 14
