name: TRUST Data Governance - Phase 8G Source Verification Comparability
run-name: "[WT:trust] TRUST Data Governance - Phase 8G Source Verification Comparability"

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*trust_phase8g_*.sql"
      - "tests/fixtures/trust-phase8g-source-verification/**"
      - "scripts/verify-trust-phase8g-source-verification-comparability.mjs"
      - "scripts/trust-source-verification-worker.mjs"
      - "scripts/trust-source-verification-canary-capture.mjs"
      - "scripts/verify-trust-source-canonicalization.mjs"
      - "docs/evidence/trust-phase8g-production-canary-target-v1.json"
      - "scripts/trust-research-worker.mjs"
      - "lib/trust/official-source-fetch.mjs"
      - "docs/evidence/trust-phase8g-source-verification-comparability-v1.md"
      - "docs/evidence/trust-phase8a-product-fact-revalidation-contract-v1.md"
      - ".github/workflows/trust-phase8g-source-verification.yml"
  push:
    branches: [main, "feat/trust-phase8g-source-verification-comparability"]
    paths:
      - "supabase/migrations/*trust_phase8g_*.sql"
      - "tests/fixtures/trust-phase8g-source-verification/**"
      - "scripts/verify-trust-phase8g-source-verification-comparability.mjs"
      - "scripts/trust-source-verification-worker.mjs"
      - "scripts/trust-source-verification-canary-capture.mjs"
      - "scripts/verify-trust-source-canonicalization.mjs"
      - "docs/evidence/trust-phase8g-production-canary-target-v1.json"
      - "scripts/trust-research-worker.mjs"
      - "lib/trust/official-source-fetch.mjs"
      - "docs/evidence/trust-phase8g-source-verification-comparability-v1.md"
      - "docs/evidence/trust-phase8a-product-fact-revalidation-contract-v1.md"
      - ".github/workflows/trust-phase8g-source-verification.yml"
  workflow_dispatch:
    inputs:
      watchtower_track:
        description: CI Watchtower Track Key
        required: false
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.117.0

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Phase 8G static contract
        run: |
          node --check lib/trust/official-source-fetch.mjs
          node --check scripts/trust-research-worker.mjs
          node --check scripts/trust-source-verification-worker.mjs
          node --check scripts/trust-source-verification-canary-capture.mjs
          node scripts/verify-trust-source-canonicalization.mjs
          node -e 'const fs=require("node:fs"); const x=JSON.parse(fs.readFileSync("docs/evidence/trust-phase8g-production-canary-target-v1.json","utf8")); if(!x.source_id || !String(x.canonical_locator || "").startsWith("https://")) process.exit(1)'
          node scripts/verify-trust-phase8g-source-verification-comparability.mjs

      - name: Detect Production canary target change
        id: canary_target
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | grep -Fxq "docs/evidence/trust-phase8g-production-canary-target-v1.json"; then
            echo "changed=true" >>"${GITHUB_OUTPUT}"
          else
            echo "changed=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Capture Production canary live-byte pair
        if: steps.canary_target.outputs.changed == 'true'
        run: node scripts/trust-source-verification-canary-capture.mjs

      - name: Materialize isolated Product Fact runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="${GITHUB_WORKSPACE}/tmp/trust-phase8g-runtime"
          echo "TRUST_RUNTIME_DIR=${runtime_dir}" >>"${GITHUB_ENV}"
          node scripts/materialize-product-fact-replay-baseline-v1.mjs --output="${runtime_dir}"
          sed -i 's/major_version = 15/major_version = 17/' "${runtime_dir}/supabase/config.toml"
          migration_dir="${runtime_dir}/supabase/migrations"
          cp supabase/migrations/20260809115932_product_fact_storage_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260810174400_product_fact_controlled_write_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260922000135_trust_phase4_evidence_null_replay_idempotency_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260810174410_product_fact_subject_registration_v1.sql "${migration_dir}/"
          cp tests/fixtures/trust-phase4-controlled-evidence-adoption/20260917194000_trust_phase4_fixture.sql "${migration_dir}/"
          cp supabase/migrations/20260917195000_trust_phase4_controlled_evidence_adoption_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260917195100_trust_phase4_controlled_evidence_adoption_fusion_hardening_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260922010350_trust_phase8b_source_verification_ledger_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260922011229_trust_phase8c_revalidation_transition_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260922011324_trust_phase8c_revalidation_transition_index_hardening_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260922012833_trust_phase8c_prestate_binding_hardening_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260924025307_trust_phase8g_source_verification_comparability_v1.sql "${migration_dir}/"
          cp supabase/migrations/20260924025341_trust_phase8g_profile_idempotency_hardening_v1.sql "${migration_dir}/"

      - name: Start isolated Supabase and verify comparability gate
        shell: bash
        run: |
          set -euo pipefail
          start_log="${RUNNER_TEMP}/trust-phase8g-start.log"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" start             --workdir "${TRUST_RUNTIME_DIR}"             --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor             >"${start_log}" 2>&1; then
            sed -E 's#(sb_(publishable|secret)_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+|postgresql://[^[:space:]]+)#[REDACTED]#g' "${start_log}" >&2
            exit 1
          fi
          rm -f "${start_log}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --workdir "${TRUST_RUNTIME_DIR}"
          DB_PORT="$(awk 'BEGIN{in_db=0} /^\[db\]/{in_db=1;next} /^\[/{in_db=0} in_db && /^port =/{gsub(/[^0-9]/,"",$0);print $0;exit}' "${TRUST_RUNTIME_DIR}/supabase/config.toml")"
          test -n "${DB_PORT}"
          DB="postgresql://postgres:postgres@127.0.0.1:${DB_PORT}/postgres"
          psql "${DB}" -qAt -v ON_ERROR_STOP=1             -f tests/fixtures/trust-phase4-controlled-evidence-adoption/verify_trust_phase4_runtime.sql             >"${RUNNER_TEMP}/trust-phase8g-phase4.log"
          grep -q 'TRUST_PHASE4_RUNTIME_JSON=' "${RUNNER_TEMP}/trust-phase8g-phase4.log"
          psql "${DB}" -qAt -v ON_ERROR_STOP=1             -f tests/fixtures/trust-phase8g-source-verification/verify_trust_phase8g_source_verification_runtime.sql             | tee "${RUNNER_TEMP}/trust-phase8g-runtime.log"
          grep -q '^TRUST_PHASE8G_SOURCE_VERIFICATION_COMPARABILITY_RUNTIME_VERIFIED$' "${RUNNER_TEMP}/trust-phase8g-runtime.log"

      - name: Check exact-head diff hygiene
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}...${HEAD_SHA}"

      - name: Stop isolated Supabase
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [[ -n "${TRUST_RUNTIME_DIR:-}" && -d "${TRUST_RUNTIME_DIR}/supabase" ]]; then
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --workdir "${TRUST_RUNTIME_DIR}" --no-backup
          fi
          rm -rf -- "${TRUST_RUNTIME_DIR:-${GITHUB_WORKSPACE}/tmp/trust-phase8g-runtime}"
