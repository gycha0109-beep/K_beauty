name: BEJEWELY MOBILE-1 Worklet Lock Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/package.json"
      - ".github/workflows/mobile-1-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  pin-mobile-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Rebuild mobile worklet dependency graph
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall --workspace @bejewely/mobile --ignore-scripts --legacy-peer-deps react-native-reanimated react-native-worklets
          npm install --workspace @bejewely/mobile --ignore-scripts --legacy-peer-deps --save-exact react-native-reanimated@4.5.1 react-native-worklets@0.10.1

      - name: Verify SDK 57 native pair
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          const versionsFor = (name) => [...new Set(
            Object.entries(packages)
              .filter(([path, meta]) => path.endsWith(`/node_modules/${name}`) && meta?.version)
              .map(([, meta]) => meta.version)
          )];
          const reanimated = versionsFor('react-native-reanimated');
          const worklets = versionsFor('react-native-worklets');
          if (reanimated.length !== 1 || reanimated[0] !== '4.5.1') {
            throw new Error(`Unexpected react-native-reanimated versions: ${reanimated.join(',')}`);
          }
          if (worklets.length !== 1 || worklets[0] !== '0.10.1') {
            throw new Error(`Unexpected react-native-worklets versions: ${worklets.join(',')}`);
          }
          console.log('MOBILE_WORKLET_PAIR=4.5.1/0.10.1');
          NODE
          npm ci --ignore-scripts

      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/mobile-1-lock-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/mobile/package.json
          git commit -m "chore(mobile): pin SDK 57 worklet runtime pair"
          git push origin "HEAD:${{ github.head_ref }}"
