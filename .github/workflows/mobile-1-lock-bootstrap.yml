name: BEJEWELY MOBILE-1 Lock Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/package.json"
      - ".github/workflows/mobile-1-lock-bootstrap.yml"

permissions:
  contents: write

jobs:
  pin-mobile-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Resolve workspace lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install from resolved lockfile
        run: npm ci --ignore-scripts

      - name: Commit lockfile and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/mobile-1-lock-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(mobile): pin MOBILE-1 native dependencies"
          git push origin "HEAD:${{ github.head_ref }}"
