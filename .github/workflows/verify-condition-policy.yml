name: Verify Condition Policy
on:
  pull_request:
    branches:
      - agent/condition-policy-single-source
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/verify-condition-policy-single-source.mjs
      - run: npm run architecture:guard
      - run: npm run build
      - run: git diff --check
