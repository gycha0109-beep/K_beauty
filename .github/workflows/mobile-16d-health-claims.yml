name: BEJEWELY Mobile 16D Health Claims

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/health-claims-readiness.json"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/lib/health-claims.ts"
      - "apps/mobile/features/analyze/analyze-client.ts"
      - "apps/mobile/app/analyze.tsx"
      - "lib/vision-observation-contract.js"
      - "app/api/analyze/route.js"
      - "scripts/verify-mobile-16d-health-claims.mjs"
      - ".github/workflows/mobile-16d-health-claims.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/health-claims-readiness.json"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/lib/health-claims.ts"
      - "apps/mobile/features/analyze/analyze-client.ts"
      - "apps/mobile/app/analyze.tsx"
      - "lib/vision-observation-contract.js"
      - "app/api/analyze/route.js"
      - "scripts/verify-mobile-16d-health-claims.mjs"
      - ".github/workflows/mobile-16d-health-claims.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-16d-health-claims-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Health Claim and Store Declaration Boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_16D_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify MOBILE-16D contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-mobile-16d-health-claims.mjs
          npm run mobile:typecheck
          npm run verify:mobile-foundation
