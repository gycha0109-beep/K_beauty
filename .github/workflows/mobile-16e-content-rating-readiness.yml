name: BEJEWELY Mobile 16E Store Content Rating Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/store/mobile-content-rating-readiness.json"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "lib/vision-observation-contract.js"
      - "scripts/verify-mobile-16e-content-rating-readiness.mjs"
      - ".github/workflows/mobile-16e-content-rating-readiness.yml"
  push:
    branches: [main]
    paths:
      - "docs/store/mobile-content-rating-readiness.json"
      - "apps/mobile/store-readiness.json"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "lib/vision-observation-contract.js"
      - "scripts/verify-mobile-16e-content-rating-readiness.mjs"
      - ".github/workflows/mobile-16e-content-rating-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-16e-content-rating-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content-rating-readiness:
    name: Store Content Rating Readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Attest exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'MOBILE_16E_SHA=%s\n' "$actual"

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Verify content-rating answer basis
        run: node scripts/verify-mobile-16e-content-rating-readiness.mjs

      - name: Verify mobile type safety
        run: npm run mobile:typecheck
