name: V21-8B Product Fact Catalog Adoption Batch 2

on:
  push:
    branches: [research/product-fact-catalog-adoption-batch-2-v1]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-8b-product-fact-adoption-batch-2.yml'
      - 'scripts/product-evidence/product-fact-adoption-batch-2-v1.mjs'
      - 'scripts/build-product-fact-adoption-batch-2-v1.mjs'
      - 'scripts/verify-product-fact-adoption-batch-2-v1.mjs'
      - 'evidence/product-fact-adoption-v1/cross-category-adoption-batch-2-v1.json'
      - 'docs/evidence/product-fact-adoption-batch-2-v1.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_MAIN_SHA: a303e216f3953567a175c4d01978efc06b20bbc6
      BRANCH_NAME: research/product-fact-catalog-adoption-batch-2-v1
      OUT_JSON: evidence/product-fact-adoption-v1/cross-category-adoption-batch-2-v1.json
      OUT_MD: docs/evidence/product-fact-adoption-batch-2-v1.md
    steps:
      - name: Checkout exact V2.1-8B head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout frozen recommendation reference
        uses: actions/checkout@v4
        with:
          repository: gycha0109-beep/K_beauty
          ref: 783afb91a964f5d762f46846f9ef854902b48e95
          path: _reference/recommendation
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout historical V2.1-2
        uses: actions/checkout@v4
        with:
          repository: gycha0109-beep/K_beauty
          ref: 6e79aa6a4ac08c98790787e371d59698588f349e
          path: _historical/v21-2
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout historical V2.1-6
        uses: actions/checkout@v4
        with:
          repository: gycha0109-beep/K_beauty
          ref: bd04f0924a74c8d36a935da8a4137dd3cf497117
          path: _historical/v21-6
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout historical V2.1-5
        uses: actions/checkout@v4
        with:
          repository: gycha0109-beep/K_beauty
          ref: 4cb69354c3919f40c2b00acc070bcd0fb142f042
          path: _historical/v21-5
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout historical V2.1-4
        uses: actions/checkout@v4
        with:
          repository: gycha0109-beep/K_beauty
          ref: c471f5ae82acc36a7c29b9ec8158b4ca2d595ec9
          path: _historical/v21-4
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Current main authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_MAIN_SHA"
          git merge-base --is-ancestor "$BASE_MAIN_SHA" HEAD
          echo "base_main=$BASE_MAIN_SHA" | tee /tmp/v21-8b-authority.txt

      - name: Frozen authority hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum evidence/product-fact-materialization-v1/cross-category-pilot-materialization-dry-run-v1.json | awk '{print $1}')" = "b2f19878f00f53d9a60dad0b1515fff1f566449e6a531825e712dfa2e3f19bb2"
          test "$(sha256sum evidence/product-fact-fusion-v1/cleanser-evidence-fusion-review-uncertainty-v1.json | awk '{print $1}')" = "86332b78ec38d79f8dfa12c5879cee46f4a22979d69945ee2f5a9dcc7038b802"
          test "$(sha256sum evidence/product-decision-axis-v1/cleanser-product-decision-axis-v1.json | awk '{print $1}')" = "fbddc761328f2caa5025a5867061866d17f16d24cb6566fe82d0796c20a4a0b4"
          test "$(sha256sum evidence/product-decision-axis-v1/cross-category-product-decision-axis-v1.json | awk '{print $1}')" = "5dc5c7975be7474bf0767951ea63074ed60968faabee5fdb8734153ff698ab5e"
          test "$(sha256sum evidence/product-recommendation-shadow-v1/legacy-vs-decision-axis-shadow-v1.json | awk '{print $1}')" = "7059cd691a0819e935d3debbd1912c7b92a2e3998557bfde28a6ded4a4659e1f"

      - name: Batch 1 replay
        env:
          V21_8A_BASE_MAIN_SHA: 5bcebba6b945f08b0fc5b1ae9f31fb0f9067397e
        run: node scripts/verify-product-fact-adoption-batch-1-v1.mjs | tee /tmp/v21-8b-batch1.txt

      - name: V2.1-8B syntax
        run: |
          node --check scripts/product-evidence/product-fact-adoption-batch-2-v1.mjs
          node --check scripts/build-product-fact-adoption-batch-2-v1.mjs
          node --check scripts/verify-product-fact-adoption-batch-2-v1.mjs

      - name: Build A
        env:
          V21_8B_BASE_MAIN_SHA: ${{ env.BASE_MAIN_SHA }}
        run: |
          node scripts/build-product-fact-adoption-batch-2-v1.mjs | tee /tmp/v21-8b-build-a.txt
          cp "$OUT_JSON" /tmp/v21-8b-a.json
          cp "$OUT_MD" /tmp/v21-8b-a.md
          sha256sum "$OUT_JSON" "$OUT_MD" | tee /tmp/v21-8b-hash-a.txt

      - name: Build B and deterministic equality
        env:
          V21_8B_BASE_MAIN_SHA: ${{ env.BASE_MAIN_SHA }}
        run: |
          rm -f "$OUT_JSON" "$OUT_MD"
          node scripts/build-product-fact-adoption-batch-2-v1.mjs | tee /tmp/v21-8b-build-b.txt
          cmp -s /tmp/v21-8b-a.json "$OUT_JSON"
          cmp -s /tmp/v21-8b-a.md "$OUT_MD"
          sha256sum "$OUT_JSON" "$OUT_MD" | tee /tmp/v21-8b-hash-b.txt

      - name: Batch 2 selection and parent dependency
        env:
          V21_8B_BASE_MAIN_SHA: ${{ env.BASE_MAIN_SHA }}
        run: node scripts/verify-product-fact-adoption-batch-2-v1.mjs | tee /tmp/v21-8b-verifier.txt

      - name: Historical V2.1-2 replay
        run: |
          cd _historical/v21-2
          git update-ref refs/remotes/origin/main e75ae83f3cc8b682fa7cc7dfb38edf983d2aa68f
          node scripts/verify-product-fact-cross-category-materialization-dry-run-v1.mjs

      - name: Historical V2.1-4 replay
        run: |
          cd _historical/v21-4
          git update-ref refs/remotes/origin/main a38df682ebc686cb076dfc40b432ae714fdfd6da
          node scripts/verify-product-fact-evidence-fusion-review-uncertainty-v1.mjs

      - name: Historical V2.1-5 replay
        run: |
          cd _historical/v21-5
          git update-ref refs/remotes/origin/main 4dce99057ca44adb14dac549e8df6d468cf7f5e2
          node scripts/verify-product-decision-axis-cleanser-v1.mjs

      - name: Historical V2.1-6 replay
        run: |
          cd _historical/v21-6
          git update-ref refs/remotes/origin/main 45628d2c859ab0ba875b66f30b4c47c150ef3162
          node scripts/verify-product-decision-axis-cross-category-v1.mjs

      - name: V2.1-7 shadow replay
        env:
          V21_7_BASE_MAIN_SHA: e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87
          RECOMMENDATION_REFERENCE_ROOT: _reference/recommendation
        run: node scripts/verify-product-decision-axis-comparator-v1.mjs

      - name: Product Fact controlled-write and subject contracts
        run: |
          node scripts/verify-product-fact-controlled-write-v1.mjs > /tmp/pf-write.json
          node scripts/verify-product-fact-subject-registration-v1.mjs > /tmp/pf-subject.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const f of ['/tmp/pf-write.json','/tmp/pf-subject.json']) {
            if (JSON.parse(fs.readFileSync(f,'utf8')).status !== 'PASS') throw new Error(`failed ${f}`);
          }
          NODE

      - name: 164 x 12 production replay
        run: node scripts/verify-skin-decision-recommendation-invariance.mjs | tee /tmp/v21-8b-production.txt

      - name: Exact scope and runtime isolation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference _historical
          mapfile -t changed < <(git diff --name-only "$BASE_MAIN_SHA..HEAD" | sort)
          allowed_re='^(\.github/workflows/v21-8b-product-fact-adoption-batch-2\.yml|scripts/product-evidence/product-fact-adoption-batch-2-v1\.mjs|scripts/build-product-fact-adoption-batch-2-v1\.mjs|scripts/verify-product-fact-adoption-batch-2-v1\.mjs|evidence/product-fact-adoption-v1/cross-category-adoption-batch-2-v1\.json|docs/evidence/product-fact-adoption-batch-2-v1\.md)$'
          for f in "${changed[@]}"; do [[ "$f" =~ $allowed_re ]] || { echo "unexpected path: $f"; exit 1; }; done
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then test "${#changed[@]}" -eq 6; fi
          test -z "$(git diff --name-only "$BASE_MAIN_SHA..HEAD" -- app components lib supabase/migrations package.json package-lock.json)"
          if grep -R -n --include='*.js' --include='*.mjs' 'product-fact-adoption-batch-2-v1' app lib components 2>/dev/null; then exit 1; fi
          git diff --check "$BASE_MAIN_SHA..HEAD"
          printf '%s\n' "${changed[@]}" | tee /tmp/v21-8b-changed.txt

      - name: Secret hygiene
        run: |
          if git diff -U0 "$BASE_MAIN_SHA..HEAD" | grep '^+' | grep -Ev '^\+\+\+' | grep -E 'sk-(proj-)?[A-Za-z0-9_-]{24,}|eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'; then exit 1; fi

      - name: Freeze generated Batch 2 outputs
        if: github.event_name == 'push' && github.ref_name == 'research/product-fact-catalog-adoption-batch-2-v1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT_JSON" "$OUT_MD"
          if ! git diff --cached --quiet; then
            git commit -m 'research(storage): freeze V2.1-8B adoption batch plan'
            git push origin HEAD:"$BRANCH_NAME"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-8b-adoption-batch-2-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/v21-8b-authority.txt
            /tmp/v21-8b-batch1.txt
            /tmp/v21-8b-build-a.txt
            /tmp/v21-8b-build-b.txt
            /tmp/v21-8b-hash-a.txt
            /tmp/v21-8b-hash-b.txt
            /tmp/v21-8b-verifier.txt
            /tmp/v21-8b-production.txt
            /tmp/v21-8b-changed.txt
            evidence/product-fact-adoption-v1/cross-category-adoption-batch-2-v1.json
            docs/evidence/product-fact-adoption-batch-2-v1.md
          if-no-files-found: warn
          retention-days: 14
