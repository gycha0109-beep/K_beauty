name: V21-8M Exfoliation Load Targeted Numeric Anchor Research

on:
  push:
    branches:
      - research/v21-8m-exfoliation-load-numeric-anchor-wave-1
      - main
    paths:
      - '.github/workflows/v21-8m-exfoliation-load-targeted-numeric-anchor-research.yml'
      - 'evidence/product-decision-axis-anchor-research-v1/**'
      - 'docs/evidence/exfoliation-load-targeted-numeric-anchor-evidence-research-wave-1-v1.md'
      - 'scripts/product-evidence/exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs'
      - 'scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-8m-exfoliation-load-targeted-numeric-anchor-research.yml'
      - 'evidence/product-decision-axis-anchor-research-v1/**'
      - 'docs/evidence/exfoliation-load-targeted-numeric-anchor-evidence-research-wave-1-v1.md'
      - 'scripts/product-evidence/exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs'
      - 'scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      START_MAIN_SHA: f7b024b81d2ffcae2082fdadda7399c33c8a1ff7
      LEDGER: evidence/product-decision-axis-anchor-research-v1/exfoliation-load-targeted-numeric-anchor-source-ledger-wave-1-v1.json
      RESULT: evidence/product-decision-axis-anchor-research-v1/exfoliation-load-targeted-numeric-anchor-research-wave-1-v1.json
      REPLAY: evidence/product-decision-axis-anchor-research-v1/exfoliation-load-targeted-numeric-anchor-research-replay-wave-1-v1.json
      DOC: docs/evidence/exfoliation-load-targeted-numeric-anchor-evidence-research-wave-1-v1.md

    steps:
      - name: Checkout exact V2.1-8M head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Exact head and execution authority
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$START_MAIN_SHA" HEAD
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            test "$PR_BASE_SHA" = "$START_MAIN_SHA"
            BASE="$PR_BASE_SHA"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            BASE="$START_MAIN_SHA"
          else
            BASE="$(git merge-base refs/remotes/origin/main HEAD)"
            test "$BASE" = "$START_MAIN_SHA"
          fi
          echo "DIFF_BASE_SHA=$BASE" >> "$GITHUB_ENV"
          printf 'start_main=%s\nbase=%s\nhead=%s\n' "$START_MAIN_SHA" "$BASE" "$(git rev-parse HEAD)" | tee /tmp/v21-8m-authority.txt

      - name: Upstream V2.1-8K and V2.1-8L authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum evidence/product-decision-axis-calibration-v1/exfoliation-load-calibration-wave-1-result-v1.json | awk '{print $1}')" = "6b79abb7b72292b16a4c6f8b1a5e420da24f2892dd4e09c7a9ca7ec22f58ffcc"
          test "$(sha256sum evidence/product-decision-axis-anchor-contract-v1/exfoliation-load-numeric-anchor-evidence-contract-v1.json | awk '{print $1}')" = "07aa89c15039b77763a0e2bd411575279e5867468db7ed9ca1ac34b6f61740d8"
          test "$(sha256sum evidence/product-decision-axis-anchor-contract-v1/exfoliation-load-anchor-contract-replay-v1.json | awk '{print $1}')" = "852c8c9143f70841594b32e1ea5637a25682d8a684a925d54cee05b1efcb18df"
          test "$(sha256sum docs/evidence/exfoliation-load-numeric-anchor-evidence-contract-v1.md | awk '{print $1}')" = "f5100ba37c48cf26f172f95bdd82c534ff5c363412a4ec012f9e5c28ffff4bdd"
          grep -q '"primary_experiment_outcome":"NUMERIC_ANCHOR_GAP_CONFIRMED"' evidence/product-decision-axis-calibration-v1/exfoliation-load-calibration-wave-1-result-v1.json
          grep -q '"target_id":"protocol_scoped_final_product_exfoliation_response_change"' evidence/product-decision-axis-anchor-contract-v1/exfoliation-load-numeric-anchor-evidence-contract-v1.json
          printf 'v21_8k_anchor_gap=PASS\nv21_8l_contract=PASS\n' | tee /tmp/v21-8m-upstream.txt

      - name: Build A/B and focused V2.1-8M verifier
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/product-evidence/exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs
          node --check scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs
          for r in a b; do
            root="/tmp/v21-8m-$r"
            rm -rf "$root"
            V21_8M_OUTPUT_ROOT="$root" node scripts/product-evidence/exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs > "/tmp/v21-8m-build-$r.txt"
          done
          for file in "$LEDGER" "$RESULT" "$REPLAY" "$DOC"; do
            cmp -s "/tmp/v21-8m-a/$file" "/tmp/v21-8m-b/$file"
            cmp -s "$file" "/tmp/v21-8m-a/$file"
          done
          node scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs | tee /tmp/v21-8m-verifier.txt
          sha256sum "$LEDGER" "$RESULT" "$REPLAY" "$DOC" | tee /tmp/v21-8m-hashes.txt

      - name: Preserve V2.1-8I through V2.1-8L authority
        shell: bash
        run: |
          set -euo pipefail
          node scripts/product-evidence/verify-product-decision-axis-readiness-audit-v1.mjs | tee /tmp/v21-8m-v21-8i.txt
          node scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs | tee /tmp/v21-8m-v21-8j.txt
          node scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs | tee /tmp/v21-8m-v21-8k.txt
          node scripts/product-evidence/verify-exfoliation-load-anchor-contract-v1.mjs | tee /tmp/v21-8m-v21-8l.txt

      - name: Historical mapper replay preservation
        shell: bash
        run: |
          set -euo pipefail
          run_hist(){
            d="$1"; commit="$2"; main="$3"; script="$4"
            rm -rf "/tmp/$d"
            git clone -q --no-hardlinks . "/tmp/$d"
            git -C "/tmp/$d" checkout -q "$commit"
            git -C "/tmp/$d" update-ref refs/remotes/origin/main "$main"
            (cd "/tmp/$d" && node "$script")
          }
          run_hist v21-5 4cb69354c3919f40c2b00acc070bcd0fb142f042 4dce99057ca44adb14dac549e8df6d468cf7f5e2 scripts/verify-product-decision-axis-cleanser-v1.mjs | tee /tmp/v21-8m-v21-5.txt
          run_hist v21-6 bd04f0924a74c8d36a935da8a4137dd3cf497117 45628d2c859ab0ba875b66f30b4c47c150ef3162 scripts/verify-product-decision-axis-cross-category-v1.mjs | tee /tmp/v21-8m-v21-6.txt

      - name: V2.1-7 shadow and 164 x 12 production invariance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q 783afb91a964f5d762f46846f9ef854902b48e95
          V21_7_BASE_MAIN_SHA=e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87 RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-product-decision-axis-comparator-v1.mjs | tee /tmp/v21-8m-v21-7.txt
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-skin-decision-recommendation-invariance.mjs | tee /tmp/v21-8m-production.txt
          rm -rf _reference
          printf 'score_delta=0\nranking_delta=0\ntop1_delta=0\ntop3_delta=0\neligibility_delta=0\npublic_response_delta=0\npersistence_delta=0\ncandidate_policy_delta=0\nproduction_pda_consumption=NO\nrecommendation_activation=NO\n' | tee /tmp/v21-8m-production-invariance.txt

      - name: 8M-only scope, frozen-web replay, and zero mutation path
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$DIFF_BASE_SHA..HEAD" | sort)
          allowed='^(\.github/workflows/v21-8m-exfoliation-load-targeted-numeric-anchor-research\.yml|docs/evidence/exfoliation-load-targeted-numeric-anchor-evidence-research-wave-1-v1\.md|evidence/product-decision-axis-anchor-research-v1/exfoliation-load-targeted-numeric-anchor-research-replay-wave-1-v1\.json|evidence/product-decision-axis-anchor-research-v1/exfoliation-load-targeted-numeric-anchor-research-wave-1-v1\.json|evidence/product-decision-axis-anchor-research-v1/exfoliation-load-targeted-numeric-anchor-source-ledger-wave-1-v1\.json|scripts/product-evidence/exfoliation-load-targeted-numeric-anchor-research-wave-1\.mjs|scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1\.mjs)$'
          test "${#changed[@]}" -eq 7
          for file in "${changed[@]}"; do [[ "$file" =~ $allowed ]] || { echo "unexpected path: $file"; exit 1; }; done
          test -z "$(git diff --name-only "$DIFF_BASE_SHA..HEAD" -- app components lib supabase/migrations package.json package-lock.json)"
          git diff --check "$DIFF_BASE_SHA..HEAD"

          if grep -En 'admin_(register|ingest|prepare|preflight|confirm)_product_fact|INSERT[[:space:]]+INTO|UPDATE[[:space:]]+product_fact|DELETE[[:space:]]+FROM[[:space:]]+product_fact|CREATE[[:space:]]+TABLE|ALTER[[:space:]]+TABLE|supabase\.from\(' scripts/product-evidence/exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs; then
            echo 'Hosted mutation path detected in V2.1-8M source files'
            exit 1
          fi

          if grep -En 'node:https|node:http|fetch\(|axios|got\(|request\(|child_process.*(curl|wget)' scripts/product-evidence/exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs; then
            echo 'Live network research path detected in deterministic V2.1-8M source files'
            exit 1
          fi

          if grep -R -n --include='*.js' --include='*.mjs' 'exfoliation-load-targeted-numeric-anchor-research-wave-1' app lib components 2>/dev/null; then
            echo 'Production runtime imports V2.1-8M research module'
            exit 1
          fi

          grep -q '"stage_terminal_outcome":"NO_NUMERIC_ANCHOR_SOURCE_FOUND"' "$RESULT"
          grep -q '"live_web_fetch_in_replay":false' "$REPLAY"
          printf '%s\n' "${changed[@]}" | tee /tmp/v21-8m-changed.txt
          printf 'hosted_product_fact_writes=0\nregistry_definition_delta=0\nmigration_delta=0\nnumeric_fitting=0\nproduction_calibration=0\nrecommendation_activation=0\nlive_web_fetch_in_ci=0\n' | tee /tmp/v21-8m-mutation-invariance.txt

      - name: Secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git diff -U0 "$DIFF_BASE_SHA..HEAD" | grep '^+' | grep -Ev '^\+\+\+' | grep -E 'sk-(proj-)?[A-Za-z0-9_-]{24,}|eyJ[A-Za-z0-9_-]{40,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'; then
            echo 'Potential credential literal detected'
            exit 1
          fi

      - name: Upload V2.1-8M evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-8m-exfoliation-load-targeted-numeric-anchor-research-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/v21-8m-*.txt
            evidence/product-decision-axis-anchor-research-v1/*.json
            docs/evidence/exfoliation-load-targeted-numeric-anchor-evidence-research-wave-1-v1.md
          if-no-files-found: warn
          retention-days: 14
