name: Premium PR27 finalizer v3

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/premium-pr27-finalize-v3.yml]

permissions:
  contents: write

concurrency:
  group: premium-pr27-finalizer-v3
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/premium-engine-main-sec-baseline
          fetch-depth: 0
      - name: Build exact reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/premium-route-storage-reentry-verification
          test "$(git rev-parse origin/agent/premium-route-storage-reentry-verification)" = "d88ad5075d9f4faab201e0d819b4f7c952d16867"
          set +e
          git merge --no-ff --no-commit origin/agent/premium-route-storage-reentry-verification
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          python - <<'PY'
          from pathlib import Path
          import ast, base64, re, zlib

          workflow = Path('.github/workflows/premium-stack-merge-once.yml').read_text(encoding='utf-8')
          for name, target in [('full', 'app/api/full-report/route.js'), ('session', 'app/api/full-report/session/route.js')]:
              match = re.search(rf'^          {name} = (".*")$', workflow, re.MULTILINE)
              if not match:
                  raise SystemExit(f'missing embedded {name} payload')
              Path(target).write_bytes(zlib.decompress(base64.b64decode(ast.literal_eval(match.group(1)))))

          current_products_path = Path('lib/premium-current-products.js')
          current_products = current_products_path.read_text(encoding='utf-8')
          function_start = current_products.find('export function buildPremiumCurrentProductVerdicts')
          if function_start < 0:
              raise SystemExit('missing buildPremiumCurrentProductVerdicts export')
          canonical_tail = '''export function buildPremiumCurrentProductVerdicts(currentProducts, report, locale = "ko") {
            const freeResult = report?.freeResult && typeof report.freeResult === "object"
              ? report.freeResult
              : {};
            return buildCurrentProductVerdicts(currentProducts, {
              locale,
              priorityAxis: freeResult?.priority?.axis || freeResult?.mainConcern || "",
              answers:
                freeResult?.answers ||
                report?.decisionBundle?.context?.survey?.answers ||
                {}
            });
          }

          export function enrichPremiumReportWithCurrentProducts(report, currentProducts, locale = "ko") {
            if (!report || typeof report !== "object" || Array.isArray(report)) return report;
            const currentProductVerdicts = buildPremiumCurrentProductVerdicts(currentProducts, report, locale);
            return rebuildPremiumDecisionState(
              {
                ...report,
                currentProducts,
                currentProductVerdicts
              },
              {
                locale,
                source: "full_report_current_products"
              }
            );
          }
          '''
          canonical_tail = '\n'.join(line[10:] if line.startswith('          ') else line for line in canonical_tail.splitlines()) + '\n'
          prefix = current_products[:function_start]
          prefix = prefix.replace(
              'import { applyPremiumDecisionState } from "@/lib/premium-decision-state";',
              'import { rebuildPremiumDecisionState } from "@/lib/premium-decision-state";'
          )
          if 'from "@/lib/premium-decision-state";' not in prefix:
              raise SystemExit('missing premium decision-state import')
          current_products_path.write_text(prefix + canonical_tail, encoding='utf-8')

          route_path = Path('app/api/full-report/route.js')
          route = route_path.read_text(encoding='utf-8')
          import_pattern = re.compile(
              r'import\s*\{(?P<body>[^{}]*)\}\s*from\s*"@/lib/premium-current-products";',
              re.DOTALL
          )
          import_match = import_pattern.search(route)
          if not import_match:
              raise SystemExit('missing premium-current-products import block')
          import_names = [
              part.strip().rstrip(',')
              for part in import_match.group('body').splitlines()
              if part.strip()
          ]
          if 'buildPremiumCurrentProductsSnapshot' not in import_names:
              raise SystemExit('missing current-product snapshot import')
          import_names = [
              'enrichPremiumReportWithCurrentProducts' if name == 'buildPremiumCurrentProductVerdicts' else name
              for name in import_names
          ]
          if 'enrichPremiumReportWithCurrentProducts' not in import_names:
              import_names.append('enrichPremiumReportWithCurrentProducts')
          import_names = list(dict.fromkeys(import_names))
          import_lines = ',\n'.join(f'  {name}' for name in import_names)
          canonical_import = f'import {{\n{import_lines}\n}} from "@/lib/premium-current-products";'
          route = route[:import_match.start()] + canonical_import + route[import_match.end():]

          function_start = route.find('async function applyCurrentProductsToReport')
          function_end_marker = '\n}\n\nexport async function POST'
          function_end = route.find(function_end_marker, function_start)
          if function_start < 0 or function_end < 0:
              raise SystemExit('missing applyCurrentProductsToReport boundary')
          canonical_function = '''async function applyCurrentProductsToReport({ report, body, locale }) {
            if (!Array.isArray(body?.currentProducts)) {
              return {
                premiumReport: report,
                changed: false
              };
            }

            const currentProducts = await buildPremiumCurrentProductsSnapshot(body.currentProducts);
            return {
              premiumReport: enrichPremiumReportWithCurrentProducts(report, currentProducts, locale),
              changed: true
            };
          }'''
          canonical_function = '\n'.join(line[10:] if line.startswith('          ') else line for line in canonical_function.splitlines())
          route = route[:function_start] + canonical_function + route[function_end + 2:]
          route_path.write_text(route, encoding='utf-8')

          suite_path = Path('scripts/run-security-closeout-verifier-suite.mjs')
          suite = suite_path.read_text(encoding='utf-8')
          entry = '  "verify-premium-route-storage-reentry.mjs",\n'
          anchor = '  "verify-premium-report-reentry-contract.mjs",\n'
          if entry not in suite:
              if suite.count(anchor) != 1:
                  raise SystemExit('security verifier anchor mismatch')
              suite_path.write_text(suite.replace(anchor, anchor + entry, 1), encoding='utf-8')
          PY
          git add \
            app/api/full-report/route.js \
            app/api/full-report/session/route.js \
            lib/premium-current-products.js \
            scripts/run-security-closeout-verifier-suite.mjs
          rm -f \
            .github/workflows/premium-stack-merge-once.yml \
            .github/workflows/premium-pr27-debug.yml \
            .github/workflows/premium-pr27-final-diagnostic.yml \
            .github/workflows/premium-pr27-finalize.yml \
            .github/workflows/premium-pr27-gate-diagnostic.yml \
            .github/workflows/premium-pr27-finalize-v2.yml \
            .github/workflows/premium-pr27-finalize-v3.yml \
            .github/workflows/premium-pr27-suite-diagnostic.yml
          git add -A
          node --check app/api/full-report/route.js
          node --check app/api/full-report/session/route.js
          node --check lib/premium-current-products.js
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!package-lock.json' || true)"
          git commit -m "merge(premium): integrate immutable route storage and reentry"
          npm ci
      - name: Verify route storage
        run: node scripts/verify-premium-route-storage-reentry.mjs
      - name: Verify integrated evaluation
        run: node scripts/verify-premium-integrated-evaluation.mjs
      - name: Verify report reentry
        run: node scripts/verify-premium-report-reentry-contract.mjs
      - name: Verify decision determinism before suite
        shell: bash
        run: |
          set -euo pipefail
          for run in 1 2 3 4 5; do
            echo "decision pre-suite run ${run}/5"
            node scripts/verify-premium-decision-state.mjs
          done
      - name: Verify cross-domain consistency
        run: node scripts/verify-cross-domain-consistency.mjs
      - name: Verify condition policy
        run: node scripts/verify-condition-policy-single-source.mjs
      - name: Verify routine policy
        run: node scripts/verify-routine-policy-single-source.mjs
      - name: Verify functional policy
        run: node scripts/verify-functional-policy-single-source.mjs
      - name: Verify security closeout
        run: node scripts/run-security-closeout-verifier-suite.mjs
      - name: Verify decision determinism after suite
        shell: bash
        run: |
          set -euo pipefail
          for run in 6 7 8 9 10; do
            echo "decision post-suite run ${run}/10"
            node scripts/verify-premium-decision-state.mjs
          done
      - name: Verify architecture
        run: npm run architecture:guard
      - name: Verify production build
        id: production_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee premium-pr27-production-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-pr27-production-build
          path: premium-pr27-production-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Require production build pass
        run: test "${{ steps.production_build.outcome }}" = "success"
      - name: Verify diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Push reviewed integration
        run: git push origin HEAD:integration/premium-engine-main-sec-baseline
