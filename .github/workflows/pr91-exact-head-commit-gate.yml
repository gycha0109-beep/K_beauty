name: PR91 Exact Head Commit Gate

on:
  push:
    branches:
      - codex/shared-skin-decision-context-completeness-v4

permissions:
  contents: read

concurrency:
  group: pr91-exact-head-commit-gate
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 9cedef020f2b2a4fb27d787d6147c0785f4ebbeb
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --short)"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          printf 'HEAD=%s\nBASE=%s\n' "$(git rev-parse HEAD)" "$BASE_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/shared-skin-decision-context-v4.js
          node --check lib/premium-decision-state.js
          node --check scripts/verify-shared-skin-decision-context-v4.mjs

      - name: Shared context exact verifier
        run: npm run verify:shared-skin-decision-context

      - name: Discover and run canonical policy verifiers
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t verifiers < <(
            find scripts -maxdepth 1 -type f \(
              -name 'verify-premium-decision-state.mjs' -o \
              -name 'verify-*functional-policy*.mjs' -o \
              -name 'verify-*routine-policy*.mjs' -o \
              -name 'verify-*condition-policy*.mjs' -o \
              -name 'verify-*cross-domain-consistency*.mjs' -o \
              -name 'verify-*effective-policy*.mjs' -o \
              -name 'verify-premium-*projection*.mjs' \
            \) -print | sort
          )
          printf 'Selected verifier count: %s\n' "${#verifiers[@]}"
          printf '%s\n' "${verifiers[@]}"
          test -f scripts/verify-premium-decision-state.mjs
          test "${#verifiers[@]}" -ge 4
          for verifier in "${verifiers[@]}"; do
            echo "::group::$verifier"
            node "$verifier"
            echo "::endgroup::"
          done

      - name: Architecture guard
        run: npm run architecture:guard

      - name: Production build
        run: npm run build

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA"..HEAD
          test -z "$(git status --short)"
          git diff --name-only "$BASE_SHA"..HEAD | sort
