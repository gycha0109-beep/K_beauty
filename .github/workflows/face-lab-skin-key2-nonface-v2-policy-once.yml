# EPHEMERAL one-shot research action. Remove after single paired v1/v2 request.
# No human images or user data. Only OPENAI_API_KEY2; never production key.
name: Face Lab Skin KEY2 nonhuman v2 policy recheck
run-name: "[WT:face-research] Skin S1-B nonhuman v2 policy recheck (ONE SHOT)"

on:
  push:
    branches:
      - face-lab/research-skin-key2-nonface-vision-pair-20261015
    paths:
      - .github/workflows/face-lab-skin-key2-nonface-v2-policy-once.yml

permissions:
  contents: read

concurrency:
  group: face-lab-skin-key2-nonface-v2-policy-one-shot
  cancel-in-progress: false

jobs:
  research-retest:
    if: github.repository == 'gycha0109-beep/K_beauty' && github.ref == 'refs/heads/face-lab/research-skin-key2-nonface-vision-pair-20261015'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run privacy and abstention mock tests without key
        run: |
          node scripts/facelab/skin/verify-skin-nonface-v2-abstention-audit.mjs
          node scripts/facelab/skin/verify-skin-key2-nonface-vision-pair.mjs
      - name: Call nonhuman v1 and v2 ONCE each using temporary repository secret
        env:
          OPENAI_API_KEY2: ${{ secrets.OPENAI_API_KEY2 }}
        run: node scripts/facelab/skin/run-skin-key2-nonface-pair.mjs --live-nonface-pair
