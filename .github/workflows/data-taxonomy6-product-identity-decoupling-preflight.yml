name: DATA-TAXONOMY6 Product Identity Decoupling Preflight

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/data-taxonomy6-product-identity-decoupling-preflight.yml"
      - "evidence/catalog-taxonomy-v1/data-taxonomy6-product-identity-decoupling-preflight-v1.json"
      - "scripts/product-evidence/verify-data-taxonomy6-product-identity-decoupling-preflight-v1.mjs"
      - "lib/product-category-normalizer.js"
      - "lib/product-source.js"
      - "lib/recommendation-scoring.ts"
      - "supabase/migrations/20260822130309_crawler_canonical_adoption_authority_remediation_v1.sql"
      - "supabase/migrations/20260913201050_data_taxonomy1_shadow_catalog_taxonomy_foundation_v1.sql"
      - "supabase/migrations/20260913202500_data_taxonomy2_candidate_manual_classification_v1.sql"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/data-taxonomy6-product-identity-decoupling-preflight.yml"
      - "evidence/catalog-taxonomy-v1/data-taxonomy6-product-identity-decoupling-preflight-v1.json"
      - "scripts/product-evidence/verify-data-taxonomy6-product-identity-decoupling-preflight-v1.mjs"
      - "lib/product-category-normalizer.js"
      - "lib/product-source.js"
      - "lib/recommendation-scoring.ts"
      - "supabase/migrations/20260822130309_crawler_canonical_adoption_authority_remediation_v1.sql"
      - "supabase/migrations/20260913201050_data_taxonomy1_shadow_catalog_taxonomy_foundation_v1.sql"
      - "supabase/migrations/20260913202500_data_taxonomy2_candidate_manual_classification_v1.sql"

permissions:
  contents: read

env:
  DATA_TAXONOMY6_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: Product identity decoupling preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_TAXONOMY6_CHECKOUT_SHA }}
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$DATA_TAXONOMY6_CHECKOUT_SHA"

      - name: Verify DATA-TAXONOMY6 preflight
        run: node scripts/product-evidence/verify-data-taxonomy6-product-identity-decoupling-preflight-v1.mjs
