name: V2.1-8X Exfoliation Normative Production Policy Decision Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v21-8x-exfoliation-normative-production-policy-decision-contract.yml'
      - 'docs/evidence/exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1.md'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1.json'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-canonical-examples-v1.json'
      - 'scripts/product-evidence/build-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs'
      - 'scripts/product-evidence/verify-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v21-8x-exfoliation-normative-production-policy-decision-contract.yml'
      - 'docs/evidence/exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1.md'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1.json'
      - 'evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-canonical-examples-v1.json'
      - 'scripts/product-evidence/build-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs'
      - 'scripts/product-evidence/verify-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v21-8x:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      V21_8X_BASE_MAIN_SHA: fc5da448cc97572547e14c4a796b57773aa0b8d0
      FROZEN_8W_MAIN_SHA: fc5da448cc97572547e14c4a796b57773aa0b8d0
      FROZEN_8V_MAIN_SHA: d85ed057cb01923d3f3beef18b08e820fb7d7e22
      FROZEN_8U_MAIN_SHA: a34b5d67dd233629c01568114fea6ebb312fd130
      FROZEN_8T_MAIN_SHA: d988f33664e3086250e2595b55319aa18e127608
      FROZEN_8S_MAIN_SHA: c3a844ff3aec6a89456aeba9e86a3479239f2974
      FROZEN_8R_MAIN_SHA: 053a963a14bf00d7deb731a2c5427a97f3172b9f
      FROZEN_8Q_MAIN_SHA: e812ee6a7eae6b98940adfe7b10471687e5cad1a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Exact authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git merge-base --is-ancestor "$V21_8X_BASE_MAIN_SHA" HEAD

      - name: Deterministic regeneration Build A B
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/product-evidence/build-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs
          node --check scripts/product-evidence/verify-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs
          node scripts/product-evidence/build-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs contract > /tmp/contract-a.json
          node scripts/product-evidence/build-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs contract > /tmp/contract-b.json
          cmp /tmp/contract-a.json /tmp/contract-b.json
          cmp /tmp/contract-a.json evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1.json
          node scripts/product-evidence/build-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs examples > /tmp/examples-a.json
          node scripts/product-evidence/build-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs examples > /tmp/examples-b.json
          cmp /tmp/examples-a.json /tmp/examples-b.json
          cmp /tmp/examples-a.json evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-canonical-examples-v1.json
          sha256sum /tmp/contract-a.json /tmp/examples-a.json

      - name: Focused V2.1-8X verifier
        shell: bash
        run: |
          set -euo pipefail
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs > /tmp/v21-8x-verifier.json
          cat /tmp/v21-8x-verifier.json

      - name: Historical V2.1-8J through V2.1-8P replay
        shell: bash
        run: |
          set -euo pipefail
          node scripts/product-evidence/verify-product-decision-axis-mapper-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-calibration-wave-1-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-anchor-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-load-targeted-numeric-anchor-research-wave-1.mjs
          node scripts/product-evidence/verify-exfoliation-load-calibration-feasibility-reassessment-v1.mjs
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-contract-v1.mjs
          node scripts/product-evidence/verify-exfoliation-non-numeric-pda-offline-shadow-v1.mjs

      - name: Historical V2.1-8Q through V2.1-8W replay at frozen authorities
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            "v21-8q:$FROZEN_8Q_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumption-v1.mjs" \
            "v21-8r:$FROZEN_8R_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-adapter-implementation-v1.mjs" \
            "v21-8s:$FROZEN_8S_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-consumer-v1.mjs" \
            "v21-8t:$FROZEN_8T_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-shadow-divergence-readiness-v1.mjs" \
            "v21-8u:$FROZEN_8U_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-consumption-contract-v1.mjs" \
            "v21-8v:$FROZEN_8V_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-consumption-shadow-v1.mjs" \
            "v21-8w:$FROZEN_8W_MAIN_SHA:scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-policy-mapping-v1.mjs"; do
            IFS=: read -r name sha verifier <<< "$pair"
            rm -rf "_reference/$name"
            git clone -q --no-hardlinks . "_reference/$name"
            git -C "_reference/$name" checkout -q "$sha"
            (cd "_reference/$name" && node "$verifier")
            rm -rf "_reference/$name"
          done

      - name: 164 x 12 production invariance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _reference/recommendation
          git clone -q --no-hardlinks . _reference/recommendation
          git -C _reference/recommendation checkout -q 783afb91a964f5d762f46846f9ef854902b48e95
          V21_7_BASE_MAIN_SHA=e2be97b9fcbf75ff43b6f7ecfe96a680aff4cb87 RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-product-decision-axis-comparator-v1.mjs
          RECOMMENDATION_REFERENCE_ROOT=_reference/recommendation node scripts/verify-skin-decision-recommendation-invariance.mjs
          rm -rf _reference/recommendation

      - name: Exact additive scope and frozen non-mutation
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            .github/workflows/v21-8x-exfoliation-normative-production-policy-decision-contract.yml
            docs/evidence/exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1.md
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-decision-contract-v1.json
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-normative-production-policy-canonical-examples-v1.json
            scripts/product-evidence/build-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs
            scripts/product-evidence/verify-exfoliation-non-numeric-pda-normative-production-policy-decision-v1.mjs
          )
          mapfile -t actual < <(git diff --name-only "$V21_8X_BASE_MAIN_SHA..HEAD" | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${wanted[@]}")"
          test -z "$(git diff --name-only "$V21_8X_BASE_MAIN_SHA..HEAD" -- \
            app package.json package-lock.json supabase/migrations \
            lib/candidate-exposure-policy.js \
            lib/candidate-exposure-policy-contract.js \
            lib/routine-policy.js \
            lib/recent-instability-guard-policy.js \
            lib/evaluator-boundary-policy-shadow.js \
            lib/functional-ranking-contract.js \
            lib/product-functional-profile.js \
            lib/current-product-findings.js \
            lib/skin-match-decision-engine.js \
            lib/exfoliation-non-numeric-pda-production-consumption-shadow.js \
            lib/exfoliation-non-numeric-pda-production-consumption-dual-run.js \
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-production-policy-authority-gap-v1.json \
            evidence/product-decision-axis-non-numeric-shadow-v1/exfoliation-non-numeric-pda-production-policy-mapping-canonical-examples-v1.json \
            scripts/product-evidence/verify-exfoliation-non-numeric-pda-production-policy-mapping-v1.mjs \
            docs/evidence/exfoliation-non-numeric-pda-production-policy-authority-gap-v1.md)"
          git diff --check "$V21_8X_BASE_MAIN_SHA..HEAD"
