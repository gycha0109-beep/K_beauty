name: Local Supabase Replay Guard

on:
  pull_request:
    paths:
      - "supabase/local-replay-test/**"
      - "supabase/migrations/**"
      - "scripts/prepare-local-supabase-replay.mjs"
      - "scripts/verify-local-supabase-replay-baseline.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/local-supabase-replay-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify replay contracts
        run: npm run db:replay:verify

      - name: Prepare isolated replay workspace
        run: npm run db:replay:prepare

      - name: Start isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          log_file="tmp/local-supabase-replay-start.log"
          if ! npx --yes supabase@2.82.0 start \
            --workdir tmp/local-supabase-replay >"${log_file}" 2>&1; then
            tail -n 200 "${log_file}"
            exit 1
          fi

      - name: Reset migration chain twice
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            log_file="tmp/local-supabase-replay-reset-${attempt}.log"
            if ! npx --yes supabase@2.82.0 db reset \
              --workdir tmp/local-supabase-replay >"${log_file}" 2>&1; then
              tail -n 200 "${log_file}"
              exit 1
            fi
          done

      - name: Lint local database
        run: npx --yes supabase@2.82.0 db lint --local --workdir tmp/local-supabase-replay

      - name: Verify anonymous product read
        shell: bash
        run: |
          set -euo pipefail
          api_url=""
          anon_key=""
          while IFS='=' read -r name value; do
            value="${value#\"}"
            value="${value%\"}"
            case "${name}" in
              API_URL) api_url="${value}" ;;
              ANON_KEY) anon_key="${value}" ;;
            esac
          done < <(npx --yes supabase@2.82.0 status -o env --workdir tmp/local-supabase-replay)
          test -n "${api_url}"
          test -n "${anon_key}"
          response="$(curl --fail --silent --show-error \
            "${api_url}/rest/v1/products?select=id&limit=5" \
            -H "apikey: ${anon_key}" \
            -H "Authorization: Bearer ${anon_key}")"
          test "$(printf '%s' "${response}" | jq 'length')" -eq 5

      - name: Stop isolated Supabase
        if: always()
        run: npx --yes supabase@2.82.0 stop --workdir tmp/local-supabase-replay --no-backup
