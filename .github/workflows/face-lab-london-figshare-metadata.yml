name: Face Lab London Figshare Metadata

on:
  pull_request:
    paths:
      - "scripts/build-face-lab-london-set-v5-figshare-metadata.mjs"
      - "scripts/verify-face-lab-london-set-v5-figshare-metadata.mjs"
      - ".github/workflows/face-lab-london-figshare-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: face-lab-london-figshare-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact Face Lab head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact event head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Fetch Figshare v5 metadata only
        run: node scripts/build-face-lab-london-set-v5-figshare-metadata.mjs "$RUNNER_TEMP/london-set-v5-figshare-source-metadata.json"
      - name: Verify metadata-only source inventory
        run: node scripts/verify-face-lab-london-set-v5-figshare-metadata.mjs "$RUNNER_TEMP/london-set-v5-figshare-source-metadata.json"
      - name: Emit metadata summary
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const m=require(process.argv[1]); console.log(JSON.stringify({fileCount:m.fileCount,totalFileBytes:m.totalFileBytes,sourceMetadataDigest:m.sourceMetadataDigest,files:m.files.map(({id,name,size})=>({id,name,size}))},null,2))' "$RUNNER_TEMP/london-set-v5-figshare-source-metadata.json"
      - name: Upload metadata packet only
        uses: actions/upload-artifact@v7
        with:
          name: face-lab-london-set-v5-figshare-metadata-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/london-set-v5-figshare-source-metadata.json
          if-no-files-found: error
          retention-days: 7
