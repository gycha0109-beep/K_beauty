name: Product Offers

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/*_product_offers_*.sql"
      - "tests/fixtures/product-offers/**"
      - "crawler/tests/verify-product-offers-local-runtime.ts"
      - "crawler/package.json"
      - ".github/workflows/product-offers.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/*_product_offers_*.sql"
      - "tests/fixtures/product-offers/**"
      - "crawler/tests/verify-product-offers-local-runtime.ts"
      - "crawler/package.json"
      - ".github/workflows/product-offers.yml"

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  verify-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crawler/package-lock.json

      - name: Install crawler dependencies
        working-directory: crawler
        run: npm ci --no-audit --no-fund

      - name: Typecheck crawler
        working-directory: crawler
        run: npm run typecheck

      - name: Prepare isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="${RUNNER_TEMP}/product-offers-runtime"
          echo "PRODUCT_OFFERS_RUNTIME_DIR=${runtime_dir}" >>"${GITHUB_ENV}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" init --workdir "${runtime_dir}" --force
          migration_dir="${runtime_dir}/supabase/migrations"
          mkdir -p "${migration_dir}"
          cp tests/fixtures/product-offers/20260910102500_product_offers_runtime_seed.sql "${migration_dir}/"
          cp supabase/migrations/20260910103000_product_offers_shadow_v1.sql "${migration_dir}/"

      - name: Start and reset isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          start_log="${RUNNER_TEMP}/product-offers-start.log"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" start \
            --workdir "${PRODUCT_OFFERS_RUNTIME_DIR}" \
            --exclude realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            >"${start_log}" 2>&1; then
            sed -E 's#(sb_(publishable|secret)_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+|postgresql://[^[:space:]]+)#[REDACTED]#g' "${start_log}" >&2
            exit 1
          fi
          rm -f "${start_log}"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" db reset --workdir "${PRODUCT_OFFERS_RUNTIME_DIR}"

      - name: Verify product offers runtime
        shell: bash
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/product-offers.env"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" status --workdir "${PRODUCT_OFFERS_RUNTIME_DIR}" -o env >"${env_file}"
          anon_key="$(grep '^ANON_KEY=' "${env_file}" | cut -d= -f2- | tr -d '\"')"
          service_key="$(grep '^SERVICE_ROLE_KEY=' "${env_file}" | cut -d= -f2- | tr -d '\"')"
          echo "::add-mask::${anon_key}"
          echo "::add-mask::${service_key}"
          set -a
          source "${env_file}"
          set +a
          export NEXT_PUBLIC_SUPABASE_URL="${API_URL}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY}"
          rm -f "${env_file}"
          cd crawler
          npm run verify:product-offers:local-runtime

      - name: Stop isolated Supabase
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [[ -d "${PRODUCT_OFFERS_RUNTIME_DIR}/supabase" ]]; then
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --workdir "${PRODUCT_OFFERS_RUNTIME_DIR}" --no-backup
          fi
          rm -rf -- "${PRODUCT_OFFERS_RUNTIME_DIR}"

      - name: Check exact-head and diff hygiene
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi
          if [[ ! "${base}" =~ ^[0-9a-f]{40}$ ]] || [[ "${base}" == "0000000000000000000000000000000000000000" ]]; then
            base="$(git rev-parse "${HEAD_SHA}^")"
          fi
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          git diff --check "${base}...${HEAD_SHA}"
