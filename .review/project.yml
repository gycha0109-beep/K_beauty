schema_version: "1.0"
project:
  id: bejewely
  name: BEJEWELY / K_beauty
  type: ai-web-application
  repository_root: "."
  baseline_branch: main
inherits: [nextjs-supabase]
technology:
  languages: [typescript, javascript, python, sql]
  frameworks: [nextjs, supabase]
  database:
    engine: postgresql
scope:
  include:
    - "app/**"
    - "components/**"
    - "lib/**"
    - "scripts/**"
    - "supabase/**"
    - "security-tests/**"
    - "tests/**"
    - "crawler/**"
    - "packages/**"
    - "tools/**"
    - "docs/**"
    - "package*.json"
    - "next.config.*"
    - ".review/**"
    - ".github/workflows/**"
  exclude:
    - "node_modules/**"
    - ".next/**"
    - ".next-dev/**"
    - "out/**"
    - "dist/**"
    - "build/**"
    - "coverage/**"
    - "tmp/**"
    - "_local_data/**"
    - ".synthetic-local/**"
    - "data/**"
    - "evidence/**"
    - "private/**"
    - ".pie/**"
protected_paths: []
commands:
  baseline: []
  integration: []
review:
  packs:
    - universal.test-completeness
    - application.authentication
    - application.authorization
    - data.rls
    - data.migration-safety
    - data.relational-integrity
    - domain.ai-inference
    - domain.recommendation
gate:
  block_on: [P0, P1]
  require:
    baseline_tests: false
    regression_tests: false
constraints:
  production_changes_allowed: false
  hosted_database_changes_allowed: false
  external_network_allowed: false
